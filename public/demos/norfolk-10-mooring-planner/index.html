(function(root){
'use strict';
const vessels={
  atlas:{name:'FNS Atlas',className:'Research support vessel',length:148,beam:20,draft:7.2,windArea:2400,displacement:9200},
  meridian:{name:'FNS Meridian',className:'Logistics vessel',length:180,beam:27,draft:8.6,windArea:3400,displacement:17800},
  tern:{name:'FNS Tern',className:'Coastal survey vessel',length:92,beam:16,draft:4.8,windArea:1120,displacement:3600}
};
const piers={p04:{name:'Pier 04 · West basin',depth:12.4,rating:250},p07:{name:'Pier 07 · Inner basin',depth:9.2,rating:180}};
const types={polyester:{name:'Polyester · 56 mm',mbl:440,elastic:1},nylon:{name:'Nylon · 56 mm',mbl:380,elastic:.65},hmpe:{name:'HMPE · 44 mm',mbl:620,elastic:2.5}};
const tugs=[{id:'orion',name:'Orion',bp:310,hp:3600,station:'Forward quarter'},{id:'kestrel',name:'Kestrel',bp:230,hp:2800,station:'Aft quarter'},{id:'wren',name:'Wren',bp:160,hp:2000,station:'Aft quarter'}];
const bollards=[30,65,100,135,165,200,235,270];
const lineDefs=[{name:'Stern line',at:-.43,b:0},{name:'Aft breast',at:-.35,b:2},{name:'Aft spring',at:-.28,b:6},{name:'Forward spring',at:.28,b:1},{name:'Forward breast',at:.35,b:5},{name:'Head line',at:.43,b:7}];
function initial(){return {version:1,name:'Arrival baseline',vessel:'atlas',pier:'p04',x:150,y:38,wind:22,windAngle:75,current:.55,currentAngle:90,gust:1.2,lines:lineDefs.map((d,i)=>({id:'L'+(i+1),type:'polyester',bollard:d.b,enabled:true})),available:tugs.map(t=>t.id),selectedTugs:['orion','kestrel'],note:''};}
function validate(s){
 const errors=[]; if(!s||typeof s!=='object')return ['Scenario must be a JSON object.'];
 if(s.version!==1)errors.push('Supported scenario version is 1.');
 if(typeof s.name!=='string'||!s.name.trim()||s.name.length>80)errors.push('Name must contain 1–80 characters.');
 if(typeof s.vessel!=='string'||!Object.hasOwn(vessels,s.vessel))errors.push('Choose a known vessel.'); if(typeof s.pier!=='string'||!Object.hasOwn(piers,s.pier))errors.push('Choose a known pier.');
 for(const [key,min,max] of [['x',100,200],['y',22,70],['wind',0,60],['windAngle',-180,180],['current',0,3],['currentAngle',-180,180],['gust',1,1.6]])if(typeof s[key]!=='number'||!Number.isFinite(s[key])||s[key]<min||s[key]>max)errors.push(`${key} must be a number from ${min} to ${max}.`);
 if(!Array.isArray(s.lines)||s.lines.length!==6)errors.push('Exactly six line records are required.');
 else s.lines.forEach((l,i)=>{if(!l||l.id!=='L'+(i+1)||typeof l.type!=='string'||!Object.hasOwn(types,l.type)||!Number.isInteger(l.bollard)||l.bollard<0||l.bollard>7||typeof l.enabled!=='boolean')errors.push(`Line ${i+1} is invalid.`);});
 for(const key of ['available','selectedTugs'])if(!Array.isArray(s[key])||s[key].some(x=>!tugs.find(t=>t.id===x))||new Set(s[key]).size!==s[key].length)errors.push(`${key} must contain unique known tug IDs.`);
 if(Array.isArray(s.available)&&Array.isArray(s.selectedTugs)&&s.selectedTugs.some(x=>!s.available.includes(x)))errors.push('Selected tugs must be available.');
 if(typeof s.note!=='string'||s.note.length>2000)errors.push('Study note must be text, up to 2,000 characters.');

}
function parse(text){if(text.length>100000)throw Error('File is too large. Maximum 100 KB.');let raw;try{raw=JSON.parse(text);}catch{throw Error('This is not valid JSON. Load the example to see the scenario format.');}const s=raw.scenario||raw;const errors=validate(s);if(errors.length)throw Error(errors.join(' '));return structuredClone(s);}
function drag(rho,cd,area,speed,angle){const v=speed*.514444*Math.sin(angle*Math.PI/180);return .5*rho*cd*area*v*Math.abs(v)/1000;}
function calculate(s){
 const errors=validate(s);if(errors.length)throw Error(errors.join(' '));
 const v=vessels[s.vessel],p=piers[s.pier];
 const wind=drag(1.225,1.1,v.windArea,s.wind,s.windAngle),gustWind=drag(1.225,1.1,v.windArea,s.wind*s.gust,s.windAngle),current=drag(1025,.9,v.length*v.draft,s.current,s.currentAngle);
 const steady=wind+current,gust=gustWind+current,mooring=Math.max(0,steady,gust),fender=Math.max(0,-steady,-gust),envelope=Math.max(Math.abs(steady),Math.abs(gust));
 const lines=s.lines.map((l,i)=>{const d=lineDefs[i],dx=bollards[l.bollard]-(s.x+d.at*v.length),dy=s.y-v.beam/2,len=Math.hypot(dx,dy),q=dy/len,k=types[l.type].elastic/len;return {...l,name:d.name,x:s.x+d.at*v.length,dx,dy,length:len,q,k,angle:Math.atan2(dy,Math.abs(dx))*180/Math.PI,limit:types[l.type].mbl*.45};});
 const denominator=lines.filter(l=>l.enabled).reduce((a,l)=>a+l.k*l.q*l.q,0);
 for(const l of lines){l.tension=l.enabled&&denominator>0?mooring*l.k*l.q/denominator:0;l.utilization=l.tension/l.limit;l.breakRatio=l.tension/types[l.type].mbl;}
 const bollardLoads=bollards.map((_,i)=>{const attached=lines.filter(l=>l.enabled&&l.bollard===i);const fx=attached.reduce((a,l)=>a-l.tension*l.dx/l.length,0),fy=attached.reduce((a,l)=>a+l.tension*l.q,0);return {id:'B'+(i+1),load:Math.hypot(fx,fy),rating:p.rating};});

 if(peakBollard>1)warnings.push('A bollard exceeds its synthetic load rating.');
 if(capacity+.001<requiredTug)warnings.push('Selected tug capacity is below the illustrative assist target.');
 if(p.depth-v.draft<1.5)warnings.push('Static under-keel clearance is below the assumed 1.5 m review threshold.');
 if(fender>0)warnings.push('An inward load requires a fender assessment; fender response is not modeled.');

}

function layout(s,r){return `<div class="workgrid"><div><div class="chart-wrap" id="chart">${canvas(s,r)}</div><div class="canvas-tools"><span>Drag vessel to explore line geometry</span><div class="small-inputs"><label for="xpos">Along pier</label><input id="xpos" aria-label="Along pier position in metres" data-field="x" type="number" min="100" max="200" value="${s.x}"><span>m</span><label for="ypos">Offset</label><input id="ypos" aria-label="Vessel center offset in metres" data-field="y" type="number" min="22" max="70" value="${s.y}"><span>m</span></div></div><div class="metrics" id="metrics">${metrics(s,r)}</div><div class="table-head"><h2>Line arrangement <small>06 LINES</small></h2><div class="filter" aria-label="Filter lines">${[['all','All lines'],['flags','Flagged'],['inactive','Inactive']].map(([k,l])=>`<button data-filter="${k}" class="${filter===k?'active':''}">${l}</button>`).join('')}</div></div><div id="line-table">${lineTable(r)}</div><div class="selected-line" id="line-editor">${lineEditor(s,r)}</div><div id="banner">${banner(r)}</div></div>${inspector(s,r)}</div>`;}
function comparison(){const entries=Object.entries(scenarios);return `<p class="compare-intro">Compare the same illustrative model across different conditions. Each scenario keeps its own vessel, line arrangement and tug selections.</p><div class="comparison">${entries.map(([key,s],i)=>{const r=M.calculate(s);return `<article class="compare-card"><span class="eyebrow">SCENARIO ${String(i+1).padStart(2,'0')} ${key===active?'· CURRENT':''}</span><h2>${esc(s.name)}</h2><span class="micro">Environmental envelope</span><div class="compare-value">${num(r.envelope)} <small>kN</small></div><div class="chart-bar"><i style="width:${Math.min(100,r.envelope/1500*100)}%;background:${r.warnings.length?'#bd8152':'#547b62'}"></i></div><div class="compare-row"><span>Peak line utilization</span><b class="${r.peak>1?'danger':''}">${r.unrestrained?'Unrestrained':num(r.peak*100)+'%'}</b></div><div class="compare-row"><span>Wind / gust</span><span>${s.wind} kt / ×${s.gust}</span></div><div class="compare-row"><span>Tug assist / target</span><span>${num(r.capacity)} / ${num(r.requiredTug)} kN</span></div><div class="compare-row"><span>Review flags</span><span class="${r.warnings.length?'warning':''}">${r.warnings.length}</span></div><button class="btn full" data-scenario="${esc(key)}">Open scenario ${icon('arrow')}</button></article>`;}).join('')}</div><p class="compare-note">Bar scale: 0–1,500 kN. Opposing loads are signed before the steady/gust envelope is evaluated. Lower demand does not imply operational acceptability.</p><section class="compare-section"><div class="table-head"><h2>Saved snapshots <small>${saved.length}</small></h2><button class="btn small" data-action="save">${icon('plus')} Save current study</button></div><input class="input search" id="snapshot-search" placeholder="Search saved snapshots…" aria-label="Search saved snapshots" value="${esc(search)}"><div id="snapshot-list">${snapshotList()}</div></section>`;}
function snapshotList(){const filtered=saved.map((s,i)=>({s,i})).filter(({s})=>s.name.toLowerCase().includes(search.toLowerCase()));return filtered.length?filtered.map(({s,i})=>`<div class="saved-row"><div><b>${esc(s.name)}</b><small>${M.vessels[s.vessel].name} · ${s.wind} kt wind · ${num(M.calculate(s).envelope)} kN envelope</small></div><button class="btn small" data-load="${i}">Open copy</button><button class="btn small" data-remove="${i}" aria-label="Delete snapshot ${esc(s.name)}">${icon('close')}</button></div>`).join(''):`<div class="empty">${saved.length?'No snapshots match your search.':'No snapshots yet. Save a study before changing a condition to compare it later.'}</div>`;}
function tugsPage(s,r){const rec=recommendation||M.recommend(s);return `<div class="tugs-page"><section><h2>Fictional tug inventory</h2><p class="micro" style="margin-top:5px">Availability and assignment are local scenario inputs.</p>${M.tugs.map(t=>`<article class="tug-card"><div class="tug-top"><h3>${t.name}</h3><span class="badge">${s.selectedTugs.includes(t.id)?'ASSIGNED':'STANDBY'}</span></div><div class="tug-meta"><span>${t.bp} kN BOLLARD PULL</span><span>${num(t.hp)} hp</span></div><p class="micro">Illustrative station: ${t.station.toLowerCase()}. Effective pull = ${num(t.bp*.8)} kN with 80% effectiveness.</p><label class="checkline"><input type="checkbox" data-available="${t.id}" ${s.available.includes(t.id)?'checked':''}> Available in this scenario</label><label class="checkline"><input type="checkbox" data-assigned="${t.id}" ${s.selectedTugs.includes(t.id)?'checked':''} ${s.available.includes(t.id)?'':'disabled'}> Include in tug allocation</label></article>`).join('')}</section><section><div class="rationale"><span class="eyebrow">DETERMINISTIC ALLOCATION</span><h2 style="margin-top:8px">${rec.feasible?'A combination for this study.':'Available capacity is insufficient.'}</h2><p>Evaluate all ${rec.evaluated} combinations of available tugs. Choose the fewest tugs meeting ${num(rec.required)} kN effective pull, then the lowest total listed horsepower.</p><div class="compare-row"><span>Suggested combination</span><strong>${rec.ids.map(id=>M.tugs.find(t=>t.id===id).name).join(' + ')||'None required'}</strong></div><div class="compare-row"><span>Effective capacity</span><strong>${num(rec.capacity)} kN</strong></div><p>${rec.feasible?'This choice covers the illustrative transverse target. Tug locations are indicative; yaw, towing geometry and maneuver dynamics remain unevaluated.':'Even all available tugs cannot meet the target. This result remains flagged; changing the line arrangement does not reduce the independent arrival-assist target.'}</p><button class="btn primary full" data-action="allocate">${icon('tug')} Apply calculated combination</button></div><div class="force-breakdown"><span class="eyebrow" style="color:#9fb9bb">CURRENT FORCE ACCOUNTING</span><div class="compare-row"><span>Steady wind</span><span>${num(r.wind,1)} kN</span></div><div class="compare-row"><span>Gust wind</span><span>${num(r.gustWind,1)} kN</span></div><div class="compare-row"><span>Current</span><span>${num(r.current,1)} kN</span></div><div class="compare-row"><span>Environmental envelope</span><span>${num(r.envelope,1)} kN</span></div><div class="compare-row"><span>Assist factor</span><span>× 1.25</span></div><div class="compare-row"><strong>Effective pull target</strong><strong>${num(r.requiredTug)} kN</strong></div><p class="micro" style="color:#b2c7ca;margin-top:14px">Positive load acts away from pier. Tug target uses the maximum absolute steady/gust load. Mooring capacity is not credited against tug demand.</p></div>${banner(r)}</section></div>`;}
function basis(s){return `<div class="basis-layout"><div><section class="basis-block"><span class="badge">DOCUMENTED RELATIONSHIP</span><h2 style="margin-top:12px">A transparent force model.</h2><div class="formula">F = ½ ρ C<sub>d</sub> A v<sub>⊥</sub> |v<sub>⊥</sub>|<br>v<sub>⊥</sub> = speed × 0.514444 × sin(θ)</div><p>The general drag equation is documented by <a href="${M.provenance.url}" target="_blank" rel="noreferrer">NASA Glenn Research Center ↗</a>. The signed cross-flow simplification used here is an illustrative adaptation. It is not a vessel-specific hydrodynamic model.</p><p>Wind uses exposed lateral area. Current uses length × draft. Steady and gust loads are evaluated separately, with signed current added to each.</p></section><section class="basis-block"><span class="badge amber">ILLUSTRATIVE ASSUMPTIONS</span><h2 style="margin-top:12px">Line sharing & tug selection</h2><div class="formula">qᵢ = transverse span / line length<br>kᵢ ∝ material factor / line length<br>Tᵢ = F<sub>out</sub> kᵢ qᵢ / Σ(kⱼ qⱼ²)</div><p>Active lines share outward load under a common small lateral displacement. No pretension is applied. Polyester / nylon / HMPE relative stiffness factors are 1 / 0.65 / 2.5. A disabled line carries zero load and the calculation redistributes load among active lines.</p><p>Working limit = 45% of fictional MBL. Bollard demand is the vector sum of its attached line loads. The tug target is 125% of the environmental envelope, with each tug delivering 80% of its fictional bollard pull. Listed horsepower is metadata, not a pull conversion.</p><p>Air / water density: 1.225 / 1,025 kg/m³. Drag coefficients: 1.1 / 0.9. All are demonstration assumptions.</p></section></div><div><section class="basis-block"><span class="badge amber">REVIEW REQUIRED</span><h2 style="margin-top:12px">A study, never an approval.</h2><p>${esc(M.provenance.limitations)}</p><p>The Norfolk #10 source brief references NSTM 582. No authenticated NSTM 582 tables or limits were supplied or applied. This demo cannot assert compliance or generate an approved safety sheet.</p><p>Every vessel, berth, bollard, line rating and tug is synthetic. Compass and plan geometry have no geographic reference. Static under-keel clearance excludes tide, squat and motion.</p></section><section class="basis-block"><h2>Reviewer’s study note</h2><p>Saved with this scenario and included in every exported study. Use synthetic information only.</p><textarea class="notearea" id="study-note" maxlength="2000" aria-label="Reviewer’s study note" placeholder="Record an assumption or a question for engineering review…">${esc(s.note)}</textarea><div class="note-save"><button class="btn small" data-action="save-note">Save note</button></div></section><section class="basis-block"><h2>Local workspace</h2><p>No service connections or API keys. Changes stay in this browser. Export a JSON study for portable recovery.</p><button class="btn small" data-action="reset">Reset demonstration</button></section></div></div>`;}
function render(){const s=state(),r=M.calculate(s);const titles={layout:'Mooring study',compare:'Scenario comparison',tugs:'Tug allocation',basis:'Model & study notes'};$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div><div class="brand"><div class="brandmark">${icon('anchor')}</div><span class="brandword">BERTH</span></div><div class="brand-caption">MOORING INTELLIGENCE</div></div><nav><div class="workspace-title">STUDY WORKSPACE</div>${[['layout','layout','Pier canvas'],['compare','compare','Scenarios'],['tugs','tug','Tug allocation'],['basis','book','Model & sources']].map(([k,ico,label])=>`<button class="navitem ${view===k?'active':''}" data-view="${k}" title="${label}" aria-label="${label}">${icon(ico)}<span>${label}</span>${k==='compare'?`<span class="count">${Object.keys(scenarios).length.toString().padStart(2,'0')}</span>`:''}</button>`).join('')}</nav><div class="sidebar-cases"><div class="sidebar-sep"></div><div class="workspace-title" style="margin-top:24px">TRAINING PORT</div><button class="case-item active" data-view="layout"><span><span class="dot"></span>West basin</span><small>Fictional Norfolk exercise</small></button><button class="btn text small" data-action="import" style="margin-top:15px">${icon('upload')} Import a study</button></div><div class="sidebar-bottom"><b><span class="dot"></span>Local demonstration</b>Norfolk catalogue · Case 10<br>Synthetic inputs. Transparent math.<br>No operational approval.</div></aside><main class="main"><header class="topbar"><div class="breadcrumb"><span>Norfolk studies</span><span>/</span><strong>West basin</strong></div><span class="offline"><span class="dot"></span>OFFLINE CAPABLE <span class="hidesmall">· LOCAL WORKSPACE</span></span></header>${storageWarning?`<div class="storage-warning">${esc(storageWarning)}</div>`:''}<div class="content"><header class="pagehead"><div><div class="eyebrow">PIER PLANNING / ILLUSTRATIVE STUDY 010</div><h1>${titles[view]}</h1><p class="subtitle">${view==='layout'?'Place the vessel. Explore the forces. Understand the tradeoffs.':'A fictional harbor, with every assumption in view.'}</p></div><div class="head-actions"><button class="btn" data-action="save">${icon('save')} Save snapshot</button><button class="btn primary" data-action="export">${icon('download')} Export study</button></div></header><div class="scenario-strip">${Object.entries(scenarios).map(([k,sc],i)=>`<button class="scenario-tab ${active===k?'active':''}" data-scenario="${esc(k)}"><span>${String(i+1).padStart(2,'0')}</span>${esc(sc.name)}</button>`).join('')}<span class="scenario-meta">ILLUSTRATIVE · NOT VALIDATED</span></div>${view==='layout'?layout(s,r):view==='compare'?comparison():view==='tugs'?tugsPage(s,r):basis(s)}<footer class="pagefooter"><span>BERTH / NORFOLK 10 · HANDCRAFTED DEMONSTRATION</span><span>QUASI-STATIC MODEL · ENGINEERING REVIEW REQUIRED</span></footer></div></main></div>`;}
function refresh(){const s=state(),r=M.calculate(s);if(view!=='layout')return;$('#canvas-svg').innerHTML=svgCanvas(s,r);$('#metrics').innerHTML=metrics(s,r);$('#line-table').innerHTML=lineTable(r);$('#line-editor').innerHTML=lineEditor(s,r);$('#tug-mini').innerHTML=tugMini(s,r);$('#banner').innerHTML=banner(r);}
function close(){const d=$('#dialog');d.close();d.innerHTML='';}
function modal(title,body,foot=''){const d=$('#dialog');d.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="btn small" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;d.showModal();}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Study exported. Synthetic inputs and model assumptions included.');}
const slug=()=>state().name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,50)||'study';
function sheet(){const s=state(),r=M.calculate(s),rep=M.report(s);return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>BERTH — ${esc(s.name)} study sheet</title><style>body{font:14px/1.55 Arial,sans-serif;color:#173641;max-width:1000px;margin:35px auto;padding:0 25px}h1{font-size:32px}h2{font-size:20px;margin-top:28px}.label{padding:12px;background:#f2e9d9;border:1px solid #d8c4a3}.canvas-svg{width:100%;height:auto;display:block;background:#173641;margin-top:25px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:9px;text-align:left;border-bottom:1px solid #ccd8ce}p,li{font-size:13px}.grid{display:flex;gap:30px}.grid b{font-size:23px}small{color:#647578}button{padding:10px 15px;background:#245d4e;color:white;border:0;border-radius:4px;cursor:pointer}@media print{button{display:none}body{margin:0;padding:0}h2{break-after:avoid}tr{break-inside:avoid}.canvas-svg{max-height:320px}}</style></head><body><button onclick="window.print()">Print / save as PDF</button><p>BERTH / NORFOLK CATALOGUE 10</p><h1>${esc(s.name)}</h1><div class="label">SYNTHETIC STUDY SHEET · ILLUSTRATIVE ONLY · NOT AN APPROVED MOORING PLAN</div><p>${M.vessels[s.vessel].name} · ${M.piers[s.pier].name} · Exported ${esc(rep.exportedAt)}</p><div class="grid"><div><b>${num(r.envelope)} kN</b><br>Environmental envelope</div><div><b>${r.unrestrained?'Unrestrained':num(r.peak*100)+'%'}</b><br>Peak assumed line utilization</div><div><b>${num(r.capacity)} / ${num(r.requiredTug)} kN</b><br>Effective tug capacity / target</div></div>${svgCanvas(s,r)}<h2>Conditions and configuration</h2><p>Wind ${s.wind} kt toward ${s.windAngle}°; gust multiplier ×${s.gust}. Current ${s.current} kt toward ${s.currentAngle}°. Angles relative to bow, +90° away from pier. Vessel center: ${s.x} m along pier, ${s.y} m offset. Static under-keel clearance ${num(r.clearance,1)} m.</p><table><tr><th>Line</th><th>Material</th><th>Bollard</th><th>Span / angle</th><th>Tension / limit</th><th>Utilization</th></tr>${r.lines.map(l=>`<tr><td>${l.id} ${l.name}${l.enabled?'':' (inactive)'}</td><td>${M.types[l.type].name}</td><td>B${l.bollard+1}</td><td>${num(l.length,1)} m / ${num(l.angle)}°</td><td>${num(l.tension)} / ${num(l.limit)} kN</td><td>${num(l.utilization*100)}%</td></tr>`).join('')}</table><h2>Bollard demands</h2><p>${r.bollardLoads.map(b=>`${b.id}: ${num(b.load)} / ${b.rating} kN`).join(' · ')}</p><h2>Tug allocation</h2><p>${s.selectedTugs.map(id=>{const t=M.tugs.find(t=>t.id===id);return `${t.name}: ${t.bp} kN fictional bollard pull, ${num(t.hp)} hp listed, ${t.station.toLowerCase()} (indicative)`;}).join('<br>')||'No tugs assigned.'}</p><p>Target = environmental envelope ×1.25. Effective tug pull = listed bollard pull ×0.8. No mooring capacity credited toward arrival assist.</p><h2>Review flags</h2><ul>${(r.warnings.length?r.warnings:['No synthetic threshold exceedance. Engineering review is still required.']).map(w=>`<li>${esc(w)}</li>`).join('')}</ul><h2>Illustrative review sequence</h2><ol><li>Confirm the fictional inputs, load directions, hydrographic assumptions and model omissions.</li><li>Review line and bollard demands; inspect spring and breast-line geometry. The model does not prescribe a line-handling sequence.</li><li>Review tug target, inventory and indicative positions. Obtain a qualified engineering and operational assessment before any real evolution.</li></ol><h2>Reviewer’s note</h2><p style="white-space:pre-wrap">${esc(s.note)||'No note recorded.'}</p><h2>Model basis and provenance</h2><p>${esc(M.provenance.formula)}</p><p>${esc(M.provenance.documented)} <a href="${M.provenance.url}">NASA drag equation</a></p><p>${esc(M.provenance.assumptions)}</p><p>${esc(M.provenance.limitations)}</p><p><small>Source brief: bundled harness/norfolk-snapshot.ts, use case 10. Handcrafted demonstration; not AppYard-generated or AppYard-verified.</small></p></body></html>`;}
function action(name){const s=state();if(name==='close')return close();if(name==='save')return modal('Save a snapshot',`<p>Keep an independent copy of the current inputs, line arrangement and tug allocation.</p><div class="field"><label for="snapshot-name">Snapshot name</label><input id="snapshot-name" type="text" maxlength="80" value="${esc(s.name)} · revision ${saved.length+1}"></div><div class="error" id="modal-error"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="confirm-save">Save snapshot</button>`);if(name==='confirm-save'){const name=$('#snapshot-name').value.trim();if(!name)return $('#modal-error').textContent='Enter a name for this snapshot.';if(saved.length>=20)return $('#modal-error').textContent='Snapshot limit reached (20). Export or delete a snapshot first.';saved.push({...structuredClone(s),name});persist();close();render();return toast('Snapshot saved locally. View it in Scenarios.');}
if(name==='import')return modal('Import a scenario',`<p>Paste a BERTH scenario JSON or choose a local file. Only the scenario’s validated inputs are loaded. Any previously exported results are recalculated.</p><div style="display:flex;gap:10px;margin-bottom:12px"><button class="btn small" data-action="example">Load example</button><label class="btn small">Choose JSON file<input type="file" id="import-file" accept=".json,application/json" hidden></label></div><textarea id="import-text" aria-label="Scenario JSON" placeholder='{"version": 1, "name": "My study", ...}'></textarea><div class="error" id="modal-error"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="confirm-import">Validate & import</button>`);
if(name==='example'){$('#import-text').value=JSON.stringify({...M.preset('gust'),name:'Imported gust study'},null,2);$('#modal-error').textContent='';return;}
if(name==='confirm-import'){try{const imported=M.parse($('#import-text').value);scenarios.imported=imported;active='imported';recommendation=null;view='layout';persist();close();render();toast('Scenario imported. All forces recalculated locally.');}catch(e){$('#modal-error').textContent=e.message;}return;}
if(name==='export')return modal('Export this study',`<p><strong>${esc(s.name)}</strong> includes the current geometry, inputs, calculated loads, review flags and model provenance.</p><button class="export-option" data-action="export-sheet"><span><b>Study sheet</b><small>Standalone HTML with graphical layout · printable to PDF</small></span>${icon('download')}</button><button class="export-option" data-action="export-json"><span><b>Scenario & calculation record</b><small>JSON · re-importable inputs and explicit assumptions</small></span>${icon('download')}</button><button class="export-option" data-action="export-csv"><span><b>Line load schedule</b><small>CSV · geometry, material, tension and utilization</small></span>${icon('download')}</button><p class="micro" style="margin:18px 0 0">All exports are marked synthetic and illustrative. They do not provide operational approval.</p>`);
if(name==='export-sheet'){download(`berth-${slug()}-study.html`,sheet(),'text/html');return close();}
if(name==='export-json'){download(`berth-${slug()}.json`,JSON.stringify(M.report(s),null,2),'application/json');return close();}
if(name==='export-csv'){const r=M.calculate(s);const rows=[['SYNTHETIC ILLUSTRATIVE STUDY - NOT APPROVED'],['Line','Function','Enabled','Material','Bollard','Span_m','Angle_deg','Tension_kN','Assumed_limit_kN','Utilization_pct'],...r.lines.map(l=>[l.id,l.name,l.enabled,M.types[l.type].name,'B'+(l.bollard+1),l.length.toFixed(2),l.angle.toFixed(2),l.tension.toFixed(2),l.limit.toFixed(2),(l.utilization*100).toFixed(2)])];download(`berth-${slug()}-lines.csv`,rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');return close();}
if(name==='allocate'){recommendation=M.recommend(s);s.selectedTugs=recommendation.ids;persist();render();return toast(recommendation.feasible?`Applied ${s.selectedTugs.length} tug combination. Review rationale in Tug allocation.`:'Maximum available capacity applied; target remains unmet.');}
if(name==='toggle-line'){s.lines[line].enabled=!s.lines[line].enabled;persist();refresh();return;}
if(name==='save-note'){s.note=$('#study-note').value;persist();return toast('Reviewer’s note saved to this scenario.');}
if(name==='reset')return modal('Reset local demonstration?',`<p>This clears your browser’s scenarios, notes and saved snapshots and reloads the three original fictional studies. Export any work you want to keep first.</p>`,`<button class="btn" data-action="close">Keep studies</button><button class="btn primary" data-action="confirm-reset">Reset demonstration</button>`);
if(name==='confirm-reset'){scenarios={base:M.initial(),gust:M.preset('gust'),flood:M.preset('flood')};active='base';saved=[];line=1;view='layout';recommendation=null;filter='all';search='';persist();close();render();toast('Original demonstration restored.');}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-line]');if(!b)return;if(b.dataset.action)return action(b.dataset.action);if(b.dataset.view){view=b.dataset.view;recommendation=null;return render();}if(b.dataset.scenario){active=b.dataset.scenario;view='layout';recommendation=null;filter='all';persist();return render();}if(b.dataset.line!==undefined){line=Number(b.dataset.line);return refresh();}if(b.dataset.filter){filter=b.dataset.filter;return render();}if(b.dataset.load!==undefined){scenarios.imported=structuredClone(saved[Number(b.dataset.load)]);active='imported';view='layout';recommendation=null;persist();render();return toast('Opened a working copy; saved snapshot retained.');}if(b.dataset.remove!==undefined){const removed=saved.splice(Number(b.dataset.remove),1)[0];persist();render();toast(`Deleted snapshot “${removed.name}”.`);}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='snapshot-search'){search=el.value;$('#snapshot-list').innerHTML=snapshotList();return;}if(el.type==='range'&&el.dataset.field){state()[el.dataset.field]=Number(el.value);recommendation=null;el.style.setProperty('--value',((+el.value-+el.min)/(+el.max-+el.min)*100)+'%');$('#value-'+el.dataset.field).innerHTML=el.value+`<small>kt</small>`;refresh();}});
document.addEventListener('change',async e=>{const el=e.target,s=state();if(el.id==='import-file'){const f=el.files[0];if(!f)return;if(f.size>100000){$('#modal-error').textContent='File is too large. Maximum 100 KB.';return;}try{$('#import-text').value=await f.text();$('#modal-error').textContent='';}catch{$('#modal-error').textContent='The file could not be read.';}return;}
if(el.dataset.field){const key=el.dataset.field,value=['vessel','pier'].includes(key)?el.value:Number(el.value);if(el.value===''||!el.checkValidity()){toast(`Enter a valid ${key} between ${el.min} and ${el.max}.`);el.value=s[key];return;}const next={...s,[key]:value};const errors=M.validate(next);if(errors.length){el.value=s[key];return toast(errors[0]);}s[key]=value;recommendation=null;persist();return render();}
if(el.id==='lineType'){s.lines[line].type=el.value;persist();return refresh();}if(el.id==='lineBollard'){s.lines[line].bollard=Number(el.value);persist();return refresh();}
if(el.dataset.available){const id=el.dataset.available;s.available=el.checked?[...s.available,id]:s.available.filter(x=>x!==id);if(!el.checked)s.selectedTugs=s.selectedTugs.filter(x=>x!==id);recommendation=null;persist();return render();}if(el.dataset.assigned){const id=el.dataset.assigned;s.selectedTugs=el.checked?[...s.selectedTugs,id]:s.selectedTugs.filter(x=>x!==id);recommendation=null;persist();return render();}});
document.addEventListener('pointerdown',e=>{const vessel=e.target.closest('[data-vessel]');if(!vessel)return;const svg=vessel.closest('svg'),rect=svg.getBoundingClientRect(),scale=Math.min(rect.width/1000,rect.height/500);dragging={startX:e.clientX,startY:e.clientY,x:state().x,y:state().y,scale};e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!dragging)return;const d=dragging,s=state();s.x=Math.round(Math.max(100,Math.min(200,d.x+(e.clientX-d.startX)/d.scale/3)));s.y=Math.round(Math.max(22,Math.min(70,d.y+(e.clientY-d.startY)/d.scale/3)));$('#xpos').value=s.x;$('#ypos').value=s.y;recommendation=null;refresh();});
document.addEventListener('pointerup',()=>{if(dragging){dragging=null;persist();}});document.addEventListener('pointercancel',()=>{if(dragging){dragging=null;persist();}});
document.addEventListener('keydown',e=>{const target=e.target;if(target.matches('[data-line]')&&['Enter',' '].includes(e.key)){e.preventDefault();line=Number(target.dataset.line);refresh();}if(target.matches('[data-vessel]')&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const s=state(),step=e.shiftKey?5:1;s.x=Math.max(100,Math.min(200,s.x+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0)));s.y=Math.max(22,Math.min(70,s.y+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0)));persist();refresh();$('#xpos').value=s.x;$('#ypos').value=s.y;$('[data-vessel]').focus();}});
render();
})();
</script></body></html>
