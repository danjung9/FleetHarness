l-section"><div class="section-heading"><h3>Investigation trail</h3><span class="subtle">UTC · exercise record</span></div><ol class="timeline">${c.events.slice(-5).map(e=>`<li><time>${esc(e.at)}</time><i></i><span>${esc(e.text)}</span></li>`).join('')}</ol></section>`;}
function evidenceView(c,obs){return `<section class="detail-section"><div class="section-heading"><h3>Evidence locker</h3><button class="btn small" data-action="ingest">${icon('plus')} Add evidence</button></div><div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload evidence">${icon('upload')}<strong>Drop evidence here</strong><span>Logs, IOC lists, JSON, CSV, classic PCAP · 2 MB each</span><button class="text-btn" data-action="sample-file">Download sample log</button></div><div class="notice">Text observables are extracted locally. PCAP imports preserve metadata only.</div>${c.evidence.length?c.evidence.map((e,i)=>`<div class="artifact"><div class="file-icon">${icon('file')}</div><div><strong>${esc(e.name)}</strong><small>${e.kind==='pcap'?e.packets+' packets · metadata':e.lineCount+' lines'} · ${(e.bytes/1024).toFixed(1)} KB · ${e.observables.length} observables</small></div><button class="icon-btn" data-source="${i}" aria-label="Inspect ${esc(e.name)}" title="Inspect evidence">${icon('arrow')}</button><button class="icon-btn" data-remove="${i}" aria-label="Remove ${esc(e.name)}" title="Remove evidence">${icon('close')}</button></div>`).join(''):'<div class="empty"><h3>No evidence attached</h3><p>Drop a log or paste an IOC list to build an evidence trail.</p></div>'}</section><section class="detail-section"><div class="section-heading"><h3>Extracted observables</h3><span class="count">${obs.length}</span></div>${obs.map((o,i)=>`<button class="ioc-row" data-observable="${i}"><span class="type-tag">${o.type}</span><code>${esc(o.value)}</code><span class="source-line">L${o.line} ${icon('arrow')}</span></button>`).join('')||'<p class="subtle">No supported observables found.</p>'}<p class="micro">IPv4, domains, SHA-256 · duplicate values consolidated across artifacts</p></section>`;}
function reportView(c){const r=c.draft||c.report||C.reportFor(c,D.bulletins);return `<form id="report-form" data-dirty="${Boolean(c.draft)}"><div class="section-heading"><h3>Incident report</h3><span class="draft-badge">${c.draft?'RECOVERED EDITS':c.report?'SAVED DRAFT':'GENERATED DRAFT'}</span></div><p class="report-intro">A structured starting point from the incident and its evidence. Review every field before sharing.</p>${[['summary','Incident summary'],['findings','Evidence findings'],['assessment','Assessment & uncertainty'],['actions','Response notes']].map(([key,label])=>`<label class="field">${label}<textarea name="${key}" rows="3" required maxlength="6000">${esc(r[key])}</textarea></label>`).join('')}<div class="form-actions"><button class="btn primary" type="submit">${icon('check')} Save report</button><button class="btn" type="button" data-action="export">${icon('download')} Export</button></div><p id="report-dirty" class="micro">${c.draft?'Edits recovered locally · save before exporting.':c.report?'Saved report will be included in exports.':'Save edits to include them in the exported report.'}</p></form>`;}
function context(){const c=current(),matches=C.matchCases(c,cases);return `<section class="context-section"><div class="section-heading"><h2>Related investigations</h2>${icon('link')}</div><p class="context-intro">Shared signals, different perspectives.</p>${matches.length?matches.map((m,i)=>`<button class="match-card" data-select="${m.case.id}"><div><span class="match-label">${i===0?'CLOSEST MATCH':'RELATED CASE'}</span><span class="score">${m.score}<small>/100</small></span></div><h3>${esc(m.case.title)}</h3><div class="match-owner">${esc(m.case.unit)} <span>↗</span></div><div class="match-reasons">${m.sharedIocs.length?`${m.sharedIocs.length} exact IOC matches`:`${m.shared.length} shared terms`} · ${m.case.status}</div></button>`).join(''):'<div class="inline-empty">No meaningful match yet. Add evidence or a more detailed description.</div>'}<button class="text-btn methodology" data-action="method">How matching works ${icon('help')}</button></section><section class="context-section owner-section"><div class="section-heading"><h2>Case owner</h2></div><div class="owner"><div class="owner-avatar">${esc(c.unit.split(' ').map(s=>s[0]).join(''))}</div><div><strong>${esc(c.unit)}</strong><small>${esc(c.region)} · fictional team</small></div></div><button class="btn full" data-action="contact">${icon('users')} View exercise contact</button></section><section class="context-section linked"><div class="section-heading"><h2>Linked bulletins</h2><span class="count">${c.bulletins.length}</span></div>${D.bulletins.filter(b=>c.bulletins.includes(b.id)).map(b=>`<button class="linked-bulletin" data-bulletin="${b.id}"><span>${b.id} · CACHED EXAMPLE</span><strong>${esc(b.title)}</strong>${icon('arrow')}</button>`).join('')||'<p class="subtle">No bulletins linked to this case.</p>'}<button class="text-btn" data-page="bulletins">Browse bulletin board ${icon('arrow')}</button></section>`;}
function bulletinsView(){const c=current();return `<div class="bulletin-toolbar"><label class="search">${icon('search')}<input type="search" id="bulletin-search" aria-label="Search bulletins" placeholder="Search titles, topics, or tags" value="${esc(bulletinQuery)}"></label><select id="bulletin-severity" aria-label="Filter bulletin severity">${['All','High','Moderate','Low'].map(x=>`<option ${x===bulletinSeverity?'selected':''}>${x}</option>`).join('')}</select><span>Linking to <strong>${c.id}</strong> · ${esc(c.unit)}</span></div><div class="notice">${icon('clock')} Fixed exercise snapshot · These are authored synthetic examples, not actual source advisories or a live feed.</div><div id="bulletin-grid" class="bulletin-grid">${bulletinCards()}</div><div class="source-note"><h3>Source provenance</h3><p>The catalogue names CISA and SANS ISC as future integration sources. External links below provide background only; no external content is ingested or represented as a current advisory.</p><a href="https://www.cisa.gov/news-events/cybersecurity-advisories" target="_blank" rel="noopener">CISA advisory catalogue ↗</a><a href="https://isc.sans.edu/" target="_blank" rel="noopener">SANS Internet Storm Center ↗</a></div>`;}
function bulletinCards(){const c=current(),list=D.bulletins.filter(b=>(bulletinSeverity==='All'||b.severity===bulletinSeverity)&&[b.title,b.summary,...b.tags].join(' ').toLowerCase().includes(bulletinQuery.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return list.map(b=>`<article class="bulletin-card"><div class="bulletin-card-top"><span>${b.id}</span>${badge(b.severity)}</div><span class="eyebrow">${b.category}</span><h2>${esc(b.title)}</h2><p>${esc(b.summary)}</p><div class="tags">${b.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="bulletin-card-bottom"><small>${date(b.date)} 2026 · Exercise desk</small><button class="btn ${c.bulletins.includes(b.id)?'linked-button':''}" data-link="${b.id}">${icon(c.bulletins.includes(b.id)?'check':'link')}${c.bulletins.includes(b.id)?'Linked · unlink':'Link to '+c.id}</button></div></article>`).join('')||'<div class="empty"><h3>No matching bulletins</h3><p>Try another search or severity.</p><button class="btn" data-action="clear-bulletins">Clear filters</button></div>';}
function guideView(){return `<div class="guide-layout"><article class="guide-card"><span class="eyebrow">THE PRESENTATION JOURNEY</span><h2>From one signal to shared context.</h2><ol class="walkthrough"><li><b>01</b><div><h3>Start with an observation</h3><p>Open INC-0249. Inspect its DNS observables and click through to the source line.</p></div></li><li><b>02</b><div><h3>Find a relevant prior case</h3><p>Compare the Kestrel Cell investigation. Exact shared IOCs explain the match; the prior resolution is context, not a conclusion.</p></div></li><li><b>03</b><div><h3>Build the evidence trail</h3><p>Log an incident, then paste or drop evidence. Import the sample DNS log to try local extraction.</p></div></li><li><b>04</b><div><h3>Review and hand over</h3><p>Link an exercise bulletin, edit the report, save it, and export Markdown or JSON.</p></div></li></ol><button class="btn primary" data-page="workspace">Open workspace ${icon('arrow')}</button></article><article class="guide-card"><span class="eyebrow">HONEST BY DESIGN</span><h2>What this demo supports</h2><ul class="scope-list"><li>Local incident creation, status updates, filters, evidence ingestion, and persistent drafts.</li><li>Source-linked IPv4, domain and SHA-256 extraction. Strict UTC timestamps when present.</li><li>Transparent similarity scoring; no machine learning or threat attribution.</li><li>Classic PCAP 2.4 metadata validation. No packet decoding, PCAPNG, IPv6 or malware analysis.</li><li>Fictional contacts. No authentication, messages, synchronization, live feeds or production security.</li></ul><p class="notice">Use synthetic data only. Browser storage and exports are unencrypted. Text artifact contents are included in JSON exports.</p><div class="guide-actions"><button class="btn" data-action="sample-file">${icon('download')} Sample log</button><button class="btn danger" data-action="reset">Reset workspace</button></div></article></div>`;}
function ingestDialog(){modal(`<span class="eyebrow">${current().id} / EVIDENCE INGESTION</span><h2>Add evidence</h2><p>Paste a log or IOC list. Import files to preserve their filename and source lines.</p><div class="upload-picker"><label class="btn">${icon('upload')} Choose files<input id="file-input" type="file" multiple accept=".log,.txt,.csv,.json,.pcap" hidden></label><span>2 MB per file · text or classic PCAP</span></div><label class="field">Evidence text<textarea id="evidence-text" rows="8" placeholder="2026-11-05T09:14:02Z query=sync-cache.example client=192.0.2.24"></textarea></label><p class="error" id="ingest-error" role="alert"></p><div class="form-actions"><button class="btn primary" data-action="parse">Extract & attach</button><button class="btn" data-action="load-sample">Load example</button></div><p class="micro">Observables are unverified. Nothing is uploaded or executed.</p>`);}
function attach(e){const c=current();if(c.evidence.some(x=>x.name===e.name&&x.text===e.text&&x.bytes===e.bytes)){toast('This evidence is already attached.');return false;}c.evidence.push(e);c.events.push({at:time(),text:`Evidence attached: ${e.name}`,type:'evidence'});save();return true;}
async function filesIngest(files){let count=0,errors=[];for(const f of [...files]){try{if(!/\.(txt|log|csv|json|pcap)$/i.test(f.name))throw Error('Use .txt, .log, .csv, .json, or .pcap.');if(f.size>C.MAX_BYTES)throw Error('File exceeds 2 MB.');const e=/\.pcap$/i.test(f.name)?C.parsePcap(await f.arrayBuffer(),f.name):C.parseText(await f.text(),f.name);if(attach(e))count++;}catch(e){errors.push(f.name+': '+e.message);}}tab='evidence';render();if(errors.length){if(!$('#modal').open)ingestDialog();$('#ingest-error').textContent=`${count?count+' file(s) attached. ':''}${errors.join(' ')}`;}else{close();toast(count?`${count} evidence artifact${count===1?'':'s'} attached.`:'No new evidence attached.');}}
function download(name,text,mime){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function exportDialog(){if(current().draft){tab='report';render();toast('Review and save your recovered report edits before exporting.');return;}modal(`<span class="eyebrow">${current().id} / LOCAL EXPORT</span><h2>Ready for handover.</h2><p>Export the selected incident, saved report, source references, and linked exercise bulletins.</p><div class="export-options"><button class="export-option" data-export="md">${icon('file')}<div><strong>Markdown report</strong><span>Readable incident brief with evidence inventory</span></div>${icon('download')}</button><button class="export-option" data-export="json">${icon('file')}<div><strong>JSON evidence package</strong><span>Full incident, raw text, observables, and provenance</span></div>${icon('download')}</button></div><div class="notice">SYNTHETIC EXERCISE DATA will be included. Reports remain analyst drafts; export does not imply approval.</div>`);}
function sourceDialog(e,line){modal(`<span class="eyebrow">SOURCE ARTIFACT / ${e.kind==='pcap'?'METADATA ONLY':'ORIGINAL TEXT'}</span><h2>${esc(e.name)}</h2><p>${esc(e.warning)}</p>${e.kind==='pcap'?`<div class="source-metadata">${e.packets} packet records · ${e.bytes} bytes<br>First timestamp: ${e.timestamps[0]?.value||'None'}<br>Last timestamp: ${e.timestamps.at(-1)?.value||'None'}</div>`:`<pre class="source-code">${e.text.split(/\r?\n/).map((s,i)=>`<span class="source-code-line ${line===i+1?'highlight':''}"><b>${String(i+1).padStart(2,'0')}</b>${esc(s)}</span>`).join('')}</pre>`}<p class="micro">${e.timestamps.length} recognized UTC timestamps · ${e.observables.length} unique observables</p>`);}
function newDialog(){modal(`<span class="eyebrow">NEW LOCAL RECORD</span><h2>Log an incident</h2><p>Describe what you observed. Evidence and similarity matching come next.</p><form id="new-form" novalidate><label class="field">Incident title<input name="title" required minlength="6" maxlength="120" placeholder="e.g. Repeated DNS queries on relay endpoint"></label><div class="field-pair"><label class="field">Severity<select name="severity"><option>Moderate</option><option>High</option><option>Critical</option><option>Low</option></select></label><label class="field">Fictional unit<select name="unit">${['Aster Watch','Kestrel Cell','Orion Desk','Morrow Team','Vale Watch','Northstar Lab'].map(s=>`<option>${s}</option>`).join('')}</select></label></div><label class="field">Affected system<input name="systems" required maxlength="100" placeholder="e.g. Relay DNS"></label><label class="field">Observation<textarea name="description" rows="4" required minlength="20" maxlength="4000" placeholder="What happened? What is known, and what remains uncertain?"></textarea></label><p id="new-error" class="error" role="alert"></p><div class="form-actions"><button class="btn primary" type="submit">Create incident ${icon('arrow')}</button><button class="btn" type="button" data-action="close">Cancel</button></div></form>`);}
document.addEventListener('click',async e=>{
 const el=e.target.closest('button,a');if(!el)return;
 if(el.dataset.page){e.preventDefault();page=el.dataset.page;render();return;}
 if(el.dataset.select){selected=el.dataset.select;tab='overview';page='workspace';render();return;}
 if(el.dataset.tab){tab=el.dataset.tab;render();return;}
 if(el.dataset.source!==undefined){sourceDialog(current().evidence[Number(el.dataset.source)]);return;}
 if(el.dataset.observable!==undefined){const o=C.uniqueObservables(current())[Number(el.dataset.observable)],source=current().evidence.find(e=>e.name===o.source&&e.observables.some(x=>x.value===o.value));sourceDialog(source,o.line);return;}
 if(el.dataset.remove!==undefined){const i=Number(el.dataset.remove);modal(`<h2>Remove this evidence?</h2><p>${esc(current().evidence[i].name)} will leave the incident. Saved report text remains unchanged; review it after removal.</p><div class="form-actions"><button class="btn danger" data-confirm-remove="${i}">Remove evidence</button><button class="btn" data-action="close">Keep evidence</button></div>`);return;}
 if(el.dataset.confirmRemove!==undefined){const c=current(),i=Number(el.dataset.confirmRemove);c.events.push({at:time(),text:'Evidence removed: '+c.evidence[i].name,type:'evidence'});c.evidence.splice(i,1);save();close();render();toast('Evidence removed. Review any saved report findings.');return;}
 if(el.dataset.link){const c=current(),id=el.dataset.link;const has=c.bulletins.includes(id);c.bulletins=has?c.bulletins.filter(x=>x!==id):[...c.bulletins,id];c.events.push({at:time(),text:`Bulletin ${has?'unlinked':'linked'}: ${id}`,type:'bulletin'});save();close();render();toast(has?'Bulletin unlinked.':'Bulletin linked to '+c.id+'.');return;}
 if(el.dataset.bulletin){const b=D.bulletins.find(x=>x.id===el.dataset.bulletin);modal(`<span class="eyebrow">${b.id} / CACHED EXERCISE EXAMPLE</span><h2>${esc(b.title)}</h2><p>${esc(b.summary)}</p><div class="notice">${b.provenance}</div><a href="${b.url}" target="_blank" rel="noopener">${b.reference} ↗</a><div class="form-actions"><button class="btn" data-link="${b.id}">Unlink from ${current().id}</button></div>`);return;}
 if(el.dataset.export){const c=current(),json=el.dataset.export==='json';download(c.id+(json?'.json':'.md'),json?JSON.stringify(C.exportPayload({...c,report:c.report||C.reportFor(c,D.bulletins)},D.bulletins),null,2):C.markdown(c,D.bulletins),json?'application/json':'text/markdown');close();toast(`${c.id} ${json?'JSON package':'Markdown report'} exported.`);return;}
 switch(el.dataset.action){
 case 'close':close();break;
 case 'new':newDialog();break;
 case 'clear-filters':query='';severityFilter='All';statusFilter='All';render();break;
 case 'clear-bulletins':bulletinQuery='';bulletinSeverity='All';render();break;
 case 'ingest':ingestDialog();break;
 case 'load-sample':$('#evidence-text').value=D.sampleLog;break;
 case 'parse':try{const attached=attach(C.parseText($('#evidence-text').value,`pasted-${current().evidence.length+1}.txt`));if(attached){close();tab='evidence';render();toast('Evidence parsed and attached. Review the extracted observables.');}}catch(error){$('#ingest-error').textContent=error.message;}break;
 case 'sample-file':download('exercise-dns.log',D.sampleLog,'text/plain');toast('Synthetic sample log downloaded.');break;
 case 'export':exportDialog();break;
 case 'method':modal(`<span class="eyebrow">TRANSPARENT / DETERMINISTIC</span><h2>Why these cases match</h2><p>The score ranks local cases for review. It is not a confidence percentage, threat score, or evidence of a common cause.</p><ol class="method-list"><li><b>Up to 60 points</b>30 points for each distinct, exact shared observable.</li><li><b>Up to 35 points</b>Shared words divided by all unique words in titles, descriptions, and systems, excluding common stop words.</li><li><b>5 points</b>An exact affected-system match.</li></ol><p>Only matches scoring at least 5 are shown. Source evidence and analyst validation should determine relevance.</p>`);break;
 case 'contact':{const c=current(),email=c.unit.toLowerCase().replace(/ /g,'.')+'@example.invalid';modal(`<span class="eyebrow">FICTIONAL CONTACT / NO MESSAGING</span><h2>${esc(c.unit)}</h2><p>Exercise directory entry. Identity is not verified and this address cannot receive mail.</p><div class="contact-card"><label>EXERCISE EMAIL</label><code id="contact-text">${esc(email)}</code><label>LOCAL ROLE</label><strong>Investigation watch team · ${esc(c.region)}</strong></div><button class="btn" data-action="copy-contact">Copy fictional address</button>`);break;}
 case 'copy-contact':try{await navigator.clipboard.writeText($('#contact-text').textContent);toast('Fictional contact copied. No message was sent.');}catch{const range=document.createRange();range.selectNodeContents($('#contact-text'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('Address selected. Use your browser’s copy command.');}break;
 case 'reset':modal(`<h2>Reset the exercise workspace?</h2><p>This removes locally created incidents and edits, then restores the six example records. Export any reports you want to keep first.</p><div class="form-actions"><button class="btn danger" data-action="confirm-reset">Reset local data</button><button class="btn" data-action="close">Cancel</button></div>`);break;
 case 'confirm-reset':cases=structuredClone(D.seed);selected='INC-0249';storageIssue='';save();page='workspace';tab='overview';query='';statusFilter=severityFilter='All';close();render();toast('Exercise workspace restored.');break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='case-search'){query=e.target.value;$('#case-list').innerHTML=caseList();}if(e.target.id==='bulletin-search'){bulletinQuery=e.target.value;$('#bulletin-grid').innerHTML=bulletinCards();}if(e.target.closest('#report-form')){current().draft=Object.fromEntries(new FormData($('#report-form')));save();$('#report-form').dataset.dirty='true';$('#report-dirty').textContent='Edits recovered locally · save before exporting.';}});
document.addEventListener('change',e=>{switch(e.target.id){case 'status-filter':statusFilter=e.target.value;$('#case-list').innerHTML=caseList();break;case 'severity-filter':severityFilter=e.target.value;$('#case-list').innerHTML=caseList();break;case 'bulletin-severity':bulletinSeverity=e.target.value;$('#bulletin-grid').innerHTML=bulletinCards();break;case 'incident-status':{const c=current();c.status=e.target.value;c.events.push({at:time(),text:'Status changed to '+c.status.toLowerCase(),type:'status'});save();render();toast('Incident status updated.');break;}case 'file-input':filesIngest(e.target.files);break;}});
document.addEventListener('submit',e=>{if(e.target.id==='new-form'){e.preventDefault();const values=Object.fromEntries(new FormData(e.target)),error=C.validateIncident(values);if(error){$('#new-error').textContent=error;return;}const id='INC-'+String(Math.max(...cases.map(c=>Number(c.id.split('-')[1])))+1).padStart(4,'0');const unitCase=D.seed.find(c=>c.unit===values.unit);cases.unshift({...values,title:values.title.trim(),description:values.description.trim(),systems:values.systems.trim(),id,region:unitCase?.region||'Exercise',status:'Investigating',created:new Date().toISOString(),evidence:[],bulletins:[],events:[{at:time(),text:'Local incident created',type:'status'}]});selected=id;save();page='workspace';tab='overview';query='';statusFilter=severityFilter='All';close();render();toast(id+' created. Add evidence to compare related cases.');}
 if(e.target.id==='report-form'){e.preventDefault();current().report=Object.fromEntries(new FormData(e.target));delete current().draft;current().events.push({at:time(),text:'Analyst report draft saved',type:'report'});save();render();toast('Report draft saved.');}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dropzone')){e.preventDefault();$('#dropzone').classList.add('dragover');}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#dropzone'))$('#dropzone').classList.remove('dragover');});
document.addEventListener('drop',e=>{if(e.target.closest('#dropzone')){e.preventDefault();filesIngest(e.dataTransfer.files);}});
document.addEventListener('click',e=>{if(e.target.closest('#dropzone')&&!e.target.closest('button'))ingestDialog();});
document.addEventListener('keydown',e=>{if(e.target.id==='dropzone'&&['Enter',' '].includes(e.key)){e.preventDefault();ingestDialog();}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
render();
})();
</script></body></html>
