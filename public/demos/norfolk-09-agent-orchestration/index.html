function conflicts(s){

function advance(s){

  if(s.paused)throw new Error('Resume systems before reviewing a request.');
  if(typeof note!=='string'||note.trim().length<5||note.length>300)throw new Error('Add a decision reason (5–300 characters).');

function changeRules(s,budget,autonomyLimit){

function eventsPanel(full){const count=live()?session.events.length:replay+1;return `<section class="panel event-panel"><header class="panel-head"><div><h2>${full?'Session event log':'Recent activity'}</h2>${full?'<small>Choose a recorded state to replay.</small>':''}</div><div class="event-tools"><input class="search" id="event-search" aria-label="Search events" placeholder="Search events…" value="${esc(query)}"><select class="select" id="event-filter" aria-label="Filter event type">${[['all','All events'],['request','Requests'],['decisions','Decisions'],['policy','Policy'],['paused','Pauses'],['denied','Denied']].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select></div></header><div id="event-rows">${eventRows(full)}</div><footer class="event-footer"><span>${count} RECORDED EVENTS · ORDERED STATE SNAPSHOTS</span><span>${full?'SESSION MEMORY ONLY':'<button data-action="page" data-id="history">View full history →</button>'}</span></footer></section>`}
function eventRows(full){const max=live()?session.events.length:replay+1;let rows=session.events.slice(0,max).filter(e=>(filter==='all'||(filter==='decisions'?['approved','rejected','rollback'].includes(e.type):e.type===filter))&&`${e.title} ${e.detail} ${agentName(e.agent)} ${e.type}`.toLowerCase().includes(query.toLowerCase()));rows=rows.reverse();if(!full)rows=rows.slice(0,4);if(!rows.length)return '<div class="empty"><h3>No matching events</h3><p>Try another search term or select “All events”.</p></div>';return `<div class="table-scroller"><table class="event-table"><thead><tr><th>SIM TIME</th><th>EVENT</th><th class="agent-col">SYSTEM</th><th>STATE</th></tr></thead><tbody>${rows.map(e=>`<tr><td class="time">${e.time}</td><td><div class="event-type"><i class="dot ${e.type}"></i><span class="event-title">${esc(e.title)}</span></div></td><td class="agent agent-col">${agentName(e.agent)}</td><td><button data-action="replay" data-id="${e.seq-1}" aria-label="Replay event ${e.seq}">Replay ${icon('arrow',12)}</button></td></tr>`).join('')}</tbody></table></div>`}
function agentsView(s){return `<div class="agents-grid">${AGENTS.map(a=>`<article class="panel agent-card"><header><span class="agent-icon">${icon(a.icon,23)}</span><div><h3>${a.name}</h3><div class="role">${a.role}</div></div></header><p>${a.description}</p><dl><dt>Information access</dt><dd>${a.access}</dd><dt>Delegated actions</dt><dd>${a.actions.join(' · ')}</dd><dt>Authority</dt><dd>${a.authority}</dd></dl><footer><span class="badge ${s.agents[a.id].paused||s.paused?'paused':'live'}">${s.agents[a.id].paused||s.paused?'Paused':'Enabled'}</span><button class="btn" data-action="pause-agent" data-id="${a.id}" ${!live()?'disabled':''}>${icon(s.agents[a.id].paused?'play':'pause',13)}${s.agents[a.id].paused?'Resume':'Pause'}</button></footer></article>`).join('')}</div><div class="callout">All identities, access lists, and permissions are illustrative model inputs. No system is connected to vessel equipment, sensors, networks, or accounts.</div>`}
function rulesView(s){return `<div class="policy-grid"><section class="panel"><header class="panel-head"><h2>Execution contract</h2><span class="pill">4 explicit rules</span></header>${[['G-01','Delegate only low-impact actions','Allowed observations and recommendations run automatically when dependencies are complete. Reservations up to the configured autonomy limit may run automatically.'],['G-02','Escalate larger reservations',`A power reservation above ${s.autonomyLimit} kW requires an operator decision and a recorded reason. Pending requests reserve no capacity.`],['G-03','Never exceed delegated authority','An action not on a system’s allowed list is denied. Operator approval cannot override this boundary. Comms cannot publish externally.'],['G-04','Honor dependencies and resource limits',`All upstream requests must be complete. Total reserved power cannot exceed ${s.budget} kW. A global or individual pause blocks execution. Completed dependent actions prevent reservation rollback.`]].map(([n,t,d])=>`<div class="policy-row"><span class="rule-num">${n}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</section><section class="panel"><header class="panel-head"><h2>Resource policy</h2><span class="eyebrow">EDITABLE</span></header><form class="policy-form" id="policy-form"><p>Changing these local rules reevaluates pending requests and creates an audit event. It cannot revoke already completed actions.</p><label class="field-label" for="budget">Auxiliary capacity / kW (20–200)</label><input id="budget" type="number" min="20" max="200" step="1" required value="${s.budget}" ${!live()?'disabled':''}><label class="field-label" for="autonomy">Automatic reservation limit / kW (0–20)</label><input id="autonomy" type="number" min="0" max="20" step="1" required value="${s.autonomyLimit}" ${!live()?'disabled':''}><div class="callout">${usedPower(s)} kW already reserved. The capacity cannot be lowered beneath that amount.</div><button class="btn green" ${!live()?'disabled':''}>${icon('check',15)} Apply resource policy</button><div class="request-bottom">Illustrative model, not a naval standard or safety certification.</div></form></section></div>`}
function historyView(s){return `${live()?`<div class="ribbon ok">${icon('history',20)}<div><strong>Replay decisions, not just messages.</strong><span>Each event preserves the complete local state after its rules were evaluated.</span></div><button data-action="replay" data-id="0">Start replay →</button></div>`:`<div class="replay-detail"><b>${esc(session.events[replay].title)}</b><br>${esc(session.events[replay].detail)}</div>`}${reserve(s)}${eventsPanel(true)}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="btn" data-action="export">${icon('download',14)} Download full audit JSON</button><button class="btn" data-action="reset">${icon('reset',14)} Reset exercise</button></div>`}
function openModal(title,body,footer){modalFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button data-action="close-modal" class="btn text" aria-label="Close dialog">${icon('close',20)}</button></div><div class="modal-content">${body}</div><div class="modal-footer">${footer||'<button class="btn dark" data-action="close-modal">Done</button>'}</div></section></div>`;$('#modal-root button, #modal-root input, #modal-root textarea')?.focus()}
function closeModal(){$('#modal-root').innerHTML='';modalFocus?.focus()}
function download(name,value){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function resetWith(scenario){stop();session=createSession(scenario);replay=null;page='overview';selected=session.requests.find(r=>r.status==='waiting')?.id||session.requests[0]?.id;inspector='request';requestTab='pending';query='';filter='all';noteDraft='';closeModal();render()}
function importModal(){openModal('Load a synthetic scenario',`<p>Paste scenario JSON or choose a file. Loading replaces the in-memory session. Export the current audit first if you want to keep it. Only the six fictional systems and four action types are supported.</p><label class="btn file-label">${icon('upload',15)} Choose JSON file<input type="file" accept="application/json,.json" id="scenario-file" class="hidden"></label><textarea id="scenario-json" aria-label="Scenario JSON" placeholder='{"version":1,"title":"My exercise",…}'></textarea><div class="error" id="import-error" role="alert"></div>`,`<button class="btn" data-action="template">Download sample</button><button class="btn" data-action="close-modal">Cancel</button><button class="btn green" data-action="load-scenario">Validate & load</button>`)}
function guide(){openModal('A five-minute walkthrough',`<p>CONDUCT is a handcrafted, offline governance simulation for Norfolk #9. Every result is produced by explicit local rules.</p><ol class="help-steps"><li><strong>Inspect the conflict.</strong> Thermal requests 45 kW; Cargo requests 60 kW. The shared reserve is 90 kW.</li><li><strong>Make a decision.</strong> Enter a reason and approve Thermal. Cargo goes on hold because only 45 kW remains. Reject Cargo with a reason.</li><li><strong>Show the boundary.</strong> Use Next event. Comms attempts external publication and is denied by its authority rule.</li><li><strong>Demonstrate control.</strong> Pause all systems, then resume. Click a system to inspect its access and pause it independently.</li><li><strong>Replay the record.</strong> Open Event history, choose Replay, and scrub through snapshots. Export the complete audit JSON.</li></ol><div class="callout">Synthetic only. No AI inference, real controls, production security, or live data. Session changes are held in browser memory; export before refreshing.</div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;
if(action==='page'){page=id;render()}
if(action==='agent'){selectedAgent=id;inspector='agent';render()}
if(action==='back-requests'){inspector='request';render()}
if(action==='request-tab'){requestTab=id;inspector='request';noteDraft='';render()}
if(action==='request'){selected=id;noteDraft='';render()}
if(action==='dependency'){selected=id;requestTab='all';noteDraft='';render()}
if(action==='focus-request'){page='overview';inspector='request';requestTab='pending';render();$('#review-panel').scrollIntoView({behavior:'smooth',block:'nearest'})}
if(action==='next')act(()=>{const r=advance(session);if(['waiting','blocked','denied'].includes(r.status)){selected=r.id;requestTab=r.status==='denied'?'all':'pending';inspector='request';noteDraft=''}},'Next scenario request received.');
if(action==='pause')act(()=>{stop();pause(session,!session.paused)},session.paused?'All systems resumed.':'All systems paused.');
if(action==='pause-agent')act(()=>pauseAgent(session,id),'System containment updated.');
if(action==='approve'||action==='reject')act(()=>{decide(session,id,action==='approve',noteDraft);noteDraft=''},`Decision recorded: ${action==='approve'?'approved':'rejected'}.`);
if(action==='run'){if(timer){stop();render()}else if(live()&&!session.paused){timer=setInterval(()=>{try{advance(session);if(session.cursor>=session.scenario.requests.length)stop();render()}catch(e){stop();toast(e.message,true);render()}},1800);render();toast('Receiving one scripted request every 1.8 seconds.')}}
if(action==='replay'){stop();replay=Number(id);render()}
if(action==='live'){replay=null;render()}
if(action==='export'){download('conduct-harbor-audit.json',exportAudit(session));toast(`Audit exported with ${session.events.length} state snapshots.`)}
if(action==='import')importModal();
if(action==='template'){download('conduct-sample-scenario.json',DEMO);toast('Sample scenario downloaded.');}
if(action==='load-scenario'){try{const text=$('#scenario-json').value;if(text.length>250000)throw new Error('Scenario is too large. Maximum size: 250 KB.');const value=validateScenario(JSON.parse(text));resetWith(value);toast(`Loaded ${value.requests.length} validated requests.`)}catch(err){$('#import-error').textContent=err instanceof SyntaxError?'Invalid JSON. Check quotes, commas, and closing brackets.':err.message}}
if(action==='close-modal')closeModal();
if(action==='guide')guide();
if(action==='reset')openModal('Reset this exercise?',`<p>This clears current decisions and the event history, then reloads the current scenario at its initial four requests. Export your audit first to keep a copy.</p>`,`<button class="btn" data-action="close-modal">Keep session</button><button class="btn" data-action="export">Export audit</button><button class="btn dark" data-action="confirm-reset">Reset exercise</button>`);
if(action==='confirm-reset'){resetWith(session.scenario);toast('Exercise reset to its opening state.')}
if(action==='rollback')openModal('Release a reservation',`<p>Rollback releases simulated power capacity. A completed downstream action prevents rollback. This does not reverse any real equipment.</p><label class="field-label" for="rollback-note">Rollback reason (5–300 characters)</label><textarea class="note" style="height:90px;font-family:inherit" id="rollback-note" maxlength="300"></textarea><div class="error" id="rollback-error" role="alert"></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn dark" data-action="confirm-rollback" data-id="${esc(id)}">Release reservation</button>`);
if(action==='confirm-rollback'){try{rollback(session,id,$('#rollback-note').value);closeModal();render();toast('Reservation released. Dependents remain held.')}catch(e){$('#rollback-error').textContent=e.message}}
});
document.addEventListener('input',e=>{if(e.target.id==='decision-note')noteDraft=e.target.value;if(e.target.id==='event-search'){query=e.target.value;$('#event-rows').innerHTML=eventRows(page==='history')}});
document.addEventListener('change',async e=>{if(e.target.id==='replay-slider'){replay=Number(e.target.value);render();$('#replay-slider')?.focus()}if(e.target.id==='event-filter'){filter=e.target.value;$('#event-rows').innerHTML=eventRows(page==='history')}if(e.target.id==='scenario-file'){const file=e.target.files[0];if(!file)return;if(file.size>250000){$('#import-error').textContent='File is too large. Maximum size: 250 KB.';return}$('#scenario-json').value=await file.text();$('#import-error').textContent=''}});
document.addEventListener('submit',e=>{if(e.target.id==='policy-form'){e.preventDefault();act(()=>changeRules(session,Number($('#budget').value),Number($('#autonomy').value)),'Policy updated and pending requests reevaluated.')}});
document.addEventListener('keydown',e=>{const modal=$('.modal');if(!modal)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusable=[...modal.querySelectorAll('button:not(:disabled),input:not(.hidden),textarea,select,a')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script></body></html>
