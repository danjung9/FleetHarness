</script><script>(()=>{'use strict';
const C=CASREP,KEY='casrep-command-norfolk08-v1',app=document.querySelector('#app'),modal=document.querySelector('#modal');
const icons={file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M9 4 4 9l5 5M4 9h10a6 6 0 0 1 6 6v5"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',ship:'<path d="m3 15 9-4 9 4-3 5H6zM6 13V7h12v6M9 7V3h6v4M3 22h18"/>',edit:'<path d="m16 3 5 5-12 12-6 1 1-6zM13 6l5 5"/>',shield:'<path d="m12 2 9 4v6c0 6-9 10-9 10S3 18 3 12V6z"/><path d="m8 12 3 3 5-6"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M5 15a8 8 0 0 0 13 3"/>'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24">${icons[n]||icons.file}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=s=>new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+'Z';
const date=s=>C.validTime(s)?new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' UTC':s||'Not provided';
let reports=seedReports(),selected=reports[0].id,tab='overview',role='CHENG',search='',filter='all',errors={},draft=null,dirty=false,compare=0,storageWarning='';
try{const stored=localStorage.getItem(KEY);if(stored){const x=JSON.parse(stored);if(!Array.isArray(x)||!x.length||x.some(r=>!r.id||!r.data||!Array.isArray(r.versions)||!r.versions.length||!Array.isArray(r.comments)||!Array.isArray(r.audit)||!Array.isArray(r.approvals)||!['draft','returned','review','released'].includes(r.status)))throw Error();reports=x;selected=reports[0].id;}}catch{storageWarning='Saved workspace could not be loaded. The synthetic examples are restored; use Export to keep a copy.';}
const current=()=>reports.find(r=>r.id===selected)||reports[0];
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(reports));}catch{storageWarning='Browser storage is unavailable. Export your report before leaving this page.';toast(storageWarning);}};
let toastTimer;function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4200);}
const stateLabel=r=>({review:`With ${C.roles[r.stage]}`,draft:'Draft',returned:'Revision requested',released:'Released · simulated'}[r.status]);
function badge(r){return `<span class="badge ${r.status==='returned'?'amber':r.status==='draft'?'neutral':''}"><span class="dot ${r.status}"></span>${esc(stateLabel(r))}</span>`;}
function queue(){const items=reports.filter(r=>(filter==='all'||r.status===filter)&&`${r.id} ${r.data.title} ${r.data.equipment}`.toLowerCase().includes(search.toLowerCase()));return items.length?items.map(r=>`<button class="report-item ${r.id===selected?'selected':''}" data-action="select" data-id="${r.id}" aria-current="${r.id===selected?'true':'false'}"><div class="item-meta"><span>${r.id}</span><span class="cat">CAT ${esc(r.data.category||'—')}</span></div><h3>${esc(r.data.title)}</h3><div class="item-footer"><span><i class="dot ${r.status}"></i>${esc(stateLabel(r))}</span><span>v${r.versions.length}</span></div></button>`).join(''):`<div class="empty">No matching reports.<br><button class="btn small subtle" data-action="clear-search">Clear filters</button></div>`;}
function render(){const r=current();app.innerHTML=`${storageWarning?`<div class="storage-warning">${esc(storageWarning)}</div>`:''}<div class="shell"><nav class="rail" aria-label="Workspace navigation"><div class="brand-icon">${icon('file')}</div><button class="rail-btn active" title="Report workspace" aria-label="Report workspace" data-action="workspace">${icon('grid')}</button><button class="rail-btn" title="Activity log" aria-label="Activity log" data-tab="activity">${icon('clock')}</button><button class="rail-btn" title="Import draft" aria-label="Import draft" data-action="import">${icon('upload')}</button><div class="rail-bottom"><button class="rail-btn" title="Demo guide" aria-label="Demo guide" data-action="guide">${icon('info')}</button><div class="avatar" title="Synthetic training workspace">08</div></div></nav><aside class="sidebar"><div><div class="sidebar-brand"><div class="wordmark">CASREP <span>Command</span></div><div class="mobile-tools"><button class="btn small subtle" data-action="import" aria-label="Import draft on mobile">${icon('upload')}</button><button class="btn small subtle" data-action="guide" aria-label="Demo guide on mobile">${icon('info')}</button></div></div><div class="eyebrow sidebar-sub">Readiness starts with clarity</div></div><div class="workspace-label"><span class="ship-icon">${icon('ship')}</span><div><b>FNS Meridian</b><div class="eyebrow">DDG-021 · Training unit</div></div></div><div class="search">${icon('search')}<input id="search" type="search" aria-label="Search reports" placeholder="Search reports…" value="${esc(search)}"></div><div class="queue-heading"><span class="eyebrow">Report workspace <span class="count">${reports.length}</span></span><select id="filter" aria-label="Filter reports">${[['all','All reports'],['review','In review'],['returned','Returned'],['draft','Drafts'],['released','Released']].map(([v,l])=>`<option value="${v}" ${v===filter?'selected':''}>${l}</option>`).join('')}</select></div><div id="report-list" class="report-list">${queue()}</div><button class="new-report" data-action="new">+ &nbsp; New casualty report</button><div class="side-foot"><b>● &nbsp; Synthetic exercise workspace</b><br>Local drafts. Simulated approvals.<br>No operational messages transmitted.<div style="margin-top:12px"><button class="btn small subtle" data-action="guide">Demo guide ${icon('arrow')}</button></div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong>${esc(r.id)}</strong></div><div class="top-actions"><div class="local">● &nbsp; LOCAL WORKSPACE</div><div class="identity"><span class="avatar">${role==='CHENG'?'CE':role==='Originator'?'OR':role==='Division Officer'?'DO':role==='Department Head'?'DH':role}</span><div><label for="role">Simulated role</label><select id="role">${C.roles.map(x=>`<option ${x===role?'selected':''}>${x}</option>`).join('')}</select></div></div></div></header><div class="content"><section class="heading"><div><div class="eyebrow">CASUALTY REPORT &nbsp; / &nbsp; ${esc(r.id)} &nbsp; / &nbsp; REVISION ${r.versions.length.toString().padStart(2,'0')}</div><h1>${esc(r.data.title)}</h1><div class="heading-meta">${badge(r)}<span>${esc(r.data.type)} report</span><span>Category ${esc(r.data.category||'—')}</span><span>${esc(r.data.jsn||'Maintenance reference pending')}</span></div></div><div class="buttons"><button class="btn mobile-new" data-action="new">${icon('plus')} New</button><button class="btn" data-action="export">${icon('download')} Export draft</button><button class="btn primary" data-action="${['draft','returned'].includes(r.status)?'edit':'review-focus'}">${icon(['draft','returned'].includes(r.status)?'edit':'check')}${['draft','returned'].includes(r.status)?'Continue draft':r.status==='released'?'View release':'Review report'}</button></div></section>${route(r)}<nav class="tabs" aria-label="Report sections">${[['overview','Report'],['draft','Draft editor'],['revisions','Revisions'],['activity','Activity']].map(([id,label])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${label}${id==='revisions'?`<span class="count">${r.versions.length}</span>`:''}</button>`).join('')}<span class="tab-note">${dirty?'Unsaved changes':'Saved locally'} &nbsp; · &nbsp; Synthetic data</span></nav><div class="workspace"><div>${tab==='overview'?documentView(r):tab==='draft'?editor(r):tab==='revisions'?revisions(r):activity(r)}</div><aside>${reviewPanel(r)}<div class="context-note">${icon('shield')} &nbsp; <b>Exercise environment</b><br>Illustrative report fields and validation. This demo does not certify NWP 1-03.1 compliance or provide authenticated approvals.</div></aside></div><footer class="footer"><span>NORFOLK 08 &nbsp; / &nbsp; CASREP COMMAND</span><span>SYNTHETIC · LOCAL ONLY · NO TRANSMISSION</span></footer></div></main></div>`;}
function route(r){return `<section class="route-box" aria-label="Approval chain"><div class="section-row"><span class="eyebrow">Approval chain</span><span class="route-status">${r.status==='review'?`Current owner: <strong>${C.roles[r.stage]}</strong>`:r.status==='released'?'All review stages complete':`Current owner: <strong>Originator</strong>`}</span></div><div class="route">${C.roles.map((name,i)=>{const done=r.status==='released'||r.status==='review'&&i<r.stage;const active=i===(r.status==='review'?r.stage:0)&&r.status!=='released';const approved=r.approvals.find(a=>a.role===name);return`<div class="route-step ${done?'done':active?'current':'pending'}"><div class="route-circle">${done?icon('check'):(i+1).toString().padStart(2,'0')}</div><div class="route-text">${{Originator:'Originator','Division Officer':'Division officer','Department Head':'Dept. head',CHENG:'CHENG',XO:'XO',CO:'CO / Release'}[name]}<span>${done?(i===0?'Submitted':approved?'Approved':'Complete'):active?(r.status==='returned'?'Revise & resubmit':r.status==='draft'?'Drafting':'In review'):'Pending'}</span></div></div>`;}).join('')}</div></section>`;}
function documentView(r){const d=r.data;return `<article class="paper"><header class="paper-top"><div class="paper-mark">${icon('file')}<div><div class="eyebrow">Synthetic / Training only</div><h2>${esc(d.type)} casualty report</h2></div></div><div class="doc-number">${r.id}<br>REV ${r.versions.length.toString().padStart(2,'0')}</div></header><div class="doc-body"><div class="facts">${[['Reporting unit',d.unit],['Equipment / system',d.equipment],['Casualty reported',date(d.occurred)],['Estimated restoration',date(d.estimate)]].map(([l,v])=>`<div class="fact"><div class="eyebrow">${l}</div><p>${esc(v)}</p></div>`).join('')}${d.reference?`<div class="fact"><div class="eyebrow">Previous report</div><p>${esc(d.reference)}</p></div>`:''}</div>${[['impact','Mission impact'],['narrative','Casualty narrative'],['actions','Corrective action'],['support','Support required']].map(([key,label],i)=>`<section class="document-section ${key==='impact'?'impact':''}"><span class="section-number">0${i+1}</span><div><h3>${label}</h3><p>${esc(d[key]||'Not provided — originator input required.')}</p></div></section>`).join('')}</div><footer class="paper-bottom"><span>ILLUSTRATIVE REPORT · ${esc(d.jsn)}</span><span>END OF REPORT</span></footer></article>`;}
function reviewPanel(r){const errs=C.validate(draft&&tab==='draft'?draft:r.data),missing=Object.keys(errs).length,total=C.required.length+(r.data.type!=='INITIAL'?1:0),can=role===C.roles[r.stage]&&r.status==='review',editable=['draft','returned'].includes(r.status),isOrigin=role==='Originator';return `<section class="review-panel" id="review-panel"><header><div class="eyebrow">${r.status==='released'?'Release record':'Review station'}</div><h2>${r.status==='review'?'Ready for your review':r.status==='returned'?'Changes requested':r.status==='released'?'Released in simulation':'Prepare for review'}</h2><p>${r.status==='review'?'Verify the impact, repair plan, and support request before forwarding.':r.status==='returned'?'Update the draft and resolve the reviewer’s request to restart the chain.':r.status==='released'?'All five review stages are complete. This record is now read-only.':'Complete the required fields to begin the approval chain.'}</p><div class="reviewer-line"><div class="avatar">${r.status==='review'?C.roles[r.stage].slice(0,2).toUpperCase():r.status==='released'?'CO':'OR'}</div><div><b>${r.status==='review'?C.roles[r.stage]:r.status==='released'?'Commanding Officer':'Originator / LPO'}</b><small>${r.status==='released'?time(r.releasedAt):'Simulated responsibility'}</small></div></div></header><div class="inner"><div class="check-summary ${missing?'invalid':''}">${icon(missing?'info':'check')} ${missing?`${missing} validation ${missing===1?'issue':'issues'}`:'All required fields complete'}</div><div class="progress-track"><i style="width:${Math.max(0,(total-missing)/total*100)}%"></i></div>${missing?`<ul class="error-list">${Object.values(errs).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}${r.status!=='released'?`<label for="review-note">${editable?'Reviewer discussion':'Review note'} <span class="muted">${editable?'':'(optional for approval)'}</span></label><textarea id="review-note" placeholder="${editable?'Add context for the review chain…':'Add a comment or describe a requested revision…'}"></textarea><div class="review-actions">${r.status==='review'?(can?`<button class="btn primary" data-action="approve">${icon('check')}${r.stage===5?'Simulate CO release':'Approve & forward'}</button><button class="btn" data-action="return">${icon('back')}Return for revision</button>`:`<button class="btn primary" data-action="assume">Review as ${C.roles[r.stage]} ${icon('arrow')}</button>`):`<button class="btn primary" data-action="${isOrigin?'submit':'assume'}">${isOrigin?'Submit for review':'Continue as originator'} ${icon('arrow')}</button>${isOrigin?`<button class="btn" data-action="edit">${icon('edit')}Edit draft</button>`:''}`}<button class="btn subtle" data-action="comment">Add comment</button></div><p class="review-note">${r.status==='review'?`Approval applies to revision ${r.versions.length}. Returning a report restarts its approval chain.`:'Drafts may be saved with missing fields. Submission requires a valid report and resolved change requests.'}</p>`:`<div class="notice success">${icon('check')} &nbsp; Local release completed.<br>No message was sent to an external system.</div><button class="btn primary" data-action="export" style="width:100%">${icon('download')}Export release record</button>`}<div class="comments"><h3>Reviewer discussion <span class="count">${r.comments.length}</span></h3>${r.comments.length?r.comments.map(c=>`<article class="comment"><div class="comment-author">${esc(c.role)} <span>${time(c.at)}</span></div><p>${esc(c.text)}</p>${c.resolved?`<span class="comment-state">✓ Resolved in draft</span>`:c.blocking?`<span class="comment-state open">● Revision requested</span>`:`<span class="comment-state open">Discussion note</span>`}${!c.resolved&&editable&&isOrigin?`<button class="btn small subtle" data-action="resolve" data-id="${esc(c.id)}">Mark resolved ${icon('check')}</button>`:''}</article>`).join(''):`<p class="review-note">No comments yet. Add context for the next reviewer.</p>`}</div></div></section>`;}
function field(key,type='text',wide=false){const d=draft||current().data;return `<div class="field ${wide?'wide':''}"><label for="f-${key}">${C.fields[key]} ${C.required.includes(key)?'<small>· required</small>':'<small>· for updates / corrections</small>'}</label>${type==='textarea'?`<textarea id="f-${key}" name="${key}" aria-invalid="${!!errors[key]}" maxlength="6000">${esc(d[key])}</textarea>`:type==='select'?`<select id="f-${key}" name="${key}">${(key==='type'?['INITIAL','UPDATE','CORRECT','CASCOR']:['2','3','4']).map(v=>`<option value="${v}" ${v===d[key]?'selected':''}>${key==='category'?'Category ':''}${v}</option>`).join('')}</select>`:`<input id="f-${key}" name="${key}" value="${esc(d[key])}" aria-invalid="${!!errors[key]}" maxlength="6000" ${['occurred','estimate'].includes(key)?'placeholder="2026-11-05T08:40Z"':''}>`}${errors[key]?`<p class="field-error">${esc(errors[key])}</p>`:''}</div>`;}
function editor(r){if(role!=='Originator'||!['draft','returned'].includes(r.status))return `<div class="paper"><div class="empty">${icon('shield')}<h2 style="font-size:17px;font-weight:500;margin-bottom:8px">${r.status==='review'?'This revision is in review':r.status==='released'?'Released records are read-only':'The originator owns this draft'}</h2><p style="margin-bottom:17px">${r.status==='review'?'Return it for revision to make changes and restart approvals.':r.status==='released'?'Create a new report with a reference to this release for follow-up.':'Switch the simulated role to continue editing.'}</p>${['draft','returned'].includes(r.status)?'<button class="btn primary" data-action="assume">Continue as originator</button>':'<button class="btn" data-tab="overview">Back to report</button>'}</div></div>`;if(!draft)draft={...r.data};return `<form id="draft-form" class="paper" novalidate><header class="paper-top"><div><div class="eyebrow">Guided drafting</div><h2>Prepare revision ${(r.versions.length+1).toString().padStart(2,'0')}</h2></div><span class="badge neutral">Originator</span></header><div class="form-body">${r.status==='returned'?'<div class="notice">This report was returned for revision. Save your changes, mark the requested comments resolved, then resubmit. All review stages will run again.</div>':''}<div class="form-section"><span>01</span> Report identity</div><div class="form-grid">${field('title','text',true)}${field('unit')}${field('equipment')}${field('type','select')}${field('category','select')}${field('jsn')}${field('reference')}</div><div class="form-section"><span>02</span> Timing & operational impact</div><div class="form-grid">${field('occurred')}${field('estimate')}${field('impact','textarea',true)}${field('narrative','textarea',true)}</div><div class="form-section"><span>03</span> Recovery plan</div><div class="form-grid">${field('actions','textarea',true)}${field('support','textarea',true)}</div></div><footer class="form-actions"><span>UTC timestamps · illustrative validation</span><div class="buttons"><button type="button" class="btn" data-action="validate">Validate</button><button type="submit" class="btn primary">Save revision ${icon('check')}</button></div></footer></form>`;}
function revisions(r){const a=r.versions[Math.min(compare,r.versions.length-1)],b=r.versions.at(-1),changes=C.diff(a.data,b.data);return `<section class="paper"><header class="paper-top"><div><div class="eyebrow">Version history</div><h2>Every revision, in context</h2></div></header><div class="revisions-head"><label for="compare">Compare</label><select id="compare">${r.versions.map((v,i)=>`<option value="${i}" ${i===compare?'selected':''}>Revision ${i+1} · ${time(v.at)}</option>`).join('')}</select><span class="muted">→</span><span style="font-size:12px">Current · v${r.versions.length}</span><span class="badge neutral">${changes.length} changed ${changes.length===1?'field':'fields'}</span></div>${changes.length?changes.map(c=>`<div class="diff-row"><h3>${esc(c.label)}</h3><div class="diff-columns"><div class="diff-content old"><div class="eyebrow">Before · v${compare+1}</div>${esc(c.before)||'Not provided'}</div><div class="diff-content new"><div class="eyebrow">After · v${r.versions.length}</div>${esc(c.after)||'Not provided'}</div></div></div>`).join(''):`<div class="empty">${icon('check')}No field changes between these versions.</div>`}</section>`;}
function activity(r){return `<section class="paper"><header class="paper-top"><div><div class="eyebrow">Report audit trail</div><h2>From draft to release</h2></div><span class="badge neutral">${r.audit.length} events</span></header><div class="activity-body">${r.audit.slice().reverse().map(e=>`<article class="audit-item"><h3>${esc(e.action)}</h3><p>${esc(e.detail)}</p><div class="audit-meta">${time(e.at)} &nbsp; / &nbsp; ${esc(e.role)} &nbsp; / &nbsp; v${e.version}</div></article>`).join('')}<p style="font-size:10px;color:var(--sub)">Browser-local activity history. This record is editable in storage and is not a tamper-proof audit system.</p></div></section>`;}
function openDialog(title,body,footer=''){modal.innerHTML=`<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${title}</h2><button class="close" data-action="close" aria-label="Close dialog">×</button></header><div class="dialog-content">${body}</div>${footer?`<footer>${footer}</footer>`:''}</section></div>`;app.inert=true;modal.querySelector('button,input,textarea')?.focus();}
function closeDialog(){modal.innerHTML='';app.inert=false;}
function importDialog(){openDialog('Import a synthetic draft',`<p>Paste a JSON draft or open a JSON file. Imported content always starts as an unapproved draft; review history is not imported.</p><div class="buttons"><button class="btn small" data-action="sample">Load example</button></div><input type="file" class="file-input" id="import-file" accept=".json,application/json" aria-label="Choose JSON draft"><textarea id="import-text" aria-label="JSON draft" spellcheck="false" placeholder='{"title":"…", "unit":"…"}'></textarea><p id="import-error" class="field-error" role="alert"></p>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="import-confirm">Import draft ${icon('arrow')}</button>`);}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Export downloaded. Synthetic data only.');}
function showExport(){const r=current();openDialog('Export report',`<p>${esc(r.id)} · revision ${r.versions.length} · ${esc(stateLabel(r))}. Exports include a clear synthetic-data label.</p><button class="export-option" data-action="export-text">${icon('file')}<span><b>Readable report · .txt</b><small>Current report fields and the approval record.</small></span></button><button class="export-option" data-action="export-json">${icon('download')}<span><b>Full report record · .json</b><small>Report, revisions, comments, approvals, and activity trail.</small></span></button><p>Formatting is illustrative and is not a certified Navy message format. No export sends or releases a message externally.</p>`);}
function guide(){openDialog('A clear path from draft to release',`<div class="eyebrow">Norfolk 08 · Handcrafted local demonstration</div><h3>1. Review the casualty</h3><p>The selected synthetic pump casualty is with CHENG. Read the report, compare revisions, and inspect the earlier return in Activity.</p><h3>2. Ask for a revision</h3><p>As CHENG, enter a review note and choose Return for revision. Continue as originator, edit the recovery plan, save, and mark the requested comment resolved.</p><h3>3. Run the approval chain</h3><p>Submit the revised draft. Switch to each assigned reviewer with Review as…, then approve through Division Officer, Department Head, CHENG, XO, and CO.</p><h3>4. Release and export</h3><p>Simulate CO release, then export the full JSON record or readable draft. The report becomes read-only locally.</p><h3>Scope & provenance</h3><p>Based on case 8 in the bundled Norfolk catalogue. NWP 1-03.1 and sponsor templates were referenced by the brief but not supplied; the fields and validation here are explicitly illustrative. Identities and approvals are simulated. Data stays in this browser; there is no real messaging, security boundary, or live integration.</p>`,`<button class="btn" data-action="reset-confirm">Reset demo data</button><button class="btn primary" data-action="close">Start walkthrough ${icon('arrow')}</button>`);}
function ensureSaved(){if(dirty)throw Error('Save the current revision before leaving the editor or routing the report.');}
function action(name,el){const r=current();try{
 if(name==='close'){closeDialog();return;}
 if(name==='select'){ensureSaved();selected=el.dataset.id;draft=null;errors={};compare=0;tab='overview';render();return;}
 if(name==='clear-search'){search='';filter='all';render();return;}
 if(name==='workspace'){ensureSaved();tab='overview';render();return;}
 if(name==='new'){ensureSaved();openDialog('Start a casualty report',`<p>Create a synthetic draft. Required-field checks will guide it through review.</p><div class="form-grid"><div class="field wide"><label for="new-title">Casualty title</label><input id="new-title" placeholder="e.g. Forward ventilation fan fault" maxlength="180"></div><div class="field wide"><label for="new-unit">Reporting unit</label><input id="new-unit" value="FNS Meridian · DDG-021" maxlength="180"></div></div><p id="new-error" class="field-error" role="alert"></p>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="new-confirm">Create draft ${icon('arrow')}</button>`);return;}
 if(name==='new-confirm'){const title=document.querySelector('#new-title').value.trim(),unit=document.querySelector('#new-unit').value.trim();if(!title||!unit){document.querySelector('#new-error').textContent='Enter a title and reporting unit.';return;}const data=Object.fromEntries(Object.keys(C.fields).map(k=>[k,'']));Object.assign(data,{title,unit,type:'INITIAL',category:'2'});createDraft(data);return;}
 if(name==='edit'){ensureSaved();role='Originator';tab='draft';draft={...r.data};render();return;}
 if(name==='review-focus'){ensureSaved();tab='overview';render();document.querySelector('#review-panel').scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('#review-note')?.focus({preventScroll:true});return;}
 if(name==='assume'){ensureSaved();role=r.status==='review'?C.roles[r.stage]:'Originator';if(['draft','returned'].includes(r.status)){tab='draft';draft={...r.data};}render();return;}
 if(name==='validate'){errors=C.validate(draft||r.data);render();toast(Object.keys(errors).length?`${Object.keys(errors).length} issues need attention.`:'All required fields are complete.');return;}
 if(name==='save'){C.save(r,draft||r.data,role);draft={...r.data};dirty=false;errors=C.validate(r.data);persist();render();toast(`Revision ${r.versions.length} saved locally.`);return;}
 if(name==='submit'){ensureSaved();errors=C.validate(r.data);C.submit(r,role);draft=null;tab='overview';persist();render();toast('Submitted to Division Officer.');return;}
 if(name==='approve'||name==='return'){ensureSaved();C.review(r,role,name==='approve'?'approve':'return',document.querySelector('#review-note')?.value||'');draft=null;persist();render();toast(r.status==='released'?'Simulated release complete. No message transmitted.':r.status==='returned'?'Returned to originator for revision.':`Forwarded to ${C.roles[r.stage]}.`);return;}
 if(name==='comment'){C.addComment(r,role,document.querySelector('#review-note').value);persist();render();toast('Comment added to the activity record.');return;}
 if(name==='resolve'){ensureSaved();C.resolve(r,role,el.dataset.id);persist();render();toast('Comment marked resolved.');return;}
 if(name==='import'){ensureSaved();importDialog();return;}
 if(name==='sample'){document.querySelector('#import-text').value=JSON.stringify({...seedReports()[0].data,title:'Forward ventilation fan fault',equipment:'VENT-FWD-02 / Ventilation',jsn:'MERI-261105-008'},null,2);return;}
 if(name==='import-confirm'){try{createDraft(C.parseImport(document.querySelector('#import-text').value));}catch(e){document.querySelector('#import-error').textContent=e.message;}return;}
 if(name==='export'){ensureSaved();showExport();return;}
 if(name==='export-text'){download(`${r.id}-v${r.versions.length}-synthetic.txt`,C.exportText(r),'text/plain');closeDialog();return;}
 if(name==='export-json'){download(`${r.id}-v${r.versions.length}-record.json`,JSON.stringify(C.exportObject(r),null,2),'application/json');closeDialog();return;}
 if(name==='guide'){guide();return;}
 if(name==='reset-confirm'){openDialog('Reset this demo workspace?',`<p>This removes locally created reports and revisions and restores the four synthetic examples. Export any work you want to keep first.</p>`,`<button class="btn" data-action="close">Keep my work</button><button class="btn primary" data-action="reset">Restore examples</button>`);return;}
 if(name==='reset'){reports=seedReports();selected=reports[0].id;role='CHENG';tab='overview';draft=null;dirty=false;errors={};search='';filter='all';storageWarning='';persist();closeDialog();render();toast('Synthetic workspace restored.');}
 }catch(e){toast(e.message);if(name==='submit'&&Object.keys(errors).length){tab='draft';render();}}}
function createDraft(data){const max=Math.max(27,...reports.map(r=>Number(r.id.split('-')[1])||0)),r=C.create('MER-'+(max+1).toString().padStart(3,'0'),data);reports.unshift(r);selected=r.id;role='Originator';tab='draft';draft={...data};dirty=false;errors={};filter='all';search='';persist();closeDialog();render();toast('Draft created. Complete the required fields before routing.');}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-tab]');if(!target)return;if(target.dataset.tab){try{ensureSaved();tab=target.dataset.tab;errors={};render();}catch(err){toast(err.message);}return;}if(target.closest('form'))e.preventDefault();action(target.dataset.action,target);});
document.addEventListener('submit',e=>{if(e.target.id==='draft-form'){e.preventDefault();action('save');}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;document.querySelector('#report-list').innerHTML=queue();}if(e.target.closest('#draft-form')&&e.target.name){draft[e.target.name]=e.target.value;dirty=true;const note=document.querySelector('.tab-note');if(note)note.textContent='Unsaved changes · Synthetic data';}});
document.addEventListener('change',async e=>{if(e.target.id==='role'){try{ensureSaved();role=e.target.value;render();}catch(err){e.target.value=role;toast(err.message);}}if(e.target.id==='filter'){filter=e.target.value;document.querySelector('#report-list').innerHTML=queue();}if(e.target.id==='compare'){compare=Number(e.target.value);render();}if(e.target.id==='import-file'){const file=e.target.files[0];if(file){if(file.size>200000){document.querySelector('#import-error').textContent='Choose a JSON file smaller than 200 KB.';return;}document.querySelector('#import-text').value=await file.text();}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.innerHTML)closeDialog();if(e.key==='Tab'&&modal.innerHTML){const nodes=[...modal.querySelectorAll('button,input,textarea,select')].filter(n=>!n.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
})();
</script></body></html>
