function canonical(value) {
  if (Array.isArray(value)) return '[' + value.map(canonical).join(',') + ']';
  if (value && typeof value === 'object') return '{' + Object.keys(value).sort().map(k => JSON.stringify(k) + ':' + canonical(value[k])).join(',') + '}';
  return JSON.stringify(value);
}

function validateScenario(input) {
  const errors = [];
  const fail = message => errors.push(message);
  const text = x => typeof x === 'string' && x.trim().length > 0 && x.length <= 500;

  if (!input || typeof input !== 'object' || Array.isArray(input)) return ['Expected a scenario object.'];
  if (input.version !== 1) fail('version must be 1.');
  if (!id(input.id) || !text(input.name) || !text(input.description)) fail('Scenario needs an ID, name and description (1–500 characters).');

  unique(input.agents, 'Agents'); unique(input.resources, 'Resources'); unique(input.frames, 'Frames');

    if (!a || !text(a.name) || !text(a.role) || !Array.isArray(a.actions) || a.actions.some(x => !['read', 'reserve', 'write'].includes(x)) || !Array.isArray(a.resources) || a.resources.some(x => !resources.has(x))) fail(`Agent ${a?.id || '?'} has an invalid permission boundary.`);
  }
  let lastAt = -1;

    if (!f || !text(f.name) || !text(f.description) || !Number.isInteger(f.at) || f.at < 0 || f.at <= lastAt) fail(`Frame ${f?.id || '?'} needs a name, description and strictly increasing nonnegative integer at.`);
    lastAt = f?.at;

    const streams = new Set(f.telemetry.map(t => t?.id));
    for (const t of f.telemetry) {
      if (!t || !text(t.name) || !text(t.unit) || !Number.isFinite(t.min) || !Number.isFinite(t.max) || t.min >= t.max || !Number.isFinite(t.tolerance) || t.tolerance < 0 || !Number.isFinite(t.maxAge) || t.maxAge <= 0 || !Array.isArray(t.samples) || t.samples.length > 20) { fail(`Stream ${t?.id || '?'} has invalid bounds, age or samples.`); continue; }
      unique(t.samples, `${t.id} samples`);
      for (const s of t.samples) if (!s || !text(s.source) || !Number.isInteger(s.at) || s.at < 0 || !(s.value === null || Number.isFinite(s.value))) fail(`Stream ${t.id}: samples need numeric/null value, nonnegative integer at, source and ID.`);
    }
    for (const r of f.requests) {
      if (!r || !agents.has(r.agent) || !resources.has(r.resource) || !['read','reserve','write'].includes(r.action) || !text(r.title) || !text(r.source) || !Number.isInteger(r.priority) || r.priority < 0 || r.priority > 100 || !array(r.evidence, 30) || r.evidence.some(x => !streams.has(x))) fail(`Request ${r?.id || '?'} has invalid identity, resource, action, priority, evidence or source.`);
    }
  }
  return errors;
}

function parseScenario(text) {
  if (new TextEncoder().encode(text).length > 500000) return { errors: ['Scenario exceeds the 500 KB input limit.'] };
  let scenario;
  try { scenario = JSON.parse(text); } catch (e) { return { errors: ['Invalid JSON. Check commas, quotes, and brackets.'] }; }
  const errors = validateScenario(scenario);
  return errors.length ? { errors } : { scenario: JSON.parse(JSON.stringify(scenario)), errors: [] };
}

function assessTelemetry(stream, now) {
  const samples = stream.samples.filter(s => s.value !== null);
  if (!samples.length) return { status: 'unknown', reason: 'No usable sample. Value is UNKNOWN.', value: null };
  if (samples.some(s => s.at > now)) return { status: 'isolated', reason: 'Sample timestamp is ahead of the replay clock.', value: null };
  if (samples.some(s => s.value < stream.min || s.value > stream.max)) return { status: 'isolated', reason: `Sample outside illustrative bounds ${stream.min}–${stream.max} ${stream.unit}.`, value: null };
  const fresh = samples.filter(s => now - s.at <= stream.maxAge);
  if (!fresh.length) return { status: 'stale', reason: `All samples are older than ${stream.maxAge}s. Value is UNKNOWN.`, value: null };
  if (Math.max(...fresh.map(s=>s.value)) - Math.min(...fresh.map(s=>s.value)) > stream.tolerance) return { status: 'isolated', reason: `Sources disagree by more than ${stream.tolerance} ${stream.unit}.`, value: null };
  const latest = [...fresh].sort((a,b) => b.at-a.at || a.id.localeCompare(b.id, 'en'))[0];
  return { status: 'trusted', reason: `Within bounds; ${now-latest.at}s old.`, value: latest.value, sample: latest.id };
}

function evaluate(scenario, frameIndex, controls = {}) {
  const frame = scenario.frames[frameIndex];
  const halted = controls.halted || [];
  const approvals = controls.approvals || {};
  const telemetry = frame.telemetry.map(t => ({ ...t, ...assessTelemetry(t, frame.at) }));
  const byStream = Object.fromEntries(telemetry.map(t => [t.id,t]));
  const results = frame.requests.map(request => {
    const agent = scenario.agents.find(a => a.id === request.agent);
    const trace = [];
    let status = 'ready', rule = 'P05', reason = 'Eligible for operator review. No operational action is executed.';
    const permission = controls.permissions?.[agent.id] || agent;
    if (halted.includes(agent.id)) { status = 'denied'; rule = 'P01'; reason = `${agent.name} is halted. Local access and reservations are revoked.`; }
    trace.push({rule:'P01', pass:status !== 'denied', detail:status === 'denied' ? reason : `${agent.name} is an active simulated identity.`});
    if (status === 'ready') {
      const allowed = permission.actions.includes(request.action) && permission.resources.includes(request.resource);
      if (!allowed) { status='denied'; rule='P02'; reason=`${request.action.toUpperCase()} on ${scenario.resources.find(r=>r.id===request.resource).name} is outside this agent’s permission boundary.`; }
      trace.push({rule:'P02',pass:allowed,detail:allowed?'Action and resource are explicitly permitted.':reason});
    }
    if (status === 'ready') {
      const blocked = request.evidence.map(id=>byStream[id]).filter(t=>t.status !== 'trusted');
      if (blocked.length) { status='isolated'; rule='P03'; reason=blocked.map(t=>`${t.name}: ${t.reason}`).join(' '); }
      trace.push({rule:'P03',pass:!blocked.length,detail:blocked.length?reason:'All referenced evidence passes freshness, range and consistency checks.'});
    }
    return {...request,status,rule,reason,trace};
  });
  const eligible = results.filter(r=>r.status==='ready').sort((a,b)=>Number(Boolean(approvals[b.id]))-Number(Boolean(approvals[a.id])) || b.priority-a.priority || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  const reservations = Object.create(null);
  for (const r of eligible) {
    if (r.action !== 'read' && reservations[r.resource]) {
      const winner=reservations[r.resource];
      r.status='held'; r.rule='P04'; r.winner=winner; r.reason=`${winner} has the reservation. ${approvals[winner] ? 'An operator selection takes precedence.' : 'Higher priority wins; equal priority uses request ID.'}`;
      r.trace.push({rule:'P04',pass:false,detail:r.reason});
    } else {
      if (r.action !== 'read') reservations[r.resource]=r.id;
      r.trace.push({rule:'P04',pass:true,detail:r.action==='read'?'Read-only requests do not take exclusive reservations.':'Exclusive simulation reservation is available.'});
      if (approvals[r.id]) { r.status='approved'; r.reason=`Operator approved this simulation proposal: ${approvals[r.id]}`; }
      r.trace.push({rule:'P05',pass:true,detail:'Proposal only. No real equipment, personnel or records can be changed.'});
    }
  }
  return {frame,telemetry,results,reservations,trusted:telemetry.filter(t=>t.status==='trusted').length};
}

async function sha256(text) {
  const digest = await globalThis.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function appendAudit(events, type, payload) {
  const event={sequence:events.length+1,type,payload,previous:events.at(-1)?.hash || '0'.repeat(64)};
  event.hash=await sha256(canonical(event));
  return [...events,event];
}

async function verifyAudit(events) {
  if (!Array.isArray(events)) return {valid:false,index:0};
  let previous='0'.repeat(64);
  for (let i=0;i<events.length;i++) {
    if (!events[i] || typeof events[i] !== 'object' || typeof events[i].hash !== 'string') return {valid:false,index:i};
    const {hash,...event}=events[i];
    if(event.sequence!==i+1 || event.previous!==previous || hash!==await sha256(canonical(event))) return {valid:false,index:i};
    previous=hash;
  }
  return {valid:true,count:events.length,head:previous};
}

function requestRows(){
 const rows=report.results.filter(r=>(filter==='all'||r.status===filter)&&[r.title,r.id,agentName(r.agent),resourceName(r.resource)].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.priority-a.priority || a.id.localeCompare(b.id));
 if(!rows.length)return `<div class="empty"><h3>${report.results.length?'No matching requests':'No requests in this frame'}</h3><p>${report.results.length?'Try another search or decision filter.':'Import a scenario with requests, or select another frame.'}</p><button class="btn small" data-action="${report.results.length?'clear-filter':'nav'}" data-view="lab">${report.results.length?'Clear filters':'Open scenario lab'}</button></div>`;
 return `<table class="request-table"><thead><tr><th>INTENT / PRIORITY</th><th>AGENT</th><th>DECISION</th></tr></thead><tbody>${rows.map(r=>`<tr class="${state.selected===r.id?'selected':''}" data-action="select" data-id="${esc(r.id)}"><td><button class="row-select" data-action="select" data-id="${esc(r.id)}" aria-label="Inspect ${esc(r.id)}: ${esc(r.title)}"><strong>${esc(r.title)}</strong><span class="sub">${esc(r.id)} · PRIORITY ${r.priority} · ${esc(r.action.toUpperCase())}</span></button></td><td class="agent-cell">${esc(agentName(r.agent))}</td><td>${badge(r.status)}</td></tr>`).join('')}</tbody></table>`;
}
function inspector(){
 const r=current();if(!r)return `<div class="empty"><h3>No decision selected</h3><p>Select a request to inspect its policy trail.</p></div>`;
 const titles={P01:'Identity verified',P02:'Permission boundary',P03:'Evidence validated',P04:'Resource arbitration',P05:'Human authority'};
 return `<div class="panel-head"><div><div class="eyebrow">DECISION INSPECTOR</div><p class="mono">${esc(r.id)} / ${esc(r.rule)}</p></div>${icon('shield')}</div><div class="inspector-inner">${badge(r.status)}<h2 class="inspector-title">${esc(r.title)}</h2><dl class="definition"><dt>Requested by</dt><dd class="mono">${esc(agentName(r.agent))}</dd><dt>Resource</dt><dd>${esc(resourceName(r.resource))}</dd><dt>Priority</dt><dd>${r.priority} / 100 <span class="muted">· illustrative</span></dd></dl><div class="reason ${r.status}"><b>${esc(r.rule)} · ${r.status==='held'?'RESOURCE CONTENTION':r.status==='denied'?'BOUNDARY ENFORCED':r.status==='isolated'?'EVIDENCE QUARANTINE':'POLICY OUTCOME'}</b><p>${esc(r.reason)}</p></div><div class="eyebrow trace-title">DECISION PATH</div><ol class="trace">${r.trace.map(t=>`<li><span class="step-icon ${t.pass?'':'fail'}">${t.pass?'✓':'!'}</span><div><h3>${t.rule} · ${titles[t.rule]}</h3><p>${esc(t.detail)}</p></div></li>`).join('')}</ol><div class="inspector-actions">${['ready','held','approved'].includes(r.status)?`<button class="btn primary" data-action="review">${icon('edit')}${r.status==='held'?'Review & reassign':r.status==='approved'?'Edit approval note':'Review proposal'}</button>`:`<button class="btn ghost" data-action="${r.status==='isolated'?'evidence':'nav'}" data-view="registry" data-id="${esc(r.evidence.find(id=>report.telemetry.find(t=>t.id===id)?.status!=='trusted')||r.evidence[0])}">${icon('info')}${r.status==='isolated'?'Inspect blocked evidence':'Inspect permission boundary'}</button>`}<button class="btn danger" data-action="halt" data-id="${esc(r.agent)}" ${state.controls.halted.includes(r.agent)?'disabled':''}>${icon('stop')} Halt / isolate ${esc(agentName(r.agent))}</button><span class="small muted" style="text-align:center;font-size:9px">Local proposals only · operator authority retained</span></div><div class="source-ref"><span class="eyebrow">PROVENANCE</span><br>${esc(r.source)}</div></div>`;
}
function replay(){return `<section class="replay" aria-label="Scenario replay"><div class="replay-label"><b>Scenario replay</b><small>${state.frame+1} / ${state.scenario.frames.length} frames</small></div><div class="replay-track">${state.scenario.frames.map((f,i)=>`<button class="frame-btn ${i===state.frame?'active':''}" data-action="frame" data-index="${i}" ${i===state.frame?'aria-current="step"':''}><span class="point"></span>${esc(f.name)}<span class="frame-time">T+${String(f.at).padStart(3,'0')}s</span></button>`).join('')}</div><div class="replay-controls"><button class="btn ghost small" data-action="reset-replay" aria-label="Replay from baseline">${icon('reset')}</button><button class="btn small" data-action="play">${icon(playing?'pause':'play')}${playing?'Pause':'Play'}</button></div></section>`;}
function registry(){return pageHead('Boundaries, made explicit.','Review simulated identities, edit their local permissions, or revoke access.')+`<div class="registry-grid">${state.scenario.agents.map(a=>{const p=state.controls.permissions[a.id]||a;const halted=state.controls.halted.includes(a.id);return `<section class="panel agent-card"><div class="agent-card-top"><div class="avatar">${esc(a.name.slice(0,1))}</div><div><h2>${esc(a.name)}</h2><p>${esc(a.role)}</p></div>${badge(halted?'denied':'active')}</div><div class="eyebrow">ALLOWED ACTIONS</div><div class="permissions">${p.actions.length?p.actions.map(x=>`<span class="permission mono">${esc(x.toUpperCase())}</span>`).join(''):'<span class="muted small">No actions permitted</span>'}</div><div class="eyebrow">ACCESSIBLE RESOURCES</div><div class="permissions">${p.resources.length?p.resources.map(x=>`<span class="permission">${esc(resourceName(x))}</span>`).join(''):'<span class="muted small">No resources permitted</span>'}</div><div class="card-actions"><button class="btn small" data-action="edit-boundary" data-id="${esc(a.id)}">${icon('edit')}Edit boundary</button><button class="btn ${halted?'ghost':'danger'} small" data-action="${halted?'restore':'halt'}" data-id="${esc(a.id)}">${icon(halted?'reset':'stop')}${halted?'Restore identity':'Halt / isolate'}</button></div></section>`;}).join('')}</div><div class="scope-note">These identities and permissions exist only inside this exercise. Browser-local controls do not provide identity verification, hardware isolation, or production authorization.</div>`;}
function audit(){return pageHead('A decision is only half the story.','Inspect the evidence chain behind every replay, boundary change, and operator choice.')+`<section class="panel"><div class="panel-head"><div><h2>Session evidence ledger</h2><p>${state.events.length} events · SHA-256 linked · ${esc(auditStatus)}</p></div><div class="audit-toolbar"><button class="btn small" data-action="verify">${icon('shield')}Verify chain</button><button class="btn small" data-action="export">${icon('download')}Export</button></div></div><div class="audit-list">${state.events.length?state.events.map(e=>`<article class="audit-event"><span class="audit-seq">${String(e.sequence).padStart(3,'0')}</span><div><h3>${esc(e.type.replaceAll('_',' ').toLowerCase().replace(/^./,c=>c.toUpperCase()))}</h3><p>${esc(e.payload.note||e.payload.summary||e.payload.frameId||'Session record')} ${e.payload.agent?`· ${esc(agentName(e.payload.agent))}`:''}</p><div class="audit-hash">${esc(e.hash.slice(0,36))}…</div><div id="audit-detail-${e.sequence}" hidden><pre class="audit-detail">${esc(JSON.stringify(e,null,2))}</pre></div></div><button class="btn ghost small" data-action="event-detail" data-id="${e.sequence}" aria-expanded="false">Inspect</button></article>`).reverse().join(''):'<div class="empty">No recorded events yet.</div>'}</div></section><div class="scope-note">This local hash chain can reveal edits to individual records. It is not immutable storage: someone with browser access can replace the entire chain. No signatures, external anchor, or production security guarantee is provided.</div>`;}
function lab(){if(!labText)labText=JSON.stringify(state.scenario,null,2);return pageHead('Build the failure case.','Load structured synthetic inputs, then inspect how the same rules respond.')+`<div class="lab-layout"><section class="panel"><div class="panel-head"><div><h2>Scenario input</h2><p>Illustrative JSON schema v1 · maximum 500 KB</p></div><button class="btn ghost small" data-action="file-import">${icon('upload')}Choose file</button></div><div class="lab-body"><div class="scenario-select"><select id="example-select" aria-label="Choose scenario example"><option value="main">Contested engineering watch</option><option value="uncertainty">Evidence uncertainty drill</option><option value="empty">Empty request queue</option></select><button class="btn small" data-action="load-example">Load example</button></div><label for="scenario-json">Editable scenario JSON</label><textarea id="scenario-json" class="editor" spellcheck="false">${esc(labText)}</textarea><div class="lab-actions"><button class="btn primary" data-action="validate-load">${icon('check')}Validate & load</button><button class="btn ghost" data-action="export-scenario">${icon('download')}Download input</button><button class="btn ghost" data-action="current-input">Use current scenario</button></div><div id="lab-errors" role="alert">${labErrors.length?`<div class="form-errors"><b>Scenario not loaded</b><ul>${labErrors.slice(0,12).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}</div><input class="import-file" id="scenario-file" type="file" accept=".json,application/json"></div></section><aside class="panel lab-help"><div class="eyebrow green" style="margin-bottom:14px">AN EXERCISE, NOT AN INTEGRATION</div><h3>Make uncertainty visible.</h3><p>Try missing values, aged samples, contradictory sources, or a request outside an agent’s boundary.</p><div class="policies">${Object.entries(RULES).map(([k,v])=>`<div class="policy"><code>${k}</code><span>${esc(v)}</span></div>`).join('')}</div><h3>Input contract</h3><ol><li>Define agents and explicit permissions.</li><li>Define isolated resources.</li><li>Add strictly ordered replay frames.</li><li>Reference telemetry IDs in requests.</li></ol><p style="margin-top:20px">Loading a scenario clears local halts and approvals. Existing audit records remain in this session.</p><p>CASREP-like references are synthetic source labels, not certified format parsing.</p></aside></div>`;}
function render(){
 $('#app').innerHTML=`<div class="app-shell">${header()}${view==='overview'?overview():view==='registry'?registry():view==='audit'?audit():lab()}<footer class="footer-note"><span>${storageWarning?esc(storageWarning):'SYNTHETIC DATA · ILLUSTRATIVE POLICY · NO LIVE EQUIPMENT'}</span><span>${view==='overview'?'Replay frames clear local approvals, halts, and boundary edits.':'Handcrafted Norfolk #23 demonstration · local browser state'}</span></footer></main></div></div>`;
}
function showModal(title,html){stopPlayback();const m=$('#modal');m.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="close-btn" data-action="close" aria-label="Close dialog">×</button></div><div class="modal-body">${html}</div>`;m.showModal();}
function scope(){showModal('Policy, scope & provenance',`<p>VIBRANIUM GATEWAY is an offline simulation of agent permission boundaries, equipment casualty evidence, and competing resource requests. It issues no orders and changes no operational records.</p><div class="policies">${Object.entries(RULES).map(([k,v])=>`<div class="policy"><code>${k}</code><span>${esc(v)}</span></div>`).join('')}</div><p>Source: bundled Norfolk catalogue, case 23. The model uses illustrative priorities, bounds, freshness windows, and resources. It does not implement naval standards, clinical triage, hardware-enforced security, or a verified readiness score.</p><p>Local evaluation duration is measured in your browser. No fleet latency or cognitive-offload acceptance claim is made. All fonts, rules, and examples are bundled for offline use.</p><button class="btn" data-action="close">Return to exercise</button>`);}
function review(){const r=current();if(!r||!['ready','held','approved'].includes(r.status))return;showModal(r.status==='held'?'Review resource reassignment':'Review simulation proposal',`<div class="review-summary"><h3>${esc(r.title)}</h3><p>${esc(agentName(r.agent))} · ${esc(resourceName(r.resource))}</p></div><p>${r.status==='held'?`Choosing this request releases ${esc(r.winner)}’s local reservation. Identity, permissions, and evidence gates remain mandatory.`:'Record your decision and reasoning in the local evidence ledger. This approval authorizes only the simulated proposal.'}</p><label for="approval-note">Operator rationale <span class="muted">· required, 8–500 characters</span></label><textarea id="approval-note" maxlength="500" placeholder="Describe the exercise reason for this decision…">${esc(state.controls.approvals[r.id]||'')}</textarea><div id="review-error" class="dialog-feedback" role="alert"></div><div class="modal-actions"><button class="btn ghost" data-action="close">Cancel</button><button class="btn primary" data-action="approve" data-id="${esc(r.id)}">${r.status==='held'?'Reassign simulation resource':'Record simulation approval'}</button></div>`);}
function evidence(id){const t=report.telemetry.find(t=>t.id===id);if(!t)return;showModal('Evidence inspection',`<div class="review-summary"><h3>${esc(t.name)} ${badge(t.status)}</h3><p>${esc(t.reason)}</p></div><dl class="definition"><dt>Accepted value</dt><dd>${t.value===null?'UNKNOWN':`${esc(t.value)} ${esc(t.unit)}`}</dd><dt>Range</dt><dd>${t.min}–${t.max} ${esc(t.unit)} · illustrative</dd><dt>Freshness</dt><dd>At most ${t.maxAge}s old</dd><dt>Consistency</dt><dd>At most ${t.tolerance} ${esc(t.unit)} disagreement</dd><dt>Replay clock</dt><dd>T+${report.frame.at}s</dd></dl><div class="eyebrow">UNMODIFIED SOURCE SAMPLES</div><table class="sample-table"><thead><tr><th>Record / source</th><th>Value</th><th>Age</th></tr></thead><tbody>${t.samples.map(s=>`<tr><td><code>${esc(s.id)}</code><br><span class="muted">${esc(s.source)}</span></td><td>${s.value===null?'MISSING':esc(s.value)} ${esc(t.unit)}</td><td>${report.frame.at-s.at}s</td></tr>`).join('')||'<tr><td colspan="3">No source samples were provided.</td></tr>'}</tbody></table><p>Quarantined evidence cannot be approved into trust. Load fresh, valid synthetic samples or replay the clean-evidence frame to recover.</p><button class="btn" data-action="close">Close evidence</button>`);}
function boundary(id){const a=state.scenario.agents.find(a=>a.id===id);if(!a)return;const p=state.controls.permissions[id]||a;showModal(`Edit ${esc(a.name)}’s boundary`,`<p>Changes affect only this local simulation. Every subsequent request is re-evaluated, and existing approvals for this agent are cleared.</p><div class="eyebrow" style="margin-bottom:10px">ALLOWED ACTIONS</div><div class="check-grid">${['read','reserve','write'].map(x=>`<label><input type="checkbox" name="action" value="${x}" ${p.actions.includes(x)?'checked':''}>${x.toUpperCase()}</label>`).join('')}</div><div class="eyebrow" style="margin-bottom:10px">ACCESSIBLE RESOURCES</div><div class="check-grid">${state.scenario.resources.map(r=>`<label><input type="checkbox" name="resource" value="${esc(r.id)}" ${p.resources.includes(r.id)?'checked':''}>${esc(r.name)}</label>`).join('')}</div><label for="boundary-note">Reason for the change · 8–500 characters</label><textarea id="boundary-note" maxlength="500" placeholder="Describe the change in exercise authority…"></textarea><div id="boundary-error" class="dialog-feedback" role="alert"></div><div class="modal-actions"><button class="btn ghost" data-action="close">Cancel</button><button class="btn primary" data-action="save-boundary" data-id="${esc(id)}">Save & re-evaluate</button></div>`);}
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}
async function exportSession(){await auditQueue;download(`vibranium-${state.scenario.id}-session.json`,{format:'vibranium-simulation-session-v1',exportedAt:new Date().toISOString(),disclaimer:'Synthetic simulation only; local hash chain is not externally anchored or immutable.',scenario:state.scenario,frame:state.frame,controls:state.controls,results:report.results,telemetry:report.telemetry,decisionFingerprint:fingerprint,evaluationMs:elapsed,audit:state.events,auditVerification:await verifyAudit(state.events)});toast('Session exported with source inputs, decisions, and audit chain.');}
function stopPlayback(){playing=false;clearTimeout(playTimer);const control=$('[data-action="play"]');if(control)control.innerHTML=icon('play')+'Play';}
async function changeFrame(index){state.frame=index;state.controls={halted:[],approvals:{},permissions:{}};await run('FRAME_REPLAYED',{summary:`Replayed ${state.scenario.frames[index].name}; operator controls reset.`});}
async function tick(){if(!playing)return;if(state.frame>=state.scenario.frames.length-1){stopPlayback();render();return;}await changeFrame(state.frame+1);if(playing)playTimer=setTimeout(tick,2200);}
async function loadScenario(scenario){stopPlayback();state.scenario=scenario;state.frame=0;state.controls={halted:[],approvals:{},permissions:{}};state.selected=null;query='';filter='all';labText=JSON.stringify(scenario,null,2);labErrors=[];view='overview';await run('SCENARIO_LOADED',{scenario,summary:`Loaded ${scenario.name}`});toast('Scenario validated and loaded. Prior audit events are retained.');}

document.addEventListener('input',e=>{if(e.target.id==='request-search'){query=e.target.value;$('#request-rows').innerHTML=requestRows();}if(e.target.id==='scenario-json')labText=e.target.value;});
document.addEventListener('change',async e=>{if(e.target.id==='status-filter'){filter=e.target.value;$('#request-rows').innerHTML=requestRows();}if(e.target.id==='scenario-file'){const file=e.target.files[0];if(!file)return;if(file.size>500000){labErrors=['Scenario exceeds the 500 KB input limit.'];render();return;}labText=await file.text();labErrors=[];render();toast('File opened for review. Validate & load to apply it.');}});
document.addEventListener('click',async e=>{
 const target=e.target.closest('[data-action]');if(!target||target.disabled)return;
 const action=target.dataset.action,id=target.dataset.id;
 if(busy&&['approve','halt','restore','save-boundary','frame','validate-load'].includes(action))return;
 try{
 if(action==='nav')navigate(target.dataset.view);
 else if(action==='scope')scope();
 else if(action==='close')$('#modal').close();
 else if(action==='select'){state.selected=id;render();save();}
 else if(action==='agent-select'||action==='resource-select'){const r=report.results.find(r=>(action==='agent-select'?r.agent:r.resource)===id);if(r){state.selected=r.id;render();save();}else toast('No requests reference this item in the current frame.');}
 else if(action==='clear-filter'){query='';filter='all';render();}
 else if(action==='review')review();
 else if(action==='evidence')evidence(id);
 else if(action==='halt'){busy=true;stopPlayback();if(!state.controls.halted.includes(id))state.controls.halted.push(id);for(const r of report.results.filter(r=>r.agent===id))delete state.controls.approvals[r.id];await run('AGENT_HALTED',{agent:id,note:'Operator halted identity; proposals and local approvals revoked.'});toast(`${agentName(id)} isolated. Its local reservations are released.`);}
 else if(action==='restore'){busy=true;state.controls.halted=state.controls.halted.filter(x=>x!==id);await run('IDENTITY_RESTORED',{agent:id,note:'Operator restored simulated identity; policy gates re-evaluated.'});toast(`${agentName(id)} restored; policy gates re-evaluated.`);}
 else if(action==='approve'){
   const note=$('#approval-note').value.trim();if(note.length<8||note.length>500){$('#review-error').textContent='Enter a rationale of 8–500 characters.';return;}
   const r=current();if(!r||r.id!==id||!['ready','held','approved'].includes(r.status))return;
   busy=true;if(r.action!=='read')for(const other of report.results.filter(q=>q.resource===r.resource&&q.action!=='read'))delete state.controls.approvals[other.id];state.controls.approvals[id]=note;$('#modal').close();await run('OPERATOR_APPROVAL',{request:id,agent:r.agent,note});toast('Operator decision recorded. Simulation reservations updated.');
 }
 else if(action==='edit-boundary')boundary(id);
 else if(action==='save-boundary'){
   const note=$('#boundary-note').value.trim();if(note.length<8||note.length>500){$('#boundary-error').textContent='Enter a reason of 8–500 characters.';return;}
   busy=true;state.controls.permissions[id]={actions:[...$('#modal').querySelectorAll('[name="action"]:checked')].map(n=>n.value),resources:[...$('#modal').querySelectorAll('[name="resource"]:checked')].map(n=>n.value)};for(const r of report.results.filter(r=>r.agent===id))delete state.controls.approvals[r.id];$('#modal').close();await run('BOUNDARY_EDITED',{agent:id,note});toast('Permission boundary saved and requests re-evaluated.');
 }
 else if(action==='frame'){busy=true;stopPlayback();await changeFrame(Number(target.dataset.index));}
 else if(action==='reset-replay'){stopPlayback();await changeFrame(0);toast('Baseline restored. Local operator changes cleared.');}
 else if(action==='play'){if(playing){stopPlayback();render();}else{if(state.frame>=state.scenario.frames.length-1)await changeFrame(0);playing=true;render();playTimer=setTimeout(tick,1600);}}
 else if(action==='export')await exportSession();
 else if(action==='verify'){const result=await verifyAudit(state.events);auditStatus=result.valid?`Verified ${result.count} linked events`:`Mismatch at event ${result.index+1}`;render();toast(auditStatus);}
 else if(action==='event-detail'){const detail=$(`#audit-detail-${id}`);detail.hidden=!detail.hidden;target.setAttribute('aria-expanded',String(!detail.hidden));target.textContent=detail.hidden?'Inspect':'Collapse';}
 else if(action==='file-import')$('#scenario-file').click();
 else if(action==='load-example'){const choice=$('#example-select').value;let s=choice==='uncertainty'?uncertaintyScenario():clone(DEMO);if(choice==='empty'){s.id='EX-EMPTY';s.name='Empty request queue';s.frames=s.frames.slice(0,1);s.frames[0].requests=[];}labText=JSON.stringify(s,null,2);labErrors=[];render();toast('Example placed in editor. Validate & load to run it.');}
 else if(action==='current-input'){labText=JSON.stringify(state.scenario,null,2);labErrors=[];render();}
 else if(action==='validate-load'){const parsed=parseScenario(labText);if(parsed.errors.length){labErrors=parsed.errors;render();$('#lab-errors').scrollIntoView({block:'nearest'});}else{busy=true;await loadScenario(parsed.scenario);}}
 else if(action==='export-scenario'){const parsed=parseScenario(labText);if(parsed.errors.length){labErrors=parsed.errors;render();}else{download(`vibranium-${parsed.scenario.id}-input.json`,parsed.scenario);toast('Validated scenario input downloaded.');}}
 }catch(error){console.error(error);toast('Action could not complete. Your existing source input remains available.');}finally{busy=false;}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const rect=e.target.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)e.target.close();}});
if(!state.events.length)await append('SESSION_STARTED',{scenario:state.scenario,summary:'Synthetic local exercise initialized. No live integrations.'});
await run('POLICY_EVALUATED',{summary:'Local deterministic policy evaluated.'});
if(storageWarning)toast(storageWarning);
</script></body></html>
