function conflictModal(){const r=current();const q=state.queue.find(q=>q.recordId===r.id&&q.status==='conflict');if(!q)return toast('No unresolved conflict for this packet.');const changed=changedFields(q.snapshot,q.remote);openModal('Two versions. One decision.',`${esc(r.id)} · Your base revision ${q.baseRevision}, shore revision ${q.remoteRevision}`,`<div class="notice">${icon('info',17)}Choose each value explicitly. Resolving creates a new draft that must pass human review again. Local attachments stay with the draft.</div><form id="conflict-form">${changed.length?changed.map(f=>`<div class="conflict-field"><div class="conflict-label">${esc(labelMap[f])}</div><div class="conflict-choices">${[['local','On this device',q.snapshot],['shore','On shore',q.remote]].map(([val,label,obj])=>`<label class="conflict-choice"><input type="radio" name="${f}" value="${val}"><span><strong>${label}</strong><p>${esc(obj[f]||'Empty')}</p></span></label>`).join('')}</div></div>`).join(''):'<p>Content matches; only the shore revision changed. Continue to re-review against the current revision.</p>'}</form>`,`<button class="button" data-action="close">Cancel</button><button class="button primary" data-action="apply-resolution">Save resolved draft ${icon('arrow',14)}</button>`,true);}
const example=[{type:'task',title:'Prepare exercise records handover',department:'Administration',owner:'Records lead',due:'2026-11-09',priority:'Routine',summary:'Verify the synthetic records index, attach a handover note and route for department review.'}];
function importModal(){openModal('Bring work into the packet desk','Import synthetic records as drafts. Validation and human review follow.',`<p class="small-muted">JSON array or {"records": […]}. Supported types: supply, training, correspondence, task. Attachments and approvals are not imported.</p><textarea id="import-text" class="import-area" aria-label="Records JSON" placeholder='[{"type":"task","title":"…"}]'></textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="button small" data-action="import-example">Load example</button><button class="button small" data-action="import-file">Choose JSON file</button><input id="import-file" type="file" accept=".json,application/json" hidden></div>`,`<button class="button" data-action="close">Cancel</button><button class="button primary" data-action="import-submit">Import drafts ${icon('arrow',14)}</button>`);}
function download(name,obj,type='application/json'){const blob=obj instanceof Blob?obj:new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportPackets(records){const approved=records.filter(r=>r.workflow==='approved'&&r.review);if(!approved.length)return toast('No reviewed packets to export yet.');const ids=approved.map(r=>r.id);const payload={format:'paperless-underway-reviewed-packets-v1',synthetic:true,exportedAt:now(),scope:'Illustrative forms; no official form compliance or authenticated approvals.',records:approved.map(r=>({...snapshot(r),review:r.review,workflow:r.workflow,sync:r.sync,baseRevision:r.baseRevision})),outbox:state.queue.filter(q=>ids.includes(q.recordId)),audit:state.audit.filter(a=>ids.some(id=>a.detail.includes(id)))};download(`paperless-reviewed-${ids.length===1?ids[0]:'packets'}.json`,payload);commit('Reviewed packets exported',ids.join(', '),()=>{});toast(`${approved.length} reviewed ${approved.length===1?'packet':'packets'} exported with attachments and audit.`);render();}
const dropinShoreKey='paperless-underway-shore-dropin-v1';
const freshDropinShore=()=>({records:Object.fromEntries(seed().records.map(r=>[r.id,{revision:r.baseRevision,record:snapshot(r)}])),receipts:{},failNext:false});
let dropinShore=freshDropinShore();
try{const saved=JSON.parse(localStorage.getItem(dropinShoreKey));if(saved?.records&&saved?.receipts)dropinShore=saved;}catch{}
async function api(path,body={}){
 let result;
 if(path==='sync'){
  if(dropinShore.failNext){dropinShore.failNext=false;result={status:503,body:{error:'Simulated shore outage. Retry is safe.'}};}
  else result=acceptSync(dropinShore,body);
 }else if(path==='advance'){
  const item=dropinShore.records[body.id];
  if(!item)result={status:404,body:{error:'No simulated shore copy exists for this packet.'}};
  else{item.revision++;item.record.summary='Shore amendment: verify storeroom availability before release. '+item.record.summary;if(item.record.type==='supply')item.record.quantity=String(Number(item.record.quantity)+2);result={status:200,body:{revision:item.revision,record:item.record}};}
 }else if(path==='fault'){dropinShore.failNext=true;result={status:200,body:{message:'The next simulated sync request will return 503.'}};}
 else if(path==='reset'){dropinShore=freshDropinShore();result={status:200,body:{message:'Synthetic simulator reset.'}};}
 else result={status:404,body:{error:'Unknown simulator action.'}};
 try{localStorage.setItem(dropinShoreKey,JSON.stringify(dropinShore));}catch{}
 return{ok:result.status>=200&&result.status<300,status:result.status,data:structuredClone(result.body)};
}
async function sync(){if(busy)return;if(!online)return toast('Reconnect to the browser simulator before syncing.');const entries=state.queue.filter(q=>['pending','failed'].includes(q.status));if(!entries.length)return toast(pending().some(q=>q.status==='conflict')?'Resolve conflicts and review the new drafts before syncing.':'No pending changes to sync.');busy=true;render();
for(const entry of entries){const q=state.queue.find(x=>x.id===entry.id);const r=state.records.find(x=>x.id===q.recordId);if(!q||!r||r.workflow!=='approved')continue;
 if(!commit('Sync attempted',`${q.recordId} · ${q.id} · base revision ${q.baseRevision}`,()=>{q.attempts++;}))break;
 try{const result=await api('sync',{operationId:q.id,record:q.snapshot,review:q.review,baseRevision:q.baseRevision});
 if(result.status===409){commit('Revision conflict detected',`${q.recordId} · shore revision ${result.data.revision}`,()=>{q.status='conflict';q.remote=result.data.record;q.remoteRevision=result.data.revision;q.error=result.data.error;r.sync='conflict';});}
 else if(result.ok){commit('Shore receipt confirmed',`${q.recordId} · ${result.data.receipt} · revision ${result.data.revision}`,()=>{q.status='synced';q.receipt=result.data.receipt;q.acceptedAt=result.data.acceptedAt;q.error=null;r.sync='synced';r.baseRevision=result.data.revision;});}
 else throw Error(result.data.error||`Endpoint returned ${result.status}`);
 }catch(e){commit('Transmission failed',`${q.recordId} · ${e.message}`,()=>{q.status='failed';q.error=e.message;r.sync='failed';});}
}
busy=false;render();toast('Sync pass complete. Receipts and unresolved changes are in the outbox.');}
function formData(){const r=current();if(!editing||!$('#packet-form'))return structuredClone(r);return {...r,...Object.fromEntries(new FormData($('#packet-form')).entries())};}
function saveDraft(route=false){const draft=formData();errors=route?validate(draft):{};if(Object.keys(errors).length){editing=true;tab='details';$('#detail').innerHTML=renderDetail();for(const [f,v]of Object.entries(draft)){const input=$(`#packet-form [name="${f}"]`);if(input)input.value=v;}toast('Complete the highlighted fields before review.');return;}const r=current();if(commit(route?'Packet routed for review':'Draft saved',`${r.id} · ${draft.title}`,()=>{supersede(r);Object.assign(r,draft);r.workflow=route?'review':'draft';r.sync='local';r.review=null;r.updatedAt=now();r.localRevision=(r.localRevision||1)+1;})){editing=false;render();toast(route?'Packet routed to the simulated department reviewer.':'Draft saved on this device.');}}
async function handleAction(action){const r=current();switch(action){
case'connection':if(online){online=false;commit('Workspace disconnected','Local editing remains available.',()=>{});render();toast('Disconnected. Work continues on this device.');}else{try{online=true;commit('Browser simulator connected','In-browser shore simulator is ready.',()=>{});render();toast('Connected. Open the outbox to sync reviewed changes.');}catch{toast('Browser simulator unavailable; your records remain saved.');}}break;
case'new':openModal('Start a new packet','Capture locally, then send it through review.',`<label class="field"><span class="field-label">Packet type</span><select id="new-type">${Object.entries(types).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>`,`<button class="button" data-action="close">Cancel</button><button class="button primary" data-action="create">Create draft ${icon('arrow',14)}</button>`);break;
case'create':{const type=$('#new-type').value;const id=uid('PW');if(commit('Packet created',`${id} · ${types[type]}`,()=>{state.records.unshift({id,type,title:'Untitled '+types[type].toLowerCase(),department:'Engineering',owner:'',due:'',priority:'Routine',summary:'',quantity:'',itemCode:'',hours:'',participants:'',attachments:[],workflow:'draft',sync:'local',review:null,baseRevision:0,localRevision:1,updatedAt:now()});})){selected=id;editing=true;tab='details';errors={};view='desk';filter='all';search='';closeModal();render();$('#packet-form [name="title"]')?.focus();}break;}
case'edit':editing=true;tab='details';errors={};render();break;
case'cancel-edit':editing=false;errors={};render();break;
case'save':saveDraft();break;
case'route':saveDraft(true);break;
case'return':if(commit('Packet returned to draft',r.id,()=>supersede(r))){render();toast('Returned to draft for correction.');}break;
case'review':reviewModal();break;
case'approve':{if(!$('#review-check').checked||!$('#review-note').value.trim()){return $('#dialog-error').textContent='Add a review note and confirm that you reviewed the packet.';}const note=$('#review-note').value.trim();if(commit('Packet approved and queued',`${r.id} · ${note}`,()=>{r.review={by:'Department reviewer (simulated)',at:now(),note};r.workflow='approved';r.sync='pending';r.updatedAt=now();state.queue.push({id:uid('Q'),recordId:r.id,snapshot:snapshot(r),review:structuredClone(r.review),baseRevision:r.baseRevision,status:'pending',attempts:0,createdAt:now()});},'Department reviewer (simulated)')){closeModal();render();toast('Approved. The reviewed snapshot is safely in the outbox.');}break;}
case'sync':await sync();break;
case'export-packet':exportPackets([r]);break;
case'export-reviewed':exportPackets(state.records);break;
case'export-workspace':download('paperless-local-workspace.json',{synthetic:true,exportedAt:now(),scope:'Local workspace archive; JSON import restores fields as drafts only, not attachments or approvals.',...state});toast('Local workspace exported, including drafts and attachment bytes.');break;
case'export-audit':download('paperless-audit.json',{synthetic:true,exportedAt:now(),events:state.audit});toast('Audit log exported.');break;
case'clear-filters':search='';filter='all';render();break;
case'close':closeModal();break;
case'lab':labModal();break;
case'advance':case'fault':try{const result=await api(action==='advance'?'advance':'fault',action==='advance'?{id:r.id}:{});if(!result.ok)throw Error(result.data.error);const msg=action==='advance'?`${r.id}: shore revision advanced to ${result.data.revision}. Local copy is unchanged.`:result.data.message;$('#lab-result').textContent=msg;commit('Connection lab scenario',msg,()=>{});}catch(e){$('#dialog-error').textContent=`Simulator unavailable: ${e.message}. Reload this demo to reset the simulator.`;}break;
case'reset-confirm':openModal('Reset the synthetic workspace?','This removes local drafts, attachments and audit history.',`<p class="small-muted">The local shore service is also reset. This only affects the Paperless Underway demo in this browser.</p>`,`<button class="button" data-action="close">Keep workspace</button><button class="button danger" data-action="reset">Reset demo</button>`);break;
case'reset':try{const result=await api('reset',{});if(!result.ok)throw Error(result.data.error);const fresh=seed();localStorage.setItem(key,JSON.stringify(fresh));state=fresh;lastGood=JSON.stringify(fresh);selected='PW-104';view='desk';tab='details';filter='all';search='';online=false;editing=false;storageWarning='';closeModal();render();toast('Synthetic workspace and shore endpoint reset.');}catch(e){$('#dialog-error').textContent=`Reset did not complete: ${e.message}`;}break;
case'resolve':conflictModal();break;
case'apply-resolution':{const q=state.queue.find(q=>q.recordId===r.id&&q.status==='conflict');try{const merged=mergeResolution(q.snapshot,q.remote,Object.fromEntries(new FormData($('#conflict-form')).entries()));if(commit('Conflict resolved into new draft',`${r.id} · reconciled against shore revision ${q.remoteRevision}`,()=>{supersede(r);Object.assign(r,merged);r.baseRevision=q.remoteRevision;r.updatedAt=now();r.localRevision=(r.localRevision||1)+1;})){closeModal();editing=false;tab='details';render();toast('Resolution saved as a draft. Route and review it before syncing.');}}catch(e){$('#dialog-error').textContent=e.message;}break;}
case'attach':$('#attachment-input').click();break;
case'import':importModal();break;
case'import-example':$('#import-text').value=JSON.stringify(example,null,2);break;
case'import-file':$('#import-file').click();break;
case'import-submit':try{const rows=parseImport($('#import-text').value);const created=[];if(commit('Synthetic records imported',`${rows.length} drafts imported from JSON; each requires review.`,()=>{for(const row of rows){const id=uid('PW');created.push(id);state.records.unshift({...row,id,workflow:'draft',sync:'local',review:null,baseRevision:0,localRevision:1,updatedAt:now()});}state.audit.push({at:now(),action:'Import provenance',detail:created.join(', '),actor:'User-provided synthetic JSON'});})){selected=created[0];editing=false;view='desk';tab='details';search='';filter='all';closeModal();render();toast(`${rows.length} drafts imported. Review their fields before routing.`);}}catch(e){$('#dialog-error').textContent=e.message;}break;
case'help':openModal('Built for the disconnected day','Norfolk use case 36 · Handcrafted local demonstration',`<div class="help-copy"><h3>What this workspace does</h3><p>Capture four illustrative packet types, attach evidence, validate fields and route to a simulated department reviewer. Approved snapshots enter an outbox with revision checks and retry-safe receipts.</p><h3>A five-minute presentation</h3><ol><li>Review the auxiliary pump request while disconnected.</li><li>Use Connection lab to amend its shore copy.</li><li>Reconnect, open Outbox, and sync.</li><li>Compare the conflict, select values, then review again.</li><li>Sync and export the reviewed packet with its history.</li></ol><h3>Honest boundaries</h3><p>All sample data is synthetic. Actors are simulated. Browser storage and the local audit are not encrypted or tamper-evident. The form rules are illustrative; no official form, records schedule or production integration is implemented.</p><h3>Source and transition</h3><p>Based on Norfolk catalogue #36, Paperless Underway, bundled in harness/norfolk-snapshot.ts. The shore service is simulated inside this browser; no external service is used.</p></div>`);break;
}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(busy){toast('Sync is in progress. Wait for this pass to finish.');return;}if(editing&&b.dataset.action&&!['save','route','cancel-edit','close'].includes(b.dataset.action)){toast('Save or cancel your draft before starting another action.');return;}try{if(b.dataset.action)await handleAction(b.dataset.action);else if(b.dataset.view){if(editing&&b.dataset.view!==view){toast('Save or cancel your draft before changing views.');return;}view=b.dataset.view;render();}else if(b.dataset.record){if(editing){toast('Save or cancel your draft before selecting another packet.');return;}selected=b.dataset.record;tab='details';errors={};render();}else if(b.dataset.filter){filter=b.dataset.filter;$('#records').innerHTML=renderList();document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));}else if(b.dataset.tab){if(editing){toast('Save or cancel the draft before switching tabs.');return;}tab=b.dataset.tab;render();}else if(b.dataset.queueOpen){selected=b.dataset.queueOpen;view='desk';tab='details';render();if(current().sync==='conflict')conflictModal();}else if(b.dataset.download!==undefined){const a=current().attachments[Number(b.dataset.download)];const link=document.createElement('a');link.href=a.data;link.download=a.name;link.click();}else if(b.dataset.remove!==undefined){const r=current();const i=Number(b.dataset.remove);if(commit('Attachment removed',`${r.id} · ${r.attachments[i].name}`,()=>{r.attachments.splice(i,1);supersede(r);r.updatedAt=now();})){render();toast('Attachment removed. Packet returned to draft.');}}}catch(error){toast('The action could not complete: '+error.message);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('#records').innerHTML=renderList();}});
document.addEventListener('change',async e=>{if(e.target.id==='attachment-input'){const file=e.target.files[0];if(!file)return;const r=current();if(r.attachments.length>=8)return toast('Eight attachments maximum. Remove a file to add another.');if(file.size>1024*1024)return toast('This file is larger than 1 MB. Choose a smaller synthetic attachment.');if(!/\.(pdf|png|jpe?g|webp|txt|csv|json)$/i.test(file.name))return toast('Choose a PDF, image or text file.');try{const data=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(file);});if(commit('Attachment added',`${r.id} · ${file.name}`,()=>{r.attachments.push({name:file.name,size:file.size,type:file.type,data});supersede(r);r.updatedAt=now();})){render();toast('Attachment stored locally. Review is required again.');}}catch{toast('Could not read the attachment. Try again.');}}
if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;if(file.size>200000)return $('#dialog-error').textContent='Import JSON must be under 200 KB.';$('#import-text').value=await file.text();}});
document.addEventListener('keydown',e=>{if(!$('.dialog'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const all=[...$('.dialog').querySelectorAll('button,input,select,textarea,[tabindex]')].filter(el=>!el.disabled&&el.type!=='hidden');const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue='';}});
window.addEventListener('offline',()=>{online=false;if(!editing)render();toast('Network unavailable. Local editing remains available.');});
render();

</script></body></html>
