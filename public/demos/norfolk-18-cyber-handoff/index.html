</script><script>(function(){
'use strict';
const E=WatchEngine,$=s=>document.querySelector(s),KEY='watch-cyber-v1';
const icons={search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',process:'<rect x="3" y="4" width="18" height="15" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/>',network:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18 5-5 5-13 0-18"/>',file:'<path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8M8 17h6"/>',auth:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3"/>',context:'<path d="M8 4H4v17h16V4h-4M9 2h6v5H9zM8 12h8M8 16h5"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/>',book:'<path d="M12 5c-3-3-6-2-9-2v16c3 0 6-1 9 2 3-3 6-2 9-2V3c-3 0-6-1-9 2v16"/>',reset:'<path d="M4 10a8 8 0 1 1 1 8M4 3v7h7"/>',shield:'<path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6zM8 12l3 3 5-6"/>',check:'<path d="m5 12 4 4L20 5"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.context}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let bundle=E.validateBundle(WATCH_DEMO),drafts={},selected=bundle.alerts[0].id,tab='investigation',filter='all',query='',reviewErrors=[],storageWarning=false;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved){bundle=E.validateBundle(saved.bundle);drafts=saved.drafts||{};selected=bundle.alerts.some(a=>a.id===saved.selected)?saved.selected:bundle.alerts[0].id;for(const k of Object.keys(drafts)){const d=drafts[k];if(!d||typeof d.summary!=='string'||!Array.isArray(d.actions)||typeof d.rationale!=='string'||typeof d.analyst!=='string') delete drafts[k];}}}catch{storageWarning=true;}
const alert=()=>bundle.alerts.find(a=>a.id===selected),analysis=()=>E.investigate(bundle,alert()),draft=()=>drafts[selected]||(drafts[selected]=E.draft(analysis()));
function save(){try{localStorage.setItem(KEY,JSON.stringify({bundle,drafts,selected}));}catch{storageWarning=true;}}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('visible'),3500);}
function change(changes){drafts[selected]=E.change(draft(),changes);reviewErrors=[];save();}
function renderQueue(){const list=bundle.alerts.filter(a=>`${a.id} ${a.title} ${a.host}`.toLowerCase().includes(query.toLowerCase()));return list.length?list.map(a=>`<button class="case ${a.id===selected?'active':''}" data-case="${esc(a.id)}" aria-pressed="${a.id===selected}"><span class="case-id"><span>${esc(a.id)}</span><span><i class="dot ${a.severity}"></i>${a.severity.toUpperCase()}</span></span><strong>${esc(a.title)}</strong><span class="case-meta">${esc(a.host)} &nbsp;·&nbsp; ${a.time.slice(11,16)} UTC${drafts[a.id]?.approval?' · REVIEWED':''}</span></button>`).join(''):'<div class="empty">No matching alerts.<br>Try a host or case ID.</div>';}
function render(){const a=alert(),an=analysis(),d=draft();$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><svg class="brand-mark" viewBox="0 0 34 32" fill="none" aria-hidden="true"><path d="M2 7l8 19 7-15 7 15 8-19" stroke="#c4dfb2" stroke-width="2.4"/></svg>WATCH</div><div class="brand-sub">CYBER WATCHSTANDER</div><div class="side-label"><span>ALERT QUEUE</span><span class="side-count">${bundle.alerts.length.toString().padStart(2,'0')}</span></div><label class="search">${icon('search')}<input id="search" aria-label="Search alerts" placeholder="Search alerts or endpoints" value="${esc(query)}"></label><div class="queue" id="queue">${renderQueue()}</div><div class="side-bottom"><button class="side-button" data-action="import">${icon('upload')}Import evidence</button><button class="side-button" data-action="playbook">${icon('book')}Response playbook</button><button class="side-button" data-action="reset">${icon('reset')}Reset exercise</button><div class="local-status"><i class="dot low"></i><b>Local workspace</b><br><span style="display:block;margin:6px 0 0 12px">Synthetic data · no live actions</span></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Investigations <span>/</span><span>${esc(a.id)}</span></div><div class="top-actions"><span class="eyebrow">NORFOLK / 18</span><span class="pill">SYNTHETIC EXERCISE</span><span class="avatar" title="Demo workspace">CW</span></div></header><div class="content"><div class="title-row"><div><div class="eyebrow">ENDPOINT INVESTIGATION &nbsp; / &nbsp; ${esc(new Date(a.time).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}).toUpperCase())}</div><h1>${esc(a.title)}</h1><div class="metadata"><span class="badge ${a.severity}">${a.severity} priority</span><span class="mono">${esc(a.host)}</span><span>Detected ${a.time.slice(11,19)} UTC</span><span>•</span><span id="decision-status">${d.approval?'Reviewed handoff':'Awaiting analyst review'}</span></div></div><button class="btn primary" data-action="${tab==='handoff'?'evidence':'handoff'}">${tab==='handoff'?'Return to evidence':'Prepare handoff'}${icon('arrow')}</button></div><nav class="tabs" aria-label="Investigation workflow"><button class="tab ${tab==='investigation'?'active':''}" data-tab="investigation"><span class="tab-number">01</span> Investigate</button><button class="tab ${tab==='handoff'?'active':''}" data-tab="handoff"><span class="tab-number">02</span> Review & handoff ${d.approval?icon('check'):''}</button></nav>${storageWarning?'<div class="notes-strip warning">Browser storage could not be restored or saved. Work remains available in this session; export a reviewed handoff to keep it.</div>':''}${tab==='investigation'?investigation(an):handoff(an,d)}<footer class="workspace-footer"><span>${icon('shield')}Local correlation · analyst decides · no actions executed</span><span>WATCH / ${bundle.events.length} supplied records / EP-01</span></footer></div></main></div>`;}
function investigation(an){const a=alert(),seenDestinations=new Set(),chain=an.evidence.filter(e=>{if(!e.linked)return false;if(e.destination){if(seenDestinations.has(e.destination))return false;seenDestinations.add(e.destination);}return true;}).slice(0,4);const displayed=filter==='all'?an.evidence:an.evidence.filter(e=>filter==='linked'?e.linked:e.type===filter);const suspicious=an.evidence.filter(e=>e.flag==='suspicious').length;return `<div class="body-grid"><section><div class="trail"><div class="trail-head"><span class="eyebrow">CORRELATED ACTIVITY</span><small>Host + 30-minute window</small></div><div class="chain">${chain.map((e,i)=>`${i?'<span class="chain-arrow">→</span>':''}<button class="node ${e.flag||''}" data-event="${esc(e.id)}">${icon(e.type)}<strong>${esc(e.type==='process'?e.title.includes('document')||e.title.includes('Document')?e.id===a.seedEventId?'Script interpreter':'Document reader':e.title:e.type==='network'?'Outbound connection':e.title)}</strong><span>${esc(e.id)} / ${e.time.slice(11,19)}</span></button>`).join('')}</div><div class="trail-foot"><span><i class="dot"></i>${an.evidence.filter(e=>e.linked).length} related records · ${an.sourceCount} sources in scope</span><span>Links indicate association</span></div></div><div class="section-head"><h2>Evidence timeline</h2><div class="counts"><span><b>${an.evidence.length}</b> in scope</span><span><b>${an.gaps.length}</b> gaps</span></div></div><div class="filters" role="group" aria-label="Filter evidence">${[['all','All evidence'],['linked','Related'],['process','Process'],['network','Network'],['auth','Identity'],['file','Files']].map(([v,l])=>`<button class="filter ${filter===v?'active':''}" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}</div><div class="evidence-table">${displayed.length?displayed.map(e=>`<button class="event" data-event="${esc(e.id)}"><span class="event-time">${e.time.slice(11,19)}</span><span class="event-icon ${e.flag||''}">${icon(e.type)}</span><span><span class="event-title">${esc(e.title)}</span><span class="event-sub"><code>${esc(e.id)}</code><span>${esc(e.source)}</span><span>·</span><span>${esc(e.relation)}</span></span></span><span class="event-chevron">${icon('chevron')}</span></button>`).join(''):'<div class="empty">No evidence in this category.<br><button class="text-btn" data-filter="all">Show all evidence</button></div>'}</div><div class="table-foot"><span>All times UTC · Select a record to inspect its source</span><span>${bundle.events.length-an.evidence.length} outside scope</span></div></section><aside class="right-rail"><section class="finding"><div class="eyebrow">INVESTIGATION ASSESSMENT</div><h2>${suspicious?'A suspicious sequence.<br>Not yet a confirmed compromise.':'Context gathered.<br>Analyst judgment required.'}</h2><p>${suspicious?`${suspicious} supplied records are flagged suspicious. Correlated activity supports further investigation, while the available logs leave intent unresolved.`:'The supplied records provide context for this alert. The local rules do not establish whether the activity is benign.'}</p><div class="recommendation"><div class="eyebrow">PROPOSED DISPOSITION</div><strong>↗ &nbsp;${esc(an.disposition)}</strong></div></section><section class="gap-area"><div class="rail-title"><h3>Information gaps</h3><span class="badge neutral">${an.gaps.length} OPEN</span></div>${an.gaps.map(g=>`<div class="gap"><strong>${esc(g.title)}</strong><p>${esc(g.detail)}</p></div>`).join('')}</section><div class="playbook-card"><span class="eyebrow">RESPONSE PLAYBOOK / EP-01</span><p>Preserve evidence. Establish context. Escalate with a documented decision.</p><button class="text-btn" data-action="playbook">View investigation guidance ${icon('arrow')}</button></div></aside></div>`;}
function handoff(an,d){const checks=[d.summary.trim().length>=40,d.rationale.trim().length>=20,!!d.analyst.trim(),d.evidenceReviewed&&d.gapsReviewed,d.actions.every(a=>['recommend','defer'].includes(a.decision))];return `<div class="handoff-grid"><section class="paper"><div class="paper-header"><div><div class="eyebrow">ANALYST WORKING DOCUMENT</div><h2>Incident handoff</h2><p>${esc(alert().id)} · ${esc(alert().host)} · revision ${d.revision}</p></div><span class="badge ${d.approval?'good':'neutral'}">${d.approval?'REVIEWED':'DRAFT'}</span></div><div class="notes-strip">Drafted with local rules from supplied evidence. Edit the assessment, record your decision, and review every action.</div><label class="field"><span>Investigation summary</span><textarea class="summary" data-field="summary">${esc(d.summary)}</textarea><small>Evidence IDs are preserved below even if you edit the narrative.</small></label><div class="source-list">Linked source records<br>${an.evidence.map(e=>`<button class="link-chip" data-event="${esc(e.id)}">${esc(e.id)}</button>`).join('')}</div><div class="inline-title"><h3>Analyst decision</h3><small>Required before export</small></div><label class="field"><span>Disposition</span><select data-field="disposition">${E.dispositions.map(v=>`<option ${v===d.disposition?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Decision rationale</span><textarea data-field="rationale" placeholder="Explain the disposition, supporting evidence, and unresolved uncertainty…">${esc(d.rationale)}</textarea><small>At least 20 characters. Acknowledge uncertainty in your own words.</small></label><div class="inline-title"><h3>Proposed next actions</h3><small>Recommendations only</small></div>${d.actions.map((a,i)=>`<div class="action-review"><p>${esc(a.text)}<small>GAP ${esc(a.id)} · no action will be executed</small></p><select data-action-index="${i}" aria-label="Review action ${i+1}"><option value="proposed" ${a.decision==='proposed'?'selected':''}>Review action</option><option value="recommend" ${a.decision==='recommend'?'selected':''}>Recommend</option><option value="defer" ${a.decision==='defer'?'selected':''}>Defer</option></select></div>`).join('')}</section><aside class="approval-panel"><div class="eyebrow">HUMAN REVIEW GATE</div><h2>Ready for the next watch.</h2><p>Review the evidence and uncertainty, then record a handoff decision. Approval is a local demo acknowledgment.</p><div id="review-state">${reviewState(d,checks)}</div><label class="field"><span>Reviewer name or role</span><input data-field="analyst" value="${esc(d.analyst)}" placeholder="e.g. Exercise watch lead" maxlength="120"></label><label class="check-row"><input type="checkbox" data-field="evidenceReviewed" ${d.evidenceReviewed?'checked':''}><span>I reviewed the source records and edited the assessment as needed.</span></label><label class="check-row"><input type="checkbox" data-field="gapsReviewed" ${d.gapsReviewed?'checked':''}><span>I acknowledge all ${an.gaps.length} information gaps and reviewed each proposed action.</span></label><div id="review-errors">${errorsHtml()}</div><button class="btn primary" data-action="approve">${icon('check')}Approve handoff</button><div class="toolbar-buttons"><button class="btn" data-action="export-json" ${!d.approval?'disabled':''}>${icon('download')}Export JSON</button><button class="btn" data-action="export-md" ${!d.approval?'disabled':''}>${icon('file')}Export Markdown</button></div><p style="margin-top:12px">Any edit invalidates approval. Exports contain sources, open gaps, action decisions, and the recorded review.</p><div class="playbook-card" style="margin-top:25px"><span class="eyebrow">OPEN INFORMATION GAPS</span>${an.gaps.map(g=>`<p><strong>${esc(g.id)} · ${esc(g.title)}</strong><br>${esc(g.detail)}</p>`).join('')}</div></aside></div>`;}
function errorsHtml(){return reviewErrors.length?`<ul class="error-list" role="alert">${reviewErrors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:'';}
function reviewState(d,checks){return `<div class="review-progress">${checks.map(c=>`<i class="${c?'done':''}"></i>`).join('')}</div><div class="status-text">${checks.filter(Boolean).length} / 5 review requirements complete</div>${d.approval?`<div class="approval-info">Reviewed by <strong>${esc(d.approval.reviewer)}</strong><br>${esc(new Date(d.approval.reviewedAt).toUTCString())}<br>Revision ${d.approval.revision} · ready to export</div>`:'<div class="status-text">Export locked until review is recorded</div>'}`;}
function updateReview(){const d=draft();if(!$('#review-state'))return;$('#decision-status').textContent=d.approval?'Reviewed handoff':'Awaiting analyst review';$('#queue').innerHTML=renderQueue();if(!d.approval)document.querySelector('[data-tab=handoff] .icon')?.remove();$('#review-state').innerHTML=reviewState(d,[d.summary.trim().length>=40,d.rationale.trim().length>=20,!!d.analyst.trim(),d.evidenceReviewed&&d.gapsReviewed,d.actions.every(a=>['recommend','defer'].includes(a.decision))]);for(const el of document.querySelectorAll('[data-action^="export-"]'))el.disabled=!d.approval;$('#review-errors').innerHTML=errorsHtml();$('.paper-header .badge').textContent=d.approval?'REVIEWED':'DRAFT';$('.paper-header .badge').className=`badge ${d.approval?'good':'neutral'}`;$('.paper-header p').textContent=`${alert().id} · ${alert().host} · revision ${d.revision}`;}
let lastFocus=null;
function modal(title,body,wide=false){lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${title}</h2><button class="close" data-action="close" aria-label="Close dialog">${icon('close')}</button></div>${body}</section></div>`;$('.modal .close').focus();}
function closeModal(){$('#overlay').innerHTML='';lastFocus?.focus();}
function eventModal(id){const e=analysis().evidence.find(e=>e.id===id);if(!e)return;const raw=bundle.events.find(x=>x.id===id);modal(`Evidence · ${esc(e.id)}`,`<div class="tagline"><span class="badge ${e.flag==='suspicious'?'high':'neutral'}">${esc(e.flag||'unclassified')}</span><span class="pill">${esc(e.source)}</span><span class="pill">${esc(e.type)}</span></div><h3>${esc(e.title)}</h3><div class="record-detail"><p>${esc(e.detail)}</p><span class="note-field">${esc(e.relation)} · ${esc(e.host)} · ${e.time.slice(11,19)} UTC</span></div><p>${e.linked?'This event is related to the trigger by a process or destination link. Association does not establish malicious intent.':'Context only: same host within the time window. No process or destination link to the trigger was found.'}</p><div class="eyebrow">ORIGINAL SUPPLIED RECORD</div><pre>${esc(JSON.stringify(raw,null,2))}</pre><p>Source: ${esc(bundle.label)}. Synthetic, unverified telemetry; original fields are retained in the export.</p><div class="modal-footer"><button class="btn" data-action="close">Back to investigation</button></div>`);}
function playbook(){modal('Endpoint investigation · EP-01',`<p>Illustrative local playbook · version 1.0. These steps guide the demonstration and are not an operational or certified response standard.</p>${[['Preserve and anchor','Identify the triggering record and preserve its source fields. Use the same host and a ±15 minute window for this exercise.'],['Correlate, then challenge','Follow process IDs and parent IDs. Check shared destinations. Treat host/time context separately from direct relationships.'],['Expose what is missing','Record missing file identity, identity context, network content, and collection boundaries. Do not infer absence of activity from absence of logs.'],['Decide and hand off','Edit the summary, select a disposition, record a rationale, and review every proposed action. A human acknowledgment is required before export.']].map(([t,d],i)=>`<div class="playbook-step"><span class="step-n">0${i+1}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}<div class="notes-strip warning" style="margin-top:20px">This workspace never executes containment, scans endpoints, or contacts evidence destinations. Recommended actions are text in the handoff.</div><div class="modal-footer"><span class="eyebrow">LOCAL RULES · NO MODEL</span><button class="btn primary" data-action="close">Understood</button></div>`);}
function importModal(){modal('Import synthetic evidence',`<p>Paste or upload a JSON bundle. Import replaces this exercise and its saved reviews after validation. Export any reviewed work you want to keep first.</p><div class="toolbar-buttons"><button class="btn small" data-action="load-example">Load example</button><label class="btn small file-label">${icon('upload')}Choose JSON file<input type="file" id="import-file" accept="application/json,.json"></label><button class="btn small" data-action="download-example">Download example</button></div><textarea id="import-text" class="import-area" aria-label="JSON evidence bundle" placeholder='{"label":"Synthetic exercise", "alerts":[…], "events":[…]}'></textarea><div id="import-error" class="import-error" role="alert"></div><details style="margin-top:14px"><summary style="font-size:12px;cursor:pointer">Supported schema and limits</summary><p style="margin-top:10px">1–50 alerts; 0–2,000 events; 2 MB maximum. Each alert needs id, title, host, time, severity, seedEventId. Each event needs id, time, host, type, source, title, detail. Times use YYYY-MM-DDTHH:MM:SSZ. Optional fields: processId, parentId, destination, hash, user, flag. Types: process, network, auth, file, context. Sources: Endpoint, Network, Identity, Change log. Flags: suspicious, expected, neutral. IDs must be unique. The seed event must exist on the alert host within 15 minutes.</p></details><div class="modal-footer"><button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="import-confirm">Validate & import ${icon('arrow')}</button></div>`,true);}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportHandoff(format){try{const record=E.exportRecord(bundle,alert(),analysis(),draft());if(format==='json')download(`${alert().id}-handoff.json`,JSON.stringify(record,null,2),'application/json');else{const m=`# WATCH · ${record.case.id} incident handoff\n\nSYNTHETIC EXERCISE — no actions executed.\n\n## Assessment\n${record.summary}\n\n## Analyst decision\n${record.disposition}\n\n${record.rationale}\n\n## Evidence\n${record.evidence.map(e=>`- **${e.id}** · ${e.time} · ${e.source} · ${e.relation}\n  ${e.title}\n  ${e.detail}\n  Original fields: ${JSON.stringify(bundle.events.find(x=>x.id===e.id))}`).join('\n\n')}\n\n## Information gaps\n${record.informationGaps.map(g=>`- ${g.id}: ${g.title}. ${g.detail}`).join('\n')}\n\n## Proposed next actions\n${record.recommendedActions.map(a=>`- [${a.decision.toUpperCase()}] ${a.text}`).join('\n')}\n\n## Review\nReviewer: ${record.review.reviewer}\nReviewed at: ${record.review.reviewedAt}\nRevision: ${record.review.revision}\n${record.review.notice}\n\n## Provenance and limits\nSource: ${record.bundle}\nMethod: ${record.correlationMethod}\nSummary: ${record.summaryMethod}\nPlaybook: EP-01 v1.0 (illustrative only).\n`;download(`${alert().id}-handoff.md`,m,'text/markdown');}toast('Reviewed handoff exported. No actions were executed.');}catch(e){toast(e.message);}}
document.addEventListener('click',ev=>{const b=ev.target.closest('button,[data-action]');if(!b)return;if(b.dataset.case){selected=b.dataset.case;filter='all';reviewErrors=[];save();render();return;}if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.filter){filter=b.dataset.filter;render();return;}if(b.dataset.event){eventModal(b.dataset.event);return;}const action=b.dataset.action;if(action==='close')closeModal();if(action==='handoff'){tab='handoff';render();}if(action==='evidence'){tab='investigation';render();}if(action==='playbook')playbook();if(action==='import')importModal();if(action==='load-example'){$('#import-text').value=JSON.stringify(WATCH_DEMO,null,2);$('#import-error').textContent='';}if(action==='download-example')download('watch-synthetic-example.json',JSON.stringify(WATCH_DEMO,null,2),'application/json');if(action==='import-confirm'){try{const next=E.parse($('#import-text').value);bundle=next;drafts={};selected=bundle.alerts[0].id;query='';tab='investigation';filter='all';save();closeModal();render();toast(`Imported ${bundle.alerts.length} alerts and ${bundle.events.length} evidence records.`);}catch(e){$('#import-error').textContent=e.message;}}if(action==='reset')modal('Reset the exercise?',`<p>This restores the three synthetic alerts and removes imported records, draft edits, and local review acknowledgments. Previously downloaded files are not affected.</p><div class="modal-footer"><button class="btn" data-action="close">Keep working</button><button class="btn primary" data-action="reset-confirm">Reset exercise</button></div>`);if(action==='reset-confirm'){bundle=E.validateBundle(WATCH_DEMO);drafts={};selected=bundle.alerts[0].id;query='';tab='investigation';filter='all';save();closeModal();render();toast('Exercise restored. You can start a fresh investigation.');}if(action==='approve'){try{drafts[selected]=E.approve(draft());reviewErrors=[];save();render();toast('Handoff review recorded. Exports are now available.');}catch{reviewErrors=E.reviewErrors(draft());updateReview();$('#review-errors').scrollIntoView({block:'nearest',behavior:'smooth'});}}if(action==='export-json')exportHandoff('json');if(action==='export-md')exportHandoff('md');});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='search'){query=el.value;$('#queue').innerHTML=renderQueue();}if(el.dataset.field&&el.type!=='checkbox'&&el.tagName!=='SELECT'){change({[el.dataset.field]:el.value});updateReview();}});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.dataset.field&&(el.type==='checkbox'||el.tagName==='SELECT')){change({[el.dataset.field]:el.type==='checkbox'?el.checked:el.value});updateReview();}if(el.dataset.actionIndex!==undefined){const actions=draft().actions.map((a,i)=>i===Number(el.dataset.actionIndex)?{...a,decision:el.value}:a);change({actions});updateReview();}if(el.id==='import-file'){try{const file=el.files[0];if(!file)return;if(file.size>2000000)throw Error('File too large. Limit: 2 MB.');$('#import-text').value=await file.text();$('#import-error').textContent='';}catch(e){$('#import-error').textContent=e.message;}}});
document.addEventListener('keydown',ev=>{const m=$('.modal');if(!m)return;if(ev.key==='Escape'){closeModal();return;}if(ev.key==='Tab'){const els=[...m.querySelectorAll('button,input,textarea,select,summary,[tabindex]')].filter(e=>!e.disabled&&e.offsetParent!==null);const first=els[0],last=els[els.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
render();
})();
</script></body></html>
