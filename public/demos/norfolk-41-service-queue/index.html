function reviewForm(){const r=draft.route,d=dept(draft.department),e=M.estimates(state,d.id);return `<div class="step-label">STEP 02 OF 03</div><h2>Review your next step.</h2><p>${esc(draft.name)} · ${esc(draft.need)}</p><div class="routing-result ${r.review?'uncertain':''}"><span class="eyebrow">${r.review?'PLEASE CONFIRM THE ROUTE':'SUGGESTED DEPARTMENT'}</span><h3>${esc(dept(r.department).name)}</h3><p>${r.evidence.length?`Matched ${r.evidence.map(x=>`“${esc(x)}”`).join(', ')}.`:'No clear keyword match.'} ${r.review?'The request needs your review.':'A rule-based suggestion, ready for your review.'}</p>${r.alternatives.length?`<small>Also matched: ${r.alternatives.map(x=>esc(dept(x).name)).join(', ')}</small>`:''}</div><label class="field">Confirm or change the department<select id="review-department">${state.departments.map(x=>`<option value="${esc(x.id)}" ${x.id===d.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="prep-heading"><h3>Get ready before your turn</h3><span>Optional</span></div><div class="checklist">${d.docs.map((x,i)=>`<label class="check-row"><input type="checkbox" class="review-doc" value="${i}" ${draft.checked?.includes(i)?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div><p class="detail-hint">Illustrative checklist. Staff confirm exact requirements.</p><div class="join-estimate">${icon('clock')}<span>Estimated wait if you join now<strong>${e.join===0?'A desk is available':e.join+' minutes'}</strong></span><button class="icon-btn" aria-label="Wait estimate assumptions" data-action="assumptions">${icon('help')}</button></div><div class="error" id="form-error" role="alert"></div><button class="btn primary full" data-action="join">Confirm & join queue ${icon('arrow')}</button><button class="text-btn full" data-action="back-intake">Edit my request</button>`;}
function memberView(t){const d=dept(t.department),e=M.estimates(state,d.id),w=e.waits[t.id],position=state.tickets.filter(x=>x.department===d.id&&x.status==='waiting').sort((a,b)=>a.arrival-b.arrival||a.id.localeCompare(b.id)).findIndex(x=>x.id===t.id)+1;return `<section class="member-card"><div class="success-ring">${icon(t.status==='called'?'bell':'check')}</div><div class="eyebrow blue">${t.status==='called'?'IT’S YOUR TURN':t.status==='completed'?'VISIT COMPLETE':t.status==='cancelled'?'TICKET CLOSED':t.status==='serving'?'SERVICE IN PROGRESS':'YOUR PLACE IS SAVED'}</div><h1>${t.status==='called'?'Head to the desk.':t.status==='completed'?'You’re all set.':t.status==='cancelled'?'Ticket cancelled.':t.status==='serving'?'You’re with the team.':'Get back to your day.'}</h1><p>${esc(t.name)}, ${t.status==='waiting'?'keep this page open for local status updates.':'your current ticket status appears below.'}</p><div class="member-ticket"><span class="eyebrow">YOUR TICKET</span><strong>${t.id}</strong><span>${esc(d.name)}</span><div class="member-ticket-bottom"><span><b>${t.status==='waiting'?(w===0?'Now':w+' min'):'—'}</b>Estimated wait</span><span><b>${t.status==='waiting'?position:({called:'Called',serving:'In service',completed:'Done',cancelled:'Closed'})[t.status]}</b>${t.status==='waiting'?'Place in line':'Current status'}</span></div></div><div class="member-notice">${icon('bell')}<span>Teams notifications are simulated locally.<br>No message will be sent to a real account.</span></div><div class="checklist member-checklist">${t.docs.map((x,i)=>`<label class="check-row"><input type="checkbox" data-doc="${i}" data-ticket="${t.id}" ${x.checked?'checked':''} ${!M.active(t)?'disabled':''}><span>${esc(x.label)}</span></label>`).join('')}</div><button class="btn primary full" data-action="view-member" data-id="${t.id}">Open in staff queue ${icon('arrow')}</button><button class="text-btn" data-action="another">Check in another sailor</button>${M.active(t)?`<button class="text-btn danger" data-action="cancel" data-id="${t.id}">Leave queue</button>`:''}</section>`;}
function insights(m){const completed=state.tickets.filter(t=>t.status==='completed');let buckets=Array.from({length:Math.max(3,Math.ceil((state.clock+1)/30))},(_,i)=>({start:i*30,n:state.tickets.filter(t=>t.arrival>=i*30&&t.arrival<(i+1)*30).length}));const max=Math.max(1,...buckets.map(b=>b.n));return `<section class="page-heading"><div><div class="eyebrow blue">DRILL DAY · LOCAL SESSION</div><h1>See where time goes.</h1><p>Use observed visits and transparent estimates to talk about staffing.</p></div><button class="btn" data-action="export">${icon('down')}Export session</button></section><div class="insight-grid"><section class="insight-main"><div class="panel-title"><div><h2>Arrival patterns</h2><span>All check-ins by half hour · synthetic ${time(0)}–${time(state.clock)}</span></div><span class="big-number">${state.tickets.length}<small> check-ins</small></span></div><div class="bar-chart">${buckets.map(b=>`<div class="bar-col"><span>${b.n}</span><i style="height:${Math.max(2,b.n/max*160)}px"></i><small>${time(b.start)}</small></div>`).join('')}</div><div class="panel-title"><h2>Demand by department</h2></div><div class="demand-table">${state.departments.map(d=>{const ts=state.tickets.filter(t=>t.department===d.id),e=M.estimates(state,d.id);return `<div><span><i style="background:${d.color}"></i><b>${esc(d.name)}</b></span><div class="demand-bar"><i style="width:${ts.length/state.tickets.length*100}%;background:${d.color}"></i></div><span>${ts.length} visits</span><span>${e.join} min <small>to join</small></span></div>`;}).join('')}</div></section><aside class="insight-side"><span class="eyebrow">OBSERVED THIS SESSION</span><strong>${m.meanWait??'—'}<small> min</small></strong><h3>Mean wait before call</h3><p>Sum of arrival-to-call times divided by ${completed.length} completed visits. This small synthetic sample does not predict real performance.</p><hr><strong>${m.completed}<small> visits</small></strong><h3>Completed by staff</h3><p>Only explicit completions count. Advancing the clock never closes a visit automatically.</p><button class="btn" data-action="assumptions">View estimate model ${icon('arrow')}</button></aside></div><section class="method-note"><h3>A staffing conversation, not a forecast.</h3><p>Estimated wait uses first-in, first-out queues, configured service durations and available parallel desks. It excludes interruptions, different request complexity and future arrivals. No claimed time savings or operational benchmarks.</p></section>`;}
function activity(){const entries=state.events.length?state.events:[];return `<section class="page-heading"><div><div class="eyebrow blue">TRACEABLE LOCAL ACTIONS</div><h1>Every next step, recorded.</h1><p>Changes in this session, with a simulated delivery record.</p></div><button class="btn" data-action="messages">${icon('bell')}Notification outbox</button></section><section class="activity-panel"><div class="panel-title"><h2>Session history</h2><span class="badge ready">${entries.length} actions</span></div>${entries.length?entries.map(e=>`<div class="activity-row"><span class="activity-icon">${icon('check')}</span><div><b>${esc(e.text)}</b><small>${esc(e.ticket)} · ${time(e.at)} simulation time</small></div><span class="badge ${e.synced?'ready':'prep'}">${e.synced?'Local replica updated':'Pending local sync'}</span></div>`).join(''):`<div class="empty">${icon('clock')}<h3>Your session starts here</h3><p>Call a ticket, prepare a checklist or check in a sailor. Each action will appear here.</p><button class="btn primary" data-action="nav" data-view="board">Go to service queue</button></div>`}</section><div class="notice">This is a browser-local activity log, not an authenticated or tamper-proof enterprise audit trail.</div>`;}
function settings(){if(!configDraft)configDraft=structuredClone(state.departments);return `<section class="page-heading"><div><div class="eyebrow blue">MAKE IT FIT YOUR COMMAND</div><h1>Your desks. Your workflow.</h1><p>Configure local routing, preparation and service assumptions.</p></div><button class="btn primary" data-action="save-config">${icon('check')}Save desk setup</button></section><div class="config-tools"><button class="btn" data-action="add-dept">${icon('add')}Add department</button><label class="btn file-btn">${icon('document')}Import JSON<input type="file" id="import-config" accept=".json,application/json" hidden></label><button class="btn" data-action="export-config">${icon('down')}Export configuration</button><button class="text-btn" data-action="discard-config">Discard edits</button></div><div id="config-error" class="error" role="alert"></div><div class="config-grid">${configDraft.map((d,i)=>`<section class="config-card" data-config-index="${i}"><div class="config-card-header"><span class="eyebrow">DEPARTMENT ${String(i+1).padStart(2,'0')}</span><span class="ticket-pill">${esc(d.id)}</span></div><label class="field">Department name<input data-config="name" value="${esc(d.name)}" maxlength="48"></label><div class="form-row"><label class="field">Parallel desks<input type="number" min="1" max="6" data-config="desks" value="${d.desks}"></label><label class="field">Minutes per visit<input type="number" min="1" max="90" data-config="minutes" value="${d.minutes}"></label></div><label class="field">Routing keywords <small>comma-separated</small><input data-config="keywords" value="${esc(d.keywords.join(', '))}"></label><label class="field">Preparation checklist <small>one item per line</small><textarea data-config="docs" rows="3">${esc(d.docs.join('\n'))}</textarea></label></section>`).join('')}</div><section class="method-note"><h3>Existing tickets keep their preparation checklist.</h3><p>New check-ins use the saved configuration. Active wait estimates update immediately. Routing rules are illustrative and should be validated with department staff before a pilot.</p><button class="text-btn danger" data-action="reset">Reset fictional drill day</button></section>`;}
function modal(title,body,wide=false){lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="scrim"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${title}</h2><button class="icon-btn" data-action="close" aria-label="Close dialog">${icon('close')}</button></header><div class="modal-body">${body}</div></section></div>`;$('#overlay .icon-btn').focus();}
function close(){ $('#overlay').innerHTML='';lastFocus?.focus();}
function assumptions(){modal('How the wait is estimated',`<div class="model-equation">Earliest free desk + visits ahead</div><p>Each department has its own first-in, first-out line. The model assigns every waiting ticket to the next available desk.</p><ol class="model-list"><li><b>Available desks start at 0 minutes.</b>Called tickets reserve one full service duration.</li><li><b>In-service desks use remaining time.</b>Configured duration minus elapsed time, with a 1-minute minimum until staff close the visit.</li><li><b>Waiting tickets fill the earliest desk.</b>Each adds one configured service duration. Future arrivals are excluded.</li></ol><table class="assumption-table"><tr><th>Department</th><th>Desks</th><th>Min / visit</th></tr>${state.departments.map(d=>`<tr><td>${esc(d.name)}</td><td>${d.desks}</td><td>${d.minutes}</td></tr>`).join('')}</table><div class="notice">Illustrative estimates, not guarantees. No learned prediction, real-time staffing feed or medical triage. Times move only with “Advance 5 min”.</div><button class="btn full" data-action="open-settings">Edit service assumptions ${icon('arrow')}</button>`);}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Export downloaded.');}
function collectConfig(){document.querySelectorAll('[data-config-index]').forEach(card=>{const d=configDraft[+card.dataset.configIndex];card.querySelectorAll('[data-config]').forEach(el=>{const key=el.dataset.config;d[key]=key==='desks'||key==='minutes'?+el.value:key==='keywords'?el.value.split(',').map(x=>x.trim()).filter(Boolean):key==='docs'?el.value.split('\n').map(x=>x.trim()).filter(Boolean):el.value;});});}
function act(action,el){
 if(action==='nav'){view=el.dataset.view;location.hash=view==='checkin'?(member&&stage==='joined'?'ticket='+member:'checkin'):'';render();window.scrollTo(0,0);}
 if(action==='filter'){filter=el.dataset.filter;render();}
 if(action==='department'){department=el.dataset.department;render();}
 if(action==='select'){selected=el.dataset.id;render();if(innerWidth<1000)$('.detail-panel').scrollIntoView({behavior:'smooth',block:'start'});}
 if(action==='clear-filters'){filter='waiting';department='all';query='';render();}
 if(action==='advance'){if(state.clock>=540)throw Error('The demo clock ends at 17:00. Reset to start another drill day.');state.clock+=5;save();render();notify(`Simulation advanced to ${time(state.clock)}. Staff still close visits.`);}
 if(action==='transition'){const t=M.transition(state,el.dataset.id,el.dataset.transition);save();render();notify(`${t.id} · ${el.dataset.transition==='call'?'Called. Local notification created.':el.dataset.transition==='complete'?'Visit completed. Desk is available.':el.dataset.transition==='return'?'Returned to waiting.':'Service started.'}`);}
 if(action==='assumptions')assumptions();
 if(action==='close')close();
 if(action==='open-settings'){close();view='settings';render();}
 if(action==='example'){$('#intake-need').value=el.dataset.value;if(!$('#intake-name').value)$('#intake-name').value='Cameron Reed';$('#intake-need').focus();}
 if(action==='back-intake'){stage='intake';render();}
 if(action==='join'){draft.checked=[...document.querySelectorAll('.review-doc:checked')].map(x=>+x.value);const t=M.addTicket(state,draft);member=t.id;selected=t.id;stage='joined';location.hash='ticket='+member;save();render();window.scrollTo(0,0);notify('You’re checked in. Your ticket is saved locally.');}
 if(action==='view-member'){selected=el.dataset.id;view='board';filter='all';department='all';query='';location.hash='';render();}
 if(action==='another'){stage='intake';draft={};member=null;location.hash='checkin';render();}
 if(action==='cancel'){const t=ticket(el.dataset.id);modal('Cancel this ticket?',`<p><b>${esc(t.name)} · ${t.id}</b> will leave the queue. Any occupied desk will become available.</p><p>The ticket stays in session history. A new check-in can be made later.</p><button class="btn danger-btn full" data-action="confirm-cancel" data-id="${t.id}">Cancel ticket</button><button class="text-btn full" data-action="close">Keep ticket</button>`);}
 if(action==='confirm-cancel'){M.transition(state,el.dataset.id,'cancel');save();close();render();notify('Ticket cancelled.');}
 if(action==='transfer'){const t=ticket(el.dataset.id);modal('Transfer to another desk',`<p>${esc(t.name)} · ${t.id}</p><label class="field">Next department<select id="transfer-department">${state.departments.filter(d=>d.id!==t.department).map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}</select></label><div class="notice">The ticket joins the end of the new line. Its checklist resets to that department’s preparation list.</div><button class="btn primary full" data-action="confirm-transfer" data-id="${t.id}">Confirm transfer ${icon('arrow')}</button>`);}
 if(action==='confirm-transfer'){M.handoff(state,el.dataset.id,$('#transfer-department').value);save();close();render();notify('Ticket transferred. Preparation checklist updated.');}
 if(action==='export')download('next-in-line-session.json',{demo:'Synthetic local demonstration; handcrafted, not AppYard-generated or verified',useCaseId:41,exportedAt:new Date().toISOString(),assumptions:{model:'Deterministic earliest-free-desk FIFO scheduling',time:'Minutes since simulated 08:00, November 7, 2026',notifications:'Local simulation only',serviceDurations:state.departments.map(d=>({department:d.name,desks:d.desks,minutes:d.minutes}))},metrics:M.metrics(state),...state});
 if(action==='connection')modal('Local integration simulator',`<div class="integration-flow"><span>Browser queue</span>${icon('arrow')}<span>Local outbox</span>${icon('arrow')}<span>Simulated Teams</span></div><p>Queue changes persist in this browser. “Offline” holds new notifications and activity for local replay; “Sync” marks them delivered to a simulated replica.</p><div class="notice">No network request, account sign-in or enterprise connection is made. This control simulates a delivery workflow, not production resilience or security.</div><button class="btn primary full" data-action="toggle-connection">${state.online?'Simulate offline mode':'Reconnect & sync locally'}</button>`);
 if(action==='toggle-connection'){let message;if(state.online){state.online=false;message='Offline simulation enabled.';}else{message=`${M.sync(state)} pending notifications replayed locally.`;}save();close();render();notify(message);}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();try{act(el.dataset.action,el);}catch(err){notify(err.message);}});
document.addEventListener('submit',e=>{if(e.target.id!=='intake-form')return;e.preventDefault();try{const name=$('#intake-name').value,need=$('#intake-need').value,r=M.route(need,state.departments);M.validateIntake(name,need,r.department,state);draft={name,need,department:r.department,route:r,checked:[]};stage='review';render();if(innerWidth<800)$('.intake-form').scrollIntoView({block:'start'});}catch(err){$('#form-error').textContent=err.message;}});
document.addEventListener('input',e=>{if(e.target.id==='intake-name')draft.name=e.target.value;if(e.target.id==='intake-need')draft.need=e.target.value;if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
document.addEventListener('change',async e=>{const el=e.target;if(el.classList.contains('review-doc'))draft.checked=[...document.querySelectorAll('.review-doc:checked')].map(x=>+x.value);if(el.dataset.doc!==undefined){const t=ticket(el.dataset.ticket);if(!M.active(t))return;t.docs[+el.dataset.doc].checked=el.checked;M.log(state,t,`Preparation ${el.checked?'confirmed':'unchecked'}: ${t.docs[+el.dataset.doc].label}`);save();render();}if(el.id==='review-department'){draft.department=el.value;draft.checked=[];render();}if(el.id==='import-config'){try{if(el.files[0].size>100000)throw Error('Configuration must be smaller than 100 KB.');const data=JSON.parse(await el.files[0].text());configDraft=M.validateConfig(data,state);render();notify('Configuration imported for review. Choose Save desk setup to apply.');}catch(err){$('#config-error').textContent=err instanceof SyntaxError?'Invalid JSON. Import a department array from an exported configuration.':err.message;}finally{el.value='';}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('tr[data-action]')){act('select',e.target);}if(e.key==='Tab'&&$('#overlay .modal')){const focusable=[...$('#overlay').querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')],first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const next=JSON.parse(e.newValue);M.validateConfig(next.departments,next);if(view==='settings')collectConfig();state=next;if(member&&!ticket(member)){member=null;stage='intake';}render();}catch{notify('A saved session update could not be read. Reload to recover.');}}});
