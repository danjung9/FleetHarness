function target(t){const s=C.sla(t,state.clock);return `<span class="sla ${s.state==='Overdue'||s.state==='Missed target'?'late':s.state==='Due soon'?'soon':''}">${s.state==='Overdue'?`${Math.abs(s.remaining).toFixed(0)}h overdue`:s.state==='Met target'?'Target met':s.state==='Missed target'?'Target missed':`${s.remaining.toFixed(0)}h remaining`}</span>`;}
const options=(items,current)=>items.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('');
function render(){const active=document.activeElement,id=active?.id,position=active?.selectionStart;
const m=C.metrics(state.tickets,state.clock), unread=state.notifications.filter(n=>!n.read).length;
$('#app').innerHTML=`<aside class="sidebar"><a class="brand" href="#" data-action="view" data-view="queue"><span class="brand-mark">b<span>↗</span></span><span>BSO<span class="brand-sub">SERVICE DESK</span></span></a><div class="workspace-label">ENTERPRISE SUPPORT</div><nav aria-label="Main navigation">${[['queue','Service queue','queue'],['portal','Customer portal','portal'],['reports','Performance','chart'],['knowledge','Knowledge base','book']].map(([v,l,i])=>`<button class="nav-item ${view===v?'active':''}" data-action="view" data-view="${v}">${icon(i)}${l}${v==='queue'?`<span class="nav-count">${m.open}</span>`:''}</button>`).join('')}</nav><div class="sidebar-note"><div class="orbital">◎</div><b>One front door.<br>Clear ownership.</b><p>Connecting BSO requests to the teams that can help.</p><button data-action="guide">Explore this workspace ${icon('arrow')}</button></div><div class="side-bottom"><span class="live-dot"></span> Local demonstration<br><small>Norfolk 51 · Synthetic data</small></div><button class="profile" data-action="guide"><span class="avatar">AM</span><span><b>A. Morgan</b><small>Service coordinator · Demo</small></span>${icon('help')}</button></aside>
<div class="app-body"><header class="topbar"><span>Enterprise services <span class="slash">/</span> <b>${({queue:'Support workspace',portal:'Customer workspace',reports:'Service performance',knowledge:'Knowledge library'})[view]}</b></span><div class="top-right"><span class="demo-tag">SYNTHETIC WORKSPACE</span><button class="icon-button" aria-label="Workspace guide" data-action="guide">${icon('help')}</button><button class="icon-button notification-button" aria-label="Open local notifications" data-action="notifications">${icon('bell')}${unread?'<span class="notification-dot"></span>':''}</button></div></header><main>${storageWarning?`<div class="notice">${esc(storageWarning)}</div>`:''}${view==='queue'?queueView(m):view==='portal'?portalView():view==='reports'?reportsView(m):knowledgeView()}</main><footer><span><i class="live-dot"></i> ${storageWarning?'Storage needs attention · export to preserve':'Changes saved in this browser'}</span><button data-action="clock">${icon('clock')} Demo clock · ${date(state.clock)} UTC</button><span>Illustrative service targets · No live integrations</span></footer></div>`;
if(id && document.getElementById(id)){const el=document.getElementById(id);el.focus();if(typeof position==='number'&&el.setSelectionRange)el.setSelectionRange(position,position);}}
function queueView(m){return `<section class="page-heading"><div><div class="eyebrow">THE SUPPORT WORKSPACE</div><h1>A clear path to resolution<span>.</span></h1><p>Prioritize the right requests. Keep every BSO moving.</p></div><button class="primary" data-action="new">${icon('plus')} New request</button></section><section class="metrics-strip" aria-label="Queue metrics">${[[m.open,'Active requests','Across all support teams',''],[m.overdue,'Past target','Ready for your attention','red'],[m.dueSoon,'Due in 8 hours','Next in the priority window','amber'],[m.resolved,'Resolved','In this sample workspace','green']].map(([n,l,d,c])=>`<div><span class="metric-name">${l}</span><b class="metric-value ${c}">${n}<small>${l==='Past target'?icon('clock'):l==='Resolved'?icon('check'):''}</small></b><span class="metric-description">${d}</span></div>`).join('')}</section><section class="work-area"><div class="queue-panel"><div class="section-top"><div><h2>Request queue <span>${m.total}</span></h2><p>One place for every handoff.</p></div><div class="actions"><button class="quiet" data-action="import">${icon('upload')} Import</button><button class="quiet" data-action="export">${icon('download')} Export</button></div></div><div class="queue-tabs">${[['active','All active',m.open],['mine','Assigned to me',state.tickets.filter(t=>t.status!=='Resolved'&&t.assignee==='A. Morgan').length],['overdue','Overdue',m.overdue],['closed','Resolved',m.resolved]].map(([f,l,n])=>`<button class="${filter===f?'selected':''}" data-action="filter" data-filter="${f}">${l}<span>${n}</span></button>`).join('')}</div><div class="toolbar"><label class="search">${icon('search')}<input id="queue-search" placeholder="Search ID, request, or organization" aria-label="Search tickets" value="${esc(query)}"></label><select id="team-filter" aria-label="Filter support team"><option value="">All teams</option>${options(C.TEAMS,team)}</select></div>${queueTable()}<div class="queue-foot"><span>Elapsed-hour targets · Waiting time included</span><button data-action="rules">View routing rules ${icon('arrow')}</button></div></div><aside class="detail-panel" aria-label="Selected ticket">${detailView(false)}</aside></section>`;}
function filtered(){return state.tickets.filter(t=>(filter==='closed'?t.status==='Resolved':t.status!=='Resolved')&&(filter!=='mine'||t.assignee==='A. Morgan')&&(filter!=='overdue'||C.sla(t,state.clock).state==='Overdue')&&(!team||t.team===team)&&(!query||[t.title,t.id,t.org,t.category,t.assignee].join(' ').toLowerCase().includes(query.toLowerCase())));}
function queueTable(){const ts=filtered(),shown=ts.slice(page*7,page*7+7);if(!shown.length&&page){page=0;return queueTable();}return `<div class="table-scroll"><table class="ticket-table"><thead><tr><th>REQUEST / ORGANIZATION</th><th>PRIORITY</th><th>STATUS</th><th>TARGET</th></tr></thead><tbody>${shown.map(t=>`<tr class="${selected===t.id?'row-selected':''}"><td><button class="ticket-link" data-action="select" data-id="${t.id}"><span class="ticket-id">${t.id}<span class="category-dot"></span>${esc(t.category)}</span><strong>${esc(t.title)}</strong><small>${esc(t.org)}</small></button></td><td><span class="priority ${t.priority.toLowerCase()}"><i></i>${t.priority}</span></td><td>${badge(t.status)}</td><td>${target(t)}</td></tr>`).join('')}</tbody></table>${!shown.length?'<div class="empty"><h3>No requests match these filters.</h3><p>Try a different phrase or clear the queue filters.</p><button class="secondary" data-action="clear-filters">Clear filters</button></div>':''}</div><div class="pagination"><span>${ts.length?`${page*7+1}–${Math.min(page*7+7,ts.length)}`:'0'} of ${ts.length} requests</span><div><button aria-label="Previous page" data-action="prev" ${page===0?'disabled':''}>←</button><button aria-label="Next page" data-action="next" ${(page+1)*7>=ts.length?'disabled':''}>→</button></div></div>`;}
function detailView(customer){const t=state.tickets.find(t=>t.id===selected && (!customer||t.org===org));if(!t)return `<div class="empty">${icon('queue')}<h3>Select a request</h3><p>Its progress, ownership, and next steps will appear here.</p></div>`;
return `<div class="detail-head"><span class="eyebrow">${customer?'YOUR REQUEST':'REQUEST SPOTLIGHT'}</span><span class="ticket-id">${t.id}</span></div><h2>${esc(t.title)}</h2><div class="detail-badges">${badge(t.status)}<span class="priority ${t.priority.toLowerCase()}"><i></i>${t.priority}</span></div><div class="target-callout ${C.sla(t,state.clock).state==='Overdue'?'overdue':''}">${icon('clock')}<div>${target(t)}<small>${C.TARGETS[t.priority]}h illustrative resolution target</small></div></div><dl class="ticket-facts"><div><dt>Requesting office</dt><dd>${esc(t.org)}</dd></div><div><dt>Support team</dt><dd>${esc(t.team)}</dd></div><div><dt>Owner</dt><dd><span class="mini-avatar">${t.assignee==='Unassigned'?'—':t.assignee==='Team lead'?'TL':t.assignee.replace(/[^A-Z]/g,'')}</span>${esc(t.assignee)}</dd></div><div><dt>Received</dt><dd>${date(t.created)} UTC</dd></div></dl><div class="detail-section"><h3>The request</h3><p>${esc(t.description)}</p>${t.supporting?`<details><summary>Supporting reference</summary><p>${esc(t.supporting)}</p></details>`:''}</div>${t.resolution?`<div class="resolution"><h3>Resolution recorded</h3><p>${esc(t.resolution)}</p></div>`:`<div class="routing-note"><span>↳</span><div><b>Rules-based routing</b><p>${esc(t.routeReason)}</p></div></div>`}<div class="detail-actions">${customer?`<button class="primary" data-action="customer-note" data-id="${t.id}">${icon('plus')} Add information</button>${t.status==='Resolved'?`<button class="secondary" data-action="rating" data-id="${t.id}">${t.rating?'Rated '+t.rating+'/5':'Rate this resolution'}</button>`:''}`:`<button class="primary" data-action="manage" data-id="${t.id}">${t.status==='Resolved'?'Review / reopen':'Manage request'} ${icon('arrow')}</button><button class="secondary" data-action="history" data-id="${t.id}">Activity <span>${t.history.length}</span></button>`}</div><div class="activity-preview"><span class="eyebrow">LATEST ACTIVITY</span><div><span class="timeline-dot"></span><p><b>${esc(t.history.at(-1)?.type)}</b><small>${esc(t.history.at(-1)?.actor)} · ${date(t.history.at(-1)?.at)}</small></p></div></div>`;}
function portalView(){const ts=state.tickets.filter(t=>t.org===org);return `<section class="page-heading"><div><div class="eyebrow">CUSTOMER PORTAL · DEMO ORGANIZATION SWITCHER</div><h1>Support, without the chase<span>.</span></h1><p>Submit a request. See who owns it. Follow the next step.</p></div><button class="primary" data-action="new">${icon('plus')} Submit a request</button></section><div class="portal-banner"><div>${icon('portal')}<div><b>Your organization's service window</b><p>Organization selection is a demo view filter, not access control.</p></div></div><select id="org-select" aria-label="Customer organization">${options(C.ORGS,org)}</select></div><section class="work-area portal-area"><div class="portal-requests"><h2>Your requests <span>${ts.length}</span></h2>${ts.map(t=>`<button class="portal-ticket ${t.id===selected?'chosen':''}" data-action="select" data-id="${t.id}"><div><span class="ticket-id">${t.id} · ${shortDate(t.created)}</span><h3>${esc(t.title)}</h3><p>${esc(t.team)} · ${esc(t.assignee)}</p></div><div>${badge(t.status)}${icon('chevron')}</div></button>`).join('')||'<div class="empty">No requests yet. Submit your first request above.</div>'}</div><aside class="detail-panel">${detailView(true)}</aside></section>`;}
function reportsView(m){const max=Math.max(1,...m.teams.map(t=>t.open));const trend=Array.from({length:7},(_,i)=>{const day=new Date(Date.parse(state.clock)-(6-i)*24*C.HOUR).toISOString().slice(0,10);return{day,received:state.tickets.filter(t=>t.created.startsWith(day)).length,resolved:state.tickets.filter(t=>t.resolved?.startsWith(day)).length};});const trendMax=Math.max(1,...trend.flatMap(t=>[t.received,t.resolved]));return `<section class="page-heading"><div><div class="eyebrow">SERVICE PERFORMANCE</div><h1>The story behind the queue<span>.</span></h1><p>Calculated from ${m.total} local tickets as of ${date(state.clock)} UTC.</p></div><button class="primary" data-action="export">${icon('download')} Export service report</button></section><section class="metrics-strip report-metrics">${[[m.meanResolutionHours?.toFixed(1)+'h','Mean resolution time',`${m.resolved} resolved tickets · elapsed hours`],[(m.targetRate?.toFixed(0)??'—')+'%','Resolved within target',`${m.targetMet} of ${m.resolved} resolved tickets`],[(m.satisfaction?.toFixed(1)??'—')+'/5','Customer satisfaction',`${m.ratingCount} submitted ratings`],[m.unassigned,'Awaiting an owner','Active, unassigned requests']].map(([v,l,s])=>`<div><span class="metric-name">${l}</span><b class="metric-value">${v}</b><span class="metric-description">${s}</span></div>`).join('')}</section><div class="report-grid"><section class="report-panel"><div class="section-top"><div><h2>Workload by support team</h2><p>Open requests · overdue portion highlighted</p></div><span class="tiny-label">${m.open} ACTIVE</span></div><div class="workload-chart">${m.teams.map(t=>`<div class="workload-row"><div><span>${esc(t.team)}</span><b>${t.open}</b></div><div class="bar-track"><span style="width:${t.open/max*100}%"><i style="width:${t.open?t.overdue/t.open*100:0}%"></i></span></div></div>`).join('')}</div><div class="legend"><span><i class="teal-swatch"></i>Within target</span><span><i class="orange-swatch"></i>Past target</span></div></section><section class="report-panel"><div class="section-top"><div><h2>Intake & resolution</h2><p>Daily ticket counts · last 7 demo days</p></div></div><div class="trend-chart">${trend.map(t=>`<div class="trend-column"><div class="trend-bars"><span class="received-bar" style="height:${t.received/trendMax*160}px" title="${t.received} received"><b>${t.received||''}</b></span><span class="resolved-bar" style="height:${t.resolved/trendMax*160}px" title="${t.resolved} resolved"><b>${t.resolved||''}</b></span></div><small>${shortDate(t.day+'T12:00:00Z')}</small></div>`).join('')}</div><div class="legend"><span><i class="teal-swatch"></i>Received</span><span><i class="lime-swatch"></i>Resolved</span></div></section><section class="report-panel"><div class="section-top"><div><h2>Requests by service category</h2><p>Includes open and resolved tickets</p></div></div><div class="category-list">${m.categories.sort((a,b)=>b.count-a.count).map((r,i)=>`<div><span class="rank">0${i+1}</span><b>${esc(r.category)}</b><span>${r.count} requests</span><strong>${Math.round(r.count/m.total*100)||0}%</strong></div>`).join('')}</div></section><section class="method-panel"><span class="eyebrow">READ THE NUMBERS WITH CONTEXT</span><h2>Transparent targets.<br>Useful signals.</h2><p>These are illustrative service targets, measured from submission to resolution in elapsed hours. Time waiting on customers is included.</p><div class="target-grid">${C.PRIORITIES.map(p=>`<div><span>${p}</span><b>${C.TARGETS[p]}h</b></div>`).join('')}</div><p>Mean resolution uses resolved tickets only. Target attainment uses the ticket’s current priority. Satisfaction includes submitted 1–5 ratings only; it is not a survey of all customers.</p><button class="text-button" data-action="clock">Advance the demo clock ${icon('arrow')}</button></section></div>`;}

{id:'KB-002',category:'Budget execution',title:'Reconcile an obligation variance',excerpt:'A consistent starting point for workbook and ledger differences.',steps:['Identify the reporting period and the two sources being compared.','Record the sample line reference, opening balance, and expected adjustment.','Check for a timing difference or duplicate entry before requesting a transfer review.','Route unresolved differences to Budget Operations with a clear explanation. This guide is illustrative, not financial authority.'],resolution:'Compared the sample workbook and ledger for the same reporting period, identified a timing difference, and recorded the reconciliation for office review.'},
{id:'KB-003',category:'Audit readiness',title:'Prepare a complete evidence package',excerpt:'Make review easier with source references and a control narrative.',steps:['Identify the control and review period using synthetic references.','Describe what the control does, its owner, and the evidence of performance.','Include a traceable source reference and note any missing evidence.','Audit & Assurance reviews completeness. This sample procedure does not establish compliance.'],resolution:'Reviewed the sample control narrative and evidence references, documented the missing item, and confirmed the completed package with the office.'},

{id:'KB-005',category:'Administrative support',title:'Write a request that is easy to resolve',excerpt:'A clear outcome and supporting context reduce follow-up.',steps:['Use a short title that names the problem.','Explain what happened, what you expected, and which office needs help.','Add a reference or excerpt without personal, sensitive, or operational information.','Choose a priority that reflects urgency. Service targets here are illustrative.'],resolution:'Clarified the requested outcome, verified the sample reference, and recorded the next action and functional owner.'}

function knowledgeView(){const list=ARTICLES.filter(a=>(a.title+' '+a.excerpt+' '+a.category).toLowerCase().includes(query.toLowerCase()));return `<section class="page-heading"><div><div class="eyebrow">THE KNOWLEDGE LIBRARY</div><h1>A good answer, ready to share<span>.</span></h1><p>Illustrative guides for recurring service questions.</p></div><span class="knowledge-count">${ARTICLES.length} practical guides</span></section><label class="search knowledge-search">${icon('search')}<input id="knowledge-search" aria-label="Search knowledge base" value="${esc(query)}" placeholder="Search procedures, categories, and common questions"></label><div class="knowledge-grid">${list.map(a=>`<article class="knowledge-card"><div class="article-meta">${icon('book')}<span>${a.id} / ${esc(a.category)}</span></div><h2>${esc(a.title)}</h2><p>${esc(a.excerpt)}</p><button class="text-button" data-action="article" data-id="${a.id}">Read guide ${icon('arrow')}</button></article>`).join('')||'<div class="empty"><h3>No guides found</h3><p>Try “budget”, “access”, or “evidence”.</p></div>'}</div><div class="library-note">All guidance is authored for this synthetic demonstration. Validate procedures with the responsible functional owner before operational use.</div>`;}
function modal(title,body,wide=false){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon-button" aria-label="Close dialog" data-action="close">${icon('close')}</button></header><div class="modal-body">${body}</div></section></div>`;setTimeout(()=>$('.modal input, .modal textarea, .modal select, .modal button')?.focus(),20);}
function closeModal(){$('#modal-root').innerHTML='';}
function field(label,content){return `<label class="field"><span>${label}</span>${content}</label>`;}
function formError(e){const el=$('#form-error');if(el){el.textContent=e.message;el.hidden=false;}else toast(e.message);}
function newRequest(){modal('Create a service request',`<p class="modal-intro">Describe the outcome you need. A tracking number and routing suggestion are created immediately.</p><form id="new-form"><div class="form-row">${field('Requesting organization',`<select name="org">${options(C.ORGS,org)}</select>`)}${field('Priority',`<select name="priority">${options(C.PRIORITIES,'Normal')}</select>`)}</div>${field('Request title',`<input id="intake-title" name="title" required minlength="8" maxlength="140" placeholder="e.g. Restore access to the budget workspace">`)}${field('What do you need help with?',`<textarea id="intake-description" name="description" required minlength="20" maxlength="5000" rows="4" placeholder="Describe the issue, expected result, and any action already taken."></textarea>`)}<div id="route-preview" class="route-preview">Add a title and description to preview rules-based routing.</div>${field('Category',`<select name="category"><option value="">Use routing suggestion</option>${options(C.RULES.map(r=>r.category),'')}</select>`)}${field('Supporting reference or excerpt (optional)',`<textarea name="supporting" rows="2" maxlength="2000" placeholder="Synthetic reference only; no sensitive data."></textarea>`)}<div id="form-error" class="error" hidden></div><div class="form-footer"><span>Synthetic data only · Local acknowledgment</span><button class="primary" type="submit">Submit request ${icon('arrow')}</button></div></form>`,true);}
function manage(id,prefill=''){const t=state.tickets.find(t=>t.id===id);modal('Manage '+id,`<p class="modal-intro">${esc(t.title)}</p><form id="manage-form" data-id="${id}"><div class="form-row">${field('Status',`<select name="status">${options(C.STATUSES,t.status)}</select>`)}${field('Priority',`<select name="priority">${options(C.PRIORITIES,t.priority)}</select>`)}</div><div class="form-row">${field('Support team',`<select name="team">${options(C.TEAMS,t.team)}</select>`)}${field('Assigned owner',`<select name="assignee">${options(['Unassigned','A. Morgan','J. Ellis','S. Rivera','Team lead'],t.assignee)}</select>`)}</div>${field('Customer-visible update / resolution',`<textarea name="note" rows="5" maxlength="5000" placeholder="Explain the next step or the resolution. Required for escalation, information requests, and resolution.">${esc(prefill)}</textarea>`)}<p class="helper">Changing priority recalculates the target from the original submission time. Every update is recorded in activity and the local notification log.</p><div id="form-error" class="error" hidden></div><div class="form-footer"><button type="button" class="quiet" data-action="knowledge-for-ticket">${icon('book')} Use a knowledge guide</button><button type="submit" class="primary">Save update ${icon('check')}</button></div></form>`);}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Export ready: '+name);}
function exportModal(){modal('Export the service workspace',`<p class="modal-intro">Exports include all ${state.tickets.length} tickets, independent of your current queue filters. All data is synthetic and local.</p><div class="export-options"><button data-action="download" data-format="report">${icon('chart')}<span><b>Service report · JSON</b><small>Calculated metrics, method, and source ticket IDs</small></span>${icon('download')}</button><button data-action="download" data-format="csv">${icon('queue')}<span><b>Ticket register · CSV</b><small>Ownership, status, service targets, and timestamps</small></span>${icon('download')}</button><button data-action="download" data-format="snapshot">${icon('download')}<span><b>Complete snapshot · JSON</b><small>Tickets, activity, and simulated notifications; archival export</small></span>${icon('download')}</button></div>`);}
function notifications(){modal('Local notification log',`<div class="notice">Delivery is simulated in this browser. No messages are sent.</div><div class="section-top"><span>${state.notifications.filter(n=>!n.read).length} unread · ${state.notifications.length} total</span><button class="quiet" data-action="mark-read">Mark all read</button></div><div class="notification-list">${state.notifications.map(n=>`<article class="${n.read?'read':''}"><span class="eyebrow">${esc(n.type)} ${n.read?'':' · NEW'}</span><p>${esc(n.message)}</p><small>${esc(n.recipient)} · ${date(n.at)} UTC</small></article>`).join('')||'<div class="empty">No local notifications yet.</div>'}</div>`);}
function history(id){const t=state.tickets.find(t=>t.id===id);modal(id+' · Activity',`<p class="modal-intro">Browser-local activity history. This is an illustrative audit trail, not a tamper-resistant production log.</p><div class="timeline">${[...t.history].reverse().map(h=>`<article><i></i><span class="eyebrow">${date(h.at)} UTC</span><h3>${esc(h.type)}</h3><p>${esc(h.text).replace(/\n/g,'<br>')}</p><small>${esc(h.actor)}</small></article>`).join('')}</div>`);}

function importModal(){modal('Import synthetic requests',`<p class="modal-intro">Paste a JSON array of 1–100 new requests. The entire batch is validated before anything is added. Tracking IDs and routing are generated locally.</p><form id="import-form">${field('Request array',`<textarea id="import-text" name="json" rows="12" required spellcheck="false" placeholder='[{"title": "...", "description": "...", "org": "...", "priority": "Normal"}]'></textarea>`)}<div id="form-error" class="error" hidden></div><div class="form-footer"><button type="button" class="secondary" data-action="load-example">Load example</button><button type="submit" class="primary">Validate & import ${icon('arrow')}</button></div></form>`);}
function showArticle(id){const a=ARTICLES.find(a=>a.id===id);modal(a.title,`<span class="eyebrow">${a.id} · ${esc(a.category)} · ILLUSTRATIVE GUIDE</span><p class="modal-intro">${esc(a.excerpt)}</p><ol class="article-steps">${a.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="notice">Source: authored synthetic procedure for Norfolk #51. Not an approved enterprise policy.</div>${selected?`<div class="form-footer"><span>Draft for ${selected}</span><button class="primary" data-action="apply-article" data-id="${id}">Use in resolution ${icon('arrow')}</button></div>`:''}`);}
function rules(){modal('How routing works',`<p class="modal-intro">The category with the most distinct keyword matches wins. Ties use the displayed rule order and require review. No match routes to Service Coordination. Staff can override the support team.</p><div class="rules-list">${C.RULES.map((r,i)=>`<article><span>0${i+1}</span><div><h3>${r.category}</h3><p>${r.words.join(' · ')}</p><small>→ ${r.team}</small></div></article>`).join('')}</div><div class="notice">Keyword routing is deterministic and illustrative. It is not an AI model, and scores are not probabilities.</div>`);}
function guide(){modal('A service desk you can walk through',`<p class="modal-intro">A handcrafted, offline prototype of Norfolk catalogue case 51. The people, organizations, requests, targets, and procedures are synthetic.</p><ol class="article-steps"><li>Create a request with “account access” in the title and see the Enterprise Systems routing suggestion.</li><li>Manage the new request: assign an owner, request information, or escalate with a clear note.</li><li>Switch to Customer portal to provide information. Return to the queue to record a resolution.</li><li>Review the computed performance charts and export the service report.</li></ol><div class="notice">View switching is not authentication. Data lives in browser storage. There is no production security, enterprise integration, email delivery, or official service-level policy.</div><div class="form-footer"><button class="secondary" data-action="reset">Reset sample workspace</button><button class="primary" data-action="close">Start exploring</button></div>`);}
function clockModal(){modal('Advance the demonstration clock',`<p class="modal-intro">Current snapshot: <b>${date(state.clock)} UTC</b>. The clock is intentionally frozen for repeatable presentations.</p><p>Advance it by 4 hours to see target risk update. Ticket timestamps remain unchanged. This affects this browser only.</p><div class="form-footer"><button class="secondary" data-action="close">Keep current time</button><button class="primary" data-action="advance">Advance 4 hours</button></div>`);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;e.preventDefault();
if(a==='view'){view=b.dataset.view;query='';page=0;if(view==='portal')selected=state.tickets.find(t=>t.org===org)?.id;render();}
else if(a==='select'){selected=id;render();}
else if(a==='filter'){filter=b.dataset.filter;page=0;render();}
else if(a==='clear-filters'){query='';team='';filter='active';page=0;render();}
else if(a==='prev'||a==='next'){page+=a==='next'?1:-1;render();}
else if(a==='new')newRequest();else if(a==='close')closeModal();else if(a==='manage')manage(id);else if(a==='history')history(id);else if(a==='export')exportModal();else if(a==='notifications')notifications();else if(a==='import')importModal();else if(a==='load-example')$('#import-text').value=importExample;else if(a==='rules')rules();else if(a==='article')showArticle(id);else if(a==='guide')guide();else if(a==='clock')clockModal();
else if(a==='mark-read'){state.notifications.forEach(n=>n.read=true);save();render();notifications();}
else if(a==='knowledge-for-ticket'){closeModal();view='knowledge';query='';render();}
else if(a==='apply-article')manage(selected,ARTICLES.find(a=>a.id===id).resolution);
else if(a==='advance'){state.clock=new Date(Date.parse(state.clock)+4*C.HOUR).toISOString();save();closeModal();render();toast('Demo clock advanced by 4 hours. Targets recalculated.');}
else if(a==='download'){const f=b.dataset.format,stamp=state.clock.slice(0,10);if(f==='csv')download(`bso-ticket-register-${stamp}.csv`,C.csv(state.tickets,state.clock),'text/csv');else if(f==='snapshot')download(`bso-snapshot-${stamp}.json`,JSON.stringify({label:'Synthetic Norfolk 51 workspace',...state},null,2),'application/json');else download(`bso-service-report-${stamp}.json`,JSON.stringify({title:'Synthetic BSO service report',asOf:state.clock,method:'Elapsed hours; waiting included; current priority targets. Resolved tickets only for duration and target attainment. Submitted ratings only for satisfaction.',targetsHours:C.TARGETS,metrics:C.metrics(state.tickets,state.clock),sourceTicketIds:state.tickets.map(t=>t.id)},null,2),'application/json');}
else if(a==='customer-note')modal('Add information · '+id,`<form id="customer-form" data-id="${id}">${field('Update for your support team',`<textarea name="note" rows="5" required minlength="8" maxlength="5000" placeholder="Provide the requested reference or clarify the next step."></textarea>`)}<p class="helper">A waiting request returns to In progress when information is added.</p><div id="form-error" class="error" hidden></div><div class="form-footer"><button type="submit" class="primary">Send local update ${icon('arrow')}</button></div></form>`);
else if(a==='rating')modal('Rate the resolution',`<form id="rating-form" data-id="${id}"><p class="modal-intro">How helpful was the resolution? Your local rating updates the performance view.</p>${field('Rating',`<select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} / 5 — ${['','Not helpful','Needs improvement','Okay','Helpful','Very helpful'][n]}</option>`).join('')}</select>`)}<div class="form-footer"><button type="submit" class="primary">Save rating</button></div></form>`);
else if(a==='reset')modal('Reset this local workspace?',`<p>This replaces all locally added requests, updates, and ratings with the 24 original sample tickets. Export a snapshot first if you want to keep your work.</p><div class="form-footer"><button class="secondary" data-action="close">Keep workspace</button><button class="danger" data-action="confirm-reset">Reset sample data</button></div>`);
else if(a==='confirm-reset'){state=C.seed();selected=state.tickets[0].id;view='queue';filter='active';query='';team='';page=0;storageWarning='';save();closeModal();render();toast('Sample workspace restored.');}
});
document.addEventListener('input',e=>{if(e.target.id==='queue-search'||e.target.id==='knowledge-search'){query=e.target.value;page=0;render();}if(['intake-title','intake-description'].includes(e.target.id)){const r=C.classify($('#intake-title').value+' '+$('#intake-description').value);$('#route-preview').innerHTML=`${icon('arrow')}<div><b>${esc(r.category)} → ${esc(r.team)}</b><small>${esc(r.reason)}</small></div>`;}});
document.addEventListener('change',e=>{if(e.target.id==='team-filter'){team=e.target.value;page=0;render();}if(e.target.id==='org-select'){org=e.target.value;selected=state.tickets.find(t=>t.org===org)?.id;render();}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,data=Object.fromEntries(new FormData(form));try{if(form.id==='new-form'){const t=C.createTicket(state,data);selected=t.id;org=t.org;filter='active';query='';team='';page=0;save();closeModal();render();toast(`${t.id} created and routed to ${t.team}.`);}else if(form.id==='manage-form'){C.updateTicket(state,form.dataset.id,data);save();closeModal();render();toast('Request updated. Activity and local notification recorded.');}else if(form.id==='customer-form'){C.customerNote(state,form.dataset.id,data.note);save();closeModal();render();toast('Information added to the request.');}else if(form.id==='import-form'){const inputs=C.parseImport(data.json);const added=inputs.map(i=>C.createTicket(state,i));selected=added[0].id;filter='active';query='';team='';page=0;save();closeModal();render();toast(`${added.length} request${added.length===1?'':'s'} imported successfully.`);}else if(form.id==='rating-form'){const t=state.tickets.find(t=>t.id===form.dataset.id);t.rating=Number(data.rating);t.history.push({at:state.clock,actor:org,type:'Feedback submitted',text:`Resolution rated ${t.rating}/5.`});save();closeModal();render();toast('Thank you. Your rating is reflected in Performance.');}}catch(err){formError(err);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('.modal')){const items=[...$('.modal').querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===items[0]){items.at(-1).focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){items[0].focus();e.preventDefault();}}});
render();
</script></body></html>
