function scenarioPanel(r){const applicable=new Set(state.portfolio.boats.flatMap(b=>b.tasks.map(t=>t.id))),remaining=state.budget-r.scenario.cost,over=remaining<0;return `<aside class="scenario-panel"><div class="scenario-title"><span class="eyebrow">THE WHAT-IF DESK</span><span class="scenario-number">01</span><h2>Make room<br>for progress.</h2><p>Fund a constraint. See what moves.</p></div><label class="field-label" for="preset">SCENARIO</label><select id="preset"><option ${state.preset==='Balanced recovery'?'selected':''}>Balanced recovery</option><option ${state.preset==='Parts first'?'selected':''}>Parts first</option><option ${state.preset==='Crew surge'?'selected':''}>Crew surge</option><option ${state.preset==='Baseline only'?'selected':''}>Baseline only</option><option ${state.preset==='Custom allocation'?'selected':''}>Custom allocation</option></select><div class="funding"><label for="budget">Incremental budget <span>USD</span></label><div class="money-input"><span>$</span><input id="budget" type="number" min="0" max="5000000" step="10000" value="${state.budget}" aria-label="Incremental budget in dollars"></div><div class="budget-track ${over?'over':''}"><span style="width:${Math.min(100,state.budget?r.scenario.cost/state.budget*100:100)}%"></span></div><div class="budget-caption"><b>${shortMoney(r.scenario.cost)} allocated</b><span class="${over?'warning':''}">${shortMoney(Math.abs(remaining))} ${over?'over budget':'remaining'}</span></div></div><div class="allocation-label">RESOURCE ALLOCATION <span>${active().length} active</span></div><div class="investments">${INVESTMENTS.map(o=>{const disabled=o.taskId&&!applicable.has(o.taskId);return `<label class="investment ${state.enabled.includes(o.id)&&!disabled?'checked':''} ${disabled?'disabled':''}"><input type="checkbox" data-option="${o.id}" ${state.enabled.includes(o.id)&&!disabled?'checked':''} ${disabled?'disabled':''}><span><b>${o.name}</b><small>${disabled?'Unavailable in imported portfolio':o.detail}</small><em>${shortMoney(o.cost)} <i>· ${o.kind}</i></em></span></label>`;}).join('')}</div><div class="sensitivity"><label for="buffer">Effort sensitivity ${icon('info')}</label><select id="buffer"><option value="0" ${state.buffer===0?'selected':''}>Nominal remaining hours</option><option value="10" ${state.buffer===10?'selected':''}>+10% remaining hours</option><option value="20" ${state.buffer===20?'selected':''}>+20% remaining hours</option></select><p>Applies to baseline and scenario. A stress test, not a confidence interval.</p></div>${over?'<div class="budget-warning" role="status">Over budget. Adjust funding or remove an allocation before saving this scenario.</div>':''}<button class="button primary full" data-action="save" ${over?'disabled':''}>${icon('saved')} Save scenario</button><button class="text-button full reset" data-action="clear-all">Clear allocations</button></aside>`;}
function assumptionsView(){return `<section class="hero"><div class="eyebrow">SOURCE WORKSPACE <b>SYNTHETIC INPUTS</b></div><div class="hero-title"><div><h1>A traceable starting point.</h1><p>Review the inputs behind every projected completion date.</p></div><button class="button primary" data-action="import">${icon('upload')} Import portfolio</button></div></section><div class="source-banner">${icon('info')}<div><b>One local portfolio, explicit assumptions.</b><p>${esc(state.portfolio.provenance||'User-supplied synthetic portfolio. No external validation.')}</p></div></div><section class="assumptions-card"><div class="section-heading"><div><h2>Shared labor pool</h2><p>Baseline capacity. Every available crew member contributes up to 8 hours per calendar day.</p></div></div><form id="capacity-form" class="capacity-form">${['mechanical','electrical','quality'].map(t=>`<label>${t[0].toUpperCase()+t.slice(1)}<input name="${t}" type="number" min="1" max="30" step="1" required value="${state.portfolio.capacity[t]}"><small>crew / day</small></label>`).join('')}<button class="button" type="submit">Update capacity</button></form></section><section class="assumptions-card"><div class="section-heading"><div><h2>Availability source register</h2><p>Editing inputs updates both the baseline and the scenario.</p></div><button class="text-button" data-action="source-export">Download source JSON ${icon('download')}</button></div><div class="table-wrap"><table><thead><tr><th>AVAILABILITY</th><th>PRIORITY</th><th>TARGET</th><th>REMAINING EFFORT</th><th></th></tr></thead><tbody>${state.portfolio.boats.map(b=>`<tr><td><strong>${esc(b.name)}</strong><small>${esc(b.id)} · ${b.tasks.length} packages</small></td><td>P${b.priority}</td><td>${date(b.targetDate)}, ${b.targetDate.slice(0,4)}</td><td>${b.tasks.reduce((n,t)=>n+t.hours,0).toLocaleString()} h</td><td><button class="text-button" data-action="edit" data-id="${esc(b.id)}">Review / edit ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div></section><div class="source-actions"><button class="button" data-action="method">Read model methodology</button><button class="text-button" data-action="reset">Restore synthetic example</button></div>`;}
function savedView(){return `<section class="hero"><div class="eyebrow">SCENARIO LIBRARY <b>ON THIS DEVICE</b></div><div class="hero-title"><div><h1>Keep the alternatives in view.</h1><p>Saved snapshots include source inputs, funding choices, and model settings.</p></div><button class="button" data-page="portfolio">Back to planner ${icon('arrow')}</button></div></section>${!state.saved.length?`<div class="empty large">${icon('saved')}<h2>Your next decision starts with a comparison.</h2><p>Save a funded scenario from the planning desk to keep its assumptions and results together.</p><button class="button primary" data-page="portfolio">Build a scenario ${icon('arrow')}</button></div>`:`<div class="saved-grid">${state.saved.map((s,i)=>{const result=M.compare(s.snapshot.portfolio,optionsFor(s.snapshot.portfolio,s.snapshot.enabled),s.snapshot.buffer);return `<article class="saved-card"><span class="eyebrow">SCENARIO ${String(i+1).padStart(2,'0')}</span><h2>${esc(s.name)}</h2><p>Saved ${new Date(s.createdAt).toLocaleString()}</p><div class="saved-stats"><div><strong>${result.daysRecovered}</strong><span>boat-days recovered</span></div><div><strong>${shortMoney(result.scenario.cost)}</strong><span>incremental spend</span></div></div><p>${result.scenario.onTime} / ${result.scenario.boats.length} within target · ${s.snapshot.buffer}% effort buffer</p><div class="saved-actions"><button class="button" data-action="load" data-id="${i}">Load scenario ${icon('arrow')}</button><button class="text-button" data-action="delete" data-id="${i}">Delete</button></div></article>`;}).join('')}</div>`}`;}
function bind(){document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{page=e.dataset.page;shell();window.scrollTo(0,0);});document.querySelectorAll('[data-boat]').forEach(e=>e.onclick=()=>{state.selected=e.dataset.boat;persist();shell();});document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action,e.dataset.id));document.querySelectorAll('[data-option]').forEach(e=>e.onchange=()=>{state.enabled=e.checked?[...state.enabled,e.dataset.option]:state.enabled.filter(id=>id!==e.dataset.option);state.preset='Custom allocation';persist();shell();});if($('#preset'))$('#preset').onchange=e=>{const presets={'Balanced recovery':['mechanics','valve','pump'],'Parts first':['valve','pump'],'Crew surge':['mechanics','electrical','quality'],'Baseline only':[]};state.preset=e.target.value;if(presets[state.preset])state.enabled=presets[state.preset];persist();shell();};if($('#budget'))$('#budget').onchange=e=>{const n=Number(e.target.value);if(!e.target.value||!Number.isInteger(n)||n<0||n>5000000){toast('Enter a whole-dollar budget between $0 and $5,000,000.');e.target.value=state.budget;return;}state.budget=n;persist();shell();};if($('#buffer'))$('#buffer').onchange=e=>{state.buffer=Number(e.target.value);persist();shell();};if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#timeline').innerHTML=timeline(calc());bindTimeline();};if($('#filter'))$('#filter').onchange=e=>{filter=e.target.value;$('#timeline').innerHTML=timeline(calc());bindTimeline();};if($('#capacity-form'))$('#capacity-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p=clone(state.portfolio);for(const t of ['mechanical','electrical','quality'])p.capacity[t]=Number(f.get(t));const errors=M.validate(p);if(errors.length){toast(errors[0]);return;}try{M.compare(p,optionsFor(p,state.enabled),20);}catch(err){toast(err.message);return;}state.portfolio=p;persist();shell();toast('Baseline labor capacity updated. All dates recalculated.');};}
function bindTimeline(){document.querySelectorAll('[data-boat]').forEach(e=>e.onclick=()=>{state.selected=e.dataset.boat;persist();shell();});document.querySelectorAll('#timeline [data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action));}
function openDialog(title,body,wide=false){const d=$('#dialog');d.className=wide?'wide':'';d.innerHTML=`<div class="dialog-heading"><div><span class="eyebrow">SOUNDINGS / PLANNING DESK</span><h2>${title}</h2></div><button class="icon-button" id="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;$('#close-dialog').onclick=()=>d.close();d.showModal();}
function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Export downloaded to your device.');}
function payload(){const r=calc();return {schemaVersion:1,title:state.preset,generatedAt:new Date().toISOString(),useCaseId:50,classification:'SYNTHETIC / ILLUSTRATIVE — NOT OPERATIONALLY VALIDATED',model:{version:'1.0',dailyHoursPerCrew:8,calendarDays:true,effortBufferPercent:state.buffer,dispatch:'Priority ascending, then source package order. Successors start no earlier than next day. Whole crew-day reservations.',limitations:['No weekends, shifts, rework, berth limits, certification, reliability or productivity effects.','Costs are fixed illustrative increments. No recurring cost model.','Completion represents last modeled work package, not authorization to return to sea.']},portfolio:state.portfolio,scenario:{options:active(),budget:state.budget,withinBudget:r.scenario.cost<=state.budget,cost:r.scenario.cost,boatDaysRecovered:r.daysRecovered},results:r.scenario.boats.map(b=>({id:b.id,name:b.name,target:b.target,baseline:r.baseline.boats.find(v=>v.id===b.id).date,scenario:b.date,onTime:b.onTime,daysRecovered:r.baseline.boats.find(v=>v.id===b.id).finish-b.finish,packages:b.tasks.map(t=>({id:t.id,partsReady:M.dateAt(state.portfolio.startDate,t.partDay),start:M.dateAt(state.portfolio.startDate,t.start),finish:M.dateAt(state.portfolio.startDate,t.finish)}))}))};}
function action(a,id){if(a==='clear-filter'){query='';filter='all';shell();}if(a==='clear-all'){state.enabled=[];state.preset='Baseline only';persist();shell();}if(a==='method')methodDialog();if(a==='edit')editDialog(id);if(a==='source-export')download('soundings-portfolio.json',JSON.stringify(state.portfolio,null,2));if(a==='export')exportDialog();if(a==='import')importDialog();if(a==='save')saveDialog();if(a==='load'){const s=state.saved[Number(id)];state={...state,...clone(s.snapshot),preset:'Custom allocation'};query='';filter='all';page='portfolio';persist();shell();toast('Saved scenario loaded, including its source assumptions.');}if(a==='delete'){state.saved.splice(Number(id),1);persist();shell();toast('Scenario removed from this device.');}if(a==='reset'){openDialog('Restore the synthetic example?',`<p>This replaces the current portfolio and allocation settings. Saved scenarios remain available. Export your current inputs first if you need them.</p><button class="button primary" id="confirm-reset">Restore example</button>`);$('#confirm-reset').onclick=()=>{state.portfolio=clone(DEMO_PORTFOLIO);state.enabled=['mechanics','valve','pump'];state.budget=1250000;state.buffer=0;state.selected='K02';state.preset='Balanced recovery';persist();$('#dialog').close();shell();toast('Synthetic example restored.');};}}
function saveDialog(){if(calc().scenario.cost>state.budget)return;openDialog('Save a planning scenario',`<form id="save-form"><label class="block-label">Scenario name<input name="name" required maxlength="60" value="${esc(state.preset)}"></label><p>A local snapshot of the full portfolio, allocation choices and effort sensitivity. No external approval or synchronization.</p><button class="button primary">Save snapshot</button></form>`);$('#save-form').onsubmit=e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();if(!name)return;const snapshot=clone({...state,saved:undefined});state.saved.unshift({name,createdAt:new Date().toISOString(),snapshot});persist();$('#dialog').close();shell();toast('Scenario saved. Find it in Saved scenarios.');};}
function exportDialog(){const p=payload();openDialog('Export the planning brief',`<div class="export-summary"><strong>${p.scenario.boatDaysRecovered} boat-days recovered</strong><span>${money(p.scenario.cost)} incremental allocation · ${p.scenario.withinBudget?'within budget':'OVER BUDGET'}</span></div><p>Every export is labeled illustrative. JSON includes original inputs, model assumptions, allocations and work-package dates. CSV includes the boat-level comparison.</p><div class="dialog-actions"><button class="button primary" id="export-json">${icon('download')} Full brief · JSON</button><button class="button" id="export-csv">${icon('download')} Comparison · CSV</button></div>`);$('#export-json').onclick=()=>download('soundings-planning-brief.json',JSON.stringify(p,null,2));$('#export-csv').onclick=()=>{const rows=[['Data status','Boat','Target','Baseline completion','Scenario completion','Boat-days recovered','Within target','Budget USD','Allocation USD','Within budget','Effort buffer percent','Model version'],...p.results.map(b=>['SYNTHETIC - ILLUSTRATIVE',b.name,b.target,b.baseline,b.scenario,b.daysRecovered,b.onTime,p.scenario.budget,p.scenario.cost,p.scenario.withinBudget,state.buffer,'1.0'])];download('soundings-comparison.csv',rows.map(r=>r.map(v=>'"'+(typeof v==='string'&&/^[=+@-]/.test(v)?"'"+v:String(v)).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');};}
function methodDialog(){openDialog('How the dates are calculated',`<p class="intro">A deterministic, illustrative schedule model. The same inputs always produce the same result.</p><ol class="method-list"><li><b>Start with the source portfolio.</b> Remaining effort, parts availability, task dependencies, target dates and daily crew capacities.</li><li><b>Apply the funding choices.</b> Crew surges increase shared capacity; expediting advances only the named package’s parts gate. Costs are fixed synthetic increments.</li><li><b>Schedule one calendar day at a time.</b> Packages become eligible when their parts and predecessors are ready. Boats with lower priority numbers go first; source order breaks ties. Each package receives up to its crew cap, at eight hours per crew member per day.</li><li><b>Compare last-package completion.</b> A successor starts the next day at the earliest. Part-day use reserves a whole crew-day. Boat-days recovered is the sum of baseline minus scenario completion across boats.</li></ol><div class="source-banner"><div><b>Know what this model leaves out</b><p>No shifts, weekends, learning curves, rework, space or berth constraints, safety clearance, certification or real supply-chain uncertainty. Completion is the end of modeled work, not authorization to return to sea.</p></div></div><p><b>Sensitivity:</b> +10% or +20% increases all remaining hours in both comparisons; these are stress tests, not probability bounds. Priorities and interactions can shift benefits between boats. Budget limits prevent saving, but permit exploring an over-budget scenario.</p><p><b>Source provenance:</b> Norfolk catalogue #50, “More Boats to Sea,” bundled in <code>harness/norfolk-snapshot.ts</code>. All demonstration records and costs are fictional. Handcrafted demo; not AppYard-generated or AppYard-verified.</p>`,true);}
function editDialog(id){const b=state.portfolio.boats.find(b=>b.id===id);openDialog(`Review ${esc(b.name)} inputs`,`<p>Changes update the baseline and scenario. The planning epoch is ${state.portfolio.startDate}; parts dates cannot precede it.</p><form id="edit-form"><div class="edit-meta"><label>Priority<input name="priority" type="number" min="1" max="12" step="1" required value="${b.priority}"></label><label>Target completion<input name="targetDate" type="date" min="${state.portfolio.startDate}" required value="${b.targetDate}"></label></div>${b.tasks.map((t,i)=>`<fieldset><legend>${esc(t.name)}</legend><p>${esc(t.id)} · ${esc(t.trade)} · ${t.dependsOn.length?'Depends on '+t.dependsOn.map(esc).join(', '):'No predecessors'}</p><div class="edit-fields"><label>Remaining hours<input type="number" name="hours-${i}" min="8" max="8000" step="1" required value="${t.hours}"></label><label>Crew limit<input type="number" name="crew-${i}" min="1" max="30" step="1" required value="${t.maxCrew}"></label><label>Parts available<input type="date" name="parts-${i}" min="${state.portfolio.startDate}" max="${M.dateAt(state.portfolio.startDate,365)}" required value="${t.partDate}"></label></div></fieldset>`).join('')}<p id="edit-error" class="error" role="alert"></p><div class="dialog-actions"><button class="button primary">Update & recalculate</button></div></form>`,true);$('#edit-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p=clone(state.portfolio),boat=p.boats.find(v=>v.id===id);boat.priority=Number(f.get('priority'));boat.targetDate=f.get('targetDate');boat.tasks.forEach((t,i)=>{t.hours=Number(f.get('hours-'+i));t.maxCrew=Number(f.get('crew-'+i));t.partDate=f.get('parts-'+i);});const errors=M.validate(p);if(errors.length){$('#edit-error').textContent=errors.join(' ');return;}try{M.compare(p,optionsFor(p,state.enabled),20);}catch(err){$('#edit-error').textContent=err.message;return;}state.portfolio=p;state.preset='Custom allocation';persist();$('#dialog').close();shell();toast('Source inputs updated. Baseline and scenario recalculated.');};}
function importDialog(){importCandidate=null;openDialog('Import a synthetic portfolio',`<p>Paste portfolio JSON or choose a local JSON file (up to 1 MB). Download the current source for the complete schema. Import replaces the active portfolio after validation; saved scenarios remain intact.</p><div class="dialog-actions"><label class="button file-button">Choose JSON file<input id="file-input" type="file" accept=".json,application/json"></label><button class="text-button" id="load-example">Load synthetic example</button></div><label class="block-label">Portfolio JSON<textarea id="import-text" rows="10" spellcheck="false" placeholder='{"schemaVersion":1,"startDate":"2026-11-09",...}'></textarea></label><div id="import-result" role="status"></div><div class="dialog-actions"><button class="button" id="validate-import">Validate portfolio</button><button class="button primary" id="apply-import" disabled>Replace active portfolio</button></div>`,true);const invalidate=()=>{importCandidate=null;$('#apply-import').disabled=true;$('#import-result').textContent='';};$('#import-text').oninput=invalidate;$('#load-example').onclick=()=>{$('#import-text').value=JSON.stringify(DEMO_PORTFOLIO,null,2);invalidate();};$('#file-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;invalidate();if(f.size>1000000){$('#import-result').innerHTML='<p class="error">File exceeds 1 MB.</p>';return;}$('#import-text').value=await f.text();invalidate();};$('#validate-import').onclick=()=>{invalidate();try{const input=$('#import-text').value;if(input.length>1000000)throw Error('Input exceeds 1 MB.');const p=JSON.parse(input);const errors=M.validate(p);if(errors.length)throw Error(errors.join(' '));M.schedule(p,[],20);importCandidate=p;$('#apply-import').disabled=false;$('#import-result').innerHTML=`<p class="validation-success">Validated: ${p.boats.length} availabilities, ${p.boats.reduce((n,b)=>n+b.tasks.length,0)} work packages. Dates are schedulable in the illustrative model.</p>`;}catch(err){$('#import-result').innerHTML=`<p class="error">${esc(err.message)}</p>`;}};$('#apply-import').onclick=()=>{if(!importCandidate)return;state.portfolio=clone(importCandidate);state.enabled=[];state.buffer=0;state.selected=state.portfolio.boats[0].id;state.preset='Baseline only';query='';filter='all';persist();$('#dialog').close();shell();toast('Portfolio imported. Allocations cleared for a fresh comparison.');};}
shell();if(storageIssue)toast(storageIssue);
</script></body></html>
