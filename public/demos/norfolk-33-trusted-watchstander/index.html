function libraryPage(){return `<header class="page-heading"><div><div class="eyebrow">REFERENCE DESK</div><h1>Evidence, in plain sight.</h1><p>Every review prompt traces to this bundled training library.</p></div>${btn('Download library','library-export','secondary','download')}</header><div class="library-notice">${icon('book',25)}<div><strong>Three fictional reference excerpts. Zero authoritative procedures.</strong><p>Written for this demo to make the reasoning inspectable. These thresholds and prompts must never be used for real navigation.</p></div></div><label class="search-box">${icon('search',19)}<input type="search" id="reference-search" placeholder="Search references, rules, or sections" value="${esc(search)}" aria-label="Search references"></label><div id="reference-list">${referenceList()}</div><div class="provenance"><h3>Source provenance</h3><p>The scenario is derived from Norfolk catalogue case #33, “Trusted Watchstander,” bundled in <code>harness/norfolk-snapshot.ts</code>. All readings, sources, aliases and excerpts in this workspace are synthetic. The app uses deterministic comparisons and direct citations; it makes no generative or procedural claims.</p></div>`;}
function referenceList(){return E.refs.filter(r=>JSON.stringify(r).toLowerCase().includes(search.toLowerCase())).map(r=>`<article class="reference-card"><div class="reference-id">${r.id}<span>SECTION ${r.section}</span></div><div><div class="eyebrow">${r.edition}</div><h2>${r.title}</h2><p>${r.body}</p><small>${r.scope}</small></div>${btn('Inspect','ref:'+r.id,'text-button','arrow')}</article>`).join('')||'<div class="empty-state"><h2>No matching references</h2><p>Try “freshness,” “human,” or a reference ID.</p></div>';}
function logPage(){return `<header class="page-heading"><div><div class="eyebrow">REPLAYABLE LOCAL RECORD</div><h1>Judgment, with a trail.</h1><p>Original evidence, human rationale, and the boundaries that held.</p></div>${btn('Verify record','verify','secondary','shield')}</header><div class="audit-banner">${icon('shield',25)}<div><strong>${verified===null?'Local SHA-256 chain':verified?'Record chain verified':'Record chain could not be verified'}</strong><p>${verified===false?'One or more records are missing, changed, or unavailable. Export the record for inspection.':'Hashes can reveal edits against a trusted saved chain. They do not provide authenticated identity or an independently anchored audit.'}</p></div>${badge(verified===null?'Not yet checked':verified?'Integrity checked':'Needs inspection',verified?'green':verified===false?'amber':'neutral')}</div><div class="log-list">${[...state.audit].reverse().map(a=>`<article class="log-row"><div class="log-icon">${icon(a.type==='Decision recorded'?'check':a.type==='Control request blocked'?'shield':a.type==='Snapshot imported'?'upload':'clock',19)}</div><div><div class="log-row-title"><h3>${esc(a.type)}</h3><span class="mono">${new Date(a.at).toLocaleString('en-GB',{timeZone:'UTC'})} UTC</span></div><p>${esc(a.detail.summary||a.detail.action||'')}</p><div class="log-meta">#${String(a.sequence).padStart(3,'0')} · ${a.hash?esc(a.hash.slice(0,20))+'…':'Hash unavailable'} ${a.detail.reviewer?'· '+esc(a.detail.reviewer):''}</div>${a.detail.rationale?`<blockquote>${esc(a.detail.rationale)}</blockquote>`:''}</div><button class="icon-button" data-audit="${a.sequence}" aria-label="Inspect record ${a.sequence}">${icon('chevron')}</button></article>`).join('')||'<div class="empty-state">No actions recorded yet.</div>'}</div><div class="boundary-panel"><div><h3>A visible boundary</h3><p>Demonstrate a rejected request to set a sensor heading. This only creates a local “blocked” record; no equipment interface exists.</p></div>${btn('Test control boundary','boundary','secondary','shield')}</div>`;}
function handoverPage(fs){return `<header class="page-heading"><div><div class="eyebrow">NEXT WATCH / HANDOVER</div><h1>Leave a clear picture.</h1><p>Carry the evidence forward, including everything still uncertain.</p></div><div class="heading-actions">${btn('Export JSON','export-json','secondary','download')}${btn('Export handover','export-md','primary','download')}</div></header><div class="handover-paper"><div class="handover-top"><div class="eyebrow">FICTIONAL EXERCISE / SHIFT HANDOVER</div><span class="mono">${time(state.dataset.snapshot)} UTC</span></div><h2>${esc(state.dataset.name)}</h2><p class="muted">${fs.filter(f=>f.status!=='clear').length} unresolved evidence conditions · ${fs.filter(f=>active(f)).length} current human reviews · ${state.dataset.observations.length} retained observations</p><div class="handover-findings">${fs.map((f,i)=>`<article><span class="handover-index">0${i+1}</span><div><h3>${esc(f.title)} ${badge(active(f)?'Reviewed':'Unreviewed',active(f)?'green':'amber')}</h3><p>${description(f)}</p>${active(f)?`<div class="handover-decision"><strong>${esc(active(f).action)}</strong> · ${esc(active(f).reviewer)}<p>${esc(active(f).rationale)}</p></div>`:'<p class="unreviewed">No human assessment has been recorded for the current evidence.</p>'}<small>Evidence: ${f.readings.map(o=>esc(o.id)).join(', ')||'None'} · ${f.refs.join(', ')}</small></div></article>`).join('')}</div><label class="field-label" for="handover-note">NOTES FOR THE NEXT WATCH</label><textarea id="handover-note" rows="4" maxlength="2000" placeholder="Capture an open question, requested check, or context for the next reviewer…">${esc(state.handoverNote)}</textarea><div class="note-save"><span id="note-status">Saved locally when you choose Save note.</span>${btn('Save note','save-note','secondary')}</div><div class="paper-foot">This handover preserves the source readings and review rationale. It conveys no authorization to operate equipment.</div></div>`;}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});document.querySelector('.brand').onclick=e=>{e.preventDefault();view='watch';render();};document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render();});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>showRef(b.dataset.ref));document.querySelectorAll('[data-observation]').forEach(b=>b.onclick=()=>showObservation(b.dataset.observation));document.querySelectorAll('[data-audit]').forEach(b=>b.onclick=()=>showAudit(Number(b.dataset.audit)));const input=document.querySelector('#reference-search');if(input)input.oninput=()=>{search=input.value;document.querySelector('#reference-list').innerHTML=referenceList();document.querySelectorAll('#reference-list [data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));};}
function openModal(title,body,wide=false){lastFocus=document.activeElement;modal=title;document.querySelector('#modal-root').innerHTML=`<div class="modal-scrim"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-button" id="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${body}</section></div>`;document.querySelector('#close-modal').onclick=closeModal;document.querySelector('.modal-scrim').onclick=e=>{if(e.target.classList.contains('modal-scrim'))closeModal();};setTimeout(()=>document.querySelector('.modal input,.modal textarea,.modal button')?.focus(),30);}
function closeModal(){document.querySelector('#modal-root').innerHTML='';modal=null;lastFocus?.focus();}
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select,.modal a')].filter(x=>!x.disabled&&x.offsetParent!==null),a=els[0],z=els.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
function showRef(id){const r=E.refs.find(x=>x.id===id);openModal('Reference evidence',`<div class="modal-content"><div class="eyebrow">${r.id} / SECTION ${r.section}</div><h3 class="modal-large">${r.title}</h3><div class="reference-quote">${r.body}</div><p class="muted">${r.scope}</p><div class="modal-note">Bundled author-created training excerpt · revision 1<br>Provenance: synthetic reference library for Norfolk #33.</div></div>`);}
function showObservation(id){const o=state.dataset.observations.find(x=>x.id===id);openModal('Source observation',`<div class="modal-content"><div class="eyebrow">${esc(o.id)} / FICTIONAL SENSOR</div><h3 class="modal-large">${esc(o.source)}</h3><div class="observation-value">${esc(val(o))}</div><dl class="details"><dt>Observed</dt><dd>${esc(o.observedAt)}</dd><dt>Age at snapshot</dt><dd>${ageText(E.age(o,state.dataset.snapshot))}</dd><dt>Source note</dt><dd>${esc(o.note)||'No source note supplied.'}</dd><dt>Interpretation</dt><dd>Current means recent, not verified or authoritative.</dd></dl></div>`);}
function showAudit(n){const a=state.audit.find(x=>x.sequence===n);openModal('Audit record '+n,`<div class="modal-content"><p class="muted">Raw payload retained for inspection. Aliases are simulated and not signatures.</p><pre>${esc(JSON.stringify(a,null,2))}</pre></div>`,true);}
function reviewModal(){const f=findings().find(x=>x.id===selected);openModal('Record a human review',`<form id="review-form" class="modal-content"><div class="eyebrow">${esc(f.title.toUpperCase())}</div><p class="muted">This records your assessment of the current evidence. The source condition remains visible.</p><label class="field-label" for="reviewer">REVIEWER ALIAS · SIMULATED</label><input id="reviewer" name="reviewer" value="M. Chen" minlength="2" maxlength="80" required><label class="field-label" for="decision">DECISION</label><select id="decision" name="decision">${['Request independent check','Retain uncertainty','Escalate for human review','Acknowledge evidence'].map(s=>`<option>${s}</option>`).join('')}</select><label class="field-label" for="rationale">RATIONALE / WHAT REMAINS UNKNOWN</label><textarea id="rationale" name="rationale" rows="4" minlength="12" maxlength="1000" required placeholder="Explain your review, the evidence considered, and any follow-up needed."></textarea><div class="modal-note">Linked evidence: ${f.readings.map(o=>esc(o.id)).join(', ')||'No readings'}<br>References: ${f.refs.join(', ')} · New evidence will require a new review.</div><label class="check-label"><input type="checkbox" name="ack" required><span>I reviewed the cited evidence. This is a training record, not an equipment instruction.</span></label><div id="form-error" class="error" role="alert"></div><button class="button primary full" type="submit">${icon('check',17)} Save human review</button></form>`);document.querySelector('#review-form').onsubmit=async e=>{e.preventDefault();const form=e.target,d={id:'REV-'+String(state.decisions.length+1).padStart(3,'0'),findingId:f.id,fingerprint:f.fingerprint,action:form.decision.value,reviewer:form.reviewer.value.trim(),rationale:form.rationale.value.trim(),evidenceIds:f.readings.map(o=>o.id),references:f.refs,at:new Date().toISOString(),exerciseSnapshot:state.dataset.snapshot};if(!E.validDecision(d)){document.querySelector('#form-error').textContent='Use a reviewer alias and a rationale of at least 12 characters.';return;}form.querySelector('button[type=submit]').disabled=true;state.decisions.push(d);await audit('Decision recorded',{...d,summary:f.title+' — '+d.action});closeModal();render();toast('Review saved. Source uncertainty retained.');};}
function addModal(){openModal('Add a synthetic observation',`<form id="observation-form" class="modal-content"><p class="muted">Add a fresh reading or update an existing source. Older readings remain in the export.</p><div class="form-grid"><div><label class="field-label" for="kind">OBSERVATION TYPE</label><select id="kind" name="kind"><option value="heading">Heading · degrees</option><option value="position">Position · exercise grid</option><option value="clock">Clock offset · seconds</option></select></div><div><label class="field-label" for="source">SOURCE NAME</label><input id="source" name="source" list="sources" maxlength="80" required placeholder="e.g. Gyro B"><datalist id="sources">${E.latest(state.dataset).map(o=>`<option value="${esc(o.source)}">`).join('')}</datalist></div></div><div id="value-inputs"></div><label class="field-label" for="observed">OBSERVED AT · UTC</label><input id="observed" name="observed" value="${state.dataset.snapshot}" required><label class="field-label" for="source-note">SOURCE NOTE</label><textarea id="source-note" name="note" rows="2" maxlength="500" placeholder="Describe how this fictional observation was obtained."></textarea><div id="form-error" class="error" role="alert"></div><button type="submit" class="button primary full">${icon('plus',16)} Add observation & reassess</button></form>`);const f=document.querySelector('#observation-form');function fields(){document.querySelector('#value-inputs').innerHTML=f.kind.value==='position'?'<div class="form-grid"><div><label class="field-label" for="value-x">X · NAUTICAL MILES</label><input id="value-x" name="x" type="number" step="any" required></div><div><label class="field-label" for="value-y">Y · NAUTICAL MILES</label><input id="value-y" name="y" type="number" step="any" required></div></div>':'<label class="field-label" for="value">'+(f.kind.value==='heading'?'HEADING · 0 TO <360°':'OFFSET · SECONDS')+'</label><input id="value" name="reading" type="number" step="any" required>';}
f.kind.onchange=fields;fields();f.onsubmit=async e=>{e.preventDefault();const o={id:'OBS-'+Date.now().toString(36).toUpperCase(),kind:f.kind.value,source:f.source.value.trim(),value:f.kind.value==='position'?{x:Number(f.x.value),y:Number(f.y.value)}:Number(f.reading.value),observedAt:f.observed.value.trim(),note:f.note.value.trim()};const data={...state.dataset,observations:[...state.dataset.observations,o]},errors=E.validate(data);if(errors.length){document.querySelector('#form-error').textContent=errors.join(' ');return;}f.querySelector('button[type=submit]').disabled=true;state.dataset=data;selected=o.kind;filter='all';await audit('Observation added',{summary:`${o.source}: ${val(o)} at ${time(o.observedAt)} UTC. Prior readings retained.`,observation:o});closeModal();render();toast('New evidence added. Findings reassessed.');};}
function importModal(){openModal('Import a fictional snapshot',`<div class="modal-content"><p class="muted">Load a JSON snapshot with a UTC exercise time and synthetic observations. This replaces the current source picture and starts new reviews; earlier actions remain in the audit.</p><div class="import-tools"><label class="button secondary file-label">${icon('upload',17)} Choose JSON file<input type="file" id="import-file" accept=".json,application/json"></label><button class="button secondary" id="load-example">Load example</button><button class="button text-button" id="download-example">Get template ${icon('download',15)}</button></div><label class="field-label" for="import-text">SNAPSHOT JSON · MAXIMUM 500 OBSERVATIONS</label><textarea id="import-text" rows="12" class="code-input" placeholder='{"schemaVersion": 1, "name": "Exercise", "snapshot": "2026-11-05T14:32:00Z", "observations": []}'></textarea><div id="import-errors" class="error" role="alert"></div><div class="modal-note">Values are checked for real dates, unique IDs, future readings, numeric ranges, and source consistency. An empty observation list is valid and shows missing evidence.</div><button class="button primary full" id="apply-import">Validate & import snapshot ${icon('arrow',16)}</button></div>`,true);document.querySelector('#load-example').onclick=()=>document.querySelector('#import-text').value=JSON.stringify(E.seed,null,2);document.querySelector('#download-example').onclick=()=>download('watch-snapshot-template.json',JSON.stringify(E.seed,null,2),'application/json');document.querySelector('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>1024*1024){document.querySelector('#import-errors').textContent='File exceeds the 1 MB limit.';return;}document.querySelector('#import-text').value=await file.text();};document.querySelector('#apply-import').onclick=async()=>{let d;try{const t=document.querySelector('#import-text').value;if(t.length>1024*1024)throw Error('too large');d=JSON.parse(t);}catch{document.querySelector('#import-errors').textContent='Enter valid JSON under 1 MB. Load the example for the expected format.';return;}const errors=E.validate(d);if(errors.length){document.querySelector('#import-errors').innerHTML='<strong>Snapshot not imported</strong><ul>'+errors.slice(0,8).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';return;}document.querySelector('#apply-import').disabled=true;state.dataset=d;state.decisions=[];state.handoverNote='';await audit('Snapshot imported',{summary:`${d.name}: ${d.observations.length} observations loaded. Previous decisions retained in audit history.`,dataset:d});selected='heading';filter='all';closeModal();view='watch';render();toast('Validated snapshot imported.');};}
function download(name,content,type='text/plain'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function markdown(h){return `# Trusted Watchstander — Shift handover\n\n**FICTIONAL TRAINING DEMO — NOT FOR NAVIGATION**\n\nExercise: ${h.exercise}\nSnapshot: ${h.exerciseSnapshot}\nExported: ${h.exportedAt}\nReviewer identity: simulated aliases; not authenticated.\n\n`+h.findings.map(f=>`## ${f.title}\n\nCondition: ${f.status}. Uncertainty retained: ${f.uncertaintyRetained?'yes':'no triggered condition; accuracy unverified'}.\n\n`+f.readings.map(o=>`- ${o.id} · ${o.source}: ${val(o)} at ${o.observedAt}. Note: ${o.note}`).join('\n')+`\n\nReview: ${f.decision?`${f.decision.action} — ${f.decision.reviewer}\nRationale: ${f.decision.rationale}`:'No current human review.'}\nReferences: ${f.refs.join(', ')}\n`).join('\n')+`\n## Next-watch notes\n\n${h.handoverNote||'No additional notes recorded.'}\n\n## Reference library\n\n`+h.references.map(r=>`### ${r.id} §${r.section} — ${r.title}\n\n${r.body}\n\n${r.scope}`).join('\n\n')+`\n\n## Limitations\n\n${h.limitations.map(x=>'- '+x).join('\n')}\n\nExport the companion JSON for all retained observations, historical reviews and full audit payloads.\n`;}
async function exportHandover(format){const note=document.querySelector('#handover-note');if(note&&note.value!==state.handoverNote){state.handoverNote=note.value;await audit('Handover note saved',{summary:'Next-watch context saved before export.',note:state.handoverNote});}await audit('Handover exported',{summary:`${format==='json'?'JSON evidence bundle':'Markdown handover'} exported at the current exercise snapshot.`});const h=E.handover(state);download(`watch-handover-${state.dataset.snapshot.slice(0,10)}.${format==='json'?'json':'md'}`,format==='json'?JSON.stringify(h,null,2):markdown(h),format==='json'?'application/json':'text/markdown');render();toast('Handover exported with sources and uncertainty.');}
async function action(a){if(a.startsWith('ref:'))return showRef(a.slice(4));if(a==='review')return reviewModal();if(a==='add')return addModal();if(a==='import')return importModal();if(a==='advance'){const next=new Date(Date.parse(state.dataset.snapshot)+60000).toISOString().replace('.000Z','Z');if(!E.validTime(next)){toast('The exercise clock has reached the supported calendar limit.');return;}state.dataset.snapshot=next;await audit('Exercise time advanced',{summary:'Snapshot advanced by one minute. Freshness conditions recalculated.'});render();toast('Exercise clock advanced by one minute.');}if(a==='verify'){verified=await verify();render();toast(verified?'All local audit links verified.':'Audit integrity could not be established.');}if(a==='boundary'){await audit('Control request blocked',{summary:'Request to set a sensor heading was blocked: equipment-control actions are outside the demo policy.',requestedAction:'set_sensor_heading',outcome:'blocked',policy:'REF-03 §4.1',equipmentInterface:'none'});render();toast('Blocked and logged. No equipment interface exists.');}if(a==='save-note'){state.handoverNote=document.querySelector('#handover-note').value;await audit('Handover note saved',{summary:'Next-watch context updated.',note:state.handoverNote});document.querySelector('#note-status').textContent='Saved in this browser.';toast('Handover note saved.');}if(a==='export-json'||a==='export-md')return exportHandover(a==='export-json'?'json':'md');if(a==='library-export')download('watch-training-reference-library.json',JSON.stringify(E.refs,null,2),'application/json');if(a==='recover')download('watch-saved-data-recovery.txt',corruptRaw||'');if(a==='reset'){openModal('Restore the original exercise?',`<div class="modal-content"><p>This clears this demo’s observations, decisions, notes and audit history from this browser. Export your handover first if you need the current record.</p><div class="modal-footer"><button id="cancel-reset" class="button secondary">Keep my work</button><button id="confirm-reset" class="button primary">Restore sample</button></div></div>`);document.querySelector('#cancel-reset').onclick=closeModal;document.querySelector('#confirm-reset').onclick=async()=>{state={dataset:structuredClone(E.seed),decisions:[],audit:[],handoverNote:''};corruptRaw=null;storageWarning='';selected='heading';filter='all';view='watch';await audit('Exercise initialized',{summary:'Original fictional exercise restored.',dataset:state.dataset});closeModal();render();toast('Original exercise restored.');};}}
if(!state.audit.length&&corruptRaw===null)await audit('Exercise initialized',{summary:'Fictional navigation snapshot loaded. Seven observations; three review conditions.',dataset:state.dataset});
render();
matchMedia('(max-width:760px)').addEventListener('change',()=>{if(view==='watch'&&!modal)render();});
})();
</script></body></html>
