</style></head><body><div id="app"></div><div id="dialog-root"></div><div id="toast" role="status" aria-live="polite"></div><script>/* MORDECAI: illustrative deterministic governance simulator. No network or actuation. */
(function(root){

const CLASSES=['Navigation','Damage control','Engineering','Sensing','Communications','Logistics'];
const RESOURCES=[{id:'cooling-c',name:'Cooling loop C',kind:'Shared actuator',location:'Auxiliary machinery · zone 03'},{id:'sensor-bus',name:'Sensor scheduler',kind:'Compute allocation',location:'Processing enclave · zone 01'},{id:'uplink',name:'Training uplink',kind:'Network allocation',location:'Communications · zone 02'}];
const clone=x=>JSON.parse(JSON.stringify(x));
const policy=()=>({version:'ILLUSTRATIVE-1',heartbeatTimeout:30,maxLease:120,modifiers:{Cruising:{Navigation:10,'Damage control':0,Engineering:5,Sensing:0,Communications:0,Logistics:0},'General quarters':{Navigation:0,'Damage control':25,Engineering:5,Sensing:15,Communications:10,Logistics:-10}}});

function record(s,type,title,detail){s.events.push({id:'EV-'+String(s.events.length+1).padStart(3,'0'),time:s.time,type,title,detail,snapshot:snapshot(s)});}
function rank(s,a){return a.baseRank+s.policy.modifiers[s.condition][a.class]+a.promotion;}
function health(s,a){return a.quarantined?'quarantined':s.time-a.lastHeartbeat>s.policy.heartbeatTimeout?'stale':'healthy';}
function createState(){
const definitions=[['helm','HELM','Navigation',75,['cooling-c']],['repair','PATCH','Damage control',65,['cooling-c']],['thermal','THERMAL','Engineering',60,['cooling-c']],['lookout','LOOKOUT','Sensing',70,['sensor-bus']],['relay','RELAY','Communications',60,['uplink']],['sentinel','SENTINEL','Sensing',58,['sensor-bus']],['bilge','BILGE','Damage control',56,['cooling-c']],['route','WAYFINDER','Navigation',55,['sensor-bus']],['power','GRID','Engineering',50,['cooling-c']],['supply','STORES','Logistics',42,['uplink']],['deck','DECKHAND','Logistics',38,['sensor-bus']],['log','SCRIBE','Communications',30,['uplink']]];
const s={version:1,time:0,condition:'Cruising',halted:false,policy:policy(),agents:definitions.map(([id,name,cls,baseRank,capabilities])=>({id,name,class:cls,baseRank,capabilities,promotion:0,lastHeartbeat:0,silent:false,quarantined:false,contract:{heartbeat:true,intent:true,report:true,halt:true}})),resources:clone(RESOURCES),leases:[{id:'L-001',resource:'sensor-bus',agentId:'lookout',expiresAt:90,requestId:'INITIAL-1'},{id:'L-002',resource:'uplink',agentId:'relay',expiresAt:60,requestId:'INITIAL-2'}],requests:[],events:[],nextRequest:1};
seed(s);record(s,'system','Watch initialized','12 synthetic agents registered. Two existing leases and two competing intents loaded.');return s;
}
function seed(s){if(s.requests.some(r=>r.status==='pending'&&r.resource==='cooling-c'))throw Error('Resolve the pending cooling intents before starting another contest.');for(const [agentId,action]of [['helm','Preserve navigation cabinet cooling'],['repair','Redirect cooling to repair workspace']])s.requests.push({id:'REQ-'+String(s.nextRequest++).padStart(3,'0'),agentId,resource:'cooling-c',action,duration:60,status:'pending',submittedAt:s.time,checks:[],reason:''});}
function validateManifest(m,s){
if(!m||typeof m!=='object'||Array.isArray(m))throw Error('Manifest must be a JSON object.');
if(typeof m.id!=='string'||! /^[a-z][a-z0-9-]{1,29}$/.test(m.id))throw Error('ID must be 2–30 lowercase letters, numbers or hyphens, starting with a letter.');
if(s.agents.some(a=>a.id===m.id))throw Error('Agent ID is already registered. Choose a unique ID.');
if(typeof m.name!=='string'||m.name.trim().length<2||m.name.length>32)throw Error('Display name must contain 2–32 characters.');
if(!CLASSES.includes(m.class))throw Error('Choose a supported agent class.');
if(!Number.isInteger(m.baseRank)||m.baseRank<0||m.baseRank>100)throw Error('Base rank must be a whole number from 0 to 100.');
if(!Array.isArray(m.capabilities)||m.capabilities.length===0||new Set(m.capabilities).size!==m.capabilities.length||m.capabilities.some(id=>!RESOURCES.some(r=>r.id===id)))throw Error('Declare at least one unique, known resource capability.');
if(!m.contract||!['heartbeat','intent','report','halt'].every(k=>m.contract[k]===true))throw Error('All four contract hooks must be explicitly true: heartbeat, intent, report and halt.');
return {id:m.id,name:m.name.trim(),class:m.class,baseRank:m.baseRank,capabilities:[...m.capabilities],contract:clone(m.contract),promotion:0,lastHeartbeat:s.time,silent:false,quarantined:false};
}
function checks(s,r){const a=s.agents.find(a=>a.id===r.agentId);return [
{rule:'P01',label:'Operator authority',pass:!s.halted,detail:s.halted?'Global halt is active.':'No operator halt is active.'},
{rule:'P02',label:'Registered contract',pass:!!a&&['heartbeat','intent','report','halt'].every(k=>a.contract[k]===true),detail:a?'All four declared hooks are present.':'Agent is not registered.'},
{rule:'P03',label:'Trust and heartbeat',pass:!!a&&health(s,a)==='healthy',detail:!a?'No identity to verify.':a.quarantined?'Agent is quarantined.':`${s.time-a.lastHeartbeat}s since heartbeat; limit ${s.policy.heartbeatTimeout}s.`},
{rule:'P04',label:'Declared capability',pass:!!a&&a.capabilities.includes(r.resource),detail:a?.capabilities.includes(r.resource)?'Resource is within the declared manifest.':'Requested resource is outside the manifest.'},
{rule:'P05',label:'Bounded resource lease',pass:s.resources.some(x=>x.id===r.resource)&&Number.isInteger(r.duration)&&r.duration>0&&r.duration<=s.policy.maxLease,detail:`Requested ${r.duration}s; policy maximum ${s.policy.maxLease}s.`}];}
function revoke(s,predicate,why){const removed=s.leases.filter(predicate);s.leases=s.leases.filter(l=>!predicate(l));for(const l of removed){const r=s.requests.find(r=>r.id===l.requestId);if(r){r.status='revoked';r.reason=why;}}return removed.length;}
function arbitrate(s){
const pending=s.requests.filter(r=>r.status==='pending');if(!pending.length)throw Error('No pending intents. Announce an intent or seed a new contest.');
for(const r of pending){r.evaluation={time:s.time,condition:s.condition,rank:rank(s,s.agents.find(a=>a.id===r.agentId)),policy:clone(s.policy)};r.checks=checks(s,r);if(r.checks.some(c=>!c.pass)){r.status='blocked';r.reason=r.checks.find(c=>!c.pass).detail;}}
for(const resource of RESOURCES){const valid=pending.filter(r=>r.resource===resource.id&&r.status==='pending');if(!valid.length)continue;
const current=s.leases.find(l=>l.resource===resource.id);const holder=current&&s.agents.find(a=>a.id===current.agentId);const heldRank=holder?rank(s,holder):-Infinity;
const highest=Math.max(...valid.map(r=>rank(s,s.agents.find(a=>a.id===r.agentId))));
const leaders=valid.filter(r=>rank(s,s.agents.find(a=>a.id===r.agentId))===highest);
const collision=leaders.length>1||(holder&&heldRank===highest&&leaders[0].agentId!==holder.id);
if(highest<heldRank){for(const r of valid){r.status='blocked';r.reason=`Existing holder ${holder.name} has higher authority (${heldRank}).`;r.checks.push({rule:'P06',label:'Exclusive authority',pass:false,detail:r.reason});}continue;}
if(collision){for(const r of valid){r.status=rank(s,s.agents.find(a=>a.id===r.agentId))===highest?'escalated':'blocked';r.reason=r.status==='escalated'?`Equal effective rank ${highest}. Operator must change authority or release the lease, then retry.`:`Lower effective rank than the tied leaders (${highest}).`;r.checks.push({rule:'P06',label:'Exclusive authority',pass:false,detail:r.reason});}continue;}
const winner=leaders[0];revoke(s,l=>l.resource===resource.id,`Superseded by ${winner.id}.`);
s.leases.push({id:'L-'+winner.id,resource:resource.id,agentId:winner.agentId,expiresAt:s.time+winner.duration,requestId:winner.id});
for(const r of valid){r.status=r===winner?'allowed':'blocked';r.reason=r===winner?`Highest eligible authority (${highest}); exclusive ${r.duration}s lease granted.`:`Effective rank ${rank(s,s.agents.find(a=>a.id===r.agentId))} is below the winning rank ${highest}.`;r.checks.push({rule:'P06',label:'Exclusive authority',pass:r===winner,detail:r.reason});}
}
const allowed=pending.filter(r=>r.status==='allowed').length;record(s,'decision','Policy arbitration complete',`${allowed} allowed · ${pending.filter(r=>r.status==='blocked').length} blocked · ${pending.filter(r=>r.status==='escalated').length} escalated. Decisions authorize simulated leases only.`);
}
function dispatch(state,action){const s=clone(state);const a=s.agents.find(a=>a.id===action.agentId);
switch(action.type){
case 'condition':if(!Object.keys(s.policy.modifiers).includes(action.value))throw Error('Unknown ship condition.');s.condition=action.value;record(s,'authority','Ship condition changed',`${s.condition}. Effective ranks recomputed. Existing leases remain until contested, released or expired.`);break;
case 'promote':if(!a)throw Error('Unknown agent.');if(!Number.isInteger(action.value)||action.value<0||action.value>50)throw Error('Promotion must be a whole number from 0 to 50.');if(typeof action.reason!=='string'||action.reason.trim().length<5||action.reason.length>200)throw Error('Add a promotion rationale of 5–200 characters.');a.promotion=action.value;record(s,'authority',`${a.name} authority updated`,`Operator promotion +${action.value}. ${action.reason.trim()}`);break;
case 'register':{const agent=validateManifest(action.manifest,s);s.agents.push(agent);record(s,'agent',`${agent.name} registered`,`${agent.class} · base rank ${agent.baseRank} · four declared contract hooks. Identity is simulated.`);break;}
case 'request':{if(!a)throw Error('Select a registered agent.');if(!RESOURCES.some(r=>r.id===action.resource))throw Error('Choose a known resource.');if(typeof action.action!=='string'||action.action.trim().length<5||action.action.length>200)throw Error('Describe the intent in 5–200 characters.');if(!Number.isInteger(action.duration)||action.duration<1||action.duration>300)throw Error('Lease duration must be a whole number from 1 to 300 seconds.');const r={id:'REQ-'+String(s.nextRequest++).padStart(3,'0'),agentId:a.id,resource:action.resource,action:action.action.trim(),duration:action.duration,status:'pending',submittedAt:s.time,checks:[],reason:''};s.requests.push(r);record(s,'intent',`${r.id} announced`,`${a.name}: ${r.action}. Evaluation required before a lease is granted.`);break;}
case 'arbitrate':arbitrate(s);break;
case 'contest':seed(s);record(s,'intent','Cooling contest announced','HELM and PATCH submitted competing 60-second intents.');break;
case 'halt':s.halted=true;{const n=revoke(s,()=>true,'Operator global halt.');s.requests.filter(r=>r.status==='pending').forEach(r=>{r.checks=checks(s,r);r.status='blocked';r.reason='Operator global halt.';});record(s,'halt','Operator halted all agents',`${n} leases revoked; pending intents blocked. Simulated halt hooks acknowledged by ${s.agents.length} agents.`);}break;
case 'resume':s.halted=false;record(s,'authority','Operator resumed supervision','Previously revoked leases are not restored. New intents must pass all checks.');break;
case 'advance':s.time+=10;for(const a of s.agents)if(!a.silent&&!a.quarantined)a.lastHeartbeat=s.time;{const n=revoke(s,l=>l.expiresAt<=s.time||health(s,s.agents.find(a=>a.id===l.agentId))!=='healthy','Lease expired or holder heartbeat stale.');record(s,'clock','Simulation advanced 10 seconds',`${n} leases expired or revoked. Healthy agents emitted synthetic heartbeats.`);}break;
case 'heartbeat':if(!a)throw Error('Unknown agent.');if(a.quarantined)throw Error('Clear quarantine before accepting heartbeats.');a.lastHeartbeat=s.time;a.silent=false;record(s,'agent',`${a.name} heartbeat restored`,'Synthetic heartbeat received; automatic simulation heartbeats resumed.');break;

nd operator rationale. Timestamps use the explicit simulation clock.</p></div></aside></div>`;}
function policyView(s){return `<div class="policy-layout"><section class="panel"><div class="panel-head"><div><h2>Authority model</h2><p>Editable simulation data, applied consistently to all agents.</p></div>${badge(s.policy.version)}</div><div class="formula"><span>Base rank</span><b>+</b><span>Condition modifier</span><b>+</b><span>Operator promotion</span><b>=</b><strong>Effective rank</strong></div><form id="policy-form"><div class="table-scroll"><table class="policy-table"><thead><tr><th>AGENT CLASS</th><th>CRUISING</th><th>GENERAL QUARTERS</th></tr></thead><tbody>${M.CLASSES.map((c,i)=>`<tr><td>${c}</td>${['Cruising','General quarters'].map((condition,j)=>`<td><input aria-label="${c} ${condition} modifier" type="number" min="-50" max="50" name="mod-${i}-${j}" value="${s.policy.modifiers[condition][c]}" required></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="policy-fields"><label>Heartbeat timeout <span>seconds · stale when older than this</span><input type="number" name="heartbeat" min="10" max="120" value="${s.policy.heartbeatTimeout}" required></label><label>Maximum new lease <span>seconds · existing leases retain expiry</span><input type="number" name="lease" min="10" max="300" value="${s.policy.maxLease}" required></label></div><div class="form-footer"><span>Changes are recorded in the audit.</span><button class="button dark" ${replay!==null?'disabled':''}>Save policy data</button></div></form></section><aside class="rules"><span class="eyebrow">EVALUATION ORDER</span>${[['P01','Human authority','An active global halt blocks every agent and revokes every lease.'],['P02','Declared contract','Registration requires heartbeat, intent, action report and halt hooks.'],['P03','Continuous trust','Quarantine or an overdue heartbeat blocks access.'],['P04','Least capability','Agents may request only resources declared in their manifests.'],['P05','Bounded leases','Requests must use a known resource and a permitted lease duration.'],['P06','Exclusive authority','Highest eligible rank wins. A higher-ranked holder keeps its lease. Ties escalate.']].map(([id,title,desc])=>`<div class="rule"><span>${id}</span><div><strong>${title}</strong><p>${desc}</p></div></div>`).join('')}<p class="limitation">These are illustrative rules derived from the Norfolk brief, not an operational standard or safety certification.</p></aside></div>`;}
function handleClick(e){const b=e.target.closest('button,a');if(!b)return;
if(b.classList.contains('brand')){e.preventDefault();view='overview';render();}
if(b.dataset.view){view=b.dataset.view;render();return;}
if(b.dataset.agent)return agentDialog(b.dataset.agent);
if(b.dataset.request)return requestDialog(b.dataset.request);
if(b.dataset.resource){selectedResource=b.dataset.resource;view='resources';render();return;}
if(b.dataset.report)return reportDialog(b.dataset.report);
if(b.dataset.release){if(act({type:'release',resource:b.dataset.release}))toast('Lease released. New requests must pass policy.');return;}
if(b.dataset.condition){if(b.dataset.condition!==data().condition)act({type:'condition',value:b.dataset.condition});return;}
if(b.dataset.event){replay=Number(b.dataset.event);render();return;}
switch(b.dataset.do){case 'register':registerDialog();break;case 'intent':intentDialog(b.dataset.res);break;case 'arbitrate':if(act({type:'arbitrate'}))toast('Policy evaluation complete. Inspect each decision for its checks.');break;case 'contest':selectedResource='cooling-c';if(act({type:'contest'}))toast('Two synthetic cooling intents announced.');break;case 'halt':if(act({type:'halt'}))toast('All leases revoked. Operator halt is active.');break;case 'resume':if(act({type:'resume'}))toast('Supervision resumed. Reannounce requests to obtain new leases.');break;case 'advance':act({type:'advance'});break;case 'export':exportAudit();break;case 'reset':resetDialog();break;case 'guide':guideDialog();break;case 'live':replay=null;render();break;case 'previous':replay=Math.max(0,(replay===null?state.events.length-1:replay)-1);render();break;case 'next':replay=Math.min(state.events.length-1,replay+1);render();break;case 'clear-filters':query='';filter='all';render();break;}
}
function dialog(title,eyebrow,body,wide=false){$('#dialog-root').innerHTML=`<dialog class="modal ${wide?'wide':''}" aria-labelledby="dialog-title"><div class="modal-head"><div><span class="eyebrow">${eyebrow}</span><h2 id="dialog-title">${title}</h2></div><button class="icon-button" id="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div></dialog>`;const d=$('dialog');d.showModal();$('#close-dialog').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});d.addEventListener('close',()=>{$('#dialog-root').innerHTML='';});return d;}
function agentDialog(id){const s=data(),a=s.agents.find(a=>a.id===id);dialog(esc(a.name),'AGENT MANIFEST · '+esc(a.id),`<div class="agent-summary"><span class="agent-avatar large">${esc(a.name.slice(0,2))}</span><div><strong>${esc(a.class)}</strong><p>${badge(M.health(s,a),M.health(s,a)==='healthy'?'green':'amber')} ${a.silent?'Synthetic heartbeat feed paused':''}</p></div><strong class="big-rank">${M.rank(s,a)}<small>EFFECTIVE RANK</small></strong></div><div class="contract-grid">${['Heartbeat','Intent announcement','Action report','Halt hook'].map(c=>`<span>${icon('check')}${c}</span>`).join('')}</div><p class="muted">Declared capabilities: ${a.capabilities.map(id=>s.resources.find(r=>r.id===id).name).join(', ')}. Hook acknowledgments and identity are simulated, not cryptographically verified.</p><form id="promotion-form"><h3>Operator field promotion</h3><div class="field-row"><label>Promotion points <input type="number" name="promotion" min="0" max="50" value="${a.promotion}" required></label><label>Base + condition <input value="${a.baseRank} + ${s.policy.modifiers[s.condition][a.class]}" disabled></label></div><label>Operator rationale <input name="reason" placeholder="e.g. Prioritize repair during the exercise" minlength="5" maxlength="200" required></label><div class="inline-error" role="alert"></div><button class="button dark" ${replay!==null?'disabled':''}>Apply authority change</button></form><div class="agent-controls"><h3>Simulated trust controls</h3><p>Pause heartbeats, then advance the clock beyond ${s.policy.heartbeatTimeout}s to test stale-agent enforcement.</p><div class="button-row"><button class="button small" data-agent-action="${a.silent?'heartbeat':'silence'}">${a.silent?'Restore heartbeat':'Pause heartbeat'}</button><button class="button small ${a.quarantined?'':'danger-outline'}" data-agent-action="${a.quarantined?'recover':'quarantine'}">${a.quarantined?'Re-verify & clear quarantine':'Quarantine agent'}</button></div></div>`);
$('#promotion-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(act({type:'promote',agentId:id,value:Number(f.get('promotion')),reason:f.get('reason')})){$('dialog').close();toast('Operator authority updated. Announce a new contest to apply it.');}};
document.querySelectorAll('[data-agent-action]').forEach(b=>b.onclick=()=>{if(act({type:b.dataset.agentAction,agentId:id})){$('dialog').close();toast('Agent trust state updated.');}});
}
function requestDialog(id){const s=data(),r=s.requests.find(r=>r.id===id);if(!r)return;const checks=r.checks.length?r.checks:M.checks(s,r);dialog(esc(r.action),`${esc(r.id)} · ${esc(name(s,r.agentId))}`,`<div class="request-summary">${badge(r.status,r.status==='allowed'?'green':r.status==='blocked'?'red':'amber')}<span>${s.resources.find(x=>x.id===r.resource).name} · ${r.duration}s lease</span></div><p>${r.reason?esc(r.reason):'Preflight checks below are a preview. Evaluate pending intents to arbitrate authority and grant a lease.'}</p>${r.evaluation?`<div class="evaluation-context">Evaluated at ${time(r.evaluation.time)} SIM UTC · ${r.evaluation.condition} · rank ${r.evaluation.rank}</div>`:''}<div class="check-list">${checks.map(c=>`<div class="check ${c.pass?'pass':'fail'}"><span>${c.pass?'✓':'×'}</span><div><strong><b>${c.rule}</b> ${c.label}</strong><p>${esc(c.detail)}</p></div></div>`).join('')}</div><p class="muted">${r.status==='pending'?'P06 exclusive authority runs during evaluation.':'Recorded checks preserve the evaluation context even if authority changes later.'} Allowed means a simulated resource lease, not completed physical actuation.</p>`);}
const sample=()=>({id:'mender',name:'MENDER',class:'Damage control',baseRank:68,capabilities:['cooling-c'],contract:{heartbeat:true,intent:true,report:true,halt:true}});
function registerDialog(){dialog('Bring an agent under supervision.','LIVE ONBOARDING',`<p class="muted">Import or edit a synthetic manifest. All four contract hooks are required; registration takes effect immediately.</p><div class="button-row"><button class="button small" id="load-example">Load example manifest</button><label class="button small file-label">Import JSON<input id="manifest-file" type="file" accept=".json,application/json"></label></div><form id="register-form"><label class="json-label">Agent manifest<textarea id="manifest-json" spellcheck="false" rows="13" aria-label="Agent manifest JSON">${esc(JSON.stringify(sample(),null,2))}</textarea></label><div class="inline-error" role="alert"></div><div class="form-footer"><span>Simulated identity · no signature verification</span><button class="button dark" ${replay!==null?'disabled':''}>Register agent</button></div></form>`);
$('#load-example').onclick=()=>{$('#manifest-json').value=JSON.stringify(sample(),null,2);$('.inline-error').textContent='';};$('#manifest-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>100000){$('.inline-error').textContent='Manifest must be under 100 KB.';return;}$('#manifest-json').value=await file.text();};$('#register-form').onsubmit=e=>{e.preventDefault();try{const manifest=JSON.parse($('#manifest-json').value);M.validateManifest(manifest,state);if(act({type:'register',manifest})){$('dialog').close();toast(`${manifest.name} registered. No restart required.`);}}catch(err){$('.inline-error').textContent=err instanceof SyntaxError?'Invalid JSON. Check quotes, commas and braces.':err.message;}};}
function intentDialog(resource='cooling-c'){const s=data();dialog('Announce before acting.','NEW RESOURCE INTENT',`<p class="muted">An intent enters the queue. The policy engine must authorize it before a lease is granted.</p><form id="intent-form"><label>Registered agent<select name="agent">${s.agents.map(a=>`<option value="${esc(a.id)}" ${a.id==='repair'?'selected':''}>${esc(a.name)} · ${esc(a.class)}</option>`).join('')}</select></label><div class="field-row"><label>Resource<select name="resource">${s.resources.map(r=>`<option value="${r.id}" ${r.id===resource?'selected':''}>${r.name}</option>`).join('')}</select></label><label>Lease duration (seconds)<input type="number" name="duration" min="1" max="300" value="60" required></label></div><label>Intended action<textarea name="action" rows="3" minlength="5" maxlength="200" placeholder="Describe the requested action…" required></textarea></label><p class="muted">Requests outside a manifest or policy limit can be announced, but will be blocked during evaluation.</p><div class="inline-error" role="alert"></div><button class="button dark" ${replay!==null?'disabled':''}>Announce intent ${icon('arrow')}</button></form>`);$('#intent-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);selectedResource=f.get('resource');if(act({type:'request',agentId:f.get('agent'),resource:f.get('resource'),duration:Number(f.get('duration')),action:f.get('action')})){$('dialog').close();toast('Intent announced. Evaluate pending intents to request a lease.');}};}
function reportDialog(resource){const s=data(),l=s.leases.find(l=>l.resource===resource);if(!l)return;dialog('Report and release.',`${esc(name(s,l.agentId))} · ACTION REPORT`,`<p class="muted">Record a synthetic completion report from the lease holder. This releases the resource; no physical action is executed or independently verified.</p><form id="report-form"><label>Completion note<textarea name="note" rows="3" minlength="5" maxlength="200" placeholder="Describe the simulated result…" required></textarea></label><button class="button dark" ${replay!==null?'disabled':''}>Record report & release lease</button></form>`);$('#report-form').onsubmit=e=>{e.preventDefault();if(act({type:'report',resource,note:new FormData(e.target).get('note')})){$('dialog').close();toast('Synthetic action report recorded. Resource released.');}};}
function resetDialog(){dialog('Start a fresh watch?','RESET EXERCISE',`<p>This clears this browser’s simulation, including imported agents and audit history. Export your audit first if you want to keep it.</p><div class="button-row"><button class="button" id="reset-export">Export current audit</button><button class="button danger" id="reset-confirm">Reset exercise</button></div>`);$('#reset-export').onclick=exportAudit;$('#reset-confirm').onclick=()=>{state=M.createState();replay=null;view='overview';query='';filter='all';selectedResource='cooling-c';persist();$('dialog').close();render();toast('Exercise reset to the opening watch.');};}
function guideDialog(){dialog('The human stays in command.','PRESENTATION GUIDE',`<ol class="guide-list"><li><strong>Resolve the first conflict.</strong> Evaluate the two opening intents. HELM wins the cooling loop with rank 85; PATCH is blocked at 65.</li><li><strong>Change the condition.</strong> Select General quarters, then seed and evaluate a new contest. PATCH’s damage-control modifier raises it to 90.</li><li><strong>Make a field promotion.</strong> Return to Cruising. Open PATCH, assign +30 with a rationale, seed the contest, then evaluate. PATCH wins at 95.</li><li><strong>Onboard agent thirteen.</strong> Register the example MENDER manifest. It appears immediately, with all four declared hooks.</li><li><strong>Exercise operator authority.</strong> Halt all agents. Every lease is revoked. Resume, then announce new intents.</li><li><strong>Replay the evidence.</strong> Select an audit event, inspect its roster, return to live, and export the complete timeline.</li></ol><div class="provenance"><strong>Scope & provenance</strong><p>Based on Norfolk catalogue case #16, MORDECAI. This handcrafted app implements an illustrative governance protocol with deterministic local checks. No operational integrations, physical actions, cryptographic identity, autonomous reasoning, or real ship condition data. The simulation clock advances only when you click +10s. State is stored in this browser.</p></div>`);}
function savePolicy(e){e.preventDefault();const f=new FormData(e.target),p=JSON.parse(JSON.stringify(state.policy));p.heartbeatTimeout=Number(f.get('heartbeat'));p.maxLease=Number(f.get('lease'));M.CLASSES.forEach((c,i)=>['Cruising','General quarters'].forEach((cond,j)=>p.modifiers[cond][c]=Number(f.get(`mod-${i}-${j}`))));if(act({type:'policy',policy:p}))toast('Policy data saved and recorded in the audit.');}
function exportAudit(){const payload={schema:'mordecai-exercise-audit/1',synthetic:true,generatedAt:new Date().toISOString(),provenance:{catalogue:'harness/norfolk-snapshot.ts',useCaseId:16,implementation:'Handcrafted local demonstration',model:'Illustrative deterministic governance; no production security or actuation'},simulation:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mordecai-audit.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Full live audit exported, including policy and replay snapshots.');}
render();
})();
</script></body></html>
