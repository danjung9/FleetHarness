function map(){const fs=findings(),f=current(),vessel=f?.vessel||(selected.startsWith('vessel:')?selected.slice(7):''),all=state.reports.filter(r=>r.time<=state.asOf),groups={};for(const r of all)(groups[r.vessel]??=[]).push(r);const off=all.filter(r=>r.lat<bounds.minLat||r.lat>bounds.maxLat||r.lon<bounds.minLon||r.lon>bounds.maxLon).length;let tracks='';for(const [name,rows] of Object.entries(groups)){rows.sort((a,b)=>a.time.localeCompare(b.time));const flag=fs.find(q=>q.vessel===name),active=name===vessel;if(!routine&&!flag)continue;const last=rows.at(-1),p=pos(last),color=flag?.kind==='gap'?'#eab283':flag?.kind==='conflict'?'#e49a8c':'#bfd9b4';tracks+=`<polyline points="${rows.map(r=>{const p=pos(r);return p.x+','+p.y;}).join(' ')}" fill="none" stroke="${color}" stroke-width="${active?2:1.2}" stroke-dasharray="${flag?.kind==='conflict'?'5 7':'none'}" opacity="${active?.8:.35}"/>`;if(active)tracks+=rows.map(r=>{const t=pos(r);return `<circle cx="${t.x}" cy="${t.y}" r="3" fill="${color}"/>`;}).join('');tracks+=`<g class="mapvessel" tabindex="0" role="button" aria-label="Inspect ${esc(name)}" data-vessel="${esc(name)}"><title>${esc(name)} · ${time(last.time)}</title>${active?`<circle cx="${p.x}" cy="${p.y}" r="29" fill="${color}" opacity=".06"/><circle cx="${p.x}" cy="${p.y}" r="21" fill="none" stroke="${color}" stroke-dasharray="3 5" opacity=".6"/>`:''}<circle cx="${p.x}" cy="${p.y}" r="18" fill="transparent"/><path d="M${p.x} ${p.y-7}l5 12-5-3-5 3z" stroke="${color}" fill="${active?color:'#183b46'}" stroke-width="1.4"/><text x="${p.x>640?p.x-14:p.x+14}" y="${p.y-3}" text-anchor="${p.x>640?'end':'start'}" fill="${color}" font-family="DM" font-size="12" font-weight="500">${esc(name)}</text><text x="${p.x>640?p.x-14:p.x+14}" y="${p.y+11}" text-anchor="${p.x>640?'end':'start'}" fill="#94afb1" font-family="Plex" font-size="8">${flag?.kind==='gap'?'LAST REPORT · ':''}${time(last.time)}</text></g>`;}
const vb=zoom===1?'0 0 760 410':'100 54 560 302';return `<div class="maphead"><span class="eyebrow">CHESAPEAKE BAY / SOUTHERN APPROACH</span><label><input type="checkbox" id="routine" ${routine?'checked':''}>Routine traffic</label></div><div class="mapbox"><svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Schematic geographic view of synthetic vessel positions"><defs><pattern id="grid" width="76" height="68.33" patternUnits="userSpaceOnUse"><path d="M76 0H0V68.33" fill="none" stroke="#31515b" stroke-width=".65" opacity=".45"/></pattern></defs><rect width="760" height="410" fill="#122f3b"/><rect width="760" height="410" fill="url(#grid)"/><path d="M0 0H205L200 35 180 63 183 88 160 100 147 128 112 138 92 162 60 177 30 184 0 183Z" fill="#284750" stroke="#49616a" stroke-width="1"/><path d="M0 231L50 212 85 220 115 216 141 234 167 237 190 258 208 263 230 290 228 316 245 340 258 365 263 410H0Z" fill="#284750" stroke="#49616a" stroke-width="1"/><path d="M0 247L57 233 110 242 165 266 184 280 210 321 222 370" fill="none" stroke="#50616a" stroke-width=".6"/><path d="M370 0L366 29 391 58 414 66 430 60 423 42 412 30 419 0Z" fill="#284750" stroke="#49616a"/><path d="M240 0L220 67 230 140 270 180 400 210 600 225 760 235" fill="none" stroke="#55727a" stroke-width="1" stroke-dasharray="2 6" opacity=".45"/><text class="maplabel" x="42" y="65" style="font-size:10px">HAMPTON</text><text class="maplabel" x="45" y="295" style="font-size:10px">NORFOLK</text><text class="maplabel" x="293" y="96" style="font-size:10px">CAPE CHARLES</text><text class="maplabel" x="355" y="334" style="font-size:14px;fill:#617f88;letter-spacing:4px">ATLANTIC APPROACH</text><text x="14" y="22" fill="#829ba2" font-family="Plex" font-size="8">37° 09′ N</text><text x="14" y="391" fill="#829ba2" font-family="Plex" font-size="8">36° 47′ N</text><g transform="translate(709 33)" fill="none" stroke="#a3b9b7"><path d="M0 30V0m-4 8L0 0l4 8"/><text y="-8" x="-4" fill="#a3b9b7" stroke="none" font-family="Plex" font-size="10">N</text></g>${tracks}</svg><div class="mapcaption">OBSERVED POSITIONS ONLY · SCHEMATIC COASTLINE</div><div class="mapcontrols"><button data-action="zoomout" aria-label="Zoom out" ${zoom===1?'disabled':''}>−</button><button data-action="zoomin" aria-label="Zoom in" ${zoom===2?'disabled':''}>+</button></div></div>${off?`<div class="offmap">${off} report${off>1?'s':''} outside this map extent; retained in source evidence.</div>`:''}<div class="maplegend"><span><i class="dot amber"></i>Reporting gap</span><span><i class="dot red"></i>Position conflict</span><span><i class="dot"></i>Observed track</span></div>${timeline(vessel,groups[vessel]||[])}`;}
function timeline(vessel,rows){const start=C.utc(state.asOf)-12*3600000;const pct=t=>Math.max(0,Math.min(100,(C.utc(t)-start)/(12*3600000)*100));const latest=rows.at(-1),isgap=latest&&C.utc(state.asOf)-C.utc(latest.time)>120*60000;return `<div class="timeline"><div class="timelinehead"><span>${esc(vessel||'Observation timeline')}</span><span>06:00 → 18:00 UTC</span></div><div class="timeaxis">${isgap?`<span class="gapline" style="left:${pct(latest.time)}%;width:${100-pct(latest.time)}%"></span>`:''}${[6,9,12,15,18].map((h,i)=>`<span class="tick" style="left:${i*25}%">${String(h).padStart(2,'0')}:00</span>`).join('')}${rows.filter(r=>C.utc(r.time)>=start).map(r=>`<button class="eventdot" style="left:${pct(r.time)}%" data-source="${esc(r.id)}" title="${esc(r.id)} · ${time(r.time)}" aria-label="Open report ${esc(r.id)} at ${time(r.time)}"></button>`).join('')}</div><div class="timelinehint">${isgap?'DASHED AMBER = NO REPORT IN DATASET':'SELECT AN OBSERVATION TO OPEN ITS SOURCE'}</div></div>`;}
function sourceCard(r){return `<button class="sourcecard" data-source="${esc(r.id)}"><header><span>${esc(r.id)}</span><span>${time(r.time)} ↗</span></header><b>${esc(r.source)}</b><p>${esc(r.text)}</p><div class="coords">${Math.abs(r.lat).toFixed(3)}° ${r.lat<0?'S':'N'} / ${Math.abs(r.lon).toFixed(3)}° ${r.lon<0?'W':'E'}</div></button>`;}
function evidence(){const f=current();if(!f){const vessel=selected.startsWith('vessel:')?selected.slice(7):'',rows=state.reports.filter(r=>r.vessel===vessel&&r.time<=state.asOf);return rows.length?`<div class="detailtop"><div class="eyebrow">Routine traffic</div><h2>${esc(vessel)}</h2><p>No review threshold is triggered by the available reports. This is not an assessment of intent.</p></div><div class="source-area"><div class="eyebrow" style="margin-bottom:10px">${rows.length} SOURCE REPORTS</div>${rows.map(sourceCard).join('')}</div>`:`<div class="empty"><h3>Evidence stays in view.</h3><p>Select a finding or vessel to inspect its source reports.</p></div>`;}
return `<div class="detailtop"><div class="eyebrow">${esc(f.label)} / ${esc(f.value)}</div><h2>${f.kind==='gap'?'A gap in the reports.':f.kind==='conflict'?'Two positions. One conflict.':'Movement remains limited.'}</h2><p>${esc(f.summary)}</p><div class="uncertainty">${esc(f.caution)}</div></div><div class="source-area"><div class="sourcetitle"><span class="eyebrow">SUPPORTING EVIDENCE</span><span class="badge">${f.sources.length}</span></div>${f.sources.map(id=>state.reports.find(r=>r.id===id)).map(sourceCard).join('')}</div><div class="rule"><b>Review rule</b><br>${esc(f.rule)}</div><div class="review-actions">${isReviewed(f)?`<span class="reviewed">✓ Reviewed locally · ${time(review(f).reviewedAt)}</span><button class="btn ${review(f).included?'':'green'}" data-action="include">${review(f).included?'Remove from shift brief':icon('plus')+'Add to shift brief'}</button><button class="btn small" data-action="review">Edit review</button>`:`<button class="btn primary" data-action="review">Review finding ${icon('arrow')}</button><span class="smalltext">Review the evidence before adding to your brief.</span>`}</div>`;}
function changes(){const c=C.compare(state.reports,state.asOf,state.baseline);return `<main class="fullpage"><div class="change-summary">${c.added.length} new finding${c.added.length!==1?'s':''} since ${time(state.baseline)} · ${c.resolved.length} no longer triggered · ${state.reports.filter(r=>r.time>state.baseline&&r.time<=state.asOf).length} new source reports</div><div class="changegrid"><section><h3>THEN / ${time(state.baseline)}</h3>${c.old.length?c.old.map(f=>`<article class="changeitem"><div class="eyebrow">${esc(f.label)}</div><h4>${esc(f.vessel)}</h4><p>${esc(f.summary)}</p></article>`).join(''):`<div class="empty" style="text-align:left;padding:24px 0"><h3>No review thresholds triggered.</h3><p style="margin:0">The ${time(state.baseline)} snapshot contains ${state.reports.filter(r=>r.time<=state.baseline).length} reports. An absence of flags does not establish normal behavior.</p></div>`}</section><section><h3>NOW / ${time(state.asOf)}</h3>${c.current.map(f=>`<article class="changeitem"><div class="eyebrow">${c.added.some(q=>q.id===f.id)?'NEW OBSERVATION':'CONTINUING'} · ${esc(f.label)}</div><h4>${esc(f.vessel)}</h4><p>${esc(f.summary)}</p><button class="citation" data-select="${esc(f.id)}">Inspect ${f.sources.length} source${f.sources.length>1?'s':''} ↗</button></article>`).join('')||'<p>No current findings. Import reports to compare snapshots.</p>'}</section></div></main>`;}

function method(){openModal('Method & workspace',`<div class="method"><p>TIDELINE is a handcrafted Norfolk #34 demonstration. Every vessel, position and report is fictional.</p><ul><li><b>Reporting gap:</b> latest report older than 120 minutes at the fixed snapshot.</li><li><b>Limited movement:</b> at least 3 reports over 120 minutes, with maximum separation ≤1 nm, in the preceding 6 hours.</li><li><b>Position conflict:</b> adjacent reports imply >50 knots, or simultaneous reports differ by >1 nm. Distance uses the haversine formula.</li></ul><p>These illustrative rules find review candidates. They do not infer intent, transmitter status or cause. The map shows approximate, hand-drawn geography and is not a nautical chart. Reports outside the map remain in the evidence records.</p><p>Review actions save in this browser. No login, network feed, server synchronization or operational assurance is provided. Exports retain source observations alongside analyst wording. A new import invalidates affected reviews when their evidence changes.</p><p>Data window: 05 Nov 2026, 06:00–18:00 UTC. The comparison baseline is 12:00 UTC.</p><hr style="border:0;border-top:1px solid var(--line)"><p>Reset affects only this demo's local workspace. Export your brief before clearing it.</p><button class="btn" data-action="resetask">Reset workspace…</button></div>`,`<button class="btn primary" data-action="close">Understood</button>`);}

function action(name){if(name==='close'){modal.close();return;}if(name==='sources')return sourceLibrary();if(name==='rawexport'){log('Source reports exported',state.reports.length+' original reports');download('tideline-source-reports.json',JSON.stringify({label:'SYNTHETIC EXERCISE',reports:state.reports},null,2),'application/json');toast('Original source reports exported.');return;}if(name==='import')return importModal();if(name==='method')return method();if(name==='review')return reviewModal();if(name==='zoomin'||name==='zoomout'){zoom=name==='zoomin'?2:1;render();return;}if(name==='example'){document.getElementById('importtext').value=JSON.stringify(example,null,2);staged=null;document.getElementById('importresult').textContent='';document.getElementById('importcommit').disabled=true;return;}
if(name==='validate'){const result=document.getElementById('importresult');try{staged=C.parse(document.getElementById('importtext').value,state.reports);const outside=staged.filter(r=>r.time>state.asOf||r.time<'2026-11-05T06:00:00Z').length;result.innerHTML=`<div class="success">${staged.length} valid report${staged.length>1?'s':''}. ${outside?`${outside} outside the displayed watch; retained, with future reports excluded from analysis.`:'Ready to add to this workspace.'}</div>`;document.getElementById('importcommit').disabled=false;}catch(e){staged=null;result.innerHTML=`<div class="error">${esc(e.message)}</div>`;document.getElementById('importcommit').disabled=true;}return;}
if(name==='commitimport'&&staged){const rows=C.parse(document.getElementById('importtext').value,state.reports);state.reports.push(...rows);log('Reports imported',`${rows.length} synthetic report(s): ${rows.map(r=>r.id).join(', ')}`);modal.close();render();toast(`${rows.length} report${rows.length>1?'s':''} added. Picture recalculated.`);return;}
if(name==='savereview'){const f=current(),summary=document.getElementById('summary').value.trim(),note=document.getElementById('note').value.trim();if(!summary||!document.getElementById('verified').checked){document.getElementById('reviewerror').innerHTML='<div class="error">Enter brief wording and confirm that you checked the source reports.</div>';return;}state.reviews[f.id]={...review(f),summary,note,verified:true,fingerprint:C.fingerprint(f,state.reports),reviewedAt:new Date().toISOString()};log('Finding reviewed',f.vessel+' · '+f.label);modal.close();render();toast('Review saved. You can now add this finding to the brief.');return;}
if(name==='include'){const f=current();if(!f||!isReviewed(f))return;state.reviews[f.id].included=!review(f).included;log(review(f).included?'Added to brief':'Removed from brief',f.vessel+' · '+f.label);render();toast(review(f).included?'Observation added to the shift brief.':'Observation removed from the shift brief.');return;}
if(name==='exportmd'||name==='exportjson'){try{C.exportBrief(state);log('Brief exported',name==='exportmd'?'Markdown with linked source appendix':'JSON with source records and local activity');const b=C.exportBrief(state);download(name==='exportmd'?'tideline-shift-brief.md':'tideline-shift-brief.json',name==='exportmd'?C.markdown(b):JSON.stringify(b,null,2),name==='exportmd'?'text/markdown;charset=utf-8':'application/json');toast('Brief exported with source evidence and uncertainty.');}catch(e){toast(e.message);}return;}
if(name==='auditexport'){download('tideline-activity.json',JSON.stringify({label:'Local demo activity; not tamper-proof',audit:state.audit},null,2),'application/json');toast('Local activity exported.');return;}
if(name==='resetask'){openModal('Reset the local workspace?',`<p>This removes imported reports, review notes and brief selections in this demo. Choose a fresh seeded exercise or an empty workspace.</p>`,`<button class="btn" data-action="close">Cancel</button><button class="btn" data-action="clear">Start empty</button><button class="btn primary" data-action="restore">Restore exercise</button>`);return;}
if(name==='clear'||name==='restore'){state={reports:name==='clear'?[]:structuredClone(S.reports),asOf:S.asOf,baseline:S.baseline,reviews:{},audit:[],title:'Norfolk approaches · Shift brief'};selected='gap:BLUE HERON';page='picture';view='map';search='';filter='all';log('Workspace reset',name==='clear'?'Empty workspace':'Seeded synthetic exercise restored');modal.close();render();toast(name==='clear'?'Empty workspace ready for reports.':'Synthetic exercise restored.');}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-view],[data-filter],[data-select],[data-vessel],[data-source],[data-action],[data-edit],[data-remove]');if(!b)return;try{if(b.dataset.page){page=b.dataset.page;render();}else if(b.dataset.view){view=b.dataset.view;render();}else if(b.dataset.filter){filter=b.dataset.filter;render();}else if(b.dataset.select){selected=b.dataset.select;view='map';render();}else if(b.dataset.vessel){selected=findings().find(f=>f.vessel===b.dataset.vessel)?.id||'vessel:'+b.dataset.vessel;render();}else if(b.dataset.source)source(b.dataset.source);else if(b.dataset.edit){selected=b.dataset.edit;reviewModal();}else if(b.dataset.remove){state.reviews[b.dataset.remove].included=false;log('Removed from brief',b.dataset.remove);render();}else if(b.dataset.action)action(b.dataset.action);}catch(err){toast('Action could not be completed: '+err.message);}});
document.addEventListener('input',e=>{if(e.target.id==='sourcesearch')document.getElementById('sourcelibrary').innerHTML=libraryRows(e.target.value);if(e.target.id==='search'){search=e.target.value;document.getElementById('findinglist').innerHTML=findingList();}if(e.target.id==='importtext'){staged=null;document.getElementById('importcommit').disabled=true;document.getElementById('importresult').textContent='';}});
document.addEventListener('change',async e=>{if(e.target.id==='routine'){routine=e.target.checked;render();}if(e.target.id==='brieftitle'){state.title=e.target.value.trim()||'Norfolk approaches · Shift brief';log('Brief title edited',state.title);e.target.value=state.title;}if(e.target.id==='importfile'){const file=e.target.files[0];if(file){staged=null;document.getElementById('importcommit').disabled=true;if(file.size>1000000){document.getElementById('importresult').innerHTML='<div class="error">Choose a JSON file smaller than 1 MB.</div>';return;}document.getElementById('importtext').value=await file.text();staged=null;document.getElementById('importcommit').disabled=true;document.getElementById('importresult').textContent='File loaded. Validate to continue.';}}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.mapvessel')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
render();
})();
</script></body></html>
