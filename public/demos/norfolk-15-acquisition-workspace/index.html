function download(filename,text,type='application/json'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function toCSV(rows){return E.fields.join(',')+'\n'+rows.map(r=>E.fields.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(',')).join('\n');}
function exportBrief(){const a=analysis();const ids=new Set(a.findings.map(f=>f.id));const payload={schema:'common-ground-brief/v1',useCaseId:15,syntheticDemo:true,generatedAt:new Date().toISOString(),analysisAsOf:'2026-11-05',perspective:{level:scope,value:scopeValue},preparedBy:{persona:people[state.persona].name,simulated:true},limitations:['Deterministic rules, no AI inference.','Personas, notes, reviews and activity are local simulations; no authentication or synchronization.','Findings are review candidates, not approvals or authoritative financial decisions.','Amounts may overlap; do not sum findings.','Missing or stale exports can explain discrepancies.'],totals:a.totals,programs:a.programs,findings:a.findings.map(f=>({...f,review:state.reviews[f.id]||null,notes:state.notes[f.id]||[],evidence:f.evidence.map(id=>state.records.find(r=>r.id===id))})),records:recordsInScope(),investigations:state.saved.filter(s=>ids.has(s.findingId)),activity:state.events};download('common-ground-brief.json',JSON.stringify(payload,null,2));log('Exported an evidence-linked '+scope+' brief');render();toast('Brief exported with source rows, notes, and review states.');}
function guide(){modal('Scope & methodology',`<div class="guidance"><p><strong>Common Ground is a handcrafted local demonstration for Norfolk use case 15.</strong> It uses synthetic acquisition exports inspired by the supplied catalogue brief. It is not AppYard-generated or AppYard-verified.</p><h3>What the workspace does</h3><p>Searches CSV/JSON rows, compares award and obligation totals, flags repeated invoice references, surfaces unapplied credits and past-due milestones, and preserves source-linked review notes. All rules are deterministic; no model or external service runs.</p><h3>How to interpret the numbers</h3><p>USD amounts are summed per contract. Award records are additive; modification exports must provide deltas, not repeated cumulative totals. Gross invoices can include duplicate candidates. Credits affect net invoiced only when their status is exactly <code>applied</code>. Milestone completion requires status <code>complete</code>. Analysis uses the fixed snapshot 2026-11-05. Division grouping is illustrative: program names containing “technical” go into Technical services; others go into Mission & facilities support.</p><h3>Local collaboration, human decisions</h3><p>Personas are labels, not accounts. Nothing is sent to another person or synchronized. “Reviewed” records a local acknowledgement; it does not authorize payment, modify a source, or approve a contract. This browser stores unencrypted demo data. Imported values are treated as text and never executed.</p><h3>Supported scope</h3><p>CSV and JSON only, up to 2,000 rows and 2 MB per file, and 5,000 rows per workspace. PDF, Google Docs, live DEAMS/WAWF/CON-IT connectors, semantic AI, production security, statutory approvals and policy compliance are outside this demonstration.</p><h3>Recovery</h3><p>Export the brief before resetting. Reset removes imported records, saved investigations, notes and review history from this browser, then restores the synthetic seed.</p><button class="btn" data-action="reset-dialog">Reset demo workspace</button></div>`);}
// Delegated controls keep every view and dialog on the same browser-local state.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.nav){view=b.dataset.nav;render();return;}if(b.dataset.scope){scope=b.dataset.scope;scopeValue=scope==='division'?'support':scope==='program'?[...new Set(state.records.map(r=>r.program))][0]:'all';render();return;}if(b.dataset.finding){selected=b.dataset.finding;render();if(innerWidth<700)$('#finding-detail')?.scrollIntoView({behavior:'smooth'});return;}if(b.dataset.record){recordDialog(b.dataset.record);return;}if(b.dataset.sourceFilter){sourceFilter=sourceFilter===b.dataset.sourceFilter?'all':b.dataset.sourceFilter;render();return;}
const act=b.dataset.action,id=b.dataset.id;
if(act==='close')closeModal();if(act==='import')importDialog();if(act==='search')searchDialog();if(act==='guide')guide();if(act==='export')exportBrief();if(act==='template'){download('acquisition-template.csv',example,'text/csv');toast('CSV template downloaded.');}if(act==='example'){$('#import-text').value=example;$('#import-name').value='harbor_example.csv';$('#import-result').innerHTML='';pendingImport=null;}if(act==='validate')validateImport();
if(act==='commit-import'&&pendingImport){const{name,rows}=pendingImport;state.records.push(...rows);log(`Imported ${name} · ${rows.length} validated records`);closeModal();scope='enterprise';scopeValue='all';view='reconciliation';findingFilter='all';selected=E.analyze(rows).findings[0]?.id;render();toast(`${rows.length} records added. Findings recalculated.`);}
if(act==='all-sources'){sourceFilter='all';sourceQuery='';render();}if(act==='export-rows'){const rows=E.search(state.records,sourceQuery).filter(r=>sourceFilter==='all'||r.source===sourceFilter);download('common-ground-records.csv',toCSV(rows),'text/csv');toast(`${rows.length} matching records exported.`);}
if(act==='source-file'){sourceFilter=b.dataset.name;sourceQuery='';view='sources';closeModal();render();}if(act==='review'){const f=allFindings().find(f=>f.id===id);if(state.reviews[id]){delete state.reviews[id];log(`Reopened review: ${f.title}`);}else{state.reviews[id]={persona:people[state.persona].name,time:new Date().toISOString(),meaning:'Local acknowledgement only; no approval'};log(`Reviewed: ${f.title}`);}render();toast('Local review state updated.');}if(act==='save')saveDialog(id);
if(act==='open-saved'){const s=state.saved.find(s=>s.id===id);scope='enterprise';scopeValue='all';findingFilter='all';selected=s.findingId;view='reconciliation';render();}if(act==='delete-saved'){state.saved=state.saved.filter(s=>s.id!==id);log('Removed a saved investigation');render();toast('Investigation removed; evidence and notes retained.');}if(act==='rename'){const s=state.saved.find(s=>s.id===id);modal('Rename investigation',`<form id="rename-form" data-id="${esc(id)}"><label class="field">Investigation title<input name="title" required maxlength="100" value="${esc(s.title)}"></label><div class="modal-actions"><button class="btn primary">Save title</button></div></form>`);}
if(act==='reset-dialog')modal('Reset this local workspace?',`<p>Imported records, notes, reviews, saved investigations and activity will be removed from this browser. The 20 synthetic seed records will be restored. Export a brief first if you need to keep your work.</p><div class="modal-actions"><button class="btn" data-action="close">Keep workspace</button><button class="btn primary" data-action="reset">Reset to sample data</button></div>`);
if(act==='reset'){state={records:structuredClone(window.CGSeed),notes:{},reviews:{},saved:[],events:[],persona:0};persist();view='reconciliation';scope='enterprise';scopeValue='all';findingFilter='all';selected='variance-SYN-ACQ-241';closeModal();render();toast('Synthetic workspace restored.');}
});
document.addEventListener('change',async e=>{if(e.target.id==='persona'){state.persona=Number(e.target.value);persist();render();toast(`Simulating ${people[state.persona].name}; no identity change or sign-in.`);}if(e.target.id==='scope-value'){scopeValue=e.target.value;render();}if(e.target.id==='finding-filter'){findingFilter=e.target.value;render();}if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){$('#import-result').innerHTML='<div class="error">File exceeds the 2 MB limit.</div>';return;}try{$('#import-name').value=file.name;$('#import-text').value=await file.text();pendingImport=null;$('#import-result').innerHTML='';}catch{$('#import-result').innerHTML='<div class="error">Unable to read this file. Paste its text instead.</div>';}}});
document.addEventListener('input',e=>{if(e.target.id==='global-query')$('#search-results').innerHTML=searchResults(e.target.value);if(e.target.id==='source-search'){sourceQuery=e.target.value;const rows=E.search(state.records,sourceQuery).filter(r=>sourceFilter==='all'||r.source===sourceFilter);$('#source-table').innerHTML=recordTable(rows);$('#row-count').textContent=rows.length+' records';}if(['import-text','import-name'].includes(e.target.id)){pendingImport=null;$('#import-result').innerHTML='';}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='note-form'){const text=form.elements.note.value.trim();if(!text){toast('Enter a note before adding it.');return;}const id=form.dataset.id;(state.notes[id]??=[]).push({text,persona:people[state.persona].name,time:new Date().toISOString()});log('Added a note to '+allFindings().find(f=>f.id===id).title);render();toast('Note saved in this browser.');}if(form.id==='save-form'){const title=form.elements.title.value.trim();if(!title){toast('Enter a title with at least one visible character.');return;}const f=allFindings().find(f=>f.id===form.dataset.id);state.saved.unshift({id:'S'+Date.now(),title,findingId:f.id,contract:f.contract,persona:people[state.persona].name,time:new Date().toISOString()});log('Saved investigation: '+title);closeModal();render();toast('Investigation saved.');}if(form.id==='rename-form'){const title=form.elements.title.value.trim();if(!title){toast('Enter a title with at least one visible character.');return;}state.saved.find(s=>s.id===form.dataset.id).title=title;log('Renamed investigation: '+title);closeModal();render();toast('Investigation renamed.');}});
document.addEventListener('keydown',e=>{const inModal=$('.modal');if(e.key==='Escape'&&inModal){closeModal();return;}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();searchDialog();}if(e.key==='Tab'&&inModal){const nodes=[...inModal.querySelectorAll('button:not([disabled]),input,textarea,select,a[href],summary')].filter(el=>el.offsetParent!==null);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();if(storageIssue)toast('Stored workspace could not be loaded. Export to preserve this session.');
})();
</script></body></html>
