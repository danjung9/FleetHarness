function spark(values){let min=Math.min(...values),range=Math.max(...values)-min||1;const points=values.map((x,i)=>`${10+i*90},${51-(x-min)/range*43}`).join(' ');return `<svg class="spark" viewBox="0 0 380 65" preserveAspectRatio="none" role="img" aria-label="Meter history: ${values.join(', ')} hours"><path d="M0 55H380M0 30H380M0 6H380" stroke="#e6ebe0"/><polyline points="${points}" stroke="#65895d" stroke-width="2" fill="none"/>${values.map((x,i)=>`<circle cx="${10+i*90}" cy="${51-(x-min)/range*43}" r="3" fill="#65895d"/>`).join('')}</svg>`}
function syncView(){return `<div class="sync-map"><div class="sync-node"><div class="eyebrow">01 / ON THIS DEVICE</div><h3>Field workspace</h3><p>${pending().length} pending transaction${pending().length===1?'':'s'}</p></div><div class="sync-line"><span>${state.connected?'LOCAL LINK ENABLED':'DISCONNECTED'}</span></div><div class="sync-node"><div class="eyebrow">02 / ${isHttp?'LOCALHOST':'IN THIS BROWSER'}</div><h3>${isHttp?'Shore simulator':'Embedded simulator'}</h3><p>${isHttp?'POST /api/sync':'Browser simulation'} · no external service</p></div><button class="btn small" data-action="connect">${state.connected?'Disconnect':'Connect simulator'}</button></div><div class="sync-controls"><div class="field"><label for="scenario">Next synchronization scenario</label><select class="input" id="scenario" ${busy?'disabled':''}><option value="normal" ${state.scenario==='normal'?'selected':''}>Normal acknowledgement</option><option value="failure" ${state.scenario==='failure'?'selected':''}>Fail once · endpoint unavailable</option><option value="conflict" ${state.scenario==='conflict'?'selected':''}>Conflict once · newer remote version</option></select></div><button class="btn primary" data-action="sync" ${!state.connected||busy||!pending().some(t=>t.status==='queued'||t.status==='failed')?'disabled':''}>${icon('sync')}${busy?'Synchronizing…':'Sync queued work'}</button></div>${!state.connected?'<div class="notice warning">Offline mode. Work and review remain available; pending transactions will not leave this device.</div>':''}<div class="section-top"><h2>Transaction queue</h2><span class="small-label">${state.queue.filter(t=>t.status==='synced').length} ACKNOWLEDGED</span></div>${state.queue.length?state.queue.slice().reverse().map(txView).join(''):`<div class="panel empty">${icon('sync')}<h3>No transactions yet</h3><p>Approve a reviewed work order to create a transaction. Nothing is sent automatically.</p><button class="btn" data-view="review">Open review queue</button></div>`}<div class="panel" style="margin-top:22px"><div class="section-top"><h2>Device activity</h2><button class="text-button" data-action="export">Export audit trail</button></div>${state.events.length?`<div class="timeline">${state.events.slice(0,8).map(e=>`<p><strong>${esc(e.action)}</strong> · ${esc(e.note)}<small>${esc(dt(e.time))}</small></p>`).join('')}</div>`:'<p class="subtitle">Actions recorded in this session will appear here.</p>'}<p class="source-line">Simulator records live in memory and reset when this page reloads. Device records persist in browser storage.</p></div>`}
function txView(t){return `<article class="tx"><div class="tx-head"><div><div class="eyebrow">${esc(t.job.id)} / BASE VERSION ${t.baseVersion}</div><h3>${esc(t.job.title)}</h3><p>${t.job.meter} h · ${t.job.attachments.length} image${t.job.attachments.length===1?'':'s'} · ${esc(t.job.notes.slice(0,120))}</p></div>${badge(t.status)}</div>${t.status==='synced'?`<p class="source-line">${esc(t.receipt)} · VERSION ${t.ackVersion} · ${esc(dt(t.syncedAt))}</p>`:''}${t.error?`<div class="${t.status==='conflict'?'notice warning':'error'}">${esc(t.error)}</div>`:''}${t.status==='conflict'&&t.remote?`<div class="conflict-columns"><div class="conflict-copy"><h4>DEVICE COPY · V${t.baseVersion}</h4><strong>${t.job.status} · ${t.job.meter} h</strong>${esc(t.job.notes)}</div><div class="conflict-copy"><h4>SIMULATOR COPY · V${t.remote.version}</h4><strong>${t.remote.status} · ${t.remote.meter||'No new reading'}${t.remote.meter?' h':''}</strong>${esc(t.remote.notes)}</div></div><div class="button-group"><button class="btn primary" data-resolve-local="${t.id}">Keep device copy & retry</button><button class="btn" data-resolve-remote="${t.id}">Use simulator copy</button></div><p class="source-line">Both copies remain in the exported resolution history. Choose deliberately.</p>`:''}${t.status==='failed'?'<p class="source-line">Retry with “Sync queued work”. The same transaction ID prevents duplicate acknowledgement.</p>':''}</article>`}
function render(){const focus=document.activeElement?.id,pos=document.activeElement?.selectionStart;$('#app').innerHTML=`<div class="shell">${nav()}<div class="workspace">${storageError?`<div class="storage-warning" id="storage-warning">${esc(storageError)}</div>`:''}<header class="topbar"><div class="mobile-brand">OUTPOST</div><div class="breadcrumb">FNS Aster <span>/</span> <strong>Maintenance workspace</strong></div><div class="top-actions"><button class="connection ${state.connected?'on':''}" data-view="sync" aria-label="Open sync center"><i class="dot"></i>${state.connected?'LOCAL SIMULATOR':'OFFLINE READY'}</button><button class="btn small" data-action="export">${icon('download')}Export records</button><div class="avatar" title="Simulated technician">T07</div></div></header><main>${heading()}${['work','review'].includes(view)?lookup():''}${view==='work'||view==='review'?work():view==='parts'?partsView():view==='assets'?assetsView():syncView()}<footer class="footer-note"><span>FICTIONAL TRAINING DATA · NORFOLK #44</span><span>Local storage is not encrypted. No live systems connected. <button class="text-button" data-action="about">Demo scope</button></span></footer></main></div></div>`;if(focus&&['job-search','part-search'].includes(focus)){const x=$('#'+focus);x?.focus();if(typeof pos==='number')x?.setSelectionRange(pos,pos)}}
function doLookup(q){query=q;results=E.lookup(q,state);render()}
function setView(v){view=v;error=[];filter='';search='';if(v==='review'&&reviews().length)selected=reviews()[0].id;render();window.scrollTo(0,0)}
function current(){return state.jobs.find(j=>j.id===selected)}
function download(name,object){const blob=new Blob([JSON.stringify(object,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Export downloaded. Images and source details are included.')}
function exportAll(){download('outpost-maintenance-records.json',{exportedAt:new Date().toISOString(),demo:true,provenance:'Norfolk catalogue #44; independently handcrafted synthetic demonstration.',limitations:['Rules-based lookup, not a language model','Browser storage is not encrypted','Simulated review; no production identity','Stock snapshot only; no inventory issue transactions','No live SAP, Navy ERP, shipboard or shore integration'],...state})}
function showModal(kind){modal=kind;importError='';if(kind==='import'){importText='';importPreview=null}renderModal();setTimeout(()=>$('#modal-root input, #modal-root textarea, #modal-root button')?.focus(),20)}
function renderModal(){if(!modal){$('#modal-root').innerHTML='';return}let body,title;if(modal==='about'){title='Built for the disconnected moment.';body=`<p>OUTPOST is a handcrafted, portable demonstration of Norfolk use case #44, “Equipment Maintenance at the Edge using AI”. All equipment, work, quantities and identities are fictional.</p><h3>Supported in this workspace</h3><ul><li>Local keyword lookup, equipment and parts snapshots.</li><li>Persistent work updates, meter validation and image attachments.</li><li>Human review, a queued outbox, retry and explicit conflict resolution.</li><li>JSON import for parts; full records and images in JSON export.</li></ul><h3>Deliberate demonstration boundaries</h3><p>The lookup is rules-based, not an AI model. Browser storage is not encrypted. Review is a simulated role, not access control. The local endpoint runs in memory; it is not a shipboard or enterprise integration. Checklists are illustrative and are not maintenance instructions.</p><p>The stock snapshot is not a live inventory. Completion does not consume or reserve parts. Image content is stored, not interpreted.</p><div class="button-group"><button class="btn danger" data-action="reset-confirm">Reset demo data</button><button class="btn primary" data-action="close-modal">Back to workspace</button></div>`}else if(modal==='import'){title='Import a parts snapshot';body=`<p>Paste synthetic JSON or choose a file. Matching part IDs are updated; new IDs are added. Work-order records are preserved.</p><div class="button-group" style="justify-content:flex-start;margin-bottom:12px"><button class="btn small" data-action="sample-import">Load example</button><label class="btn small photo-label" tabindex="0" role="button">Choose JSON<input type="file" id="import-file" accept="application/json,.json"></label></div><textarea class="input" id="import-text" aria-label="Parts snapshot JSON" placeholder='{"parts": [{"id": "BRG-024", "name": "Motor bearing kit", …}]}'>${esc(importText)}</textarea>${importError?`<div class="error" role="alert">${esc(importError)}</div>`:''}${importPreview?`<div class="notice">Validated ${importPreview.length} part record${importPreview.length===1?'':'s'}. ${importPreview.filter(p=>state.parts.some(x=>x.id===p.id)).length} existing IDs will be updated.<br>${importPreview.map(p=>`${esc(p.id)}: ${p.stock} ${esc(p.unit)}`).join(' · ')}</div>`:''}<div class="button-group"><button class="btn" data-action="close-modal">Cancel</button><button class="btn ${importPreview?'':'primary'}" data-action="validate-import">Validate JSON</button>${importPreview?'<button class="btn primary" data-action="apply-import">Apply snapshot</button>':''}</div>`}else if(modal==='reset'){title='Reset this device?';body='<p>This clears local work edits, attachments, imported parts and the queue from this browser. Export records first if you want to keep them.</p><div class="button-group"><button class="btn" data-action="close-modal">Cancel</button><button class="btn" data-action="export">Export first</button><button class="btn danger" data-action="reset">Reset demo</button></div>'}else if(modal==='return'){title='Return for changes';body='<p>The record will reopen for the technician. Add a specific review note so the next action is clear.</p><label for="review-note">Review note</label><textarea class="input" id="review-note" maxlength="1000" placeholder="Describe the change needed…"></textarea><div id="review-error"></div><div class="button-group"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="confirm-return">Return work order</button></div>'}else if(modal==='history'){title=current().id+' · Record history';body=`<div class="timeline">${current().history.map(e=>`<p><strong>${esc(e.action)}</strong><br>${esc(e.note)}<small>${dt(e.time)}</small></p>`).join('')||'<p>No actions recorded yet.</p>'}</div>`}else if(modal.startsWith('photo:')){const p=current().attachments[Number(modal.split(':')[1])];title=p.name;body=`<img src="${p.data}" alt="${esc(p.name)}" style="width:100%;max-height:65vh;object-fit:contain"><p class="source-line">Locally attached · ${dt(p.time)}</p>`}$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="Close dialog">×</button></div>${body}</section></div>`}
async function attach(file){if(!file)return;const j=current();if(j.attachments.length>=3)return toast('Maximum three images per work order.');if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>1024*1024){error=['Choose a PNG, JPEG or WebP image no larger than 1 MB.'];render();return}try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});await new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src=data});j.attachments.push({name:file.name,data,time:new Date().toISOString()});history(j,'Image attached',file.name);error=[];persist();render();toast('Image stored with the local work order.')}catch{error=['The selected file could not be decoded as an image.'];render()}}
async function synchronize(){if(!state.connected||busy)return;busy=true;render();const list=pending().filter(t=>['queued','failed'].includes(t.status));for(const tx of list){if(!state.connected)break;let r;try{if(isHttp){const response=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:state.clientId,transaction:tx,scenario:state.scenario}),signal:AbortSignal.timeout(6000)});r=await response.json();r.code=response.status;}else r=E.synchronize(embedded,tx,state.scenario);if(r.code===200){tx.status='synced';tx.receipt=r.receipt;tx.ackVersion=r.version;tx.syncedAt=r.time;delete tx.error;const j=state.jobs.find(j=>j.id===tx.job.id);j.version=r.version;history(j,'Simulator acknowledged',r.receipt)}else if(r.code===409){tx.status='conflict';tx.remote=r.remote;tx.error=r.error;log('Version conflict',tx.job.id)}else{tx.status='failed';tx.error=r.error||'Endpoint rejected the transaction.';log('Synchronization failed',tx.job.id+' · '+tx.error)}}catch{tx.status='failed';tx.error='Could not reach the local endpoint. Start server.mjs and retry. Your record remains on this device.';log('Connection failed',tx.job.id)}persist()}busy=false;render();toast('Sync pass finished. Each transaction shows its result.')}
const actions={
'close-results':()=>{results=null;render()},'clear-filter':()=>{filter='';search='';if(view==='review')view='work';render()},'clear-parts':()=>{lowOnly=false;partSearch='';render()},'low-stock':()=>{lowOnly=!lowOnly;render()},'about':()=>showModal('about'),'history':()=>showModal('history'),'import':()=>showModal('import'),'export':exportAll,'export-parts':()=>download('outpost-parts-snapshot.json',{parts:state.parts}),
'close-modal':()=>{modal='';renderModal()},'reset-confirm':()=>showModal('reset'),'reset':()=>{state=E.seed();embedded=E.createEndpoint();modal='';view='work';selected='WO-2041';results=null;error=[];search='';filter='';persist();renderModal();render();toast('A fresh fictional workspace is ready.')},
'save':()=>{const j=current();error=E.validate(j,asset(j),part(j),false);if(error.length)return render();if(j.status==='Open')j.status='In progress';history(j,'Draft saved');persist();render();toast('Draft saved locally. You can keep working offline.')},
'submit':()=>{const j=current();error=E.validate(j,asset(j),part(j));if(error.length)return render();j.status='In review';history(j,'Submitted for review');persist();render();toast('Work order is ready for local review.')},
'approve':()=>{const j=current();if(j.status!=='In review')return;error=E.validate(j,asset(j),part(j));if(error.length)return render();j.status='Completed';history(j,'Review approved','Simulated reviewer T07');const tx={id:'TX-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),job:E.clone(j),baseVersion:j.version,status:'queued',createdAt:new Date().toISOString(),resolutions:[]};state.queue.push(tx);persist();render();toast('Approved. A durable transaction is now queued.')},
'return-review':()=>showModal('return'),'confirm-return':()=>{const note=$('#review-note').value.trim();if(note.length<8){$('#review-error').innerHTML='<div class="error" role="alert">Add a review note of at least 8 characters.</div>';return}const j=current();j.status='In progress';history(j,'Returned for changes',note);modal='';persist();renderModal();render();toast('Work order reopened with the review note.')},
'connect':()=>{state.connected=!state.connected;log(state.connected?'Local simulator connection enabled':'Disconnected');persist();render()},'sync':synchronize,
'sample-import':()=>{importText=JSON.stringify({parts:[{...state.parts.find(p=>p.id==='BRG-024'),stock:2}]},null,2);importPreview=null;importError='';renderModal()},
'validate-import':()=>{importText=$('#import-text').value;try{importPreview=E.parseImport(importText);importError=''}catch(e){importPreview=null;importError=e.message}renderModal()},
'apply-import':()=>{try{const rows=E.parseImport($('#import-text').value);rows.forEach(p=>{const i=state.parts.findIndex(x=>x.id===p.id);if(i>=0)state.parts[i]=p;else state.parts.push(p)});state.snapshot=new Date().toISOString();log('Parts snapshot imported',rows.length+' records');persist();modal='';renderModal();render();toast('Parts snapshot updated locally.')}catch(e){importError=e.message;importPreview=null;renderModal()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action&&actions[b.dataset.action]){actions[b.dataset.action]();return}if(b.dataset.view){setView(b.dataset.view);return}if(b.dataset.job){selected=b.dataset.job;error=[];if(!['work','review'].includes(view))view='work';render();return}if(b.dataset.query){doLookup(b.dataset.query);return}if(b.dataset.asset){view='assets';render();return}if(b.dataset.assetJobs){view='work';filter='';search=b.dataset.assetJobs;selected=state.jobs.find(j=>j.asset===b.dataset.assetJobs)?.id;render();return}if(b.dataset.photo!==undefined){showModal('photo:'+b.dataset.photo);return}if(b.dataset.removePhoto!==undefined){current().attachments.splice(Number(b.dataset.removePhoto),1);persist();render();return}const txid=b.dataset.resolveLocal||b.dataset.resolveRemote;if(txid){const tx=state.queue.find(t=>t.id===txid);if(tx?.status!=='conflict')return;tx.resolutions.push({time:new Date().toISOString(),choice:b.dataset.resolveLocal?'device':'simulator',device:E.clone(tx.job),remote:E.clone(tx.remote)});if(b.dataset.resolveLocal){tx.baseVersion=tx.remote.version;tx.status='queued';delete tx.error;log('Conflict resolved','Kept device copy · '+tx.job.id)}else{const i=state.jobs.findIndex(j=>j.id===tx.job.id);const h=state.jobs[i].history;state.jobs[i]={...E.clone(tx.remote),history:h};history(state.jobs[i],'Conflict resolved','Adopted simulator copy; device copy retained in transaction history');tx.status='discarded';delete tx.error;}persist();render();toast(b.dataset.resolveLocal?'Device copy queued against the new version. Sync to retry.':'Simulator copy adopted. Original preserved in export.')}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){current()[el.dataset.field]=el.value;persist();$('#save-state').textContent=storageError?'In memory · export needed':'Draft captured locally'}else if(el.id==='job-search'){search=el.value;render()}else if(el.id==='part-search'){partSearch=el.value;render()}else if(el.id==='import-text'){importText=el.value;importPreview=null;const apply=$('[data-action="apply-import"]');if(apply)apply.remove()}});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.check!==undefined){current().checked[Number(el.dataset.check)]=el.checked;persist();$('#check-count').textContent=current().checked.filter(Boolean).length+' OF '+current().tasks.length+' RECORDED'}else if(el.id==='job-filter'){filter=el.value;render()}else if(el.id==='photo-input')await attach(el.files[0]);else if(el.id==='scenario'){state.scenario=el.value;persist()}else if(el.id==='import-file'){const f=el.files[0];if(!f)return;if(f.size>300000){importError='Choose a JSON snapshot smaller than 300 KB.'}else{importText=await f.text();importPreview=null;importError=''}renderModal()}});
document.addEventListener('submit',e=>{if(e.target.id==='lookup-form'){e.preventDefault();doLookup($('#lookup-input').value)}});
document.addEventListener('keydown',e=>{if(e.target.matches('.photo-label')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.querySelector('input')?.click()}if(e.key==='Escape'&&modal){modal='';renderModal()}if(e.key==='Tab'&&modal){const fs=[...document.querySelectorAll('.modal button,.modal textarea,.modal input')].filter(x=>!x.disabled&&x.offsetParent!==null);if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===fs.at(-1)){e.preventDefault();fs[0]?.focus()}}});
persist();render();
})();
</script></body></html>
