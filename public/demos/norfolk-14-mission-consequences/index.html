  const options=[{id:'expedite',title:'Expedite the cartridge',owner:'Supply watch',cost:'Priority courier coordination',changes:{part:{release:0}},note:'Set cartridge receipt to model start. Team availability remains unchanged.'},{id:'team',title:'Request an earlier team',owner:'Training duty lead',cost:'Replan the prior training evolution',changes:{team:{release:2}},note:'Set qualified-team availability to 2 hours after model start. Review-window availability stays unchanged.'},{id:'combined',title:'Align team & review window',owner:'Duty lead + engineering reviewer',cost:'Two schedule changes require review',changes:{team:{release:2},witness:{release:6}},note:'Set team availability to +2h and the review window to +6h from model start.'}];

lass="button export" id="export-button">${icon('download')} Export brief</button></div>${state.paused?'<div class="pause-banner" role="status">Exploration stopped. Assumption changes and decision recording are locked. Reading and export remain available.</div>':''}${recovery?`<div class="warning-banner">${e(recovery)} <button id="dismiss-recovery">Dismiss</button></div>`:''}<div class="scenario-bar"><div class="scenario-select"><span class="eyebrow">SCENARIO</span><select id="scenario-select" aria-label="Choose scenario" ${state.paused?'disabled':''}>${M.variants.map(v=>`<option value="${v.id}" ${state.scenarioId===v.id?'selected':''}>${v.name} · ${v.description}</option>`).join('')}${state.scenarioId==='imported'?'<option value="imported" selected>Imported scenario</option>':''}</select></div><span class="scenario-date">${e(s.start.slice(0,10))} <span>UTC</span></span><button class="quiet" id="import-button" ${state.paused?'disabled':''}>${icon('upload')} Import scenario</button></div>${state.tab==='model'?modelView(r):state.tab==='options'?optionsView(r):evidenceView(r)}<footer><span>${e(s.unit)}</span><span>Illustrative timing model · Human authority retained</span></footer></main></div>`;bind();}

l" ${state.filter==='critical'?'selected':''}>Controlling path</option><option value="estimated" ${state.filter==='estimated'?'selected':''}>Uncertain inputs</option></select></div><div id="timeline-content">${timeline(r)}</div><div class="legend"><span><i class="legend-critical"></i> Controlling path</span><span><i class="legend-regular"></i> Upstream slack</span><span><i class="legend-deadline"></i> Deadline</span><span><i class="legend-uncertainty"></i> Late bound</span></div></section><aside class="insight-column"><section class="current-state"><span class="eyebrow">01 / CURRENT STATE</span><h3>Alongside training</h3><p>${e(s.currentState)}</p><div class="state-tag">Synthetic status snapshot</div></section><section class="consequence"><span class="eyebrow">02 / WHAT THIS MEANS</span><h3>${!r.complete?'Hold the conclusion.':r.margin<0?'The deadline is exceeded.':'Slack is not mission margin.'}</h3><p>${!r.complete?'Missing values propagate through dependent work. No finish time or margin is inferred.':r.rows.part?`The cartridge has <strong>${hours(r.rows.part.slack)}</strong> of upstream slack. That is time it can slip before delaying the modeled finish; the mission margin is <strong>${hours(r.margin)}</strong>.`:'Task slack is measured against the modeled finish. Mission margin is measured against the deadline.'}</p><button class="button dark full" data-tab="options">Compare response options ${icon('arrow')}</button></section><section class="open-question"><span class="eyebrow">03 / HUMAN CHECK</span><h3>${r.unresolved} questions remain</h3><p>${e(s.questions.find(q=>!q.resolved)?.title||'All recorded questions reviewed')}. ${r.unresolved?'Review before relying on the timing projection.':'Timing remains an illustrative model.'}</p><button class="text-button" data-tab="evidence">Review evidence ${icon('arrow')}</button></section></aside></div><div class="model-note">${icon('info')}<p><strong>Late bound is a stress case, not a probability.</strong> It adds the sta function error(text){const el=$('#form-error');if(el){el.textContent=text;el.hidden=false;}}
function taskModal(id){const t=state.scenario.tasks.find(x=>x.id===id),r=M.calculate(state.scenario).rows[id];state.selection=id;modal(t.name,`<div class="modal-body"><div class="source-callout"><span class="eyebrow">SOURCE REFERENCE · SYNTHETIC</span><strong>${e(t.source)}</strong><p>${e(t.note)}</p></div><div class="task-results"><span>Start <b>${time(r.start)}</b></span><span>Finish <b>${time(r.finish)}</b></span><span>Upstream slack <b>${hours(r.slack)}</b></span></div><p class="dependent-note">Requires: ${t.dependsOn.length?t.dependsOn.map(id=>e(state.scenario.tasks.find(x=>x.id===id).name)).join(' + '):'No predecessor tasks'}</p><form id="task-form"><div class="form-grid"><label>Available after start (hours)<input name="release" type="number" min="0" max="168" step="0.25" value="${t.release??''}" placeholder="Blank = unknown" ${state.paused?'disabled':''}></label><label>Work duration (hours)<input name="duration" type="number" min="0" max="168" step="0.25" value="${t.duration??''}" placeholder="Blank = unknown" ${state.paused?'disabled':''}></label><label>Late-bound addition (hours)<input name="uncertainty" type="number" min="0" max="72" step="0.25" value="${t.uncertainty}" required ${state.paused?'disabled':''}></label><label>Evidence status<select name="confidence" ${state.paused?'disabled':''}>${['confirmed','estimated','missing'].map(v=>`<option ${t.confidence===v?'selected':''}>${v}</option>`).join('')}</select></label></div><p class="form-hint">Zero duration represents a gate. The late bound delays gates or extends work duration. Unknown or missing inputs block downstream calculations.</p><label>Reason for this change<textarea name="note" required maxlength="600" placeholder="Record the assumption or new synthetic evidence." ${state.paused?'disabled':''}></textarea></label><p id="form-error" class="form-error" role="alert" hidden></p><div class="modal-actions"><button class="button" type="button" id="cancel-edit">Cancel</button><button class="button dark" ${state.paused?'disabled':''}>Recalculate scenario ${icon('arrow')}</button></div></form></div>`);$('#cancel-edit').onclick=close;$('#task-form').onsubmit=ev=>{ev.preventDefault();if(state.paused)return;const form=new FormData(ev.target),next=M.clone(state.scenario),updated=next.tasks.find(x=>x.id===id);if(!String(form.get('note')).trim())return error('Add a reason so the assumption remains traceable.');for(const key of ['release','duration'])updated[key]=form.get(key)===''?null:Number(form.get(key));updated.uncertainty=Number(form.get('uncertainty'));updated.confidence=form.get('confidence');updated.note=form.get('note').trim();const errors=M.validate(next);if(errors.length)return error(errors.join(' '));state.scenario=next;log('Assumption changed',`${t.name}: ${updated.note}`,{taskId:id,before:t,after:updated});close();render();toast('Assumption saved. All dependent timings recalculated.');};}
function optionModal(id){const o=M.options.find(x=>x.id===id),proposal=M.apply(state.scenario,o),before=M.calculate(state.scenario),after=M.calculate(proposal);modal('Review a bounded option',`<div class="modal-body"><span class="pill amber">HUMAN DECISION · LOCAL EXERCISE ONLY</span><h3 class="option-modal-title">${o.title}</h3><p>${o.note}</p><div class="review-comparison"><div>Current margin<strong>${hours(before.margin)}</strong></div>${icon('arrow')}<div>Proposed margin<strong>${hours(after.margin)}</strong></div></div><p class="form-hint">Review owner: ${o.owner}. ${o.cost}. This records a scenario decision only; it does not send instructions.</p><form id="option-form"><label>Review rationale<textarea name="reason" required maxlength="600" placeholder="Why accept, modify, or reject this option?"></textarea></label><p id="form-error" class="form-error" role="alert" hidden></p><div class="modal-actions"><button type="submit" class="button" name="decision" value="reject">Reject option</button><button type="button" class="button" id="modify-option">Modify inputs</button><button type="submit" class="button dark" name="decision" value="approve">Approve for exercise</button></div></form></div>`);$('#modify-option').onclick=()=>{close();state.tab='model';render();toast('Choose a dependency to enter a modified assumption.');};$('#option-form').onsubmit=ev=>{ev.preventDefault();if(state.paused)return;const reason=new FormData(ev.target).get('reason').trim();if(!reason)return error('A review rationale is required.');const approved=ev.submitter.value==='approve';if(approved)state.scenario=proposal;log(approved?'Option approved locally':'Option rejected',`${o.title} — ${reason}`,{option:id,changes:o.changes,beforeMargin:before.margin,afterMargin:after.margin});close();render();toast(approved?'Exercise option applied; timings recalculated.':'Rejection recorded. Scenario inputs retained.');};}
function importModal(){modal('Import a synthetic scenario',`<div class="modal-body"><p>Load a version 1 JSON scenario. All tasks must lead to one readiness task, with an acyclic dependency graph.</p><div class="import-controls"><label class="button file-label">Choose JSON file<input id="file-input" type="file" accept="application/json,.json"></label><button class="button" id="load-example">Load example</button><button class="text-button" id="download-example">Download template</button></div><form id="import-form"><label>Scenario JSON<textarea id="json-input" class="json-area" required spellcheck="false" placeholder='{"version": 1, "name": "Exercise", ...}'></textarea></label><p class="form-hint">Maximum 250 KB, 40 dependencies. Blank or unknown task timing uses null. Imported data replaces the working model after validation.</p><p id="form-error" class="form-error" role="alert" hidden></p><div class="modal-actions"><button class="button dark">Validate & import ${icon('arrow')}</button></div></form></div>`,true);$('#load-example').onclick=()=>{$('#json-input').value=JSON.stringify(M.seed,null,2);};$('#download-example').onclick=()=>download('margin-scenario-template.json',M.seed);$('#file-input').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;if(file.size>250000)return error('File is too large. Use a JSON file smaller than 250 KB.');$('#json-input').value=await file.text();};$('#import-form').onsubmit=ev=>{ev.preventDefault();if(state.paused)return;try{if($('#json-input').value.length>250000)throw Error('JSON exceeds 250 KB.');const data=JSON.parse($('#json-input').value),errors=M.validate(data);if(errors.length)throw Error(errors.join('\n'));state.scenario=M.clone(data);state.baseline=M.clone(data);state.scenarioId='imported';state.search='';state.filter='all';log('Scenario imported',`${data.name}: ${data.tasks.length} validated tasks.`,{input:data});close();render();toast('Scenario imported. Dependency model validated.');}catch(err){error(err.message.startsWith('Unexpected')?'Invalid JSON. Check commas, quotation marks, and brackets.':err.message);}};}
function scheduleModal(){modal('Edit the exercise deadline',`<div class="modal-body"><p>All times are elapsed hours from <strong>${e(state.scenario.start)}</strong>. Adjusting the deadline changes mission margin, not task slack.</p><form id="schedule-form"><label>Deadline after model start (hours)<input name="deadline" type="number" min="0.25" max="168" step="0.25" value="${state.scenario.deadline}" required></label><label>Reason<textarea name="reason" required maxlength="600" placeholder="Explain the hypothetical deadline change."></textarea></label><p id="form-error" class="form-error" role="alert" hidden></p><div class="modal-actions"><button class="button dark">Update deadline</button></div></form></div>`);$('#schedule-form').onsubmit=ev=>{ev.preventDefault();const data=new FormData(ev.target);if(state.paused)return;const reason=data.get('reason').trim();if(!reason)return error('A reason is required.');const next=M.clone(state.scenario);next.deadline=Number(data.get('deadline'));const errors=M.validate(next);if(errors.length)return error(errors.join(' '));state.scenario=next;log('Deadline changed',`${hours(next.deadline)} from start — ${reason}`);close();render();};}
function questionModal(id){const q=state.scenario.questions.find(x=>x.id===id);modal(q.resolved?'Reopen question':'Record evidence review',`<div class="modal-body"><h3>${e(q.title)}</h3><p>${e(q.detail)}</p><form id="question-form"><label>Review note<textarea name="note" required maxlength="600" placeholder="Record the synthetic clarification and its source."></textarea></label><p id="form-error" class="form-error" role="alert" hidden></p><div class="modal-actions"><button class="button dark">${q.resolved?'Reopen question':'Record local review'}</button></div></form></div>`);$('#question-form').onsubmit=ev=>{ev.preventDefault();if(state.paused)return;const note=new FormData(ev.target).get('note').trim();if(!note)return error('A review note is required.');q.resolved=!q.resolved;log(q.resolved?'Evidence reviewed locally':'Question reopened',`${q.title} — ${note}`,{question:id});close();render();toast('Review recorded locally. Timing assumptions were not changed.');};}
function methodModal(){modal('How MARGIN calculates',`<div class="modal-body method"><h3>A transparent, deterministic model.</h3><p>Each task starts at the later of its availability time or the finish of all prerequisites. Work proceeds continuously; resource contention is represented only by explicit gates and dependencies.</p><dl><div><dt>Task finish</dt><dd>max(availability, prerequisite finishes) + duration</dd></div><div><dt>Upstream slack</dt><dd>Latest permissible task finish − earliest task finish, relative to modeled completion.</dd></div><div><dt>Mission margin</dt><dd>Exercise deadline − modeled readiness-review finish.</dd></div><div><dt>Late bound</dt><dd>Recalculate with each gate delayed or work duration extended by its uncertainty value. No likelihood is implied.</dd></div></dl><h3>Provenance & limits</h3><p>Handcrafted Norfolk case 14 demonstration based on the bundled <code>harness/norfolk-snapshot.ts</code> catalogue. All vessel, work-order and source records were created for this exercise. The workflow has not been validated by the Fleet.</p><p>No AI model, external service, production authentication or authoritative system is connected. Local decisions are editable browser data, not a tamper-proof audit. Human review remains required. No measured watchstander improvement is claimed.</p><button class="button" id="reset-demo" ${state.paused?'disabled':''}>Reset synthetic workspace</button><p class="form-hint">Resets scenario and local trace. Export first if you need to preserve this session.</p></div>`,true);$('#reset-demo').onclick=()=>{state={scenario:M.scenario('baseline'),baseline:M.scenario('baseline'),scenarioId:'baseline',tab:'model',search:'',filter:'all',paused:false,log:[],selection:null};save();close();render();toast('Synthetic workspace reset.');};}
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportBrief(){const r=M.calculate(state.scenario);download('margin-readiness-brief.json',{format:'MARGIN exercise brief v1',exportedAt:new Date().toISOString(),synthetic:true,scope:'Illustrative timing support only; no operational authorization.',scenario:state.scenario,originalScenario:state.baseline,result:r,paused:state.paused,decisions:state.log,method:{finish:'max(release, predecessor finish) + duration',slack:'latest finish relative to modeled completion minus earliest finish',missionMargin:'deadline minus readiness review finish',uncertainty:'all stated late-bound additions applied together; not probabilistic'}});toast('Brief exported with inputs, calculations, sources and decisions.');}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render();});$('.brand').onclick=ev=>{ev.preventDefault();state.tab='model';render();};$('#export-button').onclick=exportBrief;$('#stop-button').onclick=()=>{state.paused=!state.paused;log(state.paused?'Exploration stopped':'Exploration resumed',state.paused?'Local mutations locked by exercise operator.':'Local exploration unlocked by exercise operator.');render();};$('#method-button').onclick=methodModal;$('#import-button').onclick=importModal;$('#scenario-select').onchange=ev=>{if(state.paused)return;state.scenarioId=ev.target.value;state.scenario=M.scenario(state.scenarioId);state.baseline=M.clone(state.scenario);state.search='';state.filter='all';log('Scenario selected',state.scenario.name,{input:state.scenario});render();};if($('#dismiss-recovery'))$('#dismiss-recovery').onclick=()=>{recovery='';render();};if($('#schedule-button'))$('#schedule-button').onclick=scheduleModal;if($('#dependency-search'))$('#dependency-search').oninput=ev=>{state.search=ev.target.value;$('#timeline-content').innerHTML=timeline(M.calculate(state.scenario));bindTasks();};if($('#dependency-filter'))$('#dependency-filter').onchange=ev=>{state.filter=ev.target.value;$('#timeline-content').innerHTML=timeline(M.calculate(state.scenario));bindTasks();};document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>optionModal(b.dataset.option));document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>questionModal(b.dataset.question));if($('#restore-button'))$('#restore-button').onclick=()=>{state.scenario=M.clone(state.baseline);log('Scenario restored','Restored the selected scenario inputs; decision trace retained.');render();toast('Original scenario assumptions restored.');};bindTasks();}
function bindTasks(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>taskModal(b.dataset.task));if($('#clear-search'))$('#clear-search').onclick=()=>{state.search='';state.filter='all';render();};}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if(ev.key==='Tab'&&$('.modal')){const focusables=[...$('.modal').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')];const first=focusables[0],last=focusables.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
render();
})();
</script></body></html>
