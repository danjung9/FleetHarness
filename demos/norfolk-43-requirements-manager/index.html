 `<div class="workspace-toolbar"><div class="view-tabs" aria-label="Portfolio view"><button class="${layout==='board'?'active':''}" data-action="layout" data-layout="board" aria-pressed="${layout==='board'}">${icon('board')}Lifecycle board</button><button class="${layout==='register'?'active':''}" data-action="layout" data-layout="register" aria-pressed="${layout==='register'}">${icon('list')}Register</button></div><button class="btn" data-action="export">${icon('download')}Export brief</button></div><div class="filterbar"><label class="search-wrap">${icon('search')}<input id="search" type="search" aria-label="Search requirements" placeholder="Search requirements, IDs, or source…" value="${esc(query)}"></label><select id="sponsor" aria-label="Filter by sponsor">${options(C.sponsors,sponsor,'All sponsors')}</select>${view==='portfolio'?`<select id="stage" aria-label="Filter by lifecycle stage">${options(C.statuses,stage,'All stages')}</select>`:''}<select id="priority" aria-label="Filter by priority">${options(C.priorities,priority,'All priorities')}</select><select id="sort" aria-label="Sort requirements"><option value="priority" ${sort==='priority'?'selected':''}>Priority first</option><option value="updated" ${sort==='updated'?'selected':''}>Recently updated</option><option value="title" ${sort==='title'?'selected':''}>Title A–Z</option></select></div><div id="portfolio-content">${portfolioContent()}</div>`+footer();
}
function portfolioContent(){const records=filtered();return `${selected.size?`<div class="selected-bar"><strong>${selected.size} selected</strong><button class="clear-filters" data-action="clear-selection">Clear selection</button><button class="btn soft" data-action="export">Review selected export ${icon('arrow')}</button></div>`:''}${!records.length?`<div class="empty">${icon('search')}<h3>${view==='review'&&!query&&!sponsor&&!priority?'No proposals waiting.':'No matching requirements.'}</h3><p>${view==='review'?'New proposals will appear here after submission.':'Try a different search or clear the active filters.'}</p><button class="btn" data-action="clear-filters">Clear filters</button></div>`:layout==='register'?register(records):`<div class="board ${view==='review'?'review-board':''}">${laneDefs.filter(l=>view!=='review'||l.statuses.includes('Proposed')).map(l=>`<section class="lane" style="--lane-color:${l.color}"><div class="lane-head"><div><i class="lane-dot"></i>${l.title}</div><span class="count">${records.filter(r=>l.statuses.includes(r.status)).length}</span></div><p class="lane-caption">${l.sub}</p><div class="cards">${records.filter(r=>l.statuses.includes(r.status)).map(card).join('')||'<div class="lane-note">No matching requirements</div>'}</div></section>`).join('')}</div>`}<div class="board-footer"><span>${icon('layers')}${records.length} of ${state.records.length} requirements${query||sponsor||stage||priority?` · <button class="clear-filters" data-action="clear-filters">Clear filters</button>`:''}</span><span>${icon('shield')}All decisions retain their history</span></div>`;}
function card(r){return `<article class="req-card ${selected.has(r.id)?'selected':''}"><input type="checkbox" class="card-checkbox" data-select="${r.id}" aria-label="Select ${r.id}" ${selected.has(r.id)?'checked':''}><button class="card-main" data-action="detail" data-id="${r.id}" aria-label="Open ${r.id}: ${esc(r.title)}"><span class="record-id">${r.id}</span><h3>${esc(r.title)}</h3><span class="card-domain">${icon('layers')}${esc(r.domain)}</span>${['Archived','Rejected'].includes(r.status)?`<span class="closed-badge ${r.status.toLowerCase()}">${r.status}</span>`:''}</button><div class="card-meta">${priorityBadge(r)}<span class="cycle">${r.targetCycle}</span></div><div class="card-footer"><span class="sponsor"><span class="avatar">${r.sponsor.slice(0,2)}</span>${r.sponsor}</span><span class="card-extras">v${r.versions.length}${r.comments.length?`${icon('comment')}${r.comments.length}`:''}</span></div></article>`;}
function register(records){return `<div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="select-all" aria-label="Select all visible requirements" ${records.every(r=>selected.has(r.id))?'checked':''}></th><th>Requirement</th><th>Stage</th><th>Sponsor</th><th>Priority</th><th>Cycle</th><th>Version</th></tr></thead><tbody>${records.map(r=>`<tr><td><input type="checkbox" data-select="${r.id}" aria-label="Select ${r.id}" ${selected.has(r.id)?'checked':''}></td><td><button class="record-link" data-action="detail" data-id="${r.id}">${esc(r.title)}</button><span class="record-id">${r.id}</span></td><td>${badge(r)}</td><td>${r.sponsor}</td><td>${priorityBadge(r)}</td><td class="mono">${r.targetCycle}</td><td class="mono">v${r.versions.length}</td></tr>`).join('')}</tbody></table></div>`;}
function eventRow(e){return `<article class="activity-row"><div class="event-icon">${icon(e.action.includes('→')?'arrow':e.action.includes('Comment')?'comment':e.action.includes('Export')?'download':'edit')}</div><div><h3>${esc(e.action)} · ${e.recordId!=='Workspace'?`<button class="inline-link" data-action="detail" data-id="${esc(e.recordId)}">${esc(e.recordId)}</button>`:'Workspace'}</h3><p>${esc(e.note)}</p><div class="meta">${esc(e.actor)} · <span class="mono">${esc(e.id)}</span></div></div><time datetime="${esc(e.at)}">${time(e.at)}</time></article>`;}
function guide(){return titleBlock('A shared record. A visible path.','A working demonstration of accountable requirements management.','WORKSPACE GUIDE / NORFOLK #43')+`<div class="guide"><section class="guide-panel"><h2>Present the full lifecycle</h2>${[['01','Inspect the portfolio','Open Resilient logistics status exchange. Review its source, success measure, versions, and comment.'],['02','Capture a capability gap','Create a requirement, or use Bulk import → Load sample. Validate the batch before importing it as serialized drafts.'],['03','Route and decide','Submit a draft. As the simulated PPBE manager, approve, return, or reject with a rationale.'],['04','Connect to programming','Move an approved requirement into POM / PPBE with an illustrative reference, then archive it while retaining its history.'],['05','Create a review package','Select records and open Export brief. Review the scope, then download CSV, JSON, or an HTML brief, or print to PDF.']].map(([n,h,p])=>`<div class="guide-step"><b>${n}</b><div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}</section><section class="guide-panel"><h2>Local roles, made explicit</h2><p>The role selector changes UI permissions for demonstration. It is not authentication, authorization, encryption, or a multi-user service.</p><table class="permissions"><thead><tr><th>Action</th><th>Viewer</th><th>Contributor</th><th>Manager</th></tr></thead><tbody><tr><td>Read & export</td><td>Yes</td><td>Yes</td><td>Yes</td></tr><tr><td>Create & submit</td><td>—</td><td>Yes</td><td>Yes</td></tr><tr><td>Edit drafts / comment</td><td>—</td><td>Yes</td><td>Yes</td></tr><tr><td>Decide & program</td><td>—</td><td>—</td><td>Yes</td></tr></tbody></table><h3 style="margin-top:25px">Supported scope</h3><ul><li>Single browser, browser-local persistence; no live integrations.</li><li>CSV / JSON batch import, up to 200 rows and 1 MB. Imports are validated atomically and always start as drafts.</li><li>Serialized IDs use the illustrative FR-26 sequence.</li><li>Approved edits reopen proposal review. Programmed records must be archived and reopened to change content.</li><li>CSV, JSON, printable HTML and browser PDF printing. No native Word or PowerPoint generation and no approved Echelon I format.</li><li>Local history is inspectable, not tamper-proof or records-retention compliant.</li></ul><h3 style="margin-top:22px">Source & provenance</h3><p>Based on catalogue case 43 in <span class="mono">harness/norfolk-snapshot.ts</span>. All examples, owners, measures, and references are fictional training material. No formal SOP, role matrix, or Echelon I templates were supplied.</p></section><section class="guide-panel"><h2>Keep a copy. Start fresh.</h2><p>Export the complete workspace before resetting. Reset replaces local requirements, comments, versions, and audit events with the bundled synthetic examples.</p><div class="actions" style="flex-wrap:wrap"><button class="btn" data-action="backup">${icon('download')}Download workspace JSON</button>${corruptRaw!==null?'<button class="btn" data-action="recovery">Download recovery data</button>':''}<button class="btn danger" data-action="reset">${icon('reset')}Reset demo</button></div></section><section class="guide-panel"><h2>Handcrafted for this use case</h2><p>KEEL is an independent local demo prepared for Norfolk #43. It is not AppYard-generated or AppYard-verified, and it does not replace any deployed application.</p><p>Bundled typography: DM Sans and IBM Plex Mono under the SIL Open Font License. No external requests, credentials, or API keys are required.</p></section></div>`+footer();}
function openModal(type,body,opts={}) {
 if(!modalType)lastFocus=document.activeElement;
 modalType=type;
 $('#overlay-root').innerHTML=`<div class="modal-backdrop ${opts.drawer?'drawer':''}"><section class="modal ${opts.size||''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">${body}</section></div>`;

function head(title,sub='',pre=''){return `<header class="modal-head"><div>${pre?`<div class="eyebrow muted">${pre}</div>`:''}<h2 id="modal-title">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="close-btn" data-action="close" aria-label="Close dialog">${icon('close')}</button></header>`;}
function closeModal(){modalType='';$('#overlay-root').innerHTML='';document.body.classList.remove('modal-open');lastFocus?.focus();}
function detail(id,tab='Overview'){
 const r=state.records.find(x=>x.id===id);if(!r)return;
 activeId=id;detailTab=tab;
 const tabs=['Overview','Versions','Discussion','Audit'];
 let body='';
 if(tab==='Overview')body=`<div class="detail-status">${badge(r)}${priorityBadge(r)}<span class="mono">VERSION ${r.versions.length}</span></div><h3 class="detail-title">${esc(r.title)}</h3><div class="detail-grid">${[['Sponsor',r.sponsor],['Capability area',r.domain],['Target cycle',r.targetCycle],['Updated',fmt(r.updatedAt)]].map(([l,v])=>`<div class="field-read"><label>${l}</label><div>${esc(v)}</div></div>`).join('')}</div><section class="prose-block"><h3>Capability gap</h3><p>${esc(r.description)}</p></section><section class="prose-block"><h3>Success measure</h3><p>${esc(r.measure)}</p></section><section class="prose-block source"><h3>Source reference</h3><p>${esc(r.source)}</p><p style="margin-top:8px">${esc(r.provenance)}</p></section>${r.programReference?`<section class="prose-block"><h3>Illustrative programming reference</h3><p class="mono">${esc(r.programReference)}</p></section>`:''}<div class="notice">${r.status==='Approved'?'Editing an approved requirement reopens review and retains the previous approval in history.':'Synthetic content · No funding or operational approval is implied.'}</div>`;
 if(tab==='Versions')body=`<div class="notice">Each content change and stage transition records a complete snapshot. Expand a version to inspect its changes.</div>${[...r.versions].reverse().map((v,reverseIndex)=>{const previous=r.versions[r.versions.length-reverseIndex-2];const changed=Object.keys(v.data).filter(f=>!previous||v.data[f]!==previous.data[f]);return `<details class="version" ${reverseIndex===0?'open':''}><summary>Version ${v.number} · ${esc(v.data.status)}<small>${time(v.at)} · ${esc(v.actor)}</small></summary><div class="version-body"><p>${esc(v.note)}</p>${changed.map(f=>`<div class="changed-field"><b>${esc(f)}</b><div>${previous?`<del>${esc(previous.data[f]||'Not set')}</del>`:''}<ins>${esc(v.data[f]||'Not set')}</ins></div></div>`).join('')}</div></details>`;}).join('')}`;
 if(tab==='Discussion')body=`${r.comments.length?r.comments.map(c=>`<div class="comment"><p>${esc(c.body)}</p><div class="meta">${esc(c.actor)} · ${time(c.at)}</div></div>`).join(''):'<div class="notice">No comments yet. Capture review context without changing the requirement.</div>'}${role!=='Viewer'?`<form id="comment-form"><div class="form-error" id="form-error" role="alert"></div><div class="form-field"><label for="comment-body">Add review context</label><textarea id="comment-body" name="comment" minlength="3" maxlength="2000" required placeholder="Add a specific question, assumption, or review note…"></textarea></div><button class="btn primary" type="submit">${icon('comment')}Add comment</button></form>`:'<div class="notice">Viewer simulation is read-only. Switch roles to add a comment.</div>'}`;
 if(tab==='Audit')body=`<div class="activity-list">${state.audit.filter(e=>e.recordId===r.id).map(eventRow).join('')}</div>`;
 const labels={Proposed:'Submit for review',Approved:'Approve',Draft:r.status==='Proposed'?'Return for revision':'Reopen as draft',Rejected:'Reject',Programming:'Enter POM / PPBE',Archived:'Archive'};
 const avail=C.actions(r,role);
 openModal('detail',head('Requirement record',`${r.id} · Created ${fmt(r.createdAt)}`,'TRACEABLE BY DESIGN')+`<nav class="modal-tabs" aria-label="Requirement sections">${tabs.map(t=>`<button class="${t===tab?'active':''}" data-action="detail-tab" data-tab="${t}" aria-pressed="${t===tab}">${t}${t==='Versions'?` (${r.versions.length})`:t==='Discussion'?` (${r.comments.length})`:''}</button>`).join('')}</nav><div class="modal-body">${body}</div><footer class="modal-footer detail-actions">${avail.map((s,i)=>`<button class="btn ${i===0?'primary':''} ${s==='Rejected'?'danger':''}" data-action="decision" data-target="${s}">${s==='Approved'?icon('check'):''}${labels[s]}</button>`).join('')}${!avail.length?`<span class="no-actions">${role==='Viewer'?'Viewer simulation · Read-only':'No lifecycle actions for this role'}</span>`:''}${C.canEdit(r,role)?`<button class="btn" data-action="edit" data-id="${r.id}" aria-label="Edit requirement">${icon('edit')}Edit</button>`:''}</footer>`,{drawer:true});
}
function formFields(r={}){return `<div class="form-grid"><div class="form-field full"><label for="title">Requirement title</label><input id="title" name="title" required minlength="8" maxlength="160" placeholder="Name the capability you need" value="${esc(r.title)}" autofocus></div><div class="form-field full"><label for="description">Capability gap</label><textarea id="description" name="description" required minlength="20" maxlength="3000" placeholder="Describe the current limitation and its impact in a synthetic exercise.">${esc(r.description)}</textarea></div><div class="form-field"><label for="form-sponsor">Sponsor</label><select id="form-sponsor" name="sponsor">${options(C.sponsors,r.sponsor||'USFF')}</select></div><div class="form-field"><label for="domain">Capability area</label><select id="domain" name="domain">${options(C.domains,r.domain||C.domains[0])}</select></div><div class="form-field"><label for="form-priority">Priority</label><select id="form-priority" name="priority">${options(C.priorities,r.priority||'Medium')}</select></div><div class="form-field"><label for="targetCycle">Target cycle</label><select id="targetCycle" name="targetCycle">${options(Array.from({length:9},(_,i)=>'FY'+(i+27)),r.targetCycle||'FY28')}</select></div><div class="form-field full"><label for="measure">Success measure</label><textarea id="measure" name="measure" required minlength="10" maxlength="1000" placeholder="Define a measurable training outcome.">${esc(r.measure)}</textarea></div><div class="form-field full"><label for="source">Source reference</label><input id="source" name="source" required minlength="5" maxlength="300" placeholder="e.g. Synthetic workshop notes · item 04" value="${esc(r.source)}"><small>Use synthetic content only. Preserve the source and any uncertainty.</small></div></div>`;}
function recordForm(id){const r=id?state.records.find(x=>x.id===id):null;activeId=id||null;openModal('edit',head(r?'Revise requirement':'Capture a requirement',r?`${r.id} · Saving creates version ${r.versions.length+1}.`:'A serialized tracking number is assigned when the draft is saved.')+`<form id="record-form" class="modal-body"><div class="form-error" id="form-error" role="alert"></div>${r?.status==='Approved'?'<div class="notice warn">Saving changes moves this approved requirement back to Proposed for a new review.</div>':''}${formFields(r||{})}${r?`<div class="form-field" style="margin-top:18px"><label for="change-note">What changed and why?</label><textarea id="change-note" name="changeNote" required minlength="5" maxlength="1000"></textarea></div>`:''}<div class="form-footer"><button class="btn" type="button" data-action="${r?'back-detail':'close'}">Cancel</button><button class="btn primary" type="submit">${icon('check')}${r?'Save new version':'Create draft'}</button></div></form>`);}
function decision(target){const r=state.records.find(x=>x.id===activeId);const titles={Proposed:'Submit for review',Approved:'Approve requirement',Draft:r.status==='Proposed'?'Return for revision':'Reopen as draft',Rejected:'Reject proposal',Programming:'Enter POM / PPBE',Archived:'Archive requirement'};openModal('decision',head(titles[target],`${r.id} · ${r.status} → ${target}`,'LOCAL DECISION SIMULATION')+`<form id="decision-form" class="modal-body" data-target="${target}"><div class="notice">${esc(r.title)}<br>Decision recorded as <strong>${esc(role)}</strong>. This is a local simulation.</div><div class="form-error" id="form-error" role="alert"></div><div class="form-field"><label for="rationale">Decision rationale</label><textarea id="rationale" name="rationale" required minlength="10" maxlength="1000" autofocus placeholder="Explain the decision and any conditions or next steps…"></textarea></div>${target==='Programming'?'<div class="form-field"><label for="program-reference">Illustrative programming reference</label><input id="program-reference" name="programReference" required minlength="5" maxlength="100" placeholder="e.g. ILLUSTRATIVE-POM28-014"><small>Records a local reference only. No PPBE system or funding integration.</small></div>':''}<div class="form-footer"><button type="button" class="btn" data-action="back-detail">Cancel</button><button type="submit" class="btn ${target==='Rejected'?'danger':'primary'}">Confirm ${target==='Draft'?'return to draft':target.toLowerCase()}</button></div></form>`,{size:'small'});}
const sampleCSV='title,description,sponsor,domain,priority,targetCycle,measure,source\n"Mobile exercise lesson library","Provide a portable library of reviewed exercise lessons with explicit sources and local search for training teams.",USFF,Training,Medium,FY29,"Find a relevant synthetic lesson and its source in under three minutes.","Synthetic lessons workshop · item 24"\n"Training supply reconciliation","Reconcile synthetic supply requests across training teams while preserving discrepancies and named review ownership.",CPF,Sustainment,High,FY28,"Identify all mismatched quantities in a twenty-record synthetic reconciliation exercise.","Exercise planning lab · item 25"';
function importModal(){validatedImport=null;openModal('import',head('Bring requirements together','Paste CSV or a JSON array, or choose a local file. Validate before creating drafts.','BULK CAPTURE')+`<div class="modal-body"><div class="notice">Required fields: <span class="mono">${C.fields.join(', ')}</span>.<br>Up to 200 rows / 1 MB. Duplicate titles and invalid fields block the entire batch.</div><div class="import-actions"><label class="btn file-label">${icon('upload')}Choose CSV / JSON<input type="file" id="import-file" accept=".csv,.json,text/csv,application/json"></label><button class="btn" data-action="load-sample">Load sample</button><button class="btn text" data-action="template">Download CSV template</button></div><div class="form-field"><label for="import-text">Source content</label><textarea id="import-text" class="import-text" spellcheck="false" placeholder="Paste a CSV header and rows, or an array of requirement objects…"></textarea></div><div id="import-preview"></div></div><footer class="modal-footer"><button class="btn" data-action="validate-import">Validate batch</button><button class="btn primary" data-action="commit-import" disabled id="import-commit">Import as drafts</button></footer>`,{size:'wide'});}

function exportModal(){exportIds=selected.size?[...selected]:filtered().map(r=>r.id);const records=state.records.filter(r=>exportIds.includes(r.id));openModal('export',head('A reviewable portfolio brief','Confirm the scope before exporting. All files are generated locally.','EXPORT / SYNTHETIC CONTENT')+`<div class="modal-body"><div class="export-summary"><span class="big">${records.length}</span><div><h3>${selected.size?'Selected requirements':'Requirements in the current view'}</h3><p>Current versions · ${fmt(new Date())} · ${esc(role)} simulation</p></div></div><div class="preview-list">${records.map(r=>`<div class="preview-row"><div><small class="mono">${r.id}</small> ${esc(r.title)}</div><small>${r.status} · v${r.versions.length}</small></div>`).join('')||'<div class="preview-row">No records in scope. Adjust the filters or select records.</div>'}</div><div class="export-options">${[['csv','file','CSV register','Spreadsheet-compatible · current record fields'],['json','layers','JSON review package','Records, versions, comments, and scoped audit'],['html','book','HTML review brief','Portable, readable document with source references'],['print','print','Print / Save as PDF','Browser print dialogue · current records']].map(([format,i,t,s])=>`<button class="export-option" data-action="download-export" data-format="${format}" ${!records.length?'disabled':''}>${icon(i)}<span><strong>${t}</strong><small>${s}</small></span></button>`).join('')}</div><div class="notice" style="margin:18px 0 0">Illustrative exports for review. These are not approved Echelon I templates. CSV cells beginning with spreadsheet formula markers are neutralized.</div></div>`,{size:'wide'});}
function exportEnvelope(records){return { product:'KEEL · Norfolk #43',label:'SYNTHETIC DEMONSTRATION — LOCAL ROLE SIMULATION',schemaVersion:1,exportedAt:new Date().toISOString(),exportedBy:role+' · local simulation',scope:records.map(r=>r.id),limitations:['Browser-local data; identities and approvals are simulated.','Illustrative export, not an approved Echelon I format.','Audit is not tamper-evident.'],records:C.clone(records),audit:C.clone(state.audit.filter(e=>records.some(r=>r.id===e.recordId)))};}
function briefHTML(records){return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>KEEL · Requirements review brief</title><style>body{font:14px/1.65 system-ui,sans-serif;color:#203b35;max-width:920px;margin:48px auto;padding:0 28px}h1{font-size:34px;font-weight:500;letter-spacing:-1px}h2{font-size:22px;font-weight:500}h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#65775d;margin-bottom:5px}p{white-space:pre-wrap;margin-top:5px}header{border-bottom:3px solid #214b3e;padding-bottom:20px}article{padding:25px 0;border-bottom:1px solid #cdd8c4;break-inside:avoid}.meta{color:#6f8066;font-size:12px}.source{background:#eff3e8;padding:14px}.tag{font-size:11px;border:1px solid #baccae;border-radius:4px;padding:4px 8px}footer{font-size:11px;color:#7c8b73;margin:30px 0}@media print{body{margin:0;max-width:none}header{margin-top:0}article{break-inside:avoid}}</style></head><body><header><div class="meta">KEEL / NORFOLK #43 · SYNTHETIC DEMONSTRATION</div><h1>Requirements review brief</h1><p>${records.length} requirements · Generated ${esc(time(new Date()))}</p><div class="meta">${esc(role)} · Local role simulation. Illustrative review format; not an approved Echelon I template.</div></header>${records.map(r=>`<article><div class="meta">${r.id} · Version ${r.versions.length} · Updated ${esc(fmt(r.updatedAt))}</div><h2>${esc(r.title)}</h2><p><span class="tag">${esc(r.status)}</span> ${esc(r.sponsor)} · ${esc(r.domain)} · ${esc(r.priority)} priority · ${esc(r.targetCycle)}</p><h3>Capability gap</h3><p>${esc(r.description)}</p><h3>Success measure</h3><p>${esc(r.measure)}</p><div class="source"><h3>Source & provenance</h3><p>${esc(r.source)}</p><div class="meta">${esc(r.provenance)}</div></div>${r.programReference?`<h3>Illustrative programming reference</h3><p>${esc(r.programReference)}</p>`:''}<h3>Latest version rationale</h3><p>${esc(r.versions.at(-1).note)}</p><div class="meta">${esc(r.versions.at(-1).actor)} · ${esc(time(r.versions.at(-1).at))}</div></article>`).join('')}<footer>Generated locally by the handcrafted KEEL demo. All requirements, source references, roles, and approvals are synthetic. For full history, use the JSON review package. No live operational data or enterprise integrations.</footer></body></html>`;}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function doExport(format){const records=state.records.filter(r=>exportIds.includes(r.id));if(!records.length)return;const base='keel-review-'+new Date().toISOString().slice(0,10);if(format==='csv')download(base+'.csv','\uFEFF'+C.csv(records),'text/csv;charset=utf-8');else if(format==='json')download(base+'.json',JSON.stringify(exportEnvelope(records),null,2),'application/json');else if(format==='html')download(base+'.html',briefHTML(records),'text/html;charset=utf-8');else if(format==='print'){const frame=document.createElement('iframe');frame.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';frame.title='Printable requirements brief';frame.srcdoc=briefHTML(records);frame.onload=()=>{frame.contentWindow.focus();frame.contentWindow.print();setTimeout(()=>frame.remove(),60000);};document.body.append(frame);}C.audit(state,null,format==='print'?'Print brief requested':'Export generated',role,`${records.length} requirements · ${format.toUpperCase()} · ${records.map(r=>r.id).join(', ')}`);persist();toast(format==='print'?'Print dialog requested. Choose Save as PDF.':`${format.toUpperCase()} package generated for ${records.length} requirements.`);}
function error(e){const el=$('#form-error');if(el){el.textContent=e.message;el.scrollIntoView({block:'nearest'});}else toast(e.message);}
function changed(message,id){persist();shell();if(id)detail(id);else closeModal();toast(message);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;try{
 if(a==='view'){view=b.dataset.view;query='';sponsor='';stage='';priority='';shell();}
 else if(a==='layout'){layout=b.dataset.layout;shell();}
 else if(a==='detail')detail(b.dataset.id);
 else if(a==='detail-tab')detail(activeId,b.dataset.tab);
 else if(a==='close')closeModal();
 else if(a==='new')recordForm();
 else if(a==='edit')recordForm(b.dataset.id);
 else if(a==='back-detail')detail(activeId);
 else if(a==='decision')decision(b.dataset.target);
 else if(a==='clear-filters'){query='';sponsor='';stage='';priority='';shell();}
 else if(a==='clear-selection'){selected.clear();shell();}
 else if(a==='import')importModal();
 else if(a==='load-sample'){$('#import-text').value=sampleCSV;validatedImport=null;$('#import-preview').innerHTML='';$('#import-commit').disabled=true;}
 else if(a==='template')download('keel-import-template.csv',sampleCSV,'text/csv;charset=utf-8');
 else if(a==='validate-import')validateImport();
 else if(a==='commit-import'){if(!validatedImport||validatedImport.source!==$('#import-text').value)throw Error('Validate the current batch before importing.');const parsed=C.parseImport($('#import-text').value,state.records);if(parsed.errors.length)throw Error('The workspace changed. Validate the batch again.');const created=C.addRecords(state,parsed.records,role,'Local bulk import · synthetic input');selected=new Set(created.map(r=>r.id));view='portfolio';stage='';sponsor='';priority='';query='';changed(`${created.length} drafts created with serialized tracking numbers.`);}
 else if(a==='export')exportModal();
 else if(a==='download-export')doExport(b.dataset.format);
 else if(a==='audit-export'){download('keel-audit.json',JSON.stringify({label:'SYNTHETIC LOCAL AUDIT — NOT TAMPER-EVIDENT',exportedAt:new Date().toISOString(),events:state.audit},null,2),'application/json');toast('Audit JSON downloaded.');}
 else if(a==='backup'){download('keel-workspace.json',JSON.stringify({label:'SYNTHETIC LOCAL WORKSPACE',exportedAt:new Date().toISOString(),workspace:state},null,2),'application/json');toast('Complete workspace JSON downloaded.');}
 else if(a==='recovery')download('keel-recovery.txt',corruptRaw||'No readable browser storage.','text/plain');
 else if(a==='reset')openModal('reset',head('Reset this local workspace?','This replaces all local changes with the bundled synthetic examples.')+`<div class="modal-body"><div class="notice warn">Requirements, versions, comments, and audit events created in this browser will be removed. Download a workspace JSON copy first if you need to retain them.</div><button class="btn" data-action="backup">${icon('download')}Download workspace JSON</button></div><footer class="modal-footer"><button class="btn" data-action="close">Cancel</button><button class="btn danger" data-action="confirm-reset">Reset to synthetic examples</button></footer>`,{size:'small'});
 else if(a==='confirm-reset'){state=createKeelSeed();corruptRaw=null;storageError='';selected.clear();query='';sponsor='';stage='';priority='';view='portfolio';changed('Synthetic workspace restored.');}
 }catch(err){error(err);}});
document.addEventListener('input',e=>{
 if(e.target.id==='search'){query=e.target.value;$('#portfolio-content').innerHTML=portfolioContent();}
 if(e.target.id==='import-text'){validatedImport=null;$('#import-commit').disabled=true;$('#import-preview').innerHTML='';}
});
document.addEventListener('change',async e=>{const el=e.target;
 if(el.id==='role'){role=el.value;closeModal();shell();toast(`${role} simulation active. No authentication is performed.`);}
 else if(['sponsor','stage','priority','sort'].includes(el.id)){if(el.id==='sponsor')sponsor=el.value;if(el.id==='stage')stage=el.value;if(el.id==='priority')priority=el.value;if(el.id==='sort')sort=el.value;shell();}
 else if(el.dataset.select){const id=el.dataset.select;el.checked?selected.add(id):selected.delete(id);$('#portfolio-content').innerHTML=portfolioContent();document.querySelector('[data-select="'+id+'"]')?.focus();}
 else if(el.id==='select-all'){filtered().forEach(r=>el.checked?selected.add(r.id):selected.delete(r.id));$('#portfolio-content').innerHTML=portfolioContent();$('#select-all')?.focus();}
 else if(el.id==='import-file'){const file=el.files[0];if(!file)return;validatedImport=null;$('#import-commit').disabled=true;if(file.size>1000000){$('#import-preview').innerHTML='<div class="form-error" role="alert">File exceeds the 1 MB limit.</div>';el.value='';return;}try{$('#import-text').value=await file.text();validatedImport=null;$('#import-commit').disabled=true;$('#import-preview').innerHTML='';toast(`Loaded ${file.name}. Validate the batch to continue.`);}catch{toast('Could not read the file. Try pasting its content.');}}
});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const values=Object.fromEntries(new FormData(form));try{
 if(form.id==='record-form'){const r=activeId?C.editRecord(state,activeId,values,role,values.changeNote):C.addRecords(state,[values],role)[0];changed(activeId?'New version saved.':'Draft created: '+r.id,r.id);}
 else if(form.id==='decision-form'){const r=C.transition(state,activeId,form.dataset.target,role,values.rationale,values.programReference||'');changed(`Decision recorded: ${r.status}.`,r.id);}
 else if(form.id==='comment-form'){C.comment(state,activeId,values.comment,role);persist();shell();detail(activeId,'Discussion');toast('Comment added to the record history.');}
 }catch(err){error(err);}});
document.addEventListener('keydown',e=>{if(!modalType)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const els=[...$('#overlay-root').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),summary,[tabindex="0"]')].filter(x=>x.offsetParent!==null);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){storageError='This workspace changed in another tab. Reload before making further edits to avoid overwriting that copy.';corruptRaw=e.newValue;shell();toast('Another tab changed this workspace. Reload to use that copy.');}});
shell();
})();
</script></body>
</html>
