const icons={grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',network:'M9 3h6v6H9zM2 16h6v6H2zM16 16h6v6h-6zM12 9v4M5 16v-3h14v3',pulse:'M2 12h5l3-8 4 16 3-8h5',star:'m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z',arrow:'M4 12h15M13 6l6 6-6 6',download:'M12 3v12M7 10l5 5 5-5M4 16v5h16v-5',upload:'M12 16V4M7 9l5-5 5 5M4 16v5h16v-5',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14M15 15l6 6',settings:'M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M9 15v6',chevron:'m9 5 7 7-7 7',check:'m4 12 5 5L20 6',close:'m6 6 12 12M18 6 6 18',clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',info:'M12 11v6M12 7v1M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',shield:'m12 2 8 3v7c0 5-8 10-8 10S4 17 4 12V5zM8 11l3 3 5-5',file:'M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8',reset:'M3 11a9 9 0 1 1 2 7M3 4v7h7',play:'m8 4 12 8-12 8z',pause:'M8 4v16M16 4v16',plus:'M12 4v16M4 12h16',box:'m3 7 9-5 9 5v10l-9 5-9-5zM3 7l9 5 9-5M12 12v10',trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[n]||icons.box}"/></svg>`;}
function time(s){return new Date(s).toLocaleTimeString('en-GB',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function age(m){return m<1?'<1m':m<60?Math.floor(m)+'m':Math.floor(m/60)+'h';}
function label(s){return ({operational:'Operational',degraded:'Degraded',offline:'Offline',unknown:'Unknown'})[s]||s;}
function pill(s){return `<span class="pill ${s}"><i></i>${label(s)}</span>`;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{toast('Browser storage is full or unavailable. Export to retain this session.');}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),4500);}
function filtered(){let a=ASSETS.filter(a=>{const r=TSS.reconcile(state,a.id);return (system==='all'||a.system===system)&&(!query||[a.name,a.id,a.serial,a.local,a.nsn,a.apl,...r.evidence.map(x=>x.nsn||'')].join(' ').toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||filter==='attention'&&r.attention||filter==='conflicts'&&r.conflicts.length||filter==='stale'&&r.stale.length||filter==='watch'&&state.watch.includes(a.id));});return a.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):Number(TSS.reconcile(state,b.id).attention)-Number(TSS.reconcile(state,a.id).attention));}
function resetFilters(){query='';system='all';filter='all';viewName='All equipment';}
function render(){const focus=document.activeElement?.id,pos=document.activeElement?.selectionStart;
const all=ASSETS.map(a=>TSS.reconcile(state,a.id)),conflicts=all.filter(r=>r.conflicts.length).length,stale=all.filter(r=>r.stale.length).length;
document.getElementById('app').innerHTML=`<aside class="sidebar"><a class="brand" href="#" data-action="home"><span class="brand-mark"><i></i><i></i><i></i></span><span>TSS<small>TOTAL SHIP SYSTEM</small></span></a><div class="vessel"><span class="eyebrow">SYNTHETIC VESSEL</span><b>FNS Meridian <span>013</span></b><span>Engineering systems workspace</span></div><div class="nav-label">WORKSPACE</div><nav>${[['equipment','grid','Equipment'],['relationships','network','Relationships'],['activity','pulse','Source activity'],['views','star','Saved views']].map(([id,ic,t])=>`<button class="nav-item ${page===id?'active':''}" data-page="${id}">${icon(ic)}${t}${id==='equipment'?'<small>10</small>':''}</button>`).join('')}</nav><div class="sidebar-rule"></div><div class="nav-label">MONITORING</div><button class="nav-item ${filter==='watch'&&page==='equipment'?'active':''}" data-action="watch">${icon('star')}My watchlist<small>${state.watch.length}</small></button><button class="nav-item" data-action="attention">${icon('info')}Needs attention<small>${all.filter(r=>r.attention).length}</small></button><div class="sidebar-bottom"><div class="read-only">${icon('shield')}<span>Receive. Reconcile. Review.<small>Read-only by design</small></span></div><button class="help-link" data-action="guide">Demo guide ${icon('arrow')}</button><div class="sandbox"><span class="dot"></span> LOCAL SANDBOX <b>v1.0</b></div></div></aside>
<div class="main"><header class="topbar"><div class="breadcrumb">Norfolk <span>/</span> Total Ship System</div><div class="top-right"><span class="demo-label">SYNTHETIC DATA</span><span class="clock">${icon('clock')} ${time(state.clock)} <small>UTC · DEMO CLOCK</small></span></div></header><main><section class="page-heading"><div><div class="eyebrow">CONNECTED CONTEXT. TRACEABLE EVIDENCE.</div><h1>${({equipment:'Equipment intelligence',relationships:'Everything is connected',activity:'From source to context',views:'Your view of the ship'})[page]}</h1><p>${({equipment:'One equipment identity. Every source in view.',relationships:'Follow equipment associations without losing the source.',activity:'A transparent record of every received snapshot.',views:'Keep the systems and exceptions that matter to you in focus.'})[page]}</p></div><div class="heading-actions"><button class="button" data-action="export">${icon('download')}Export</button><button class="button primary" data-action="import">${icon('plus')}Receive snapshot</button></div></section>
${page==='equipment'?`<section class="overview"><button class="overview-item" data-filter="all"><div><span class="eyebrow">CORRELATED EQUIPMENT</span><strong>10 <small>across 3 systems</small></strong></div><span class="overview-glyph">${icon('box')}</span></button><button class="overview-item" data-filter="conflicts"><div><span class="eyebrow">SOURCE DISCREPANCIES</span><strong>${conflicts} <small>need a closer look</small></strong></div><span class="overview-glyph amber">${icon('network')}</span></button><button class="overview-item" data-filter="stale"><div><span class="eyebrow">STALE EVIDENCE</span><strong>${stale} <small>equipment affected</small></strong></div><span class="overview-glyph gray">${icon('clock')}</span></button><div class="replay"><span class="eyebrow"><span class="dot"></span> SENSOR REPLAY</span><p>${playing?'Receiving synthetic events…':'Watch a changing signal'}</p><button data-action="replay" class="text-button">${icon(playing?'pause':'play')}${playing?'Pause replay':'Run 4-event replay'} ${!playing?'<span>→</span>':''}</button></div></section>
<section class="workspace"><div class="equipment-pane"><div class="section-title"><h2>${E(viewName)}</h2><button class="text-button" data-action="customize">${icon('settings')}Customize view</button></div><div class="filters"><div class="search">${icon('search')}<input id="search" aria-label="Search equipment or identifier" placeholder="Search equipment, serial, NSN…" value="${E(query)}">${query?'<button data-action="clear-search" aria-label="Clear search">×</button>':''}</div><select id="system" aria-label="Filter by system"><option value="all">All systems</option>${SYSTEMS.map(s=>`<option ${system===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="filter-tabs">${[['all','All equipment'],['attention','Needs attention'],['conflicts','Conflicts'],['watch','Watchlist']].map(([id,t])=>`<button data-filter="${id}" class="${filter===id?'active':''}">${t}</button>`).join('')}<span>${filtered().length} items</span></div><div class="equipment-list"><div class="table-header"><button data-action="sort">Equipment ${sort==='name'?'↓':'↕'}</button><span>Condition</span><span>Evidence</span></div>${assetRows()}</div><div class="table-footer"><span>${icon('shield')} Source systems are never modified</span><button class="text-button" data-action="policy">Reconciliation policy ${icon('arrow')}</button></div></div><aside class="detail-pane">${details()}</aside></section>`:page==='relationships'?relationships():page==='activity'?activity():views()}
<footer class="page-footer"><span>TSS / NORFOLK 13</span><span>Illustrative thresholds · No operational readiness certification</span><button data-action="guide">About this workspace ${icon('info')}</button></footer></main></div>`;
bind();if(focus==='search'){const el=document.getElementById(focus);if(el){el.focus();el.setSelectionRange(pos,pos);}}
}
function assetRows(){const assets=filtered();if(!assets.length)return `<div class="empty">${icon('search')}<h3>No matching equipment</h3><p>Try another identifier or clear your filters.</p><button class="button" data-action="clear-filters">Clear filters</button></div>`;return assets.map(a=>{const r=TSS.reconcile(state,a.id);return `<div class="asset-row ${selected===a.id?'selected':''}"><button class="asset-select" data-select="${a.id}" aria-label="Inspect ${a.name}" aria-pressed="${selected===a.id}"><div class="asset-main"><span class="asset-symbol">${icon(a.system===SYSTEMS[1]?'pulse':a.system===SYSTEMS[0]?'box':'network')}</span><span><b>${a.name}</b><small>${a.id} <em>·</em> ${a.system}</small></span></div><div>${pill(r.status)}</div><div class="evidence-cell">${r.conflicts.length?'<span class="conflict-label">'+r.conflicts.length+' conflict'+(r.conflicts.length>1?'s':'')+'</span>':r.stale.length?'<span class="stale-label">Stale source</span>':'<span class="aligned">'+icon('check')+' Aligned</span>'}<small>${r.evidence.length} sources</small></div></button><button class="watch-star ${state.watch.includes(a.id)?'on':''}" data-star="${a.id}" aria-label="${state.watch.includes(a.id)?'Remove':'Add'} ${a.name} ${state.watch.includes(a.id)?'from':'to'} watchlist" aria-pressed="${state.watch.includes(a.id)}">${icon('star')}</button></div>`;}).join('');}
function chart(a,r){const points=state.records.filter(x=>x.equipmentId===a.id&&x.sourceId==='sensor'&&typeof x.temperature==='number').sort((a,b)=>Date.parse(a.observedAt)-Date.parse(b.observedAt)).slice(-12);if(!points.length)return '<p class="muted">No numeric sensor history.</p>';const lo=Math.floor(Math.min(...points.map(p=>p.temperature),a.limit)-8),hi=Math.ceil(Math.max(...points.map(p=>p.temperature),a.limit)+8),y=v=>95-(v-lo)/(hi-lo)*76,x=i=>12+(Date.parse(points[i].observedAt)-Date.parse(points[0].observedAt))/(Date.parse(points.at(-1).observedAt)-Date.parse(points[0].observedAt)||1)*308;const pts=points.map((p,i)=>`${x(i)},${y(p.temperature)}`).join(' '),th=y(a.limit),last=points.at(-1);return `<div class="sensor-chart"><div class="chart-heading"><div><span class="eyebrow">${a.metric}</span><strong>${last.temperature.toFixed(1)}<small> ${a.unit}</small></strong></div><span class="${r.sensor?.stale?'stale-label':last.temperature>a.limit?'conflict-label':'aligned'}">${r.sensor?.stale?'Stale reading':last.temperature>a.limit?'Above baseline':'Within baseline'}</span></div><svg viewBox="0 0 334 125" role="img" aria-label="${a.metric}: ${points.map(p=>p.temperature).join(', ')} degrees Celsius. Illustrative threshold ${a.limit}."><path d="M12 35H322M12 65H322M12 95H322" stroke="#dfe8e5" stroke-width="1"/><path d="M12 ${th}H322" stroke="#bc884c" stroke-dasharray="4 4"/><text x="320" y="${th-5}" text-anchor="end" fill="#8e6436">${a.limit}° reference</text><path d="M${x(0)} 100 L${pts.replaceAll(' ',' L')} L${x(points.length-1)} 100Z" fill="#168778" opacity=".08"/><polyline points="${pts}" stroke="#168778" stroke-width="2.5" fill="none"/><circle cx="${x(points.length-1)}" cy="${y(last.temperature)}" r="4" fill="#168778" stroke="white" stroke-width="2"/><text x="12" y="120" fill="#687775">${time(points[0].observedAt).slice(0,5)}</text><text x="320" y="120" text-anchor="end" fill="#687775">${time(last.observedAt).slice(0,5)} UTC</text></svg><div class="chart-caption">Illustrative baseline · ${points.length} observed readings</div></div>`;}
function details(){const a=ASSETS.find(x=>x.id===selected),r=TSS.reconcile(state,a.id);return `<div class="detail-top"><div class="eyebrow">EQUIPMENT RECORD <span>${a.id}</span></div><div class="detail-title"><h2>${a.name}</h2><button class="icon-button ${state.watch.includes(a.id)?'starred':''}" data-star="${a.id}" aria-label="Toggle selected equipment watchlist">${icon('star')}</button></div><p>${a.location}</p><div class="detail-status">${pill(r.status)}<span>Consolidated from fresh evidence</span></div></div><div class="detail-tabs">${[['evidence','Evidence'],['identity','Identifiers'],['review','Review & notes']].map(([id,t])=>`<button data-detail="${id}" class="${detailTab===id?'active':''}">${t}${id==='review'&&state.notes[a.id]?'<i class="dot"></i>':''}</button>`).join('')}</div><div class="detail-body">${detailTab==='evidence'?`${r.conflicts.length?`<div class="callout"><span class="callout-icon">!</span><div><b>${r.conflicts[0].field==='Condition'?'Sources disagree on condition':'Identifier discrepancy'}</b><p>${r.conflicts[0].field==='Condition'?'The latest sensor and maintenance records report different conditions. Both are retained.':'Source NSNs differ. No preferred identifier has been asserted.'}</p></div></div>`:''}${r.stale.length?`<div class="stale-note">${icon('clock')} ${r.stale.map(x=>SOURCES[x.sourceId].name).join(', ')} evidence is stale.</div>`:''}${chart(a,r)}<div class="subhead"><h3>Source evidence</h3><span>AS OF ${time(state.clock).slice(0,5)} UTC</span></div><div class="source-list">${r.evidence.map(s=>`<button class="source-row" data-source="${s.sourceId}"><span class="source-icon" style="--source:${SOURCES[s.sourceId].color}">${icon(s.sourceId==='sensor'?'pulse':s.sourceId==='maintenance'?'settings':'box')}</span><span><b>${SOURCES[s.sourceId].name}</b><small>${s.status?label(s.status):E(s.nsn)}</small></span><span class="source-age ${s.stale?'warning':''}">${age(s.age)} ago<small>${s.stale?'STALE':'FRESH'}</small></span>${icon('chevron')}</button>`).join('')}</div><button class="relationship-link" data-action="related">${icon('network')}Part of ${E(a.parent)}<span>Explore ${icon('arrow')}</span></button>`:detailTab==='identity'?`<div class="identity-intro">One record, multiple identities.<p>Matched by exact normalized registry aliases. NSN differences remain visible.</p></div><dl class="identifiers">${[['TSS equipment ID',a.id],['Work-center identifier',a.local],['Manufacturer serial',a.serial],['Registry NSN',a.nsn],['Allowance parts list',a.apl]].map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>${r.evidence.filter(x=>x.nsn).map(s=>`<div class="identity-source"><span>${SOURCES[s.sourceId].name}</span><code>${E(s.nsn)}</code>${s.nsn!==a.nsn?'<small class="conflict-label">Differs from registry · review required</small>':''}</div>`).join('')}<p class="small muted">APL is a shared association, not a unique equipment key. Synthetic NSNs have no real catalogue meaning.</p>`:`<div class="identity-intro">Keep a local review note.<p>Notes annotate this portal only. They do not override source values or resolve source discrepancies.</p></div><label class="field-label" for="review-note">Review note</label><textarea id="review-note" maxlength="1500" placeholder="Record the discrepancy and what should be checked…">${E(state.notes[a.id]?.text||'')}</textarea><button class="button primary full" data-action="save-note">${icon('check')}Save local note</button>${state.notes[a.id]?`<p class="small muted note-time">Saved ${new Date(state.notes[a.id].at).toLocaleString('en-GB',{timeZone:'UTC'})} UTC</p><button class="text-button danger" data-action="delete-note">Remove local note</button>`:''}<div class="review-policy">${icon('shield')}<p>This is an unauthenticated local demonstration. Notes are not approvals or certified maintenance records.</p></div>`}</div>`;}
function relationships(){const a=ASSETS.find(a=>a.id===selected),related=ASSETS.filter(x=>x.system===a.system);return `<section class="relationship-workspace"><div class="relation-main"><div class="section-title"><div><h2>System relationships</h2><p class="muted small">Select a component to follow its evidence.</p></div><select id="relation-system" aria-label="Relationship system">${SYSTEMS.map(s=>`<option ${s===a.system?'selected':''}>${s}</option>`).join('')}</select></div><div class="network"><div class="network-vessel">${icon('box')} FNS MERIDIAN <span>SYNTHETIC VESSEL 013</span></div><div class="connector"></div><div class="network-system">${icon('network')}<strong>${a.system}</strong><code>${a.parent}</code></div><div class="network-branches">${related.map(item=>{const r=TSS.reconcile(state,item.id);return `<button class="network-node ${selected===item.id?'active':''}" data-select="${item.id}"><span class="node-icon">${icon('box')}</span><strong>${item.name}</strong><code>${item.id}</code>${pill(r.status)}</button>`;}).join('')}</div></div><div class="relationship-context"><div class="eyebrow">SELECTED EQUIPMENT CONTEXT</div><h3>${a.name}</h3><p>Belongs to <b>${a.parent}</b> and references allowance parts list <b>${a.apl}</b>.</p><div class="linked-assets">${a.related.map(id=>`<button data-select="${id}">${icon('network')}${id}${icon('arrow')}</button>`).join('')}</div><p class="small muted">Associations are seeded registry relationships. A component condition does not imply parent-system readiness.</p></div></div><aside class="detail-pane">${details()}</aside></section>`;}
function activity(){return `<section class="activity-layout"><div class="activity-main"><div class="section-title"><h2>Received snapshots <span class="count">${state.batches.length}</span></h2><span class="small muted">Local receipt history</span></div><div class="activity-table"><div class="activity-header"><span>Snapshot / source</span><span>Captured at (UTC)</span><span>Records</span></div>${[...state.batches].reverse().map(b=>`<button class="activity-row" data-batch="${E(b.batchId)}"><span><i class="event-dot" style="background:${SOURCES[b.sourceId].color}"></i><b>${E(b.batchId)}</b><small>${SOURCES[b.sourceId].name}</small></span><span>${E(b.capturedAt.replace('T',' ').replace('.000Z','').replace('Z',''))}</span><span>${b.count} ${icon('chevron')}</span></button>`).join('')}</div></div><aside class="source-guide"><div class="eyebrow">DATA CONTRACT</div><h2>Three feeds.<br>One traceable view.</h2><p>Snapshots are received locally and reconciled against a fixed synthetic equipment registry.</p>${Object.entries(SOURCES).map(([id,s])=>`<div class="feed-guide"><span class="source-icon" style="--source:${s.color}">${icon(id==='sensor'?'pulse':id==='maintenance'?'settings':'box')}</span><div><h3>${s.name}</h3><p>${s.description}</p><small>Freshness window: ${s.ttl<60?s.ttl+' minutes':s.ttl/60+' hours'}</small></div></div>`).join('')}<button class="button full" data-action="import">${icon('upload')}Receive a JSON snapshot</button><p class="small muted">No live connections. Nothing is sent back to a source system.</p></aside></section>`;}
function views(){return `<section class="saved-views"><div class="section-title"><h2>Saved dashboard views</h2><button class="button primary" data-action="customize">${icon('plus')}Create view</button></div>${state.views.length?state.views.map((v,i)=>`<article class="saved-view"><div class="saved-view-icon">${icon('grid')}</div><div><h3>${E(v.name)}</h3><p>${E(v.system==='all'?'All systems':v.system)} · ${E(v.filter)}${v.query?' · '+E(v.query):''}</p></div><button class="button" data-view="${i}">Open view ${icon('arrow')}</button><button class="icon-button" data-delete-view="${i}" aria-label="Delete ${E(v.name)}">${icon('trash')}</button></article>`).join(''):`<div class="empty large">${icon('grid')}<h3>A focused view for every watch</h3><p>Save a system, evidence filter, and search as a reusable dashboard.<br>Your views stay in this browser.</p><button class="button primary" data-action="customize">Create your first view</button></div>`}</section>`;}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render();if(window.innerWidth<=1050)document.querySelector('.detail-pane')?.scrollIntoView({behavior:'smooth',block:'start'});});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const id=b.dataset.star;state.watch=state.watch.includes(id)?state.watch.filter(x=>x!==id):[...state.watch,id];save();render();});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;viewName=filter==='stale'?'Stale evidence':'All equipment';render();});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detail;render();});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>showSource(b.dataset.source));document.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>showBatch(b.dataset.batch));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=state.views[+b.dataset.view];({filter,system,query}=v);viewName=v.name;page='equipment';render();});document.querySelectorAll('[data-delete-view]').forEach(b=>b.onclick=()=>{state.views.splice(+b.dataset.deleteView,1);save();render();toast('Saved view removed.');});const q=document.getElementById('search');if(q)q.oninput=()=>{query=q.value;render();};const s=document.getElementById('system');if(s)s.onchange=()=>{system=s.value;render();};const rs=document.getElementById('relation-system');if(rs)rs.onchange=()=>{selected=ASSETS.find(a=>a.system===rs.value).id;render();};}
function action(a){if(a==='home'){page='equipment';resetFilters();render();}else if(a==='watch'){page='equipment';resetFilters();filter='watch';viewName='My watchlist';render();}else if(a==='attention'){page='equipment';resetFilters();filter='attention';viewName='Needs attention';render();}else if(a==='clear-filters'){resetFilters();render();}else if(a==='clear-search'){query='';render();}else if(a==='sort'){sort=sort==='attention'?'name':'attention';render();}else if(a==='related'){page='relationships';render();}else if(a==='import'){stopReplay();render();showImport();}else if(a==='customize')showCustomize();else if(a==='export')showExport();else if(a==='policy')showPolicy();else if(a==='guide')showGuide();else if(a==='replay')toggleReplay();else if(a==='save-note'){const text=document.getElementById('review-note').value.trim();if(!text){toast('Enter a note before saving.');return;}state.notes[selected]={text,at:new Date().toISOString()};save();render();toast('Review note saved locally. Source values are unchanged.');}else if(a==='delete-note'){delete state.notes[selected];save();render();toast('Local review note removed.');}}
function modal(title,body,wide=false){document.getElementById('modal-root').innerHTML=`<dialog class="modal ${wide?'wide':''}"><div class="modal-header"><div><span class="eyebrow">TSS / LOCAL WORKSPACE</span><h2>${title}</h2></div><button class="icon-button" id="close-modal" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div></dialog>`;const d=document.querySelector('dialog');d.showModal();document.getElementById('close-modal').onclick=closeModal;d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});}
function closeModal(){document.querySelector('dialog')?.close();document.getElementById('modal-root').innerHTML='';}
function showImport(){modal('Receive a source snapshot',`<p class="intro">Match incoming records to equipment, preview changes, then receive them into this local portal. Use synthetic data only.</p><div class="import-toolbar"><button class="button" id="load-example">${icon('file')}Load pump recovery example</button><label class="button file-input">${icon('upload')}Choose JSON<input type="file" id="json-file" accept=".json,application/json"></label></div><label class="field-label" for="snapshot-json">Snapshot JSON <span>Maximum 256 KB · up to 200 records</span></label><textarea class="json-input" id="snapshot-json" spellcheck="false" placeholder='{"sourceId":"sensor","batchId":"SENSOR-NEW",…}'></textarea><div id="validation" aria-live="polite"></div><div class="modal-actions"><button class="text-button" id="sample-download">Download example</button><button class="button primary" id="validate">Validate snapshot ${icon('arrow')}</button></div>`,true);const input=document.getElementById('snapshot-json');let checked=null;
const invalidate=()=>{checked=null;document.getElementById('validation').innerHTML='';document.getElementById('validate').innerHTML='Validate snapshot '+icon('arrow');};input.oninput=invalidate;
document.getElementById('load-example').onclick=()=>{input.value=JSON.stringify(TSS.sample(state),null,2);invalidate();};document.getElementById('sample-download').onclick=()=>download('tss-sample-snapshot.json',JSON.stringify(TSS.sample(state),null,2),'application/json');
document.getElementById('json-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>262144){document.getElementById('validation').innerHTML='<div class="validation error">File exceeds 256 KB. Choose a smaller snapshot.</div>';return;}input.value=await f.text();invalidate();};
document.getElementById('validate').onclick=()=>{if(checked){try{state=TSS.ingest(state,checked);save();closeModal();render();toast(`${checked.records.length} record received. Source evidence and condition recalculated.`);}catch{toast('Snapshot could not be received. Validate it again.');}return;}const v=TSS.validate(input.value,state);const el=document.getElementById('validation');if(v.errors.length){el.innerHTML=`<div class="validation error"><b>Snapshot needs correction</b><ul>${v.errors.map(x=>`<li>${E(x)}</li>`).join('')}</ul><small>No changes were made.</small></div>`;return;}checked=v;const next=TSS.ingest(state,v);el.innerHTML=`<div class="validation success"><b>${icon('check')} ${v.records.length} record matched · ready to receive</b>${v.records.map(r=>`<div class="preview-row"><code>${r.equipmentId}</code><span>${label(TSS.reconcile(state,r.equipmentId).status)} → <b>${label(TSS.reconcile(next,r.equipmentId).status)}</b></span></div>`).join('')}<p>Source: ${SOURCES[v.payload.sourceId].name} · Captured ${time(v.payload.capturedAt)} UTC</p>${v.warnings.map(w=>`<p>${E(w)}</p>`).join('')}</div>`;document.getElementById('validate').innerHTML='Receive '+v.records.length+' record'+(v.records.length>1?'s':'')+' '+icon('check');};}
function showSource(sourceId){const a=ASSETS.find(x=>x.id===selected),s=TSS.current(state,a.id).find(x=>x.sourceId===sourceId);modal(SOURCES[sourceId].name,`<p class="intro">Source evidence for <b>${a.name}</b>. Original identifiers and values remain intact.</p><dl class="provenance"><div><dt>Received identifier</dt><dd>${E(s.identifier)}</dd></div><div><dt>Correlated equipment</dt><dd>${a.id}</dd></div><div><dt>Observed at</dt><dd>${E(s.observedAt)}</dd></div><div><dt>Snapshot</dt><dd>${E(s.batchId)}</dd></div><div><dt>Freshness</dt><dd>${s.stale?'Stale':'Fresh'} · ${age(s.age)} old · ${SOURCES[sourceId].ttl} minute window</dd></div></dl><h3 class="raw-heading">Retained source record</h3><pre>${E(JSON.stringify(state.records.find(x=>x.equipmentId===selected&&x.sourceId===sourceId&&x.observedAt===s.observedAt),null,2))}</pre><p class="small muted">Exact normalized alias match. No probabilistic identity claim.</p>`);}
function showBatch(id){const batch=state.batches.find(x=>x.batchId===id);const records=state.records.filter(x=>x.batchId===id);modal('Snapshot provenance',`<p class="intro"><b>${E(id)}</b> · ${SOURCES[batch.sourceId].name} · ${records.length} retained records</p><pre>${E(JSON.stringify({snapshot:batch,records},null,2))}</pre>`,true);}
function showCustomize(){modal('Make this view yours',`<p class="intro">Save a repeatable equipment view. Preferences stay in this browser and never change source records.</p><label class="field-label" for="view-name">View name</label><input class="form-input" id="view-name" maxlength="60" placeholder="e.g. Cooling watch"><label class="field-label" for="view-system">System</label><select class="form-input" id="view-system"><option value="all">All systems</option>${SYSTEMS.map(s=>`<option ${system===s?'selected':''}>${s}</option>`).join('')}</select><label class="field-label" for="view-filter">Show equipment</label><select class="form-input" id="view-filter">${[['all','All equipment'],['attention','Needs attention'],['conflicts','Source conflicts'],['stale','Stale evidence'],['watch','My watchlist']].map(([id,t])=>`<option value="${id}" ${filter===id?'selected':''}>${t}</option>`).join('')}</select><label class="field-label" for="view-query">Search term (optional)</label><input class="form-input" id="view-query" value="${E(query)}" maxlength="100"><div id="view-error" class="form-error" role="alert"></div><div class="modal-actions"><span class="small muted">${state.views.length} of 20 saved views</span><button class="button primary" id="save-view">Save & open view ${icon('arrow')}</button></div>`);document.getElementById('save-view').onclick=()=>{const name=document.getElementById('view-name').value.trim();if(!name||state.views.some(v=>v.name.toLowerCase()===name.toLowerCase())||state.views.length>=20){document.getElementById('view-error').textContent=!name?'Give your view a name.':state.views.length>=20?'Remove a saved view before adding another.':'A view with this name already exists.';return;}const v={name,system:document.getElementById('view-system').value,filter:document.getElementById('view-filter').value,query:document.getElementById('view-query').value.trim()};state.views.push(v);save();({system,filter,query}=v);viewName=name;page='equipment';closeModal();render();toast('Dashboard view saved.');};}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function showExport(){modal('Export a traceable record',`<p class="intro">Carry the consolidated view together with the evidence behind it. All exports are marked synthetic.</p><label class="field-label" for="export-scope">Equipment scope</label><select class="form-input" id="export-scope"><option value="filtered">Current filtered view (${filtered().length} equipment)</option><option value="selected">Selected equipment (${selected})</option><option value="all">Entire registry (10 equipment)</option></select><div class="export-option"><span>${icon('file')}</span><div><h3>Evidence report · JSON</h3><p>Conditions, identifiers, conflicts, source history, relationships, and review notes.</p></div><button class="button primary" id="export-json">Export JSON</button></div><div class="export-option"><span>${icon('grid')}</span><div><h3>Equipment summary · CSV</h3><p>A flat, spreadsheet-friendly condition and discrepancy summary.</p></div><button class="button" id="export-csv">Export CSV</button></div><p class="small muted">Export uses the frozen demo clock shown in the workspace. A zero-result filter produces an explicitly empty report.</p>`);const assets=()=>{const v=document.getElementById('export-scope').value;return v==='all'?ASSETS:v==='selected'?ASSETS.filter(a=>a.id===selected):filtered();};document.getElementById('export-json').onclick=()=>{download('tss-evidence-report.json',JSON.stringify(TSS.exportReport(state,assets()),null,2),'application/json');toast('Evidence report exported.');};document.getElementById('export-csv').onclick=()=>{const cell=v=>'"'+String(v).replaceAll('"','""')+'"';const rows=[['synthetic','reference_time','equipment_id','name','system','condition','conflicts','stale_sources','local_review'],...assets().map(a=>{const r=TSS.reconcile(state,a.id);return [true,state.clock,a.id,a.name,a.system,r.status,r.conflicts.map(c=>c.field).join('; '),r.stale.map(s=>s.sourceId).join('; '),(state.notes[a.id]?.text||'').replace(/^[=+@\-]/,"'$&")];})];download('tss-equipment-summary.csv',rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv');toast('Equipment summary exported.');};}
function showPolicy(){modal('How reconciliation works',`<div class="policy-step"><b>01</b><div><h3>Correlate exact identities</h3><p>Equipment ID, manufacturer serial, work-center identifier, and registry NSN are normalized and matched to a fixed synthetic registry. Unmatched or ambiguous input is rejected.</p></div></div><div class="policy-step"><b>02</b><div><h3>Retain the evidence</h3><p>The newest observation per equipment and source becomes current evidence. Prior observations remain in the export. Older or duplicate observations are rejected at import.</p></div></div><div class="policy-step"><b>03</b><div><h3>Make uncertainty visible</h3><p>Worst fresh reported condition wins: offline → degraded → operational. With no fresh known condition, the result is unknown. Different fresh conditions are flagged; differing current NSNs are always flagged, including stale evidence.</p></div></div><div class="policy-step"><b>04</b><div><h3>Keep freshness explicit</h3><p>Sensor: 5 minutes. Maintenance: 24 hours. Supply: 12 hours. These are illustrative windows measured against the demo clock, which advances only on imported snapshots or replay.</p></div></div><div class="callout"><div><b>Decision support, with clear limits</b><p>Temperature thresholds are illustrative. There is no ML, CAC, Active Directory, production authorization, or operational readiness certification in this demo.</p></div></div>`);}
function showGuide(){modal('A clearer picture of the ship',`<p class="intro">A handcrafted, offline demonstration of Norfolk use case #13. All vessel, equipment, identifier, and source records are synthetic.</p><ol class="guide-steps"><li><b>Inspect the pump.</b> Compare its sensor and maintenance conditions. Open each source row for timestamped provenance.</li><li><b>Follow the context.</b> Explore its chilled-water associations, then review the differing NSNs on isolation valve 03.</li><li><b>Receive a change.</b> Load the pump recovery example, validate the match, and receive it. The consolidated condition recalculates.</li><li><b>Keep your perspective.</b> Add a review note, save a dashboard view, and export evidence for handover.</li></ol><p class="small muted">Source brief: bundled harness/norfolk-snapshot.ts, ID 13. No source-system writeback, live integration, authentication, or machine learning. Browser storage is local and unencrypted. The 4-event sensor replay is explicitly simulated.</p><div class="reset-zone"><h3>Restore the demo baseline</h3><p>This removes locally received snapshots, notes, saved views, and watchlist changes. Export first if you need to keep them.</p><button class="button" id="reset-demo">${icon('reset')}Reset local demo</button><div id="reset-confirm"></div></div>`);document.getElementById('reset-demo').onclick=()=>{document.getElementById('reset-confirm').innerHTML='<div class="reset-confirm"><span>Restore the baseline and discard local changes?</span><button class="button danger" id="confirm-reset">Restore baseline</button></div>';document.getElementById('confirm-reset').onclick=()=>{stopReplay();state=TSS.seed();save();selected='CHW-P-02';detailTab='evidence';page='equipment';resetFilters();closeModal();render();toast('Synthetic baseline restored.');};};}
function stopReplay(){if(playing){clearInterval(playing);playing=null;}}
function toggleReplay(){if(playing){stopReplay();render();toast('Sensor replay paused.');return;}let ticks=0;selected='CHW-P-02';detailTab='evidence';playing=setInterval(()=>{state=TSS.replay(state);save();ticks++;if(ticks===4){stopReplay();toast('Replay complete: four synthetic sensor events received.');}render();},2200);render();toast('Replaying four synthetic pump readings.');}
render();if(storageWarning)toast(storageWarning);
</script></body></html>
