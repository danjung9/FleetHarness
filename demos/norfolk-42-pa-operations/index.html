function planning(r){const rows=selected().filter(e=>(filter==='All statuses'||e.status===filter)&&`${e.title} ${e.command} ${e.venue}`.toLowerCase().includes(search.toLowerCase()));const days=[];for(let d=new Date(p().start+'T12:00:00');d<=new Date(p().end+'T12:00:00')&&days.length<31;d.setDate(d.getDate()+1))days.push(d.toISOString().slice(0,10));const cs=conflictRows();return `${metrics(r)}<div class="planning-grid"><section class="schedule panel"><div class="section-title"><div><span class="eyebrow">THE WEEK AHEAD</span><h2>One plan. Every engagement.</h2></div><div class="segmented"><button class="${layout==='week'?'active':''}" data-layout="week">Week</button><button class="${layout==='list'?'active':''}" data-layout="list">List</button></div></div><div class="filters"><label class="search">${icon('search')}<input id="search" aria-label="Search engagements" placeholder="Find an engagement, venue, or team" value="${esc(search)}"></label><select id="status-filter" aria-label="Filter status">${['All statuses','Planned','Confirmed','Completed','Cancelled'].map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select></div>${rows.length?layout==='week'?`<div class="week-scroll"><div class="week-grid" style="--days:${days.length}">${days.map((d,i)=>`<div class="day-column"><div class="day-head"><span>${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}</span><strong>${Number(d.slice(-2))}</strong><small>${rows.filter(e=>e.date===d).length} ${rows.filter(e=>e.date===d).length===1?'visit':'visits'}</small></div><div class="day-content">${rows.filter(e=>e.date===d).sort((a,b)=>a.start.localeCompare(b.start)).map(e=>engagementCard(e)).join('')||'<div class="day-empty">Open for planning</div>'}</div></div>`).join('')}</div></div>`:`<div class="table-wrap"><table><thead><tr><th>Engagement</th><th>Schedule · ET</th><th>Status</th><th>Planned</th></tr></thead><tbody>${rows.map(e=>`<tr><td><button class="table-link" data-engagement="${e.id}">${esc(e.title)}</button><small>${esc(e.venue)}</small></td><td>${e.date.slice(5)}<small>${e.start}–${e.end}</small></td><td>${badge(e.status)}${isConflict(e.id)?'<small class="danger">Resource overlap</small>':''}</td><td>${money(e.planned)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>No matching engagements</h3><p>Try another search or add an engagement to this event.</p><button class="btn" data-action="clear-search">Clear filters</button></div>`}<div class="schedule-legend">${days.length===31&&days[30]<p().end?'<span class="danger">First 31 days shown. Use List for all engagements.</span>':''}<span><i class="dot green-dot"></i>Completed</span><span><i class="dot blue-dot"></i>Confirmed</span><span><i class="dot amber-dot"></i>Needs attention</span><span class="timezone">All times Eastern · No travel buffers</span></div></section><aside class="attention"><div class="attention-head"><span class="eyebrow">PLANNING SIGNALS</span><h2>Needs attention <span>${cs.length+(r.pending?1:0)}</span></h2></div>${cs.length?cs.map(c=>{const a=s.engagements.find(e=>e.id===c.a),b=s.engagements.find(e=>e.id===c.b);return `<div class="signal conflict"><span class="signal-kicker">${icon('alert')} RESOURCE OVERLAP</span><h3>${c.resources.length} shared resources. <br>One schedule conflict.</h3><p>${esc(a.title)} and ${esc(b.title)} overlap on ${a.date.slice(5)}.</p><div class="overlap-times"><span>${c.start}</span><i></i><span>${c.end} ET</span></div><div class="resource-tags">${c.resources.map(id=>`<span>${esc(s.resources.find(r=>r.id===id).name)}</span>`).join('')}${c.venue?'<span>Same venue</span>':''}</div><button class="text-button" data-engagement="${b.id}">Resolve conflict ${icon('arrow')}</button></div>`;}).join(''):`<div class="signal clear"><span class="signal-kicker">${icon('check')} SCHEDULE CLEAR</span><h3>Room to execute.</h3><p>No shared-resource or venue overlaps detected across the workspace.</p></div>`}<div class="signal"><span class="signal-kicker">${icon('media')} RESPONSE WORKFLOW</span><h3>${r.pending} ${r.pending===1?'inquiry awaits':'inquiries await'} review</h3><p>Keep response drafts connected to the engagements they support.</p><button class="text-button" data-view="media">Open media desk ${icon('arrow')}</button></div><button class="advance" data-action="advance">Advance demo lifecycle ${icon('arrow')}<small>Current: ${esc(p().status)}</small></button></aside></div><section class="bottom-band"><div class="band-heading"><span class="eyebrow">RESOURCES IN VIEW</span><h2>${money(r.remaining)} <span>remaining against actuals</span></h2></div><div class="budget-visual"><div class="budget-caption"><span>${money(r.actual)} recorded</span><span>${money(r.planned)} planned / ${money(r.budget)} ceiling</span></div><div class="budget-track"><i style="width:${Math.min(100,r.planned/r.budget*100)||0}%"></i><b style="width:${Math.min(100,r.actual/r.budget*100)||0}%"></b></div><span class="muted">Sample tracking only · ${selected().filter(e=>e.approval==='Review pending'&&e.status!=='Cancelled').length} resource reviews pending</span></div><button class="text-button" data-view="resources">View allocations ${icon('arrow')}</button></section>`;}
function engagementCard(e){const conflict=isConflict(e.id);return `<button class="engagement ${conflict?'has-conflict':''} ${e.status==='Completed'?'completed':''}" data-engagement="${e.id}"><span class="card-time">${e.start} — ${e.end}${conflict?icon('alert'):e.status==='Completed'?icon('check'):''}</span><strong>${esc(e.title)}</strong><span class="card-venue">${esc(e.venue)}</span><div class="card-bottom"><span>${esc(e.command)}</span><span class="crew-count">${e.resources.length}</span></div><span class="card-status">${conflict?'Resource overlap':e.status}</span></button>`;}
function resources(r){return `${metrics(r)}<section class="panel"><div class="section-title"><div><span class="eyebrow">PEOPLE, EQUIPMENT & FUNDING</span><h2>Allocation ledger</h2></div><button class="btn" data-action="new-resource">${icon('plus')}Add resource</button></div><div class="info-bar">Resource and funding reviews are local simulations. Recording a review makes no real commitment.</div><div class="table-wrap"><table><thead><tr><th>Engagement / resources</th><th>Planned</th><th>Recorded actual</th><th>Variance¹</th><th>Demo review</th></tr></thead><tbody>${selected().map(e=>`<tr><td><button class="table-link" data-engagement="${e.id}">${esc(e.title)}</button><small>${e.resources.map(id=>esc(s.resources.find(r=>r.id===id).name)).join(' · ')||'No resources assigned'}</small></td><td>${money(e.planned)}</td><td>${money(e.actual)}</td><td class="${e.actual>e.planned?'danger':''}">${money(e.planned-e.actual)}</td><td>${badge(e.approval==='Recorded demo approval'?'Approved (demo)':'Review pending')}${e.status==='Cancelled'?'<small>Excluded from rollups</small>':''}</td></tr>`).join('')||'<tr><td colspan="5">No allocations yet. Add an engagement to begin.</td></tr>'}</tbody><tfoot><tr><td>Active engagement totals</td><td>${money(r.planned)}</td><td>${money(r.actual)}</td><td>${money(r.planned-r.actual)}</td><td>${r.planned>r.budget?'Above planning ceiling':'Within planning ceiling'}</td></tr></tfoot></table></div><p class="table-note">¹ Planned less actual. This is a tracking balance, not a forecast of final savings. Cancelled engagements are excluded from active totals.</p></section><section class="resource-roster"><div class="section-title"><h2>Shared resource pool</h2><span class="muted">Workspace-wide conflict checks</span></div><div class="roster">${s.resources.map(r=>`<div><span class="resource-icon">${icon(r.type==='Vehicle'?'resource':'grid')}</span><strong>${esc(r.name)}</strong><small>${esc(r.type)} · ${s.engagements.filter(e=>e.resources.includes(r.id)&&e.status!=='Cancelled').length} assignments</small></div>`).join('')}</div></section>`;}
function media(r){const qs=s.queries.filter(q=>q.eventId===parent&&`${q.subject} ${q.outlet} ${q.owner}`.toLowerCase().includes(search.toLowerCase()));return `${metrics(r)}<section class="panel"><div class="section-title"><div><span class="eyebrow">INQUIRY → REVIEW → COVERAGE</span><h2>A connected media record</h2></div><label class="search">${icon('search')}<input id="search" aria-label="Search inquiries" placeholder="Search inquiries or outlets" value="${esc(search)}"></label></div><div class="table-wrap"><table><thead><tr><th>Media inquiry</th><th>Action desk</th><th>Deadline · ET</th><th>Response stage</th><th></th></tr></thead><tbody>${qs.map(q=>`<tr><td><span class="record-id">${esc(q.id)}</span><button class="table-link" data-query="${q.id}">${esc(q.subject)}</button><small>${esc(q.outlet)} · ${esc(q.engagementId)}</small></td><td>${esc(q.owner)}</td><td>${q.deadline.slice(5,10)}<small>${q.deadline.slice(11)}</small></td><td>${badge(q.stage)}</td><td><button class="icon-btn" data-query="${q.id}" aria-label="Review ${esc(q.id)}">${icon('arrow')}</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No matching inquiries. Add one to start the response workflow.</div></td></tr>'}</tbody></table></div></section><section class="coverage-section"><div class="section-title"><div><span class="eyebrow">CLOSED-LOOP STORYTELLING</span><h2>Earned media</h2></div><button class="btn" data-action="new-coverage">${icon('plus')}Log coverage</button></div><div class="coverage-grid">${s.coverage.filter(c=>c.eventId===parent).map(c=>`<button class="coverage-card" data-coverage="${c.id}"><span class="coverage-top">${esc(c.outlet)} ${badge(c.sentiment)}</span><h3>${esc(c.title)}</h3><div class="coverage-numbers"><strong>${number(c.reach)}<small>estimated reach</small></strong><span>${c.messageIncluded?'✓ Key message present':'— No key message tag'}</span></div><div class="coverage-foot">${esc(c.queryId)} <span>${c.date.slice(5)} ${icon('arrow')}</span></div></button>`).join('')||'<div class="empty">No coverage logged. Link a clipping to an inquiry to build the after-action record.</div>'}</div><p class="table-note">All outlets and clippings are fictional. Reach is a gross, non-deduplicated estimate; sentiment and key-message presence are manual tags.</p></section>`;}
function brief(r){const max=Math.max(r.coverage,1);return `<div class="brief-layout"><section class="brief-paper"><div class="brief-mast"><span>HARBOR / EXECUTIVE WORKING BRIEF</span><span>${esc(parent)}</span></div><div class="brief-title"><span class="eyebrow">AFTER-ACTION / ${r.completed===r.engagements&&r.engagements?'EXECUTION RECORDED':'INTERIM'}</span><h2>A week of engagement.<br>A connected account.</h2><p>${esc(p().name)} · ${dates(p().start,p().end)}</p></div><div class="brief-summary"><span class="label">EXECUTION SNAPSHOT</span><p><strong>${r.completed} of ${r.engagements} engagements completed</strong>, with ${number(r.attendance)} recorded attendees. ${r.coverage} linked coverage records carry an estimated gross reach of ${number(r.reach)}. ${r.conflicts?r.conflicts+' scheduling conflict pair requires attention.':'No resource or venue overlaps are currently detected.'}</p></div><div class="brief-two"><div><span class="label">BUDGET EXECUTION</span><strong class="big-number">${money(r.actual)}</strong><p>recorded of ${money(r.budget)} planning ceiling</p><div class="budget-track"><b style="width:${Math.min(100,r.actual/r.budget*100)||0}%"></b></div><small>${money(r.planned)} total planned · tracking only</small></div><div><span class="label">COVERAGE SENTIMENT</span><div class="sentiment"><i style="width:${r.positive/max*100}%"></i><i style="width:${r.neutral/max*100}%"></i><i style="width:${r.negative/max*100}%"></i></div><div class="sentiment-legend"><span>Positive <b>${r.positive}</b></span><span>Neutral <b>${r.neutral}</b></span><span>Negative <b>${r.negative}</b></span></div><small>Manually tagged · ${r.messages}/${r.coverage} include key message</small></div></div><h3>Decisions & follow-through</h3><div class="brief-finding"><span>01</span><p>${r.conflicts?'Reconcile shared crews and transport before the next engagement.':'Maintain the deconflicted schedule; confirm travel time separately.'}</p></div><div class="brief-finding"><span>02</span><p>${r.pending?`Finish ${r.pending} pending response reviews in the simulated approval workflow.`:'All local response review stages are complete. No statement has been released.'}</p></div><div class="brief-finding"><span>03</span><p>Validate outlet reach estimates and attendance logs before using this brief for real decisions.</p></div><div class="brief-caveat">SYNTHETIC DEMONSTRATION · NOT FOR RELEASE<br>Live rollup of local sample records. Gross reach may overlap between outlets. Attendance counts visits, not unique people. This working brief does not certify completion or approval.</div></section><aside class="brief-aside"><div class="eyebrow">READY TO REVIEW</div><h2>From activity<br>to an account.</h2><p>This brief recalculates from the current event’s engagements, funding records, inquiries and coverage.</p><button class="btn primary" data-action="export-brief">${icon('download')}Export brief · Markdown</button><div class="brief-source"><h3>Source record chain</h3><div><strong>01</strong>Parent event<small>${esc(parent)}</small></div><div><strong>02</strong>Engagements & allocations<small>${r.engagements} active records</small></div><div><strong>03</strong>Media & response reviews<small>${r.queries} inquiries · ${r.approved} approved in demo</small></div><div><strong>04</strong>Earned coverage<small>${r.coverage} source-linked records</small></div></div><button class="text-button" data-action="advance">Advance demo lifecycle ${icon('arrow')}</button></aside></div>`;}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;search='';render();});document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;render();});document.querySelectorAll('[data-engagement]').forEach(b=>b.onclick=()=>editEngagement(b.dataset.engagement));document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>editQuery(b.dataset.query));document.querySelectorAll('[data-coverage]').forEach(b=>b.onclick=()=>editCoverage(b.dataset.coverage));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.preventDefault();action(b.dataset.action);});$('#parent-select')?.addEventListener('change',e=>{parent=e.target.value;search='';render();});$('#status-filter')?.addEventListener('change',e=>{filter=e.target.value;render();});$('#search')?.addEventListener('input',e=>{const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);});}
function modal(title,kicker,body,submit,onSubmit){const d=$('#dialog');d.innerHTML=`<form id="edit-form"><div class="modal-head"><div><span class="eyebrow">${kicker}</span><h2>${title}</h2></div><button type="button" class="icon-btn close-modal" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}<p class="form-error" role="alert" id="form-error"></p></div><div class="modal-foot"><button type="button" class="btn close-modal">Cancel</button>${submit?`<button class="btn primary" type="submit">${submit}</button>`:''}</div></form>`;d.querySelectorAll('.close-modal').forEach(b=>b.onclick=()=>d.close());$('#edit-form').onsubmit=e=>{e.preventDefault();try{onSubmit?.(new FormData(e.target),e.submitter);}catch(err){$('#form-error').textContent=err.message;}};d.showModal();}
function field(label,name,value,type='text',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function select(label,name,value,options){return `<label class="field">${label}<select name="${name}">${options.map(x=>{let [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`;}).join('')}</select></label>`;}
function commit(next,msg){const errors=PAO.validate(next);if(errors.length)throw Error(errors.join(' '));s=next;$('#dialog').close();save(msg);}
function uid(prefix,arr){let n=1;while(arr.some(x=>x.id===prefix+'-'+String(n).padStart(3,'0')))n++;return prefix+'-'+String(n).padStart(3,'0');}
function editEngagement(id){if(!p())return editEvent();const existing=s.engagements.find(e=>e.id===id),e=existing||{id:uid('ENG',s.engagements),eventId:parent,title:'',command:'NAVCO',venue:'',date:p().start,start:'09:00',end:'10:00',status:'Planned',planned:0,actual:0,attendance:0,approval:'Review pending',resources:[]};modal(existing?'Engagement detail':'Add an engagement',esc(e.id)+' / '+esc(parent),`<div class="info-bar">Edit the plan to resolve overlapping resource or venue assignments. Times are Eastern.</div>${field('Engagement title','title',e.title,'text','required maxlength="120"')}<div class="form-grid">${field('Participating command','command',e.command,'text','required')}${field('Venue','venue',e.venue,'text','required')}${field('Date','date',e.date,'date',`required min="${p().start}" max="${p().end}"`)}${select('Status','status',e.status,['Planned','Confirmed','Completed','Cancelled'])}${field('Start · ET','start',e.start,'time','required')}${field('End · ET','end',e.end,'time','required')}</div><h3 class="form-section">Assigned resources</h3><div class="resource-checks">${s.resources.map(r=>`<label><input type="checkbox" name="resources" value="${esc(r.id)}" ${e.resources.includes(r.id)?'checked':''}><span>${esc(r.name)}<small>${esc(r.type)}</small></span></label>`).join('')}</div><h3 class="form-section">Funding & outcomes</h3><div class="form-grid">${field('Planned amount · USD','planned',e.planned,'number','min="0" step="0.01" required')}${field('Recorded actual · USD','actual',e.actual,'number','min="0" step="0.01" required')}${field('Recorded attendance','attendance',e.attendance,'number','min="0" step="1" required')}${select('Demo resource review','approval',e.approval,['Review pending','Recorded demo approval'])}</div><p class="muted">Review selection is a local simulation, not an authorization or commitment. Attendance is included in the brief only when completed.</p>`,'Save engagement',fd=>{const next=structuredClone(s),v={...e,...Object.fromEntries(fd),resources:fd.getAll('resources'),planned:Number(fd.get('planned')),actual:Number(fd.get('actual')),attendance:Number(fd.get('attendance'))};if(existing)next.engagements[next.engagements.findIndex(x=>x.id===id)]=v;else next.engagements.push(v);commit(next,'Engagement saved. Schedule and rollups recalculated.');});}
function editEvent(id){const e=s.events.find(e=>e.id===id)||{id:uid('NW',s.events),name:'',location:'',start:'2026-11-09',end:'2026-11-13',budget:0,lead:'NAVCO planning cell',status:'Requested'};modal(id?'Parent event settings':'Create parent event',esc(e.id),`${field('Event name','name',e.name,'text','required')}${field('Location','location',e.location,'text','required')}<div class="form-grid">${field('Start date','start',e.start,'date','required')}${field('End date','end',e.end,'date','required')}${field('Planning ceiling · USD','budget',e.budget,'number','min="0" step="0.01" required')}${field('Planning lead / desk','lead',e.lead,'text','required')}</div><p class="muted">New events begin as Requested. Use the lifecycle control after deconfliction and review. Schedule views support up to 31 days; longer events can be browsed in List view.</p>`,'Save parent event',fd=>{const next=structuredClone(s),v={...e,...Object.fromEntries(fd),budget:Number(fd.get('budget'))};if(id)next.events[next.events.findIndex(x=>x.id===id)]=v;else next.events.push(v);const errors=PAO.validate(next);if(errors.length)throw Error(errors.join(' '));parent=v.id;commit(next,'Parent event saved.');});}
function editQuery(id){if(!selected().length){toast('Add an engagement to this event before creating an inquiry.');return;}const existing=s.queries.find(q=>q.id===id),q=existing||{id:uid('MQ',s.queries),eventId:parent,engagementId:selected()[0].id,subject:'',outlet:'',owner:'PA desk Alpha',deadline:p().start+'T12:00',draft:'',stage:'Drafting'};const ix=PAO.chops.indexOf(q.stage);modal(existing?'Review media inquiry':'New media inquiry',esc(q.id)+' / LOCAL REVIEW SIMULATION',`${badge(q.stage)}<div class="review-stages">${PAO.chops.map((x,i)=>`<span class="${i<=ix?'done':''}">${i<ix?'✓':i+1} ${x}</span>`).join('')}</div>${field('Inquiry subject','subject',q.subject,'text','required')}<div class="form-grid">${field('Outlet / channel','outlet',q.outlet,'text','required')}${field('Assigned action desk','owner',q.owner,'text','required')}${select('Linked engagement','engagementId',q.engagementId,selected().map(e=>[e.id,e.title]))}${field('Response deadline · ET','deadline',q.deadline,'datetime-local','required')}</div><label class="field">Draft response <textarea name="draft" rows="6" placeholder="Write a fictional response for review…">${esc(q.draft)}</textarea></label><p class="muted">${ix===3?'Editing approved content restarts the local review at Drafting.':'Save a draft before advancing through SME and Flag review. Changing reviewed content restarts at Drafting.'} No statement is sent or released.</p>${ix<3?`<button type="submit" class="btn" name="advance" value="yes">${icon('check')}Save & advance to ${PAO.chops[ix+1]}</button>`:''}`,'Save draft', (fd,button)=>{const next=structuredClone(s),v={...q,...Object.fromEntries(fd)};if(button?.name==='advance'){if(!v.draft.trim())throw Error('Enter a response draft before advancing the review.');v.stage=existing&&ix>0&&['draft','subject','outlet','engagementId'].some(k=>v[k]!==q[k])?'Drafting':PAO.chops[ix+1];}else if(existing&&['draft','subject','outlet','engagementId'].some(k=>v[k]!==q[k]))v.stage='Drafting';if(existing)next.queries[next.queries.findIndex(x=>x.id===id)]=v;else next.queries.push(v);commit(next,'Inquiry saved. No response was released.');});}
function editCoverage(id){const qs=s.queries.filter(q=>q.eventId===parent);if(!qs.length){toast('Create a linked media inquiry before logging coverage.');return;}const existing=s.coverage.find(c=>c.id===id),c=existing||{id:uid('COV',s.coverage),eventId:parent,queryId:qs[0].id,title:'',outlet:'',date:p().start,sentiment:'Neutral',reach:0,messageIncluded:false,source:''};modal(existing?'Coverage source record':'Log earned coverage',esc(c.id)+' / MANUAL OBSERVATION',`${field('Story / clipping title','title',c.title,'text','required')}${field('Outlet','outlet',c.outlet,'text','required')}${select('Originating inquiry','queryId',c.queryId,qs.map(q=>[q.id,q.id+' · '+q.subject]))}<div class="form-grid">${field('Publication date','date',c.date,'date','required')}${select('Manual sentiment tag','sentiment',c.sentiment,['Positive','Neutral','Negative'])}${field('Estimated gross reach','reach',c.reach,'number','min="0" step="1" required')}<label class="field">Key message presence<select name="messageIncluded"><option value="true" ${c.messageIncluded?'selected':''}>Present</option><option value="false" ${!c.messageIncluded?'selected':''}>Not tagged</option></select></label></div>${field('Source reference / provenance','source',c.source,'text','required placeholder="Synthetic clipping reference or exercise note"')}<p class="muted">Reach is summed without deduplication. Use fictional exercise records only.</p>`,'Save coverage',fd=>{const next=structuredClone(s),v={...c,...Object.fromEntries(fd),reach:Number(fd.get('reach')),messageIncluded:fd.get('messageIncluded')==='true'};if(existing)next.coverage[next.coverage.findIndex(x=>x.id===id)]=v;else next.coverage.push(v);commit(next,'Coverage linked. Brief recalculated.');});}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Export created: '+name);}
function action(a){if(a==='home'){view='planning';render();}if(a==='new-engagement')editEngagement();if(a==='edit-event')editEvent(parent);if(a==='new-event')editEvent();if(a==='new-query')editQuery();if(a==='new-coverage')editCoverage();if(a==='clear-search'){search='';filter='All statuses';render();}if(a==='export')download('harbor-workspace.json',JSON.stringify(s,null,2),'application/json');if(a==='export-brief')download(parent+'-after-action.md',PAO.brief(s,parent),'text/markdown');if(a==='advance'){const r=PAO.transition(s,parent);if(r.error)toast(r.error);else{p().status=r.status;save('Demo lifecycle advanced to '+r.status+'.');}}
if(a==='new-resource')modal('Add shared resource','WORKSPACE RESOURCE POOL',`${field('Resource name','name','','text','required')}${select('Resource type','type','MC crew',['MC crew','Outreach','Vehicle','Performance','Other'])}`,'Add resource',fd=>{const next=structuredClone(s);next.resources.push({id:uid('RES',s.resources),...Object.fromEntries(fd)});commit(next,'Resource added to the shared pool.');});
if(a==='import'){modal('Import a workspace','JSON / VALIDATED RELATIONSHIPS',`<p>Replace this browser’s workspace with a validated JSON export. Export current work first if you want to keep it.</p><label class="field">Choose JSON file<input type="file" id="json-file" accept=".json,application/json"></label><label class="field">Or paste workspace JSON<textarea id="import-json" name="json" rows="11" placeholder='{"schemaVersion":1,"events":[…],…}' required></textarea></label><button type="button" class="text-button" id="load-example">Load sample workspace</button><label class="check-line"><input type="checkbox" required> Replace the current local workspace</label>`,'Validate & import',fd=>{const parsed=PAO.parse(fd.get('json'));if(parsed.errors.length)throw Error(parsed.errors.slice(0,7).join(' '));parent=parsed.state.events[0]?.id||'';commit(parsed.state,'Workspace imported. All record links validated.');});$('#load-example').onclick=()=>$('#import-json').value=JSON.stringify(SEED,null,2);$('#json-file').onchange=async e=>{const file=e.target.files[0];if(file){if(file.size>2000000){$('#form-error').textContent='Use a JSON file smaller than 2 MB.';return;}$('#import-json').value=await file.text();}};}
if(a==='help'){modal('A small desk. A connected plan.','NORFOLK CASE 042',`<p>HARBOR is a handcrafted, offline demonstration of a public affairs planning workspace. All names, outlets, schedules and financial records are synthetic.</p><ol class="guide"><li><b>Resolve a scheduling conflict.</b> Open the Riverwalk performance and move its start to 12:00 and end to 13:30. Shared-resource overlap disappears.</li><li><b>Review the media response.</b> In Media desk, open MQ-043 and advance its draft through Flag Review and demo approval.</li><li><b>Log the outcome.</b> Edit a completed engagement’s recorded attendance or add a linked coverage record.</li><li><b>Export the account.</b> Open After-action brief and export the recalculated Markdown record.</li></ol><div class="info-bar">Local-only storage. No Flank Speed, identity, synchronization, publishing or financial connection. Review controls simulate a human workflow and provide no production security. Time conflicts use exact overlap; travel time is not modeled.</div><h3>Reset the demonstration</h3><p>Reset replaces locally edited records with the original sample. Export your workspace first to preserve edits.</p><label class="check-line"><input type="checkbox" name="confirm" required> Replace local changes with the original sample</label>`,'Reset demo',()=>{s=structuredClone(SEED);parent=s.events[0].id;view='planning';search='';filter='All statuses';layout='week';notice='';$('#dialog').close();save('Original sample restored.');});}}
render();
})();
</script></body></html>
