function selectOptions(items,value){return Object.entries(items).map(([k,v])=>`<option value="${k}" ${value===k?'selected':''}>${v}</option>`).join('');}
function queryBuilder(config,isMission){return `<div class="query-controls"><label class="field"><span>Group by</span><select data-query="group">${selectOptions({region:'Region',category:'Category',status:'Delivery status'},config.group)}</select></label><label class="field"><span>Measure</span><select data-query="metric">${selectOptions(C.METRICS,config.metric)}</select></label><label class="field"><span>Include</span><select data-query="filter">${selectOptions({all:'All records',open:'Open requests',fulfilled:'Fulfilled requests',needs_review:'Missing delivery values'},config.filter)}</select></label><label class="field"><span>Sort values</span><select data-query="sort">${selectOptions({desc:'Highest first',asc:'Lowest first'},config.sort)}</select></label></div><div class="query-summary">GROUP ${esc(config.group)} · MEASURE ${esc(config.metric)} · FILTER ${esc(config.filter)} · SORT ${esc(config.sort.toUpperCase())}</div>${btn('Run analysis',isMission?'run-mission-query':'run-query','dark','play')}`;}
function resultHTML(result){if(!result)return `<div class="empty">${icon('chart')}<h3>Your question, made visible.</h3>Choose a grouping and a measure, then run your analysis.</div>`;const max=Math.max(...result.results.map(r=>r.value||0),1);return `<div class="section-title" style="margin-top:23px"><h2>Query results</h2><span>${result.rows} SOURCE ROWS</span></div>${result.results.length?`<div class="result-layout"><div class="bar-chart" role="img" aria-label="${esc(C.METRICS[result.config.metric])} by ${esc(result.config.group)}">${result.results.slice(0,12).map(x=>`<div class="chart-row"><span title="${esc(x.label)}">${esc(x.label.length>12?x.label.slice(0,11)+'…':x.label)}</span><div class="chart-track"><div class="chart-fill" style="width:${(x.value||0)/max*100}%"></div></div><span class="chart-value">${C.format(x.value,result.config.metric)}</span></div>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>${esc(result.config.group)}</th><th>${esc(C.METRICS[result.config.metric])}</th><th>Rows</th></tr></thead><tbody>${result.results.map(x=>`<tr><td>${esc(x.label)}</td><td class="numeric">${C.format(x.value,result.config.metric)}</td><td class="numeric">${x.rows}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty">No records match this filter. Select all records and run again.</div>'}<p class="summary-line">${result.results.length>12?'Chart shows the first 12 sorted groups; the table and CSV include every group. ':''}${result.config.metric==='rate'?'Rate = sum(delivered) ÷ sum(requested) × 100, using complete pairs. ':result.config.metric==='outstanding'?'Outstanding = sum(requested − delivered), using complete pairs. ':result.config.metric==='missing'?'Missing = count of blank delivered values; these records are retained. ':''}${result.missing} record${result.missing===1?'':'s'} with missing delivery values in this selection.</p>${btn('Export result CSV','export-results','','download')}`;}
function missionTwo(){const p=progress(),a=p.drafts[2]||{},target=C.expected(state.role);return `<section class="panel"><h2>${C.ROLES[state.role].question}</h2><p>Build an analysis on Delivery requests v1.0. All calculations run locally on the 24 bundled records.</p>${queryBuilder(p.config,true)}${resultHTML(p.result)}</section><form id="mission-form"><section class="panel"><h2>Make a finding from your result.</h2><p>Run an analysis, then identify the group and its value.</p><label class="field"><span>Which ${C.ROLES[state.role].group} answers the mission question?</span><select name="answer"><option value="">Select a group…</option>${selectOptions(Object.fromEntries(target.results.map(x=>[x.label,x.label])),a.answer)}</select></label><label class="field"><span>${C.METRICS[C.ROLES[state.role].metric]}${C.ROLES[state.role].metric==='rate'?' (%)':''}</span><input type="number" name="value" min="0" step="0.1" placeholder="Enter the result value" value="${esc(a.value)}"><small>For a percentage, use one decimal place. Do not enter the % symbol.</small></label><button class="btn primary" type="submit">Check my analysis ${icon('arrow')}</button></section></form>${feedbackHTML()}`;}
function missionThree(){const p=progress(),a=p.drafts[3]||{},r=C.ROLES[state.role],top=C.expected(state.role).results[0],complete=p.completed[3];return `<section class="panel"><h2>Your evidence, ready for review.</h2><p>Review the conclusion before making it part of your brief.</p><div class="evidence"><b>Finding</b> · ${esc(top.label)} — ${C.format(top.value,r.metric)} ${esc(C.METRICS[r.metric].toLowerCase())}</div><div class="evidence"><b>Source</b> · Delivery requests v1.0 · synthetic snapshot · 05 Nov 2026</div><div class="evidence"><b>Method</b> · ${esc(r.metric)} grouped by ${esc(r.group)} · all records</div><div class="evidence"><b>Quality note</b> · 3 of 24 records have unknown delivered values.</div></section><form id="mission-form"><section class="panel"><h2>Write a brief someone can use.</h2><label class="field"><span>How should delivery arithmetic handle missing values?</span><select name="policy"><option value="">Choose a policy…</option>${selectOptions({exclude:'Exclude incomplete pairs; disclose the missing values',zero:'Treat missing delivered values as zero',guess:'Fill missing values with a guessed average'},a.policy)}</select></label><label class="field"><span>What does this dataset support?</span><select name="scope"><option value="">Choose a claim scope…</option>${selectOptions({snapshot:'An observation about this synthetic snapshot',trend:'A long-term performance trend',cause:'The cause of delayed deliveries'},a.scope)}</select></label><label class="field"><span>Your finding and recommendation</span><textarea name="brief" maxlength="3000" placeholder="Name the group, explain your finding, and disclose the missing values and synthetic scope…">${esc(a.brief)}</textarea><small>At least 60 characters. The rubric checks the group, missing-data caveat, and synthetic scope; it is not a semantic fact-check.</small></label><div class="button-row">${btn('Insert a draft to review','draft-brief','','book','type="button"')}<button class="btn primary" type="submit">Review & publish brief ${icon('check')}</button></div></section></form>${feedbackHTML()}${complete?`<section class="panel"><span class="tag green">Published locally · ${new Date(complete.completedAt).toLocaleDateString()}</span><div class="review-brief">${esc(complete.answers.brief)}</div><p class="tiny">Published revision is preserved until a new submission passes the rubric. Export includes the verified query evidence and caveats.</p><div class="button-row">${btn('Export brief (.md)','export-brief','dark','download')}${btn('Export evidence (.json)','export-evidence','','download')}</div></section>`:''}`;}
function missionPage(){const [t,d]=missionData[mission-1];return `<div class="mission-header"><button class="text-button" data-nav="home">${icon('back')}Back to your path</button><div class="eyebrow">MISSION ${String(mission).padStart(2,'0')} / 03 · ${C.ROLES[state.role].name.toUpperCase()} · 100 XP</div><h1>${t}</h1><p>${d}</p><div class="steps">${missionData.map((m,i)=>`<span class="${mission===i+1?'active':''}">${progress().completed[i+1]?'✓':String(i+1).padStart(2,'0')} ${['Explore','Analyze','Publish'][i]}</span>`).join(`${icon('chevron')}`)}</div></div><div class="mission-layout"><div>${mission===1?missionOne():mission===2?missionTwo():missionThree()}</div>${hints()}</div>`;}
function activeRows(){return workSource==='imported'&&state.imported?state.imported.rows:C.DATA;}
function workbench(){return `<div class="page-heading"><div><h1>Follow your own question.</h1><p>A small, real workbench for your next useful answer.</p></div>${btn('Sample CSV','download-data','','download')}</div><div class="mission-layout"><div><section class="panel"><h2>Data explorer</h2><p>Practice independently. Workbench activity does not complete scored missions.</p><label class="field"><span>Active source</span><select id="work-source"><option value="bundled">Delivery requests v1.0 · bundled synthetic data</option>${state.imported?`<option value="imported" ${workSource==='imported'?'selected':''}>${esc(state.imported.name)} · imported practice data</option>`:''}</select></label>${datasetPreview(activeRows())}</section><section class="panel"><h2>Build an analysis</h2><p>Explore grouped results. Complete pairs are used for delivery arithmetic.</p>${queryBuilder(workConfig,false)}${resultHTML(workResult)}</section></div><aside><div class="side-panel"><div class="eyebrow">Bring a practice dataset</div><h3>Try a variation.</h3><p>Download the sample, edit a few values, and import it here. Use synthetic data only.</p><div class="upload-box"><label for="csv-upload">Import CSV · up to 5,000 rows</label><input id="csv-upload" type="file" accept=".csv,text/csv"></div>${importError?`<div class="notice error" role="alert">${icon('info')}${esc(importError)}</div>`:''}${state.imported?`<div class="notice success">${icon('check')}Loaded ${state.imported.rows.length} rows from ${esc(state.imported.name)}.</div>${btn('Remove imported data','remove-import','','close')}`:''}<p class="tiny">Required fields and order: request_id, region, category, requested, delivered, days_open. Missing delivered values may be blank.</p><hr><button class="text-button" data-nav="guide">See data and measure definitions ${icon('arrow')}</button></div><div class="notice">${icon('shield')}Imported data stays in this browser. It never changes the scored training dataset.</div></aside></div>`;}
function achievements(){const p=progress(),r=C.ROLES[state.role],awards=[['Source scout','Inspect the source, identify its grain, and count missing delivery values.',!!p.completed[1],'database'],['Evidence builder','Run the right analysis and identify a finding backed by its result.',!!p.completed[2],'chart'],[r.badge,'Complete all three missions and publish a brief with its limitations.',!!p.completed[3],'award']];return `<div class="page-heading"><div><h1>Skills earned, not just collected.</h1><p>Every achievement is backed by completed work on your ${r.name.toLowerCase()} path.</p></div><button class="text-button" data-action="export-progress">${icon('download')}Export progress</button></div><div class="achievement-banner"><div class="badge-outline">${icon('award')}</div><div><h3>${done()===3?'Foundation complete. Well earned.':'Your evidence is your progress.'}</h3><p>${done()*100} XP earned · ${done()} of 3 missions completed · ${p.attempts.length} submissions</p><span class="tiny">No points for page views. Each completed mission awards 100 XP once.</span></div></div><div class="earned-grid">${awards.map(([t,d,earned,ic],i)=>`<article class="achievement ${earned?'earned':''}"><div class="badge-outline">${icon(ic)}</div><h3>${t}</h3><p>${d}</p><span class="tag ${earned?'green':''}">${earned?'Earned · 100 / 100':'Locked · complete mission '+(i+1)}</span></article>`).join('')}</div><section class="panel" style="margin-top:22px"><h2>Your submission record</h2><p>Retries are part of learning. Scores below reflect each submission, not points added.</p>${p.attempts.length?`<div class="table-wrap"><table><thead><tr><th>Mission</th><th>Score</th><th>Outcome</th><th>Submitted</th></tr></thead><tbody>${p.attempts.slice().reverse().map(a=>`<tr><td>${esc(missionData[a.mission-1]?.[0]||'Unknown')}</td><td class="numeric">${esc(a.score)} / 100</td><td>${a.passed?'Completed':'Try again'}</td><td>${esc(new Date(a.at).toLocaleString())}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No submissions yet. Start your first mission to put a skill into practice.</div>'}</section>${btn(done()===3?'Explore the workbench':'Continue your path',done()===3?'go-workbench':'start-mission','primary')}`;}
function guide(){return `<div class="page-heading"><div><h1>A field guide for useful data.</h1><p>The definitions, boundaries, and shortcuts behind this training space.</p></div></div><div class="guide-grid"><section class="panel"><h3>01 / Know your source</h3><p><b>Delivery requests v1.0</b> is a handcrafted synthetic snapshot dated 05 Nov 2026. Its 24 rows represent individual requests across four fictional regions and three equipment categories. All records are invented for this exercise.</p><ul><li><code>request_id</code> · unique request identifier</li><li><code>region</code>, <code>category</code> · grouping labels</li><li><code>requested</code>, <code>delivered</code> · unit counts</li><li><code>days_open</code> · elapsed days in this snapshot</li></ul><p>The equipment inventory card in mission 1 is a reference catalog distractor, not a second bundled dataset.</p></section><section class="panel"><h3>02 / Understand the measures</h3><ul><li><b>Outstanding units:</b> sum of requested minus delivered on complete rows.</li><li><b>Fulfillment rate:</b> total delivered divided by total requested on complete rows, multiplied by 100. This is a weighted rate.</li><li><b>Missing delivery values:</b> count of blank delivered fields.</li><li><b>Requested units:</b> includes all selected rows. <b>Delivered units:</b> sums known values.</li><li><b>Record count:</b> includes incomplete rows.</li></ul><p>A rate with a zero denominator is shown as N/A. Missing delivery values are never silently converted to zero.</p></section><section class="panel"><h3>03 / Learn by demonstrating</h3><p>Choose Data analyst, Data engineer, or Mission lead. Each role has a different analytical question and a separate saved path. Missions unlock sequentially after a 100/100 submission. Each one awards 100 XP once, even when repeated.</p><p>Mission 3 uses a transparent rule-based writing rubric. It checks claim scope, missing-data policy, group name, minimum length, and caveat words. The export pairs your wording with verified computed evidence; the rubric cannot guarantee prose quality.</p></section><section class="panel"><h3>04 / Your local practice space</h3><p>There is no account, cloud sync, AI service, or connection to a live enterprise platform. Browser storage saves progress and imported practice data on this origin. Exports preserve a portable record; they cannot be imported as earned progress.</p><p>Use sample CSV headers unchanged. Request IDs must be unique; numeric values must be whole numbers between 0 and 1,000,000. Only delivered may be blank. A delivered count cannot exceed the requested count.</p><div class="button-row">${btn('Download sample CSV','download-data','','download')}${btn('Export progress','export-progress','','download')}</div></section></div><section class="panel" style="margin-top:20px"><h3>About this demonstration</h3><p>Waypoint is a handcrafted, offline demonstration for Norfolk catalogue case #52, “Gamified Onboarding Framework for Data Plaforms.” It demonstrates role-based learning and practical data exploration. It does not implement Databricks Genie, enterprise platform integrations, production identity, or security controls. It is not AppYard-generated or AppYard-verified.</p><div class="reset-panel"><div><b>Start this role’s path again</b><p>Clears ${C.ROLES[state.role].name.toLowerCase()} progress, drafts, and submissions. Other roles and imported data are preserved.</p></div>${resetRequested?`<div class="button-row">${btn('Confirm reset','confirm-reset','primary','reset')}${btn('Cancel','cancel-reset','','close')}</div>`:btn('Reset this path','reset','','reset')}</div></section>`;}
function render(){document.title=`${title()} · Waypoint`;$('#app').innerHTML=shell(page==='home'?home():page==='mission'?missionPage():page==='workbench'?workbench():page==='achievements'?achievements():guide());}
function getAnswers(){const form=$('#mission-form');return form?Object.fromEntries(new FormData(form)):{};}
function keepDraft(){if(page==='mission'){progress().drafts[mission]=getAnswers();save();}}
function resultCSV(result){const header=[result.config.group,C.METRICS[result.config.metric],'source_rows','missing_delivery_rows'];return [header,...result.results.map(x=>[x.label,x.value===null?'':x.value,x.rows,x.missing])].map(row=>row.map(x=>'"'+(/^[=+@\-\t\r]/.test(String(x))?"'":'')+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')+'\n';}
function exportRecord(){return {product:'Waypoint data academy',useCaseId:52,synthetic:true,version:1,exportedAt:new Date().toISOString(),role:state.role,roleName:C.ROLES[state.role].name,xp:done()*100,completedMissions:done(),source:{name:'Delivery requests',version:'1.0',snapshot:'2026-11-05',provenance:'Handcrafted synthetic training records',rows:24,missingDeliveryValues:3},progress:progress(),limitations:['Local practice only; no authentication or enterprise integrations.','Mission 3 uses a transparent keyword and selection rubric, not semantic fact checking.','Browser state is not a tamper-proof certification.']};}
async function action(name){
 const p=progress();if(page==='mission')keepDraft();
 if(name==='start-mission')return openMission(nextMission());
 if(name==='next-mission')return openMission(Math.min(3,mission+1));
 if(name==='go-workbench')return nav('workbench');if(name==='go-achievements')return nav('achievements');
 if(name==='download-data')return download('waypoint-delivery-requests.csv',C.csv(C.DATA),'text/csv');
 if(name==='export-progress')return download(`waypoint-${state.role}-progress.json`,JSON.stringify(exportRecord(),null,2));
 if(name==='export-evidence')return download(`waypoint-${state.role}-evidence.json`,JSON.stringify(exportRecord(),null,2));
 if(name==='export-brief'){const a=p.completed[3]?.answers;if(!a)return notify('Complete mission 3 to publish a brief.');const r=C.ROLES[state.role],t=C.expected(state.role).results[0];return download(`waypoint-${state.role}-brief.md`,`# Delivery request brief\n\nRole: ${r.name}\nPublished: ${p.completed[3].completedAt}\n\n## Learner brief\n\n${a.brief}\n\n## Computed evidence\n\n${r.question}\n${t.label}: ${C.format(t.value,r.metric)} ${C.METRICS[r.metric]}\nMethod: ${r.metric} grouped by ${r.group}, all records.\n\nSource: Delivery requests v1.0, synthetic snapshot 2026-11-05.\n24 records; 3 unknown delivered values. Incomplete pairs are excluded from delivery arithmetic and retained in missing-value counts. This snapshot does not establish a trend or cause.\n\nHandcrafted Norfolk #52 demonstration; local rubric, not a credential.\n`,'text/markdown');}
 if(name==='hint'){hint=!hint;render();return;}
 if(name==='run-mission-query'){p.result=C.query(C.DATA,p.config);feedback=null;save();render();notify('Analysis complete. Read your result, then submit your finding.');return;}
 if(name==='run-query'){workResult=C.query(activeRows(),workConfig);render();notify(`Analysis complete: ${workResult.results.length} groups from ${workResult.rows} rows.`);return;}
 if(name==='export-results'){const result=page==='mission'?p.result:workResult;if(result)return download('waypoint-query-results.csv',resultCSV(result),'text/csv');return notify('Run an analysis first.');}
 if(name==='draft-brief'){const r=C.ROLES[state.role],t=C.expected(state.role).results[0];p.drafts[3]={...getAnswers(),brief:`${t.label} has ${C.format(t.value,r.metric)} ${C.METRICS[r.metric].toLowerCase()} in this synthetic training snapshot. ${r.action} Three records have missing delivered values. Delivery arithmetic excludes incomplete pairs, so confirm these values before drawing an operational conclusion.`};save();render();notify('Draft inserted. Review the wording and complete the policy choices.');return;}
 if(name==='remove-import'){state.imported=null;workSource='bundled';workResult=null;importError='';save();render();notify('Imported practice data removed.');return;}
 if(name==='reset'){resetRequested=true;render();return;}if(name==='cancel-reset'){resetRequested=false;render();return;}if(name==='confirm-reset'){delete state.progress[state.role];save();notify('This role’s learning path has been reset.');return nav('home');}
}
document.addEventListener('click',e=>{const navEl=e.target.closest('[data-nav]');if(navEl){keepDraft();nav(navEl.dataset.nav);return;}const missionEl=e.target.closest('[data-mission]');if(missionEl){openMission(+missionEl.dataset.mission);return;}const b=e.target.closest('[data-action]');if(b){e.preventDefault();action(b.dataset.action);}});
document.addEventListener('input',e=>{if(e.target.id==='data-search'){search=e.target.value;const rows=page==='workbench'?activeRows():C.DATA;const filtered=rows.filter(r=>Object.values(r).some(v=>String(v??'missing').toLowerCase().includes(search.toLowerCase())));$('#data-rows').innerHTML=tableRows(filtered);$('#record-count').textContent=`${filtered.length} of ${rows.length} records`;return;}if(e.target.closest('#mission-form'))keepDraft();});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='role'){keepDraft();state.role=t.value;save();nav('home');notify(`${C.ROLES[state.role].name} path selected. Progress is saved separately.`);return;}
 if(t.dataset.query){const config=page==='mission'?progress().config:workConfig;config[t.dataset.query]=t.value;if(page==='mission'){keepDraft();progress().result=null;feedback=null;save();}else workResult=null;render();return;}
 if(t.id==='work-source'){workSource=t.value;workResult=null;search='';render();return;}
 if(t.id==='csv-upload'){const file=t.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Use a CSV smaller than 1 MB.');const text=await file.text(),rows=C.parseCSV(text);state.imported={name:file.name,csv:C.csv(rows),rows};workSource='imported';workResult=null;search='';importError='';save();notify(`${rows.length} practice rows imported successfully.`);}catch(err){importError=err.message;}render();return;}
 if(t.closest('#mission-form'))keepDraft();
});
document.addEventListener('submit',e=>{if(e.target.id!=='mission-form')return;e.preventDefault();const a=getAnswers(),p=progress();p.drafts[mission]=a;feedback=mission===1?C.scoreMission1(a):mission===2?C.scoreMission2(state.role,a,p.result):C.scoreMission3(state.role,a);const at=new Date().toISOString();p.attempts.push({mission,score:feedback.score,passed:feedback.passed,at});p.attempts=p.attempts.slice(-100);if(feedback.passed){p.completed[mission]={score:100,answers:a,completedAt:at,query:mission===2?p.result:mission===3?C.expected(state.role):null};}save();render();$('#feedback')?.scrollIntoView({behavior:'smooth',block:'center'});});
render();
})();
</script></body></html>
