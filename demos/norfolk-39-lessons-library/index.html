iv>`:''}${!storageOK&&!recovery?'<div class="alert">Local saving is unavailable. Export your work before closing.</div>':''}${state.view==='brief'?briefPage():researchPage()}</div><footer><span>FOLIO / NORFOLK 39</span><span>Local reference date: 05 NOV 2026 · No live JLLIS connection</span></footer></main></div>`;

on="search">${icon('search')}Find relevant lessons ${icon('arrow')}</button></div></section>`}<div class="research-grid"><section class="results-panel" aria-label="Ranked lessons"><div class="results-head"><div><h2>${library?'Source records':'Relevant lessons'} <span>${list.length}</span></h2><small>${library?'Sorted by local relevance':'Ranked for your observation'} <button data-action="method" class="text-button" aria-label="Explain ranking">${icon('info')}</button></small></div><div class="filters"><select id="evidenceFilter" aria-label="Filter by evidence">${option(['All evidence','Practice tested','Observation'],state.evidence)}</select><select id="recencyFilter" aria-label="Filter by recency"><option value="Any date" ${state.recency==='Any date'?'selected':''}>Any date</option><option value="12" ${state.recency==='12'?'selected':''}>Last 12 months</option><option value="24" ${state.recency==='24'?'selected':''}>Last 24 months</option></select></div></div><div class="result-list">${list.length?list.map((x,i)=>resultCard(x,i)).join(''):`<div class="empty"><span class="empty-icon">${icon('search')}</span><h3>No lessons match this view.</h3><p>Try a broader observation or clear the evidence and date filters.</p><button class="button" data-action="clear-filters">Clear filters</button><button class="text-button" data-action="scenario" data-scenario="cyber">Load the access-review example</button></div>`}</div><div class="results-foot">${icon('info')}Match scores explain retrieval. They do not establish applicability.</div></section><aside class="inspector" aria-label="Selected lesson">${list.length?detail():`<div class="empty"><h3>Your evidence appears here.</h3><p>Choose a lesson from the results to inspect its source and capture your review.</p></div>`}</aside></div>`;

b>Original input:</b> ${esc(e.input)}</p><p><b>Context:</b> ${esc(e.context.domain)} / ${esc(e.context.environment)} · Local match ${e.match.score}/100</p></details></article>`).join(''):`<div class="empty brief-empty"><span class="empty-icon">${icon('file')}</span><h3>Your judgment starts the brief.</h3><p>Review a lesson, adapt the practice if needed, and choose “Include in brief.” Its source travels with it.</p><button class="button primary" data-action="nav" data-view="research">Find lessons ${icon('arrow')}</button></div>`}<div class="paper-bottom">All source records are fictional. No authoritative requirements are asserted.</div></section><aside class="brief-rail"><h3>Review trail</h3><p>Your decisions in this workspace.</p><div class="review-stat"><strong>${brief.entries.length}</strong><span>lessons in this brief</span></div><div class="mini-stats"><span><b>${brief.entries.filter(x=>x.decision==='adapted').length}</b> adapted</span><span><b>${rejected}</b> set aside</span><span><b>${records().length-reviewed()}</b> unreviewed</span></div><div class="trace-line">${icon('link')}Every included lesson retains its exact excerpt, source date, and reviewer feedback.</div><h4>What gets exported</h4><ul><li>Your recommendation and notes</li><li>Source citations and full excerpts</li><li>Applicability limits</li><li>Original input and match breakdown</li><li>Accepted and set-aside feedback</li></ul><button class="button full" data-action="export" ${!brief.entries.length?'disabled':''}>${icon('down')}Choose export format</button><p class="small-note">Saved in this browser. Export a copy to carry the work with you.</p></aside></div>`;

function takeReview(id,decision){const r=records().find(r=>r.id===id),action=document.querySelector('#actionText').value.trim(),note=document.querySelector('#reviewNote').value.trim();if(!action){toast('Add a recommendation before saving the review.');document.querySelector('#actionText').focus();return;}const x=C.rank(records(),q(),state,true).find(x=>x.record.id===id);if(!x){toast('Search again to refresh this match.');return;}const adapted=action!==r.practice;state.reviews[id]={decision:decision==='accepted'&&adapted?'adapted':decision,action,note,reviewedAt:new Date().toISOString(),input:q()||'Library browse without an assessment observation.',context:{domain:state.domain,environment:state.environment},match:{score:x.score,parts:x.parts,matched:x.matched,concepts:x.concepts}};save();render();toast(decision==='accepted'?'Lesson included. Its source and your feedback are attached.':decision==='rejected'?'Lesson set aside. Feedback retained.':'Feedback saved for later.');}
function importDialog(){modal('Bring your own synthetic input',`<p class="modal-intro">Add an observation or extend the local lesson library. Files stay on this device.</p><div class="import-sections"><section><h3>Assessment observation</h3><p>Plain text, up to 6,000 characters. It becomes your search input.</p><label class="file-picker">${icon('file')}Choose a .txt file<input id="observationFile" type="file" accept=".txt,text/plain"></label></section><section><h3>Lesson records</h3><p>Structured JSON, up to 64 KB. New IDs are added together; invalid imports change nothing.</p><label class="file-picker">${icon('book')}Choose a .json file<input id="libraryFile" type="file" accept=".json,application/json"></label><button class="text-button" data-action="sample-import">Download sample format ${icon('down')}</button></section></div><p class="input-error" id="importError" role="alert"></p><div class="modal-foot">Synthetic data only. Browser storage is local and is not encrypted.</div>`,true);
document.querySelector('#observationFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>24000)throw Error('Use a text file containing no more than 6,000 characters.');const txt=(await f.text()).trim(),err=C.validateObservation(txt);if(err)throw Error(err);state.query=state.draft=txt;state.view='research';state.evidence='All evidence';state.recency='Any date';selectFirst();save();closeModal();render();toast('Observation imported and matched against the local library.');}catch(err){document.querySelector('#importError').textContent=err.message;e.target.value='';}});

case 'sample-import':download('folio-sample-library.json',JSON.stringify({schema:'folio.library.v1',records:[sampleRecord()]},null,2),'application/json');break;
case 'download-library':download('folio-synthetic-library.json',JSON.stringify({schema:'folio.library.v1',records:records()},null,2),'application/json');break;
case 'export':modal('Carry the evidence forward.',`<p class="modal-intro">Export ${included()} reviewed lesson${included()===1?'':'s'}, with exact excerpts, original inputs, scoring and your feedback.</p><div class="export-options"><button data-action="export-md">${icon('file')}<span><b>Readable brief</b><small>Markdown · source-linked narrative</small></span>${icon('down')}</button><button data-action="export-json">${icon('layers')}<span><b>Structured evidence</b><small>JSON · full records and review trail</small></span>${icon('down')}</button></div><div class="modal-foot">Draft decision support. No authoritative requirement or operational approval is implied.</div>`);break;
case 'export-md':case 'export-json':{const brief=C.makeBrief(records(),state.reviews,{title:state.briefTitle,summary:state.briefSummary});if(!brief.entries.length)break;const json=b.dataset.action==='export-json';download(`folio-lessons-brief.${json?'json':'md'}`,json?JSON.stringify(brief,null,2):C.markdown(brief),json?'application/json':'text/markdown');closeModal();break;}
case 'reset':modal('Reset this local workspace?',`<p class="modal-intro">This removes your imported records, review decisions and brief edits from this browser. The twelve sample sources will remain. Export your brief first if you need a copy.</p><div class="modal-actions"><button class="button" data-action="close-modal">Keep working</button><button class="button danger" data-action="confirm-reset">Reset workspace</button></div>`);break;
case 'confirm-reset':try{localStorage.removeItem(KEY);}catch{}location.reload();break;
case 'close-modal':closeModal();break;
}});
render();
})();
</script></body></html>
