function datum(field){const f=C.fact(state.sources,state.selected,field);return `<div class="datum"><dt>${escape(C.fields[field])}</dt><dd class="${f.status==='sourced'?'':'unknown'}">${escape(f.value)} ${cite(f.citations)}</dd>${f.status==='conflict'?'<small>Conflicting captured records</small>':''}</div>`;}
function vesselArt(){return `<svg class="vessel-art" viewBox="0 0 340 100" fill="none" aria-hidden="true"><path d="M7 78h325 M29 68h273l-21 19H56Z" stroke="currentColor" stroke-width="1.5"/><path d="M60 67V42h25v25 M65 42V29h14v13 M89 67V49h38v18 M132 67V49h38v18 M175 67V49h38v18 M218 67V49h38v18 M75 29V14 M68 18h14 M45 62h14 M263 61h23" stroke="currentColor" stroke-width="1.5"/><path d="M2 95h48m8 0h200m9 0h71" stroke="currentColor" opacity=".35"/><path d="M15 13v8m-4-4h8 M313 31v8m-4-4h8" stroke="currentColor" opacity=".35"/></svg>`;}
function render(){const c=current(),sources=selectedSources(),held=sources.filter(s=>s.identityMatch==='name-only'),d=draft();
$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('compass')}</span><span>BEARING<small>CONTACT INTELLIGENCE</small></span></div><div class="workspace-label">WORKSPACE <span>01</span></div><nav aria-label="Workspace"><button data-action="tab" data-tab="brief" class="nav-item ${tab==='brief'?'active':''}">${icon('doc')}Contact brief</button><button data-action="tab" data-tab="trail" class="nav-item ${tab==='trail'?'active':''}">${icon('stack')}Source library <span>${state.sources.length}</span></button></nav><div class="sidebar-label">CONTACTS IN THIS EXERCISE</div><div class="contacts">${state.contacts.map((v,i)=>`<button class="contact ${v.imo===state.selected?'selected':''}" data-action="choose" data-id="${v.imo}"><span class="contact-dot"></span><strong>${escape(v.name)}</strong><small>${escape(v.imo)}<br>${escape(v.type)}</small>${v.imo===state.selected?'<span class="contact-selected">IN BRIEF</span>':''}</button>`).join('')}</div><button class="new-contact" data-action="resolve">${icon('search')} Resolve an identifier</button><div class="sidebar-bottom"><div class="local-status"><span></span>Local evidence workspace</div><p>No live feeds connected.<br>Fictional vessels. Synthetic sources.</p><button data-action="scope">${icon('info')} Method & scope</button></div></aside><div class="main"><header class="topbar"><div><span>Contact intelligence</span><span class="slash">/</span><strong>Brief workspace</strong></div><div class="topbar-right"><span class="demo-pill">SYNTHETIC DEMO</span><span class="local-date">05 NOV 2026</span></div></header><main><div class="heading-row"><div><div class="eyebrow">NORFOLK / CASE 20 <span>·</span> EVIDENCE-BACKED BRIEFING</div><h1>${escape(c.name)}</h1><p class="contact-subtitle">${escape(C.fact(state.sources,state.selected,'type').value)}<span>•</span>${escape(C.fact(state.sources,state.selected,'flag').value)} registry ${cite(C.fact(state.sources,state.selected,'type').citations)}<span class="id-label">${escape(c.imo)}</span></p></div><div class="heading-actions"><button class="btn" data-action="resolve">${icon('search')} Find a contact</button><button class="btn dark" data-action="import">${icon('plus')} Add source</button></div></div><div class="identity-bar"><span class="identity-mark">${icon('check')}</span><div><strong>Identity selected by demo IMO</strong><span>Same name, two vessels. This brief uses ${escape(c.imo)}.</span></div><button data-action="resolve">Review match ${icon('arrow')}</button></div>${storageWarning?`<div class="notice error">${escape(storageWarning)}</div>`:''}<div class="viewbar"><div class="view-tabs" role="tablist"><button role="tab" aria-selected="${tab==='brief'}" class="${tab==='brief'?'active':''}" data-action="tab" data-tab="brief">The brief</button><button role="tab" aria-selected="${tab==='trail'}" class="${tab==='trail'?'active':''}" data-action="tab" data-tab="trail">Evidence trail <span>${sources.length}</span></button></div><button class="btn export-btn" data-action="export">${icon('download')} Export brief</button></div>${tab==='brief'?briefHtml():trailHtml()}<footer class="page-footer"><span>${icon('compass')} BEARING <b>·</b> Evidence before interpretation</span><span>Handcrafted local demo <b>·</b> All times UTC</span></footer></main></div></div>`;
}
function briefHtml(){const c=current(),s=selectedSources(),d=draft(),excluded=d.excluded||[],acts=C.factsFor(s,c.imo,'activity');return `<div class="brief-layout"><article class="paper"><div class="paper-header"><div><div class="eyebrow">CONTACT BRIEF <span>/</span> ${escape(c.imo)}</div><h2>${escape(d.title||'Contact brief')}</h2></div><button class="text-button" data-action="edit">${icon('edit')} Edit brief</button></div><div class="registry-block"><div class="registry-title"><div><span class="section-kicker">REGISTRY IDENTITY</span><h3>${escape(c.name)}</h3><p>Attributed by the identifier in captured records.</p></div>${vesselArt()}</div><dl class="identity-grid">${['type','flag','owner','callsign','mmsi','length'].filter(f=>!excluded.includes(f)).map(datum).join('')}</dl></div><section class="brief-section"><div class="section-heading"><span>01</span><h3>Recorded activity</h3><span class="section-caption">OBSERVATIONS</span></div>${!excluded.includes('destination')?`<div class="destination">Reported destination <strong>${escape(C.fact(s,c.imo,'destination').value)}</strong>${cite(C.fact(s,c.imo,'destination').citations)}<small>A reported destination does not confirm arrival.</small></div>`:''}${excluded.includes('activity')?'<p class="muted">Activity omitted from this brief. Edit the brief to include it.</p>':acts.length?`<div class="journey ${acts.length>4?'long':''}" style="--stops:${acts.length}">${acts.map((a,i)=>`<button class="journey-stop" data-action="source" data-id="${a.sourceId}" data-quote="${escape(a.quote)}"><span class="journey-time">${date(a.observedAt)}</span><span class="journey-node">${icon(i===0?'ship':i===acts.length-1?'doc':'compass')}</span><span class="journey-text">${escape(a.value)}</span><span class="journey-ref">${a.sourceId} ${icon('arrow')}</span></button>`).join('')}</div>`:'<div class="empty compact">No identifier-linked movement records.<br><strong>Current location: UNKNOWN</strong></div>'}</section><section class="brief-section"><div class="section-heading"><span>02</span><h3>Gaps to carry forward</h3><span class="section-caption">UNRESOLVED</span></div><div class="gaps">${['beneficialOwner','cargo','sanctions'].filter(f=>!excluded.includes(f)).map(f=>{const v=C.fact(s,c.imo,f);return `<div><span>${C.fields[f]}</span><strong class="${v.status==='sourced'?'':'unknown'}">${escape(v.value)}</strong>${cite(v.citations)}<small>${v.status==='conflict'?'Captured records disagree.':v.status==='sourced'?'Statement from captured record.':f==='sanctions'?'Name-only result is unattributed.':f==='cargo'?'No manifest in the source set.':'Not established by registered ownership.'}</small></div>`;}).join('')}</div>${s.some(s=>s.identityMatch==='name-only')?`<button class="caveat" data-action="source" data-id="${s.find(s=>s.identityMatch==='name-only').id}">${icon('info')}<span><strong>Name match held apart.</strong> A screening bulletin cannot identify this vessel.</span>${icon('arrow')}</button>`:''}</section><section class="brief-section interpretation"><div class="section-heading"><span>03</span><h3>Analyst interpretation</h3><button class="text-button" data-action="edit">${icon('edit')}</button></div><p>${escape(d.note||'No interpretation entered. Use Edit brief to add an analyst note.').replace(/\n/g,'<br>')}</p><small>Analyst-authored · Not independently verified · ${d.updatedAt?'Edited '+date(d.updatedAt)+' UTC':'Exercise starting assessment'}</small></section><div class="paper-foot"><span>${icon('doc')} ${s.filter(s=>s.identityMatch==='identifier').length} identifier-linked sources</span><span>Unknown does not mean cleared.</span></div></article><aside class="evidence-rail"><div class="rail-title"><div><div class="eyebrow">CAPTURED RECORDS</div><h2>The source trail</h2></div><span class="count-circle">${s.length}</span></div><p class="rail-intro">Follow each statement back to the record. Ordered by observation time.</p><div class="rail-timeline">${s.map((source,i)=>`<button class="rail-source ${source.identityMatch==='name-only'?'held':''}" data-action="source" data-id="${source.id}"><span class="rail-dot"></span><span class="rail-time">${date(source.observedAt)} UTC</span><strong>${escape(source.title)}</strong><span class="rail-meta">${source.id} <b>·</b> ${escape(source.kind)}</span>${source.identityMatch==='name-only'?'<span class="held-label">Identity unresolved</span>':''}<span class="source-arrow">${icon('arrow')}</span></button>`).join('')}</div><button class="all-evidence" data-action="tab" data-tab="trail">Explore evidence ${icon('arrow')}</button><div class="rail-note">${icon('stack')}<div><strong>Captured, never silently replaced.</strong><p>Original text and timestamps travel with every export. Imported sources append to the record.</p></div></div></aside></div>`;}
function trailHtml(){const list=C.trail(state.sources,state.selected,filter,trailQuery);return `<section class="library"><div class="library-heading"><div><div class="eyebrow">CHRONOLOGICAL EVIDENCE</div><h2>Every record has a source.</h2><p>Observation time orders the trail. Capture time records when the snapshot was saved.</p></div><button class="text-button" data-action="import">${icon('plus')} Add captured source</button></div><div class="filterbar"><label class="search-field">${icon('search')}<input id="trail-query" type="search" value="${escape(trailQuery)}" placeholder="Search titles, text or publishers" aria-label="Search source trail"></label><label class="kind-filter">${icon('filter')}<select id="kind-filter" aria-label="Filter by source type">${['All',...C.kinds].map(k=>`<option ${filter===k?'selected':''}>${k}</option>`).join('')}</select></label><span id="result-count">${list.length} records</span></div><div id="source-results">${sourceRows(list)}</div></section>`;}
function sourceRows(list){return list.length?list.map(s=>`<button class="source-row" data-action="source" data-id="${s.id}"><span class="source-row-date"><strong>${date(s.observedAt,true)}</strong><small>${s.observedAt.slice(11,16)} UTC</small></span><span class="source-kind-icon">${icon(s.kind==='AIS sample'?'compass':'doc')}</span><span class="source-row-content"><span class="rail-meta">${s.id} <b>·</b> ${escape(s.kind)} <b>·</b> ${escape(s.publisher)}</span><strong>${escape(s.title)}</strong><small>Captured ${date(s.capturedAt)} UTC</small></span><span class="match-tag ${s.identityMatch==='identifier'?'linked':'held'}">${s.identityMatch==='identifier'?'Identifier linked':'Name only · held apart'}</span>${icon('arrow')}</button>`).join(''):`<div class="empty">${icon('search')}<h3>No matching records</h3><p>Try a different phrase or clear the source filters.</p><button class="btn" data-action="clear-filter">Clear filters</button></div>`;}
function dialog(html,kind=''){lastFocus=document.activeElement;$('#modal-root').innerHTML=`<dialog class="modal ${kind}" aria-labelledby="dialog-title">${html}</dialog>`;const el=$('dialog');el.showModal();el.addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();});el.addEventListener('click',e=>{if(e.target===el){const r=el.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)el.close();}});}
const closeButton=()=>`<button class="icon-button" data-action="close" aria-label="Close dialog">${icon('close')}</button>`;
function close(){if($('dialog')?.open)$('dialog').close();}
function openSource(id,quote=''){const s=state.sources.find(s=>s.id===id);if(!s)return;let text=escape(s.text);if(quote&&s.text.includes(quote))text=text.replace(escape(quote),`<mark>${escape(quote)}</mark>`);dialog(`<header class="modal-header"><div><div class="eyebrow">SOURCE SNAPSHOT / ${s.id}</div><h2 id="dialog-title">${escape(s.title)}</h2></div>${closeButton()}</header><div class="source-detail"><span class="match-tag ${s.identityMatch==='identifier'?'linked':'held'}">${s.identityMatch==='identifier'?'Identifier linked · '+escape(s.vesselId):'Name only · identity unresolved'}</span><dl class="source-metadata"><div><dt>Publisher</dt><dd>${escape(s.publisher)}</dd></div><div><dt>Source type</dt><dd>${escape(s.kind)}</dd></div><div><dt>Observed</dt><dd>${escape(s.observedAt)}</dd></div><div><dt>Captured</dt><dd>${escape(s.capturedAt)}</dd></div></dl>${s.identityMatch==='name-only'?'<div class="notice">This name-only record is held apart from factual claims. It does not establish this vessel’s sanctions status.</div>':''}<div class="text-heading"><span>ORIGINAL CAPTURED TEXT</span><span>SYNTHETIC</span></div><pre class="snapshot">${text}</pre><div class="source-statements"><h3>Linked statements</h3>${s.facts.length?s.facts.map(f=>`<button data-action="highlight" data-id="${s.id}" data-quote="${escape(f.quote)}"><span>${C.fields[f.field]}</span><strong>${escape(f.value)}</strong>${icon('arrow')}</button>`).join(''):'<p>No attributed statements. This source is retained for the identity caveat.</p>'}</div><div class="fingerprint"><span>SHA-256 · CAPTURED TEXT</span><code>${escape(s.sha256||'Unavailable in this browser')}</code><p>A local integrity fingerprint, not external authentication. Browser storage can be changed outside the application.</p></div></div><footer class="modal-footer"><span>Preserved source · Read only</span><button class="btn" data-action="download-source" data-id="${s.id}">${icon('download')} Download snapshot</button></footer>`,'drawer');}
function openResolve(q='Aster Meridian'){resolutionQuery=q;candidate='';dialog(`<header class="modal-header"><div><div class="eyebrow">IDENTITY RESOLUTION</div><h2 id="dialog-title">A name is only the start.</h2></div>${closeButton()}</header><div class="modal-body"><p class="modal-lead">Search by vessel name, demo IMO, demo MMSI or call sign. Select a specific registry record to keep same-name contacts apart.</p><label class="resolve-search">${icon('search')}<input id="resolve-query" aria-label="Vessel name or identifier" value="${escape(q)}" placeholder="Try Aster Meridian or DEMO-9001001" autocomplete="off"></label><div id="resolve-results">${resolveResults()}</div></div><footer class="modal-footer"><span id="resolution-hint">Select a registry record to continue.</span><button class="btn dark" data-action="confirm-contact" disabled>Use this contact ${icon('arrow')}</button></footer>`);$('#resolve-query').focus();$('#resolve-query').select();}
function resolveResults(){const r=C.resolveContacts(resolutionQuery,state.contacts);return `<div class="resolve-result-label">${r.length?r.length+' matching records':'No matches'} ${r.length>1?'<span>Same name · different identifiers</span>':''}</div>`+(r.length?r.map(c=>`<button class="candidate ${candidate===c.imo?'chosen':''}" data-action="candidate" data-id="${c.imo}"><span class="radio">${candidate===c.imo?'●':''}</span><span><strong>${escape(c.name)}</strong><small>${escape(c.type)} · ${escape(c.flag)}</small><code>${escape(c.imo)} / ${escape(c.mmsi)}</code></span><span class="candidate-match">${c.match}</span></button>`).join(''):'<div class="empty compact"><h3>No contact in this local source set</h3><p>Try “Aster”, “XDM101” or a complete demo identifier.</p></div>');}
function openEdit(){const d=draft();dialog(`<header class="modal-header"><div><div class="eyebrow">EDITABLE BRIEF</div><h2 id="dialog-title">Make the assessment yours.</h2></div>${closeButton()}</header><form id="edit-form"><div class="modal-body"><label class="field-label" for="brief-title">Brief title</label><input id="brief-title" required maxlength="90" value="${escape(d.title||'Contact brief')}"><label class="field-label" for="analyst-note">Analyst interpretation <span>Separate from sourced observations</span></label><textarea id="analyst-note" maxlength="2500" rows="6" placeholder="Add your interpretation, uncertainties, and next research questions.">${escape(d.note)}</textarea><p class="field-help">This text is labeled as analyst interpretation in the brief and all exports. It does not become a verified fact.</p><fieldset><legend>Include in the brief</legend><div class="check-grid">${['type','flag','owner','callsign','mmsi','length','destination','activity','beneficialOwner','cargo','sanctions'].map(f=>`<label><input type="checkbox" name="include" value="${f}" ${!(d.excluded||[]).includes(f)?'checked':''}>${C.fields[f]}</label>`).join('')}</div></fieldset><p class="field-help">Captured statements remain read only; all original sources remain in the evidence export.</p></div><footer class="modal-footer"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn dark" type="submit">${icon('check')} Save brief</button></footer></form>`);}
function openImport(){dialog(`<header class="modal-header"><div><div class="eyebrow">APPEND TO THE SOURCE SET</div><h2 id="dialog-title">Add a captured source.</h2></div>${closeButton()}</header><div class="modal-body"><p class="modal-lead">Import a synthetic JSON snapshot. Each statement must quote the source exactly, and identifier-linked text must contain its demo vessel ID.</p><div class="import-tools"><button class="btn" data-action="load-example">Load example</button><label class="btn file-button">${icon('plus')} Choose JSON file<input id="source-file" type="file" accept=".json,application/json"></label><span>or drop a file below</span></div><label class="field-label" for="source-json">Source JSON <span>Maximum 100 KB</span></label><textarea id="source-json" class="code-input" rows="13" spellcheck="false" placeholder='{"id":"SRC-008","title":"…","facts":[…]}'></textarea><div id="import-errors" role="alert"></div><p class="field-help">Existing IDs cannot be replaced. A citation confirms the excerpt exists, not that its statement is true. Use fictional data only.</p></div><footer class="modal-footer"><span>Local import · No upload</span><button class="btn dark" data-action="import-submit">${icon('plus')} Validate & add source</button></footer>`,'import-modal');$('#source-json').addEventListener('dragover',e=>e.preventDefault());$('#source-json').addEventListener('drop',async e=>{e.preventDefault();if(e.dataTransfer.files[0])await readFile(e.dataTransfer.files[0]);});}
async function readFile(f){if(f.size>102400){$('#import-errors').innerHTML='<div class="notice error">File exceeds the 100 KB limit.</div>';return;}$('#source-json').value=await f.text();$('#import-errors').innerHTML='';}
async function importSource(){const raw=$('#source-json').value;if(new TextEncoder().encode(raw).length>102400){$('#import-errors').innerHTML='<div class="notice error">Source JSON exceeds the 100 KB limit.</div>';return;}const result=C.validateSource(raw,state.sources.map(s=>s.id),state.contacts.map(c=>c.imo));if(!result.ok){$('#import-errors').innerHTML=`<div class="notice error"><strong>Source not added</strong><ul>${result.errors.map(e=>`<li>${escape(e)}</li>`).join('')}</ul></div>`;return;}const s=result.source;s.sha256=await C.digest(s.text);state.sources.push(s);save();close();render();toast(`${s.id} added. Original sources preserved.`);}
function openExport(){const p=C.buildExport(state);dialog(`<header class="modal-header"><div><div class="eyebrow">PORTABLE, WITH PROVENANCE</div><h2 id="dialog-title">Take the evidence with you.</h2></div>${closeButton()}</header><div class="modal-body"><p class="modal-lead">Export the current brief for ${escape(p.contact.name)} (${escape(p.contact.imo)}), including your assessment and its original source set.</p><div class="export-options"><button data-action="download-md">${icon('doc')}<span><strong>Brief + citations</strong><small>Markdown · Editable text, linked source appendix</small></span>${icon('download')}</button><button data-action="download-json">${icon('stack')}<span><strong>Complete evidence package</strong><small>JSON · Statements, original snapshots, timestamps & hashes</small></span>${icon('download')}</button><button data-action="print">${icon('print')}<span><strong>Print presentation brief</strong><small>Browser print · Save to PDF available in print dialog</small></span>${icon('arrow')}</button></div><div class="export-summary"><span>${p.sources.length} source snapshots</span><span>${p.unattributedSources.length} held apart</span><span>Synthetic labels retained</span></div></div><footer class="modal-footer"><span>Generated locally. No external service.</span><button class="btn" data-action="close">Done</button></footer>`);}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Export downloaded.');}
function openScope(){dialog(`<header class="modal-header"><div><div class="eyebrow">METHOD & SCOPE</div><h2 id="dialog-title">Traceable, by construction.</h2></div>${closeButton()}</header><div class="modal-body scope"><p>This handcrafted demonstration addresses Norfolk use case 20. All vessels, organizations, locations, identifiers and records are fictional.</p><h3>How the brief is built</h3><ol><li>Match a name or identifier against the local two-contact registry.</li><li>Use only statements with an exact quote in an identifier-linked snapshot.</li><li>Keep conflicting values and missing facts UNKNOWN. Hold name-only records apart.</li><li>Order events by observation time, retaining capture time and original text.</li><li>Keep analyst interpretation separate and export the original source set.</li></ol><h3>What this demo does not establish</h3><p>It does not query live registries, AIS or sanctions feeds, infer intent, certify identity, authenticate publishers, or verify claims independently. Identifiers with DEMO prefixes are illustrative and are not valid operational IMO or MMSI values.</p><p>SHA-256 covers source text only. Sources are append-only in the app, but browser storage is mutable and is not an immutable evidence archive. A production system would require trusted capture and externally protected storage.</p><h3>Local workspace</h3><p>Your edits and imports are saved in this browser when storage is available. Export before resetting or clearing browser data.</p><button class="btn danger" data-action="reset-dialog">${icon('undo')} Reset this demo workspace</button></div>`);}
function resetDialog(){dialog(`<header class="modal-header"><h2 id="dialog-title">Reset the local workspace?</h2>${closeButton()}</header><div class="modal-body"><p>This removes your imported sources and brief edits from this demo. The original seven synthetic snapshots will be restored. Export any work you want to keep first.</p></div><footer class="modal-footer"><button class="btn" data-action="close">Cancel</button><button class="btn danger" data-action="reset">Reset workspace</button></footer>`);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
if(action==='tab'){tab=b.dataset.tab;render();}
else if(action==='close')close();
else if(action==='source')openSource(b.dataset.id,b.dataset.quote);
else if(action==='highlight'){openSource(b.dataset.id,b.dataset.quote);$('.snapshot').scrollIntoView({block:'center'});}
else if(action==='resolve')openResolve();
else if(action==='choose')openResolve(b.dataset.id);
else if(action==='candidate'){candidate=b.dataset.id;$('#resolve-results').innerHTML=resolveResults();$('[data-action="confirm-contact"]').disabled=false;$('#resolution-hint').textContent=candidate+' selected';}
else if(action==='confirm-contact'&&candidate){const matches=C.resolveContacts(resolutionQuery,state.contacts);state.selected=candidate;state.resolutions[candidate]={method:matches.find(c=>c.imo===candidate)?.match==='Exact identifier'?'Exact demo identifier':'Analyst selection from matching records',identifier:candidate,query:resolutionQuery,at:new Date().toISOString()};save();close();tab='brief';render();toast('Brief updated for '+candidate);}
else if(action==='edit')openEdit();
else if(action==='import')openImport();
else if(action==='load-example'){$('#source-json').value=JSON.stringify({...D.sample,id:'SRC-'+String(Math.max(7,...state.sources.map(s=>Number(s.id.replace('SRC-',''))||0))+1).padStart(3,'0')},null,2);$('#import-errors').innerHTML='';}
else if(action==='import-submit')await importSource();
else if(action==='export')openExport();
else if(action==='download-md')download(`bearing-${state.selected.toLowerCase()}.md`,C.markdown(C.buildExport(state)),'text/markdown');
else if(action==='download-json')download(`bearing-${state.selected.toLowerCase()}-evidence.json`,JSON.stringify(C.buildExport(state),null,2),'application/json');
else if(action==='download-source'){const s=state.sources.find(s=>s.id===b.dataset.id);download(`${s.id}.json`,JSON.stringify(s,null,2),'application/json');}
else if(action==='print'){close();tab='brief';render();window.print();}
else if(action==='scope')openScope();
else if(action==='clear-filter'){filter='All';trailQuery='';render();}
else if(action==='reset-dialog')resetDialog();
else if(action==='reset'){state=fresh();await hashSources();save();close();tab='brief';filter='All';trailQuery='';render();toast('Original exercise restored.');}
});
document.addEventListener('input',e=>{if(e.target.id==='resolve-query'){resolutionQuery=e.target.value;candidate='';$('#resolve-results').innerHTML=resolveResults();$('[data-action="confirm-contact"]').disabled=true;$('#resolution-hint').textContent='Select a registry record to continue.';}if(e.target.id==='trail-query'){trailQuery=e.target.value;const list=C.trail(state.sources,state.selected,filter,trailQuery);$('#source-results').innerHTML=sourceRows(list);$('#result-count').textContent=list.length+' records';}});
document.addEventListener('change',async e=>{if(e.target.id==='kind-filter'){filter=e.target.value;render();}if(e.target.id==='source-file'&&e.target.files[0])await readFile(e.target.files[0]);});
document.addEventListener('submit',e=>{if(e.target.id!=='edit-form')return;e.preventDefault();const title=$('#brief-title').value.trim();if(!title){$('#brief-title').setCustomValidity('Enter a brief title.');$('#brief-title').reportValidity();$('#brief-title').oninput=()=>$('#brief-title').setCustomValidity('');return;}const included=[...e.target.querySelectorAll('[name="include"]:checked')].map(el=>el.value);state.drafts[state.selected]={title,note:$('#analyst-note').value.trim(),excluded:['type','flag','owner','callsign','mmsi','length','destination','activity','beneficialOwner','cargo','sanctions'].filter(f=>!included.includes(f)),updatedAt:new Date().toISOString()};save();close();render();toast('Brief saved in this browser.');});
async function hashSources(){for(const s of state.sources)s.sha256=await C.digest(s.text);}
async function init(){try{const stored=localStorage.getItem(key);if(stored){const parsed=JSON.parse(stored);if(!parsed||!Array.isArray(parsed.sources)||!parsed.drafts||!parsed.resolutions||!D.contacts.some(c=>c.imo===parsed.selected))throw Error('Invalid saved workspace.');const ids=[];for(const source of parsed.sources){const result=C.validateSource(source,ids,D.contacts.map(c=>c.imo));if(!result.ok)throw Error('A saved source failed validation.');ids.push(source.id);const hash=await C.digest(source.text);if(source.sha256&&hash&&source.sha256!==hash)throw Error('A saved source fingerprint changed.');}for(const d of Object.values(parsed.drafts)){if(!d||typeof d.title!=='string'||typeof d.note!=='string'||!Array.isArray(d.excluded))throw Error('Invalid saved draft.');}state={...parsed,contacts:structuredClone(D.contacts)};}}catch(err){storageWarning='Saved workspace could not be verified. Original exercise loaded. '+err.message;state=fresh();}await hashSources();render();}
init();
})();

</script></body></html>
