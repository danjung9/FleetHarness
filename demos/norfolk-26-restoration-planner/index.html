function assessmentView(){const hs=M.hypotheses(D.hypotheses,state.casualty.facts);return `<div class="section-head"><div><h2>Trace the fault before choosing the repair.</h2><p>Transparent observation matching. Scores are support points, not probabilities.</p></div><button class="btn sm" data-action="edit">${icon('edit')}Edit assessment</button></div><div class="split"><div class="panel"><div class="eyebrow" style="margin-bottom:20px">RANKED ISOLATION BRANCHES</div>${hs.map((h,i)=>`<article class="hypothesis"><h3><span><span class="rank">0${i+1}</span>${h.title}</span><span class="score">${h.score} pts</span></h3><div class="support-track"><span style="width:${Math.min(100,h.score/10*100)}%"></span></div><p>${h.subtitle}</p><p>${h.caution}</p>${citations(h.sources)}</article>`).join('')}<div class="notice" style="margin-top:22px">${icon('info')}<span>No component is confirmed by this model. Review the evidence and retain alternative explanations. <button class="text-btn" data-action="scoring">Inspect scoring rules</button></span></div></div><aside class="panel"><div class="row between"><h3 class="panel-title" style="margin:0">Working observations</h3><button class="icon-btn" data-action="edit" aria-label="Edit observations">${icon('edit')}</button></div><p class="detail-description" style="margin-top:13px">${esc(state.casualty.description)}</p><div class="observations">${state.casualty.facts.length?state.casualty.facts.map(f=>`<div class="obs"><span class="check-dot">✓</span>${D.facts.find(x=>x.id===f)?.label||esc(f)}</div>`).join(''):'<p class="muted small">No observations selected. Add observations to rank the branches.</p>'}</div>${citations(['LOG-01'])}<div class="history"><div class="history-item"><small>12 JUN 2026 · WR-118</small><b>Regulator wear noted</b><p>Assembly retained. Current condition unconfirmed.</p>${citations(['HIST-01'])}</div><div class="history-item"><small>21 OCT 2026 · WR-204</small><b>Filter element replaced</b><p>No differential measurement in the extract.</p>${citations(['HIST-02'])}</div></div></aside></div>`;}
function missionView(){const o=focused();return `<div class="section-head"><div><h2>Restoration is a chain of dependencies.</h2><p>Fictional capability mapping; equipment recovery does not certify readiness.</p></div><button class="btn sm" data-action="horizon">${icon('edit')}Set horizon</button></div><div class="split"><section class="panel"><div class="eyebrow">CAPABILITY DEPENDENCY</div><div style="display:flex;flex-direction:column;align-items:center;margin:25px 0"><div class="dep-node wide" style="width:85%;padding:18px;font-size:14px">Auxiliary electrical redundancy<span>UNAVAILABLE WHILE SSDG-02 IS SECURED</span></div><div class="dep-line" style="height:26px"></div><div class="parallel" style="width:100%;padding-bottom:0"><div class="dep-node" style="padding:20px 10px">Generator 01<span>LIMITED LOAD · SCENARIO ASSUMPTION</span></div><div class="dep-node" style="padding:20px 10px;background:#f9efe0;border-color:#e4d3b9">Generator 02<span>SECURED · VALIDATION REQUIRED</span></div></div></div><div class="notice">${icon('info')}<span>Until post-maintenance validation and authorized acceptance are recorded, the plan retains the loss of redundancy as an unresolved mission impact.</span></div>${citations(['PLAN-01','LOG-01'])}</section><aside class="panel"><div class="eyebrow">WINDOW SENSITIVITY</div><h3 style="font-size:19px;margin:12px 0">${o.short}</h3><p class="detail-description">${o.estimate.min}–${o.estimate.max} hours is the modeled completion interval from plan start. Supply and confirmation begin in parallel.</p><div class="summary-divider"></div><div class="summary-row"><span>Planning horizon</span><b>${state.casualty.missionHours} h</b></div><div class="summary-row"><span>Conservative completion</span><b>${o.estimate.max} h</b></div><div class="summary-row"><span>${o.slack>=0?'Remaining buffer':'Window shortfall'}</span><b>${Math.abs(o.slack)} h</b></div><button class="btn block" style="margin-top:20px" data-action="horizon">Adjust planning horizon</button><p class="bottom-note">No estimate removes an unresolved prerequisite.</p></aside></div>`;}
function sourcesView(){return `<div class="heading"><div><div class="eyebrow">REFERENCE WORKSPACE / READ ONLY</div><h1>Evidence, kept in context.</h1><p class="sub">Every record is a fictional, locally bundled source.</p></div><button class="btn" data-action="provenance">${icon('info')}About these sources</button></div><div class="toolbar"><div class="searchbox">${icon('search')}<input id="source-search" aria-label="Search sources" placeholder="Search references, parts, or maintenance history…" value="${esc(sourceQuery)}"></div><select id="source-filter" aria-label="Filter source type"><option value="all">All source types</option>${[...new Set(D.sources.map(s=>s.type))].map(t=>`<option ${sourceFilter===t?'selected':''}>${t}</option>`).join('')}</select></div><div id="source-results">${sourceResults()}</div>`;}
function sourceResults(){const q=sourceQuery.toLowerCase();const matches=D.sources.filter(s=>(sourceFilter==='all'||s.type===sourceFilter)&&[s.id,s.title,s.body,s.type].join(' ').toLowerCase().includes(q));return matches.length?`<div class="row between" style="margin:0 0 12px"><span class="eyebrow">${matches.length} RECORD${matches.length===1?'':'S'}</span><span class="small muted">Snapshot · 05 Nov 2026, 08:00 UTC</span></div><div class="source-table">${matches.map(s=>`<button class="source-row" data-action="source" data-id="${s.id}"><span class="mono">${s.id}</span><span class="source-title">${s.title}<small>${s.date}</small></span><span class="source-type">${s.type}</span>${icon('chevron')}</button>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">${icon('search')}</div><h2>No matching evidence.</h2><p>Try a part number such as RK-204, or clear the source filters.</p><button class="btn" data-action="clear-search">Clear filters</button></div>`;}
function packageView(){const o=chosen();if(!o)return `<div class="heading"><div><div class="eyebrow">REVIEW & EXPORT</div><h1>A plan worth reviewing.</h1><p class="sub">Make a planning choice to begin your work package.</p></div></div><div class="empty"><div class="empty-icon">${icon('clipboard')}</div><h2>Your package is ready to build.</h2><p>Compare the three restoration paths, inspect the evidence, and select an option. Its task sequence and prerequisites come with it.</p><button class="btn primary" data-action="return-paths">Compare restoration paths ${icon('arrow')}</button></div>`;
const e=M.optionSchedule(o),open=M.openGates(o,state.checks);return `<div class="heading"><div><div class="eyebrow">${esc(state.casualty.id)} / LOCAL PLANNING PACKAGE</div><h1>A clear plan. Visible holds.</h1><p class="sub">${state.reviewed?'Reviewed planning draft · no work or release authority conferred.':'Review the evidence, capture prerequisites, and prepare a portable draft.'}</p></div><button class="btn" data-action="export">${icon('download')}Export plan</button></div><div class="split"><div class="stack"><section class="panel"><div class="row between"><div><div class="eyebrow">01 / RESTORATION SEQUENCE</div><h3 style="font-size:20px;font-weight:500;margin-top:8px">${o.title}</h3></div><button class="text-btn" data-action="return-paths">Change path ${icon('arrow')}</button></div><div class="task-list">${e.tasks.map((t,i)=>`<div class="task-row"><span class="step-num">0${i+1}</span><div><b>${t.label}</b><small>${t.depends.length?'After '+t.depends.map(id=>e.tasks.find(d=>d.id===id).label.toLowerCase()).join(' + '):'Can begin at plan start'} · ${t.start[0]}–${t.start[1]} h earliest/latest start</small></div><span class="duration">${t.hours[0]}–${t.hours[1]} h</span></div>`).join('')}</div>${citations(o.sources)}</section><section class="panel"><div class="row between"><div><div class="eyebrow">02 / PREREQUISITE REVIEW</div><h3 style="font-size:17px;font-weight:500;margin-top:8px">Before work can proceed</h3></div><span class="pill ${open.length?'warn':''}">${open.length} open</span></div>${o.gates.map(id=>{const g=D.prerequisites[id],r=state.checks[id];return `<div class="gate ${r?.resolved?'resolved':''}"><span class="gate-symbol">${r?.resolved?'✓':'!'}</span><div><b>${g.label}</b><p>${r?.resolved?'Evidence recorded: '+esc(r.note):g.detail}</p><button class="text-btn" data-action="gate" data-id="${id}">${r?.resolved?'Review evidence':'Record prerequisite evidence'} ${icon('arrow')}</button></div></div>`;}).join('')}</section><section class="panel"><div class="eyebrow" style="margin-bottom:13px">PLANNER NOTES</div><textarea id="planner-notes" aria-label="Planner notes" maxlength="3000" placeholder="Record assumptions, handover context, or questions for the reviewer…">${esc(state.notes)}</textarea><p class="small muted" style="margin-top:8px">Saved locally. Editing the package invalidates an earlier review.</p></section></div><aside class="package-summary"><div class="eyebrow">03 / HUMAN REVIEW</div><h3>Package summary</h3><div class="summary-row"><span>Modeled restoration</span><b>${e.min}–${e.max} h</b></div><div class="summary-row"><span>Planning horizon</span><b>${state.casualty.missionHours} h</b></div><div class="summary-row"><span>Part requirement</span><b>1 × ${o.part}</b></div><div class="summary-row"><span>Prerequisites remaining</span><b>${open.length} of ${o.gates.length}</b></div><div class="summary-divider"></div><label class="field">Synthetic reviewer label<input id="reviewer" value="${esc(state.reviewer)}" maxlength="80" placeholder="e.g. Engineering reviewer A"></label><label class="check-label"><input type="checkbox" id="ack-evidence" ${state.ackEvidence?'checked':''}><span>I reviewed the source records, the selected path, and the illustrative time estimate.</span></label><label class="check-label"><input type="checkbox" id="ack-open" ${state.ackOpen?'checked':''}><span>I acknowledge that open prerequisites remain holds. This planning review does not authorize work or report release.</span></label><div class="form-error" id="review-errors" role="alert"></div>${state.reviewed?`<div class="review-status">${icon('check')}Planning review recorded</div>`:''}<button class="btn primary block" data-action="review">${icon('check')}${state.reviewed?'Record review again':'Mark planning review complete'}</button><div class="summary-divider"></div><button class="btn block" data-action="reports">Preview draft reports ${icon('arrow')}</button><button class="btn block" style="margin-top:9px" data-action="queue" ${state.reviewed?'':'disabled'}>${icon('upload')}Queue draft reports locally</button><p class="bottom-note">Local demonstration only. No approval identity or external transmission.</p></aside></div>`;}
function activityView(){return `<div class="heading"><div><div class="eyebrow">TRACEABILITY / DEVICE LOCAL</div><h1>Every planning choice leaves a trail.</h1><p class="sub">Auditable demo events and immutable queued snapshots. No system of record is changed.</p></div><button class="btn" data-action="sync">${icon('refresh')}Sync simulation</button></div><div class="split"><section class="panel"><div class="row between"><h3 class="panel-title" style="margin:0">Planning activity</h3><button class="text-btn" data-action="export-audit">Export log ${icon('download')}</button></div>${state.audit.map(a=>`<div class="log-row"><time>${esc(dateTime(a.at))}</time><div>${esc(a.action)}<small>${esc(a.detail)}</small></div></div>`).join('')}</section><aside class="panel"><div class="row between"><h3 class="panel-title" style="margin:0">Draft outbox</h3><span class="pill neutral">${state.queue.length}</span></div><p class="detail-description" style="margin:12px 0 18px">Locally reviewed snapshots, awaiting a simulated connection. These are not released reports.</p>${state.queue.length?state.queue.map(q=>`<div class="queue-item"><div class="row between"><b>${q.type==='casualty'?'Casualty draft':'Parts request draft'}</b><span class="pill ${q.status==='queued'?'warn':''}">${q.status==='queued'?'Queued':'Local receipt'}</span></div><p>${esc(q.id)}<br>${esc(dateTime(q.at))}</p><button class="text-btn" data-action="queue-preview" data-id="${q.id}">Inspect snapshot ${icon('arrow')}</button></div>`).join(''):'<div class="empty" style="padding:26px 14px"><p style="margin:0">No drafts queued. Complete a planning review to add a casualty and parts request draft.</p></div>'}<div class="summary-divider"></div><button class="text-btn" data-action="reset">Reset demo workspace</button></aside></div>`;}
function openDialog(title,body,footer='',eyebrow='RESTORE / PLANNING WORKSPACE',wide=false){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="dialog-backdrop"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-header"><div><div class="eyebrow">${eyebrow}</div><h2 id="dialog-title">${title}</h2></div><button class="icon-btn" data-action="close" aria-label="Close dialog">${icon('close')}</button></header><div class="dialog-body">${body}</div>${footer?`<footer class="dialog-footer">${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';document.querySelector('.dialog .icon-btn').focus();}
function closeDialog(){document.getElementById('overlay').innerHTML='';document.body.style.overflow='';lastFocus?.focus?.();}
function sourceDialog(id){const s=D.sources.find(x=>x.id===id);if(!s)return;openDialog(s.title,`<div class="row between"><span class="pill neutral">${s.type}</span><span class="mono">${s.id}</span></div><p class="small muted" style="margin-top:16px">${s.date}<br>${s.section}</p><div class="source-text">${esc(s.body)}</div><div class="notice" style="margin-top:18px">${icon('info')}<span>${s.note}</span></div><p class="small muted" style="margin-top:15px">Authored synthetic record · bundled locally · no live source connection</p>`,`<button class="btn" data-action="close">Return to workspace</button>`,'SOURCE RECORD / READ ONLY');}
function editDialog(){const c=state.casualty;openDialog('Review the casualty assessment',`<p class="detail-description" style="margin-bottom:18px">This workspace models one fictional SSDG-02 scenario. Changes update the working assessment; bundled source records remain unchanged.</p><label class="field">Working casualty description<textarea id="edit-description" maxlength="3000">${esc(c.description)}</textarea></label><div class="row between"><label class="small">Observed facts</label><button class="text-btn" data-action="infer">Suggest from description</button></div><div class="fact-grid">${D.facts.map(f=>`<label class="check-label"><input type="checkbox" name="fact" value="${f.id}" ${c.facts.includes(f.id)?'checked':''}><span>${f.label}</span></label>`).join('')}</div><div class="notice">${icon('info')}<span>Keyword suggestions are editable observations, not fault confirmation. Deselect anything the source does not support.</span></div><div class="form-error" id="edit-error" role="alert"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save-edit">Save assessment</button>`,'CASUALTY / HUMAN INPUT');}
function importDialog(){openDialog('Bring a casualty into the workspace',`<p class="detail-description" style="margin-bottom:17px">Import a synthetic JSON record for the supported SSDG-02 scenario. This replaces the working casualty and clears the current package. Your existing queue and activity remain.</p><div class="row between" style="margin-bottom:12px"><button class="btn sm" data-action="load-example">Load example</button><label class="btn sm" for="import-file">${icon('upload')}Choose JSON file</label><input id="import-file" type="file" accept=".json,application/json" hidden></div><textarea id="import-json" class="importarea" aria-label="Casualty JSON" placeholder='Paste a synthetic casualty JSON object…'></textarea><div class="form-error" id="import-error" role="alert"></div><p class="small muted" style="margin-top:12px">Maximum 128 KB. Supported asset: SSDG-02. Fixed surrogate references and repair paths are retained.</p>`,`<button class="btn" data-action="download-example">Download example</button><button class="btn primary" data-action="import-json">Validate & import</button>`,'LOCAL INPUT / SYNTHETIC DATA ONLY',true);}
function horizonDialog(){openDialog('Set the planning horizon',`<p class="detail-description" style="margin-bottom:18px">Compare completion estimates against a relative time window from plan start. This does not alter task durations or verify readiness.</p><label class="field">Hours from plan start<input type="number" id="horizon" min="1" max="168" step="1" value="${state.casualty.missionHours}"></label><div class="form-error" id="horizon-error" role="alert"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save-horizon">Apply horizon</button>`);}
function gateDialog(id){const g=D.prerequisites[id],r=state.checks[id];openDialog(g.label,`<p class="detail-description">${g.detail}</p>${citations([g.source])}<label class="field" style="margin-top:22px">Synthetic evidence or verification note<textarea id="gate-note" maxlength="1500" placeholder="Describe the verification and its fictional record reference…">${esc(r?.note||'')}</textarea></label><label class="check-label"><input type="checkbox" id="gate-verified" ${r?.resolved?'checked':''}><span>Record this prerequisite as verified in the local planning demonstration.</span></label><div class="notice">${icon('info')}<span>This is a local record, not an authenticated approval. It does not perform maintenance or validate mission readiness.</span></div><div class="form-error" id="gate-error" role="alert"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save-gate" data-id="${id}">Save evidence</button>`,'PREREQUISITE / HUMAN ENTERED EVIDENCE');}
function exportObject(){const result=M.buildExport(state,D);result.sources.unshift({id:'INPUT-01',type:'Working assessment',title:'Current planner-entered casualty and observations',date:result.exportedAt,body:state.casualty.description+'\nSelected observations: '+state.casualty.facts.join(', '),note:'Working user input. Bundled LOG-01 remains the original fictional baseline.'});return result;}
function markdown(p){return `# RESTORE — ${p.casualty.id}\n\nSYNTHETIC PLANNING DRAFT — NOT WORK AUTHORIZATION\n\nExported: ${p.exportedAt}\nSnapshot: ${p.snapshot}\nReview: ${p.review.status}\nReviewer: ${p.review.reviewer||'Not recorded'}\n\n## Casualty\n${p.casualty.vessel} / ${p.casualty.asset}\n${p.casualty.description}\nSource: INPUT-01 (current working assessment); LOG-01 (unchanged baseline).\n\n## Selected restoration path\n${p.selectedOption.title}\nEstimated completion: ${p.selectedOption.estimatedHours.join('–')} hours from plan start.\nMission horizon: ${p.selectedOption.missionWindowHours} hours.\nPart request: 1 × ${p.selectedOption.part}; ${p.selectedOption.location}. Availability is a snapshot, not a reservation.\nMission impact: electrical redundancy remains unavailable until validation and authorized acceptance.\n\n## Open prerequisites\n${p.unresolvedPrerequisites.length?p.unresolvedPrerequisites.map(g=>`- ${g.label}: ${g.detail} [${g.source}]`).join('\n'):'No open prerequisites recorded locally. Actual authority and readiness must be established outside this demo.'}\n\n## Task sequence\n${p.tasks.map(t=>`- ${t.label}: ${t.hours.join('–')} h; depends on ${t.depends.join(', ')||'none'}; start window ${t.start.join('–')} h. [${t.source}]`).join('\n')}\n\n## Recorded prerequisite evidence\n${p.prerequisites.map(g=>`- ${g.label}: ${g.resolved?'recorded verified':'open'}. ${g.note||'No evidence recorded.'}`).join('\n')}\n\n## Planner notes\n${p.plannerNotes||'None recorded.'}\n\n## Sources\n${p.sources.map(s=>`### ${s.id} — ${s.title}\n${s.date}\n${s.body}\nLimitation: ${s.note}`).join('\n\n')}\n\n## Local activity\n${p.audit.map(a=>`- ${a.at} — ${a.action}. ${a.detail}`).join('\n')}\n\n${p.disclaimer}\n`;}
function exportDialog(){const p=exportObject();openDialog('Export a portable planning record',`<div class="row between"><span class="pill ${state.reviewed?'':'warn'}">${state.reviewed?'Reviewed planning draft':'Unreviewed draft'}</span><span class="mono">${p.unresolvedPrerequisites.length} OPEN PREREQUISITES</span></div><p class="detail-description" style="margin:15px 0">Both formats preserve the casualty, selected path, estimates, source excerpts, recorded evidence, open prerequisites, and local activity.</p><pre class="export-preview">${esc(markdown(p).slice(0,1500))}\n… Full source excerpts and audit entries included in download.</pre>`,`<button class="btn" data-action="download-md">${icon('download')}Download Markdown</button><button class="btn primary" data-action="download-json">${icon('download')}Download JSON</button>`,'EXPORT / LOCAL FILE',true);}
function reportPayload(type,p){return {type:type==='casualty'?'casualty-planning-draft':'parts-request-draft',synthetic:true,releaseStatus:'NOT RELEASED — local planning review only',casualtyId:p.casualty.id,equipment:p.casualty.asset,vessel:p.casualty.vessel,description:p.casualty.description,...(type==='parts'?{part:p.selectedOption.part,quantity:1,sourceLocation:p.selectedOption.location,availability:'Unconfirmed snapshot; not reserved'}:{missionImpact:'Electrical redundancy unavailable; unit secured pending assessment and validation',restorationPath:p.selectedOption.title,estimatedHours:p.selectedOption.estimatedHours}),review:p.review,unresolvedPrerequisites:p.unresolvedPrerequisites,sources:p.sources,package:p};}
function reportsDialog(){const p=exportObject();openDialog('Draft reports for the chain of review',`<span class="pill warn">NOT RELEASED · SYNTHETIC</span><div class="source-text"><b>CASUALTY PLANNING DRAFT</b>\n${esc(p.casualty.id)} / ${esc(p.casualty.vessel)} / ${esc(p.casualty.asset)}\n${esc(p.casualty.description)}\n\nMission impact: auxiliary electrical redundancy unavailable.\nRestoration path: ${p.selectedOption.title} · ${p.selectedOption.estimatedHours.join('–')} hours estimated.\nOpen prerequisites: ${p.unresolvedPrerequisites.map(g=>g.label).join('; ')||'None recorded locally'}.</div><div class="source-text"><b>PARTS REQUEST DRAFT</b>\nQuantity: 1 × ${p.selectedOption.part}\nSource: ${p.selectedOption.location}\nAvailability: reported snapshot; physical stock and fitment must be confirmed.\nPurpose: ${p.selectedOption.title} for ${esc(p.casualty.asset)}.</div><p class="small muted" style="margin-top:16px">These are illustrative fielded drafts, not official message or requisition formats. Downloaded payloads contain full citations.</p>`,`<button class="btn" data-action="download-report" data-type="casualty">Download casualty draft</button><button class="btn primary" data-action="download-report" data-type="parts">Download parts draft</button>`,'REPORT PREVIEW / PLANNING ONLY',true);}
function syncDialog(){const n=state.queue.filter(q=>q.status==='queued').length;openDialog('Disconnected by design',`<div class="notice green">${icon('signal')}<span>The entire workspace runs on bundled data. This control simulates connectivity locally; it never contacts an external system.</span></div><div class="summary-row" style="margin-top:23px"><span>Simulation state</span><b>${state.link?'Link available':'Disconnected'}</b></div><div class="summary-row"><span>Queued draft snapshots</span><b>${n}</b></div><div class="summary-row"><span>Local receipts</span><b>${state.queue.filter(q=>q.status==='received').length}</b></div><p class="detail-description" style="margin-top:20px">Each queued item retains its reviewed package as an immutable snapshot. Repeating simulated synchronization skips items that already have a local receipt.</p>`,`<button class="btn" data-action="toggle-link">${state.link?'Simulate disconnect':'Simulate reconnect'}</button><button class="btn primary" data-action="simulate-sync" ${!state.link||!n?'disabled':''}>Simulate draft synchronization</button>`,'LOCAL SIMULATION / NO EXTERNAL CONNECTION');}
function download(name,content,type='application/json'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);}
const fileBase=()=>state.casualty.id.replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,60)||'restore';
function build(option){if(state.selected!==option){invalidate();state.selected=option;state.checks={};state.ackEvidence=false;state.ackOpen=false;audit('Restoration path selected',D.options.find(o=>o.id===option).title);}state.view='package';render();window.scrollTo(0,0);}
const actions={
  view:el=>{state.view=el.dataset.view;render();window.scrollTo(0,0);},tab:el=>{state.tab=el.dataset.tab;render();},'focus-option':el=>{state.focused=el.dataset.option;render();},build:el=>build(el.dataset.option),source:el=>sourceDialog(el.dataset.id),close:closeDialog,edit:editDialog,import:importDialog,horizon:horizonDialog,gate:el=>gateDialog(el.dataset.id),export:exportDialog,reports:reportsDialog,sync:syncDialog,
  'return-paths':()=>{state.view='workspace';state.tab='paths';render();window.scrollTo(0,0);},
  'clear-search':()=>{sourceQuery='';sourceFilter='all';render();},
  infer:()=>{const facts=M.inferFacts(document.getElementById('edit-description').value);document.querySelectorAll('[name=fact]').forEach(el=>el.checked=facts.includes(el.value));toast('Keyword suggestions applied. Verify each observed fact.');},
  'save-edit':()=>{const desc=document.getElementById('edit-description').value.trim();if(!desc){document.getElementById('edit-error').textContent='Add a casualty description before saving.';return;}invalidate();state.casualty.description=desc;state.casualty.facts=[...document.querySelectorAll('[name=fact]:checked')].map(el=>el.value);audit('Working assessment updated',state.casualty.facts.length+' observed facts selected. Baseline source records unchanged.');closeDialog();render();toast('Assessment saved; planning review must reflect the new evidence.');},
  'load-example':()=>{document.getElementById('import-json').value=JSON.stringify(D.casualty,null,2);document.getElementById('import-error').textContent='';},
  'download-example':()=>download('restore-synthetic-casualty.json',JSON.stringify(D.casualty,null,2)),
  'import-json':()=>{try{const c=M.parseImport(document.getElementById('import-json').value);if(c.asset!=='SSDG-02')throw new Error('This demonstration supports asset SSDG-02 only. Other equipment needs its own sources and restoration model.');invalidate();state.casualty=c;state.selected=null;state.checks={};state.notes='';state.reviewer='';state.ackEvidence=false;state.ackOpen=false;state.focused='rebuild';state.view='workspace';state.tab='assessment';audit('Synthetic casualty imported',c.id+'; prior package cleared; queued snapshots preserved.');closeDialog();render();toast('Casualty validated and imported. Review the working observations.');}catch(e){document.getElementById('import-error').textContent=e.message;}},
  'save-horizon':()=>{const n=Number(document.getElementById('horizon').value);if(!Number.isFinite(n)||n<1||n>168){document.getElementById('horizon-error').textContent='Enter a planning horizon between 1 and 168 hours.';return;}invalidate();state.casualty.missionHours=n;audit('Planning horizon changed',n+' hours from plan start.');closeDialog();render();toast('Horizon updated. Estimates and eligibility holds are unchanged.');},
  'save-gate':el=>{const note=document.getElementById('gate-note').value.trim(),resolved=document.getElementById('gate-verified').checked;if(resolved&&note.length<8){document.getElementById('gate-error').textContent='Add an evidence note of at least 8 characters before recording verification.';return;}invalidate();state.checks[el.dataset.id]={resolved,note,at:new Date().toISOString()};audit('Prerequisite '+(resolved?'evidence recorded':'left open'),D.prerequisites[el.dataset.id].label);closeDialog();render();toast('Prerequisite evidence saved.');},
  review:()=>{const errors=M.reviewErrors(state);if(errors.length){document.getElementById('review-errors').textContent=errors.join(' ');return;}state.reviewed=true;state.reviewedAt=new Date().toISOString();audit('Planning review recorded',state.reviewer+' reviewed the draft with '+M.openGates(chosen(),state.checks).length+' unresolved prerequisites. No work authorization granted.');render();toast('Planning review recorded. Open prerequisites remain visible holds.');},
  queue:()=>{if(!state.reviewed){toast('Complete the planning review before queuing drafts.');return;}const p=exportObject();const fingerprint=state.reviewedAt+'|'+state.selected;if(state.queue.some(q=>q.fingerprint===fingerprint)){toast('This reviewed revision is already in the local outbox.');return;}['casualty','parts'].forEach(type=>{state.queue.push({id:'DRAFT-'+Date.now()+'-'+type,type,fingerprint,at:new Date().toISOString(),status:'queued',payload:reportPayload(type,p)});});audit('Two draft reports queued','Immutable casualty and parts draft snapshots stored locally; not released or transmitted.');state.view='activity';render();toast('Casualty and parts drafts queued locally.');},
  'toggle-link':()=>{state.link=!state.link;audit(state.link?'Simulated link available':'Simulated disconnect','Local demonstration state only; no network connection attempted.');render();syncDialog();},
  'simulate-sync':()=>{if(!state.link)return;let n=0;state.queue.forEach(q=>{if(q.status==='queued'){q.status='received';q.receipt={id:'LOCAL-'+q.id,at:new Date().toISOString(),scope:'local simulation only'};n++;}});audit('Local sync simulation completed',n+' draft snapshots received locally; no external transmission.');render();syncDialog();toast(n+' local receipts created. No reports were transmitted.');},
  'queue-preview':el=>{const q=state.queue.find(x=>x.id===el.dataset.id);if(q)openDialog('Queued draft snapshot',`<p class="detail-description">${q.status==='received'?'Local receipt recorded; no external transmission.':'Awaiting a simulated link.'} This snapshot does not change when you edit the current plan.</p><pre class="export-preview" style="margin-top:18px">${esc(JSON.stringify(q,null,2))}</pre>`,`<button class="btn primary" data-action="download-queued" data-id="${q.id}">Download snapshot</button>`,'IMMUTABLE LOCAL DRAFT',true);},
  'download-queued':el=>{const q=state.queue.find(x=>x.id===el.dataset.id);if(q)download(q.id+'.json',JSON.stringify(q,null,2));},
  'download-json':()=>{const p=exportObject();download(fileBase()+'-restoration-plan.json',JSON.stringify(p,null,2));audit('Planning package exported','JSON with sources and '+p.unresolvedPrerequisites.length+' unresolved prerequisites.');toast('JSON planning package downloaded.');},
  'download-md':()=>{const p=exportObject();download(fileBase()+'-restoration-plan.md',markdown(p),'text/markdown');audit('Planning package exported','Markdown with source excerpts and open prerequisites.');toast('Markdown planning package downloaded.');},
  'download-report':el=>{download(fileBase()+'-'+el.dataset.type+'-draft.json',JSON.stringify(reportPayload(el.dataset.type,exportObject()),null,2));audit('Draft report downloaded',el.dataset.type+' draft; not released.');toast('Draft report downloaded with citations.');},
  'export-audit':()=>{download('restore-local-activity.json',JSON.stringify({synthetic:true,scope:'Device-local demo log; not tamper-proof',events:state.audit},null,2));toast('Local activity log downloaded.');},
  reset:()=>openDialog('Reset this local workspace?',`<p class="detail-description">This removes the current assessment, package, draft queue, and activity stored by this demo on this device, then restores the bundled example. Export anything you want to keep first.</p>`,`<button class="btn" data-action="close">Keep workspace</button><button class="btn primary" data-action="confirm-reset">Reset demo</button>`),
  'confirm-reset':()=>{state=fresh();sourceQuery='';sourceFilter='all';save();closeDialog();render();toast('Bundled example restored.');},
  model:()=>{const o=focused(),e=o.estimate;openDialog('How the completion window is calculated',`<p class="detail-description">For each task, earliest and latest start are the maximum completion time of its dependencies. Durations are added to those starts. The final interval is the latest task completion. Independent tasks run in parallel.</p><div class="source-text"><b>${o.title}</b>\nConfirmation + authorization: (1–2) + (1–2) = 2–4 h\nSupply branch: ${o.supply.join('–')} h\nComponent work: 3–4 h\nValidation: 2–3 h\n\nEarliest: max(2, ${o.supply[0]}) + 3 + 2 = ${e.min} h\nLatest: max(4, ${o.supply[1]}) + 4 + 3 = ${e.max} h</div><p class="small muted" style="margin-top:15px">Ranges are illustrative bounds, not probability distributions. No resource contention, work shifts, transport disruption, or unexpected damage is modeled. Prerequisite holds remain separate from the time calculation.</p>${citations(['PLAN-01'])}`,`<button class="btn" data-action="close">Close calculation</button>`,'TRANSPARENT PLANNING MODEL');},
  scoring:()=>openDialog('Observation support, not a diagnosis',`<p class="detail-description">The model sums the weights below for selected facts and floors each score at zero. Unselected observations contribute zero. The resulting points order the branches; they are not a validated likelihood.</p><div class="source-text">${D.hypotheses.map(h=>`<b>${h.title}</b>\n${Object.entries(h.weights).map(([f,w])=>`${D.facts.find(x=>x.id===f).label}: ${w>0?'+':''}${w}`).join('\n')}`).join('\n\n')}</div>${citations(['REF-01','PLAN-01'])}`,`<button class="btn" data-action="close">Close rules</button>`,'ILLUSTRATIVE MATCHING RULES'),
  provenance:()=>openDialog('A transparent, synthetic workspace',`<div class="notice green">${icon('book')}<span>All casualties, units, inventories, histories, and reference excerpts in this application were authored for this demonstration. No operational data or manufacturer procedures are included.</span></div><div class="source-text"><b>Use-case provenance</b>\nNorfolk catalogue #26 — Restore to Mission\nBundled catalogue snapshot: 04 Nov 2026, 20:08 UTC\nSource: harness/norfolk-snapshot.ts\n\n<b>Product scope</b>\nOne generator planning scenario, deterministic observation matching, three repair paths, task dependency estimates, local review, cited exports, and an offline draft queue.\n\n<b>Boundaries</b>\nNo external integrations, authenticated approval, technical work instructions, verified interchangeability, readiness certification, or real synchronization. Browser-local storage is editable and is not a secure records system.</div>`,`<button class="btn" data-action="close">Return to sources</button>`,'PROVENANCE & SCOPE',true)
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el&&!el.disabled){const fn=actions[el.dataset.action];if(fn)fn(el);}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='source-search'){sourceQuery=el.value;document.getElementById('source-results').innerHTML=sourceResults();}if(el.id==='reviewer'||el.id==='planner-notes'){const had=state.reviewed;invalidate();state[el.id==='reviewer'?'reviewer':'notes']=el.value;save();if(had){toast('The package changed. Complete a new planning review.');const btn=document.querySelector('[data-action=queue]');if(btn)btn.disabled=true;document.querySelector('.review-status')?.remove();document.querySelectorAll('#ack-evidence,#ack-open').forEach(x=>x.checked=false);const rb=document.querySelector('[data-action=review]');if(rb)rb.innerHTML=icon('check')+'Mark planning review complete';}}});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.id==='source-filter'){sourceFilter=el.value;document.getElementById('source-results').innerHTML=sourceResults();}if(el.id==='ack-evidence'||el.id==='ack-open'){invalidate();state[el.id==='ack-evidence'?'ackEvidence':'ackOpen']=el.checked;save();render();}if(el.id==='import-file'&&el.files[0]){const f=el.files[0];if(f.size>131072){document.getElementById('import-error').textContent='File is too large. Use a JSON casualty under 128 KB.';return;}document.getElementById('import-json').value=await f.text();document.getElementById('import-error').textContent='File loaded. Select Validate & import to check it.';}});
document.addEventListener('keydown',ev=>{const modal=document.querySelector('.dialog');if(!modal)return;if(ev.key==='Escape'){closeDialog();return;}if(ev.key==='Tab'){const list=[...modal.querySelectorAll('button:not(:disabled),input:not([hidden]),textarea,select,[tabindex="0"]')].filter(x=>x.offsetParent!==null);const first=list[0],last=list[list.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus();}}});
render();
if(storageWarning)toast('Saved workspace could not be read. The bundled example is available.');
})();
</script></body></html>
