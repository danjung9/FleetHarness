function previewHTML(){const events=[...scoped().filter(r=>r.type==='EVENT'),...state.calendar.filter(c=>c.command===command)].filter(r=>r.start.startsWith('2026-11-06')&&E.timestamp(r.start)!==null&&E.timestamp(r.end)!==null);const commandConflicts=overlap().filter(c=>c.command===command),conflictCount=commandConflicts.length;const firstPair=commandConflicts[0];const names=firstPair?[...all(),...state.calendar].filter(r=>[firstPair.a,firstPair.b].includes(r.key)).map(r=>r.action).join(' / '):'';return`<section class="schedule-preview" aria-label="Schedule overview"><div class="preview-head"><h2>Today's schedule</h2><button class="text-btn" data-nav="schedule">Open schedule ${icon('arrow')}</button></div><div class="timeline-mini"><div class="time-labels"><span>08:00</span><span>10:00</span><span>12:00</span><span>14:00</span><span>16:00</span><span>18:00</span></div><div class="timeline-axis"></div>${events.map(r=>{const pos=position(r);return pos?`<button class="mini-bar ${r.type==='CALENDAR'?'cal':''} ${clashes(r).length?'collision':''}" style="left:${pos.left}%;width:${pos.width}%" data-schedule-item="${esc(r.key)}" title="${esc(r.action)} · ${time(r.start)}–${time(r.end)} UTC" aria-label="${esc(r.action)}"></button>`:'';}).join('')}</div><div class="preview-foot">${icon(conflictCount?'review':'check')}<span>${conflictCount?`${conflictCount} overlap${conflictCount>1?'s':''} to resolve · ${esc(names)}`:'No overlaps in the current command schedule'}</span></div></section>`;}
function position(r,day='2026-11-06'){const begin=Date.parse(day+'T08:00Z'),end=begin+36000000;const s=Math.max(E.timestamp(r.start),begin),e=Math.min(E.timestamp(r.end),end);return e>s?{left:(s-begin)/360000,width:(e-s)/360000}:null;}
function detailHTML(){let r=find(selected);if(!r||r.command!==command)return`<div class="detail empty">${icon('inbox')}<h3>Select an obligation</h3><p>Inspect its exact source, coordinating role, and review state.</p></div>`;const m=messageFor(r);const cs=clashes(r);return`<article class="detail"><div class="detail-top"><span class="eyebrow">Obligation detail</span><span class="source-ref">${esc(r.id)} / ${r.type==='CORRESPONDENCE'?'REPLY':r.type}</span></div><div class="detail-inner"><span class="badge ${r.status==='reviewed'?'':'neutral'}">${r.status==='reviewed'?icon('check'):''}${r.status==='reviewed'?'Reviewed locally':'Awaiting review'}</span><h2 class="detail-title">${esc(r.action)}</h2><p class="detail-description">${esc(r.command)} · ${esc(m.meta.FROM)}</p><div class="time-pair"><div><span class="field-label">${r.type==='EVENT'?'Start time':'Deadline'}</span><div class="time-value">${esc(time(r.type==='EVENT'?r.start:r.due))} ${E.timestamp(r.type==='EVENT'?r.start:r.due)!==null?'<span>UTC</span>':''}</div></div><div><span class="field-label">${r.type==='EVENT'?'End time':'Date'}</span><div class="time-value">${r.type==='EVENT'?`${esc(time(r.end))} <span>UTC</span>`:date(r.due)}</div></div></div>${cs.map(c=>{const other=[...all(),...state.calendar].find(x=>x.key===(c.a===r.key?c.b:c.a));return`<div class="callout">${icon('review')}<div><strong>Schedule overlap · ${time(c.start)}–${time(c.end)}</strong>${esc(other?.action)} also uses this command's schedule. <button class="text-btn" data-nav="schedule">Review schedule →</button></div></div>`;}).join('')}${r.issues.length?`<div class="callout">${icon('review')}<div><strong>Clarification required</strong>${r.issues.map(esc).join('. ')}. Original wording is retained below.</div></div>`:''}<div class="section-line"><div class="section-heading"><h3>Suggested coordinating role</h3><span class="badge neutral">RULE BASED</span></div><div class="owner-block"><div class="avatar">${esc(r.role)}</div><div><div class="owner-name">${esc(roleNames[r.role])}</div><small class="subtle">${r.status==='reviewed'?'Confirmed in local review':'For your confirmation'}</small></div></div><p class="reason">${esc(r.routing.reason)}${r.status==='reviewed'?' Current assignment reflects reviewer input.':''}</p></div><div class="section-line"><div class="section-heading"><h3>Source evidence</h3><button class="text-btn" data-action="source">Full message ${icon('arrow')}</button></div><div class="source-block"><div class="source-ref">${esc(r.messageId)} · LINE ${r.source.line}</div><div class="source-quote">${esc(r.source.text)}</div></div></div>${r.status==='reviewed'?`<div class="reviewed-note"><strong>Review note</strong><br>${esc(r.note)}</div>`:''}<div class="detail-actions"><button class="btn primary" data-action="review">${icon('check')}${r.status==='reviewed'?'Edit review':'Review & clarify'}</button><button class="btn" data-action="draft">${icon('draft')}Draft response</button></div></div><div class="detail-footer"><span class="dot"></span>Source preserved · Changes stay in this browser</div></article>`;}
function scheduleHTML(){const items=[...scoped().filter(r=>r.type==='EVENT'),...state.calendar.filter(r=>r.command===command)].filter(r=>r.start?.startsWith(scheduleDay)).sort((a,b)=>(E.timestamp(a.start)||0)-(E.timestamp(b.start)||0));const cc=overlap().filter(c=>c.command===command&&c.start.startsWith(scheduleDay));return`<div class="full-panel"><div class="panel-head"><div><h2>Command commitments</h2><p>${items.length} items · ${cc.length} overlapping pairs · Times in UTC</p></div><div class="top-actions"><label class="sr-only" for="schedule-day">Schedule date</label><input type="date" id="schedule-day" value="${scheduleDay}"><button class="btn primary" data-action="add-calendar">${icon('plus')}Add commitment</button></div></div><div class="schedule-large"><div class="time-labels">${['08','09','10','11','12','13','14','15','16','17','18'].map(h=>`<span>${h}:00</span>`).join('')}</div>${items.map(r=>{const pos=position(r,scheduleDay);return pos?`<div class="schedule-track"><button class="schedule-bar ${clashes(r).length?'collision':''}" style="left:${pos.left}%;width:${pos.width}%" data-schedule-item="${esc(r.key)}" title="${esc(r.action)}">${esc(r.action)}</button></div>`:'';}).join('')}<div class="timeline-legend"><span><i class="legend-dot"></i>Scheduled commitment</span><span><i class="legend-dot orange"></i>Time overlap</span><span>Chart window 08:00–18:00</span></div></div>${cc.length?`<div class="callout">${icon('review')}<div><strong>${cc.length} schedule overlap${cc.length>1?'s':''} require coordination</strong>Overlap means two intervals share time for the same command. It does not determine resource availability.</div></div>`:''}<div class="agenda">${items.map(r=>`<div class="agenda-item"><div class="agenda-time">${time(r.start)}–${time(r.end)}<small>${date(r.start)} · UTC</small></div><div><h3>${esc(r.action)}</h3><p>${r.type==='CALENDAR'?esc(r.provenance):`${esc(r.messageId)} · line ${r.source.line}`} · ${esc(r.role)}</p></div><button class="btn small" data-schedule-item="${esc(r.key)}">${r.type==='CALENDAR'?'Edit commitment':'Review source'} ${icon('arrow')}</button></div>`).join('')||'<div class="empty"><h3>A clear schedule</h3><p>No events on this date. Add a commitment or choose another date.</p></div>'}</div></div>`;}
function draftsHTML(){const keys=Object.keys(state.drafts).filter(k=>find(k)?.command===command);if(!keys.includes(draftKey))draftKey=keys[0]||'';return`<div class="full-panel">${keys.length?`<div class="draft-grid"><div><div class="eyebrow">Saved drafts · ${keys.length}</div>${keys.map(k=>`<button class="draft-pick ${draftKey===k?'active':''}" data-draft-key="${esc(k)}">${esc(find(k).action)}<small>${esc(k)} · Not transmitted</small></button>`).join('')}</div><div><div class="section-heading"><h3>Editable response</h3><span class="badge warn">FOR HUMAN REVIEW</span></div><label for="draft-editor" class="sr-only">Response draft</label><textarea id="draft-editor" class="draft-editor">${esc(state.drafts[draftKey].text)}</textarea><div class="editor-toolbar"><small class="subtle" id="draft-save-state">Saved locally · Illustrative format</small><div class="top-actions"><button class="btn" data-action="download-draft">${icon('export')}Export .txt</button><button class="btn primary" data-action="save-draft">Save changes</button></div></div></div></div>`:`<div class="empty">${icon('draft')}<h3>Your response starts with a source.</h3><p>Select an obligation in the inbox, then choose Draft response.</p><button class="btn primary" data-nav="inbox">Open action inbox ${icon('arrow')}</button></div>`}</div>`;}
function rulesHTML(){return`<div class="full-panel"><div class="panel-head"><div><h2>Routing you can explain</h2><p>Exactly one matching topic rule suggests a role. Zero or multiple matches require review.</p></div><button class="btn" data-action="guide">Parser guide</button></div><div class="rules-grid">${E.RULES.map(r=>`<div class="rule"><div class="avatar">${r.role}</div><div><h3>${esc(r.name)}</h3><p>Topic contains: ${r.words.map(esc).join(', ')}.</p></div></div>`).join('')}<div class="rule"><div class="avatar">?</div><div><h3>Human review is the fallback</h3><p>Roles are coordinating suggestions. The app does not assign authority or transmit tasking.</p></div></div></div></div><div class="full-panel"><h2>Built for a clear, bounded demonstration</h2><div class="provenance"><p><strong>Source brief:</strong> Norfolk catalogue case 24, “Automated Message Traffic Task & Event Extraction,” bundled in harness/norfolk-snapshot.ts. This handcrafted demonstration covers command filtering, coordinating-role suggestions, drafts, and schedule overlap detection.</p><p><strong>Supported scope:</strong> Explicit TASK, EVENT, and CORRESPONDENCE lines with labeled fields. Every extracted obligation preserves its original text, line number, and character offsets. Imported prose is retained and reported as unsupported.</p><p><strong>Time & uncertainty:</strong> Strict UTC timestamps only. Relative phrases remain unresolved until a reviewer enters an explicit time and note. The exercise is anchored to 06 November 2026; current local time is used only in the activity log.</p><p><strong>Local only:</strong> Browser storage is not encrypted. No live operational data, identity, message transmission, synchronization, security accreditation, or military-format certification. Draft formatting is illustrative. This is not AppYard-generated or AppYard-verified.</p></div><div class="section-line"><button class="btn" data-action="reset">Reset synthetic workspace</button></div></div>`;}
function historyHTML(){return`<div class="full-panel"><div class="panel-head"><h2>Workspace activity</h2><span class="badge neutral">BROWSER LOCAL</span></div>${state.audit.length?state.audit.map(a=>`<div class="audit-line"><time>${new Date(a.at).toLocaleString('en-GB',{timeZone:'UTC'})} UTC</time><div><strong>${esc(a.action)}</strong><p>${esc(a.key)}${a.note?' · '+esc(a.note):''}</p></div></div>`).join(''):`<div class="empty">${icon('history')}<h3>Ready for your first review</h3><p>Imports, reviews, calendar changes, and draft saves appear here. This local log is editable browser data, not a tamper-proof audit.</p></div>`}</div>`;}
function bindInputs(){const q=$('#search');if(q)q.oninput=()=>{query=q.value;$('#record-list').innerHTML=listHTML();};['type','owner'].forEach(id=>{const e=$('#'+id);if(e)e.onchange=()=>{if(id==='type')type=e.value;else owner=e.value;$('#record-list').innerHTML=listHTML();};});$('#command').onchange=e=>{command=e.target.value;selected=scoped()[0]?.key||'';query='';type=owner=tab='all';render();};if($('#schedule-day'))$('#schedule-day').onchange=e=>{if(e.target.value){scheduleDay=e.target.value;render();}};if($('#draft-editor')){ $('#draft-editor').oninput=()=>{$('#draft-save-state').textContent='Unsaved edits';}; $('#draft-editor').onchange=()=>saveDraft(true); }}
function modal(title,body,footer=''){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}`;document.body.appendChild(d);d.showModal();d.addEventListener('click',e=>{if(e.target===d)d.close();});d.addEventListener('close',()=>d.remove());return d;}
function close(){document.querySelector('dialog')?.close();}
function showSource(){const r=find(selected),m=messageFor(r);modal('Original message',`<p>${esc(m.meta.MSGID)} · Exact source text. Highlighted line ${r.source.line} produced this obligation.</p><div class="source-lines">${m.raw.split('\n').map((l,i)=>`<span class="source-line ${i+1===r.source.line?'highlight':''}"><span class="line-no">${i+1}</span>${esc(l)}</span>`).join('')}</div>`,`<button class="btn" data-action="download-source">${icon('export')}Export source .txt</button><button class="btn primary" data-action="close">Done</button>`);}
function review(){const r=find(selected),original=originals().find(x=>x.key===selected);modal('Review & clarify',`<p>${esc(r.action)}<br>Edits are recorded separately. The original source stays unchanged.</p><div id="form-errors"></div><form id="review-form"><div class="form-field"><label for="edit-action">Action</label><input id="edit-action" value="${esc(r.action)}" maxlength="500"></div><div class="form-grid"><div class="form-field"><label for="edit-role">Coordinating role</label><select id="edit-role">${E.ROLES.map(v=>`<option value="${v}" ${r.role===v?'selected':''}>${v} — ${roleNames[v]}</option>`).join('')}</select></div><div class="form-field"><label for="edit-time">${r.type==='EVENT'?'Start':'Deadline'} (UTC)</label><input type="datetime-local" id="edit-time" value="${E.timestamp(r.type==='EVENT'?r.start:r.due)!==null?(r.type==='EVENT'?r.start:r.due).slice(0,16):''}"><div class="hint">Original: ${esc(original.type==='EVENT'?original.start:original.due)||'Not specified'}</div></div>${r.type==='EVENT'?`<div class="form-field"><label for="edit-end">End (UTC)</label><input type="datetime-local" id="edit-end" value="${E.timestamp(r.end)!==null?r.end.slice(0,16):''}"></div>`:''}</div><div class="form-field"><label for="edit-note">Review note / clarification source</label><textarea id="edit-note" placeholder="Describe what you confirmed and where the clarification came from…">${esc(r.note||'')}</textarea></div>${clashes(r).length?'<div class="review-notice">This event overlaps another commitment. Adjust its times to resolve the overlap, or record your coordination note. Reviewing alone does not remove a conflict.</div>':''}</form>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save-review">${icon('check')}Save reviewed obligation</button>`);}
function saveReview(){const r=find(selected),patch={action:$('#edit-action').value.trim(),role:$('#edit-role').value,note:$('#edit-note').value.trim(),status:'reviewed',issues:[],reviewedAt:new Date().toISOString()};if(r.type==='EVENT'){patch.start=$('#edit-time').value?$('#edit-time').value+'Z':'';patch.end=$('#edit-end').value?$('#edit-end').value+'Z':'';}else patch.due=$('#edit-time').value?$('#edit-time').value+'Z':'';const errors=E.validateReview({...r,...patch});if(errors.length){$('#form-errors').innerHTML=`<div class="error" role="alert">${errors.map(esc).join('<br>')}</div>`;return;}state.edits[r.key]=patch;log('Obligation reviewed',r.key,patch.note);close();render();toast('Review saved. Original source preserved.');}
function importModal(){importPreview=null;modal('Import synthetic message',`<p>Paste a structured message or load a local .txt file. Each supported line becomes a traceable obligation.</p><div class="import-bar"><button class="btn small" data-action="example">Load example</button><label class="btn small file-label">Choose .txt file<input type="file" id="message-file" accept=".txt,text/plain" hidden></label><button class="text-btn" data-action="guide">Parser guide</button></div><div class="form-field"><label for="import-raw">Message text</label><textarea id="import-raw" class="import-text" placeholder="MSGID: EXAMPLE-001&#10;SUBJECT: Exercise update&#10;FROM: EXERCISE CELL&#10;DTG: 2026-11-06T08:00Z&#10;TASK T01 | COMMAND: FNS KESTREL | ACTION: Confirm stores manifest | DUE: 2026-11-06T14:00Z | TOPIC: Supply" maxlength="100000"></textarea></div><div id="import-result" aria-live="polite"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="preview-import">Preview extraction</button><button class="btn accent" id="confirm-import" data-action="confirm-import" disabled>Add to inbox</button>`);$('#import-raw').oninput=()=>{importPreview=null;$('#confirm-import').disabled=true;$('#import-result').innerHTML='';};$('#message-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>100000){$('#import-result').innerHTML='<div class="error">Choose a text file under 100 KB.</div>';return;}$('#import-raw').value=await file.text();$('#import-raw').dispatchEvent(new Event('input'));};}
function previewImport(){const p=E.parseMessage($('#import-raw').value);if(state.messages.some(m=>m.meta.MSGID===p.meta.MSGID))p.errors.push('This MSGID already exists. Use a unique message identifier.');importPreview=p.errors.length?null:p;$('#confirm-import').disabled=!importPreview;$('#import-result').innerHTML=p.errors.length?`<div class="error" role="alert">${p.errors.map(esc).join('<br>')}</div>`:`<div class="success"><strong>${p.records.length} obligations ready to import</strong><br>${p.records.filter(r=>r.issues.length).length} require clarification · Commands: ${[...new Set(p.records.map(r=>r.command))].map(esc).join(', ')}</div>${p.warnings.length?`<div class="error">${p.warnings.map(esc).join('<br>')}</div>`:''}`;}
function guide(){modal('Supported message grammar',`<p>This is a deterministic extractor for labeled synthetic records, not general natural-language understanding.</p><div class="grammar">MSGID: EXAMPLE-001<br>SUBJECT: Exercise coordination<br>FROM: EXERCISE CELL<br>DTG: 2026-11-06T08:00Z<br><br>TASK T01 | COMMAND: FNS KESTREL | ACTION: Confirm readiness | DUE: 2026-11-06T12:00Z | TOPIC: Engineering<br><br>EVENT E01 | COMMAND: FNS KESTREL | ACTION: Readiness brief | START: 2026-11-06T10:00Z | END: 2026-11-06T11:00Z | TOPIC: Operations<br><br>CORRESPONDENCE C01 | COMMAND: FNS KESTREL | ACTION: Acknowledge plan | DUE: tomorrow | TOPIC: Operations</div><p style="margin-top:15px">Use one obligation per line. Headers and fields are uppercase. Record IDs must be unique within a message; MSGID must be unique in the workspace. Timestamps use YYYY-MM-DDTHH:mmZ and a valid calendar date. Missing or relative times are retained for review. Duplicate/unknown fields block import; unsupported prose is reported. Lines starting with # are comments. Maximum input: 100,000 characters.</p>`,`<button class="btn primary" data-action="import">Import a message</button><button class="btn" data-action="close">Close</button>`);}
function calendarModal(key){const r=state.calendar.find(x=>x.key===key);modal(r?'Edit commitment':'Add schedule commitment',`<p>A local schedule entry for ${esc(command)}. All times UTC.</p><div id="form-errors"></div><div class="form-field"><label for="cal-title">Commitment</label><input id="cal-title" value="${esc(r?.action||'')}" maxlength="200"></div><div class="form-grid"><div class="form-field"><label for="cal-start">Start (UTC)</label><input type="datetime-local" id="cal-start" value="${r?.start.slice(0,16)||scheduleDay+'T09:00'}"></div><div class="form-field"><label for="cal-end">End (UTC)</label><input type="datetime-local" id="cal-end" value="${r?.end.slice(0,16)||scheduleDay+'T10:00'}"></div></div><div class="form-field"><label for="cal-role">Coordinating role</label><select id="cal-role">${E.ROLES.filter(v=>v!=='REVIEW').map(v=>`<option ${r?.role===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-field"><label for="cal-note">Schedule source / note</label><input id="cal-note" value="${esc(r?.provenance||'Local synthetic schedule entry')}"></div>`,`<button class="btn" data-action="close">Cancel</button>${r?`<button class="btn" data-delete-calendar="${esc(r.key)}">Remove commitment</button>`:''}<button class="btn primary" data-save-calendar="${esc(key||'new')}">Save commitment</button>`);}
function saveCalendar(key){const action=$('#cal-title').value.trim(),start=$('#cal-start').value+'Z',end=$('#cal-end').value+'Z',provenance=$('#cal-note').value.trim();if(!action||!provenance||E.timestamp(start)===null||E.timestamp(end)===null||E.timestamp(end)<=E.timestamp(start)){$('#form-errors').innerHTML='<div class="error" role="alert">Provide a title, source note, and valid UTC interval with end after start.</div>';return;}const item={key:key==='new'?'cal-'+Date.now():key,command,action,start,end,provenance,role:$('#cal-role').value,type:'CALENDAR'};if(key==='new')state.calendar.push(item);else state.calendar=state.calendar.map(c=>c.key===key?item:c);log('Schedule commitment saved',item.key,action);close();render();toast('Schedule updated. Overlaps recalculated.');}
function download(name,data,mime='text/plain'){const blob=new Blob([data],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Export prepared: '+name);}
function saveDraft(silent=false){if(!draftKey||!$('#draft-editor'))return;const text=$('#draft-editor').value;if(!text.trim()){toast('A draft cannot be empty.');return false;}state.drafts[draftKey]={text,updatedAt:new Date().toISOString()};log('Response draft saved',draftKey,'Editable draft; not transmitted');$('#draft-save-state').textContent='Saved locally · Illustrative format';if(!silent)toast('Response draft saved locally.');return true;}
function exportModal(){modal('Export local workspace',`<p>The packet includes all ${all().length} obligations across all commands, original messages, review corrections, calendar entries, saved drafts, overlap results, and local activity. Current filters do not limit the export.</p><div class="export-options"><button class="export-choice" data-action="download-packet">${icon('export')}<div><span>Complete review packet · JSON</span><small>Machine-readable records with exact sources and editable drafts.</small></div>${icon('arrow')}</button><button class="export-choice" data-action="download-brief">${icon('draft')}<div><span>Command action brief · Text</span><small>Readable summary for ${esc(command)} with source references.</small></div>${icon('arrow')}</button></div>`,`<button class="btn" data-action="close">Close</button>`);}
function brief(){return`DISPATCH — SYNTHETIC COMMAND ACTION BRIEF\n${command}\nAll times UTC. Human review required.\n\n`+scoped().map(r=>`${r.id} | ${r.type} | ${r.action}\nRole: ${r.role} | ${r.status}\nTime: ${r.type==='EVENT'?r.start+' — '+r.end:r.due}\nSource: ${r.messageId}, line ${r.source.line}\nFlags: ${[...r.issues,...(clashes(r).length?['Schedule overlap']:[])].join('; ')||'None'}\nReview note: ${r.note||'Not reviewed'}\n`).join('\n');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){view=b.dataset.nav;query='';owner=type=tab='all';render();return;}if(b.dataset.select){selected=b.dataset.select;$('#record-list').innerHTML=listHTML();$('#detail').innerHTML=detailHTML();if(innerWidth<761)$('#detail').scrollIntoView({behavior:'smooth',block:'start'});return;}if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.draftKey){draftKey=b.dataset.draftKey;render();return;}if(b.dataset.scheduleItem){const k=b.dataset.scheduleItem;if(k.startsWith('cal-'))calendarModal(k);else{selected=k;view='inbox';render();}return;}if(b.dataset.saveCalendar){saveCalendar(b.dataset.saveCalendar);return;}if(b.dataset.deleteCalendar){const k=b.dataset.deleteCalendar;state.calendar=state.calendar.filter(r=>r.key!==k);log('Schedule commitment removed',k,'Local calendar only');close();render();toast('Commitment removed.');return;}
const a=b.dataset.action;if(a==='close')close();if(a==='clear-filters'){query='';owner=type=tab='all';render();}if(a==='source')showSource();if(a==='review')review();if(a==='save-review')saveReview();if(a==='import')importModal();if(a==='guide')guide();if(a==='example'){$('#import-raw').value=D.example;$('#import-raw').dispatchEvent(new Event('input'));}if(a==='preview-import')previewImport();if(a==='confirm-import'&&importPreview){const p=importPreview;state.messages.push(p);command=p.records[0].command;selected=p.meta.MSGID+'/'+p.records[0].id;log('Message imported',p.meta.MSGID,`${p.records.length} obligations; ${p.warnings.length} unsupported lines`);importPreview=null;view='inbox';query='';owner=type=tab='all';close();render();toast(`${p.records.length} obligations added. Source text retained.`);}if(a==='draft'){const r=find(selected);if(!state.drafts[r.key]){state.drafts[r.key]={text:E.draft(r,messageFor(r)),updatedAt:new Date().toISOString()};log('Response draft created',r.key,'Illustrative format; not transmitted');}draftKey=r.key;view='drafts';render();}if(a==='save-draft')saveDraft();if(a==='download-draft'){if(saveDraft(true))download(draftKey.replace('/','-')+'-draft.txt',state.drafts[draftKey].text);}if(a==='download-source'){const r=find(selected);download(r.messageId+'-source.txt',messageFor(r).raw);}if(a==='export')exportModal();if(a==='download-packet'){download('dispatch-review-packet.json',JSON.stringify(E.exportPacket(state,originals()),null,2),'application/json');}if(a==='download-brief')download('dispatch-'+command.toLowerCase().replaceAll(' ','-')+'-brief.txt',brief());if(a==='add-calendar')calendarModal();if(a==='reset')modal('Reset synthetic workspace?',`<p>This removes locally imported messages, reviews, drafts, and schedule edits. Export a packet first if you want to keep them. The original synthetic examples will be restored.</p>`,`<button class="btn" data-action="close">Cancel</button><button class="btn accent" data-action="confirm-reset">Reset workspace</button>`);if(a==='confirm-reset'){state=fresh();recovery='';persist();command='FNS KESTREL';selected='EX-1106-021/E01';view='inbox';query='';owner=type=tab='all';close();render();toast('Synthetic workspace restored.');}});
render();
})();
</script></body></html>
