 try{const saved=localStorage.getItem(key);state=saved?JSON.parse(saved):blank();if(!Array.isArray(state.observations)||state.observations.length>500||state.observations.some(o=>E.validate(o).length||typeof o.id!=='string')||new Set(state.observations.map(o=>o.time)).size!==state.observations.length||new Set(state.observations.map(o=>o.id)).size!==state.observations.length||!Array.isArray(state.audit)||state.audit.some(a=>!a||typeof a.time!=='string'||!Number.isFinite(new Date(a.time).valueOf())||typeof a.action!=='string'||typeof a.detail!=='string')||typeof state.halted!=='boolean'||typeof state.reviewed!=='boolean'||!Array.isArray(state.checks)||state.checks.length!==4||state.checks.some(x=>typeof x!=='boolean')||typeof state.reviewNote!=='string'||!E.profiles.some(p=>p.id===state.profile))throw Error('Invalid workspace');state.observations.sort((a,b)=>a.time.localeCompare(b.time));if(!state.observations.some(o=>o.id===state.selected))state.selected=state.observations.at(-1)?.id||null;}catch{state=blank();storageWarning='Saved workspace could not be read. A fresh exercise is shown; export a copy before closing if browser storage is unavailable.';}
 const selected=()=>state.observations.find(o=>o.id===state.selected)||state.observations.at(-1);

 function render(){const o=selected();$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">${icon('wave')}</div><div><strong>Digital SUROB</strong><small>BEACH OBSERVATION DESK</small></div></div><div class="workspace-label">WORKSPACE / 017</div><nav class="nav" aria-label="Workspace navigation">${[['observations','log','Observations'],['craft','craft','Craft comparison'],['review','check','Review brief'],['activity','activity','Activity log']].map(([id,ic,label])=>`<button data-nav="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${icon(ic)}${label}${id==='review'?`<span class="count">${state.checks.filter(Boolean).length}/4</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="station-box"><div class="eyebrow">EXERCISE STATION</div><strong>Stony Inlet · North beach</strong><p><span class="dot"></span>Local workspace ready</p></div><button class="stop" data-action="halt">${icon(state.halted?'reset':'stop')}${state.halted?'Resume workspace':'Pause workspace'}</button><div class="sidebar-foot">SYNTHETIC / UNCLASSIFIED DEMO</div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb">Norfolk / <b>Surf observation workspace</b></div><div class="top-tools"><span class="exercise">EXERCISE DATA</span><span class="offline">${icon('shield')}Offline ready</span></div></header>${state.halted?'<div class="halt-banner">Workspace paused · Observation changes and review completion are disabled. Resume from the sidebar.</div>':''}${storageWarning?`<div class="saved-warning">${esc(storageWarning)}</div>`:''}<div class="page"><div class="page-head"><div><h1>${{observations:'Read the surf. Keep the judgment.',craft:'Compare the craft profiles.',review:'A clear handover starts here.',activity:'Every change, in context.'}[view]}</h1><p>${{observations:'Observe conditions, understand the trend, prepare the human review.',craft:'Explore how the same observation compares with illustrative limits.',review:'Check the evidence and export a reviewable exercise brief.',activity:'A browser-local record of inputs, edits, review steps, and exports.'}[view]}</p></div><div class="actions">${view==='observations'?`<button class="btn" data-action="import" ${state.halted?'disabled':''}>${icon('upload')}Import</button><button class="btn primary" data-action="new" ${state.halted?'disabled':''}>${icon('plus')}Add observation</button>`:view==='activity'?`<button class="btn" data-action="json">${icon('download')}Export workspace</button>`:`<button class="btn" data-nav="observations">${icon('arrow')}Back to observations</button>`}</div></div><div class="notice">${icon('info')}<span><b>Illustrative model.</b> Scores and craft limits are synthetic. This workspace cannot issue an operational GO / NO-GO.</span><button data-action="model">View method</button></div>${view==='observations'?observations(o):view==='craft'?craftView(o):view==='review'?reviewView(o):activityView()}<footer class="page-foot"><span>LOCAL EXERCISE · ${state.observations.length} OBSERVATIONS · ALL TIMES UTC</span><button class="text-button" data-action="guide">${icon('help')}Scope & source notes</button></footer></div></main></div>`;}
 function coast(o){return `<svg class="coast" viewBox="0 0 250 175" role="img" aria-label="Schematic of shore, angled breakers, and alongshore current. Not a map."><defs><pattern id="dots" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#bacbb4"/></pattern></defs><path d="M188 7C172 38 191 60 178 93S171 137 155 174H250V7Z" fill="#dbe3cc"/><path d="M188 7C172 38 191 60 178 93S171 137 155 174" stroke="#a8bb98" fill="none" stroke-width="1.5"/><path d="M200 10C187 40 205 60 193 98S185 138 170 175H250V10Z" fill="url(#dots)"/><g fill="none" stroke="#aacabb" stroke-width="2"><path d="M29 25q12 11 24 0t24 0M23 60q12 11 24 0t24 0M16 95q12 11 24 0t24 0M9 130q12 11 24 0t24 0"/></g><g stroke="#78a78c" stroke-width="2" fill="none" transform="rotate(${Math.min(o.angle,40)} 130 90)"><path d="M119 34q14 7 28 0M110 60q14 7 28 0M103 86q14 7 28 0M94 112q14 7 28 0"/></g><path d="M158 65l-8 55m-4-8 4 8 7-6" fill="none" stroke="#4a886c" stroke-width="1.5"/><path d="M104 79h38m-6-5 6 5-6 5" stroke="#36775d" fill="none"/><text x="32" y="161" font-size="8" font-family="DM" fill="#83957d">SURF ZONE</text><text x="203" y="91" font-size="8" font-family="DM" fill="#83957d" transform="rotate(-90 203 91)">NORTH BEACH</text><text x="116" y="59" font-size="9" font-family="Plex" fill="#4f8065">${o.angle}°</text><circle cx="181" cy="50" r="4" fill="#326e55"/><circle cx="181" cy="50" r="8" stroke="#326e55" fill="none" opacity=".3"/></svg>`;}
 function observations(o){if(!o)return empty();const s=E.score(o),first=E.score(state.observations[0]).total,delta=Math.round((s.total-first)*10)/10;return `<div class="layout"><section class="primary-column"><div class="panel hero"><div class="hero-top"><div><div class="location eyebrow">${icon('pin')}STATION N-01 / SYNTHETIC</div><h2>Stony Inlet, north beach</h2><div class="subline">${date(o.time)} <span aria-hidden="true">&nbsp; / &nbsp;</span> ${time(o.time)} UTC <span aria-hidden="true">&nbsp; / &nbsp;</span> ${esc(o.id)}</div></div><span class="tag">${o.id===state.observations.at(-1).id?'Latest observation':'Selected observation'}</span></div><div class="hero-content"><div><div class="eyebrow" style="color:#6b826f">ILLUSTRATIVE EXPOSURE SCORE</div><div class="score-wrap"><span class="score-value">${s.total.toFixed(1)}</span><div class="score-info"><strong>${delta>=0?'↗':'↘'} ${signed(delta)} since ${time(state.observations[0].time)}</strong><span>Range ${s.low.toFixed(1)}–${s.high.toFixed(1)}</span></div></div><div class="score-caption">Height uncertainty ±${o.uncertainty} m · not MSI</div></div>${coast(o)}</div><div class="metric-strip"><div class="metric"><div class="label">${icon('wave')}Breaker height</div><strong>${o.height.toFixed(1)} <small>m</small></strong></div><div class="metric"><div class="label">${icon('clock')}Wave period</div><strong>${o.period.toFixed(1)} <small>sec</small></strong></div><div class="metric"><div class="label">${icon('angle')}Breaker angle</div><strong>${o.angle} <small>deg</small></strong></div></div></div><div class="panel chart-panel"><div class="panel-heading"><div><h3>Conditions over time</h3><p>${state.observations.length} observations · Select a point to inspect</p></div><div class="segmented" aria-label="Chart metric"><button data-chart="score" class="${chartMode==='score'?'active':''}" aria-pressed="${chartMode==='score'}">Score</button><button data-chart="height" class="${chartMode==='height'?'active':''}" aria-presse  function profileBar(o,p){const c=E.compare(o,p),cls=c.status.startsWith('Above')?'over':c.status.startsWith('Uncertainty')?'overlap':'';return `<button class="profile-button ${state.profile===p.id?'active':''}" data-profile="${p.id}" aria-pressed="${state.profile===p.id}" aria-label="Select ${p.id}, ${c.status}"><div class="profile-title"><b>${p.id}</b><small>${p.limit} pts</small></div><div class="bar ${cls}"><span style="width:${Math.min(100,c.score/80*100)}%"></span><i class="marker" style="left:${p.limit/80*100}%"></i></div><div class="profile-footer"><span class="${cls}">${c.status}</span><span>${Math.abs(c.margin).toFixed(1)} ${c.margin<0?'above':'below'}</span></div></button>`;}

${time(a.time)}</text>`).join('')}</svg>`;}
 function records(){const obs=state.observations.filter(o=>`${o.id} ${o.time} ${o.breaker} ${o.notes} ${o.source}`.toLowerCase().includes(query.toLowerCase())).slice().reverse();if(!obs.length)return `<div class="empty"><h3>No matching observations</h3><p>Try a time, breaker type, source, or note.</p><button class="btn small" data-action="clear-search">Clear search</button></div>`;return `<div class="table-scroll"><table><thead><tr><th>TIME (UTC)</th><th>HEIGHT</th><th>PERIOD</th><th>BREAKERS</th><th>SCORE</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${obs.map(o=>`<tr data-id="${esc(o.id)}" class="${o.id===state.selected?'selected':''}"><td class="mono"><button class="table-button" data-select="${esc(o.id)}">${o.id===state.selected?'<span class="row-dot"></span>':''}${time(o.time)}</button></td><td>${o.height.toFixed(1)} m</td><td>${o.period.toFixed(1)} s</td><td>${o.breaker}</td><td class="mono">${E.score(o).total.toFixed(1)}</td><td><button class="table-button" data-edit="${esc(o.id)}" ${state.halted?'disabled':''} aria-label="Edit observation ${time(o.time)}">${icon('edit')} Edit</button></td></tr>`).join('')}</tbody></table></div>`;}

 function activityView(){return `<div class="panel activity"><div class="panel-heading"><div><h3>Local activity record</h3><p>${state.audit.length} events · Stored in this browser · Not tamper-evident</p></div><button class="btn small" data-action="guide">Data controls</button></div>${state.audit.slice().reverse().map(a=>`<div class="activity-entry"><time>${esc(date(a.time))}<br>${esc(a.time.slice(11,19))} UTC</time><div><strong>${esc(a.action)}</strong><p>${esc(a.detail)}</p></div></div>`).join('')}</div>`;}

 const example=()=>E.seed().map(({id,...o})=>o);
 function importDialog(){if(!canEdit())return;pendingImport=null;showModal('Import exercise observations',`<div class="dialog-body"><p>Append JSON or CSV records. Imports are validated together; existing observations are preserved. Maximum 500 total records, 1 MB per file.</p><div class="actions"><button class="btn small" data-action="template">Download CSV template</button><button class="btn small" data-action="import-example">Paste example JSON</button></div><label class="file-zone">Choose a local JSON or CSV file<input type="file" id="import-file" accept=".json,.csv,application/json,text/csv"></label><label class="field">Format<select id="import-format"><option value="json">JSON observation array</option><option value="csv">CSV with header row</option></select></label><textarea id="import-text" class="import-text" aria-label="Observation import content" placeholder="Paste JSON or CSV here…"></textarea><div id="import-errors" class="errors" role="alert"></div><div id="import-status" class="import-status" role="status"></div></div>`,`<div class="dialog-footer"><button class="btn" data-action="close">Cancel</button><button class="btn" data-action="validate-import">Validate</button><button id="import-apply" class="btn primary" data-action="apply-import" disabled>Import records</button></div>`);}
 function validateImport(){try{const rows=E.parse($('#import-text').value,$('#import-format').value);const duplicate=rows.find(r=>state.observations.some(o=>o.time===r.time));if(duplicate)throw Error(`An observation already exists at ${duplicate.time}. Edit it in the log or use a new timestamp.`);if(rows.length+state.observations.length>500)throw Error('Workspace is limited to 500 observations. Export and clear it before importing more.');pendingImport=rows;$('#import-errors').textContent='';$('#import-status').textContent=`${rows.length} valid observation${rows.length===1?'':'s'} ready to append. Review state will reset.`;$('#import-apply').disabled=false;}catch(e){pendingImport=null;$('#import-errors').textContent=e.message;$('#import-status').textContent='';$('#import-apply').disabled=true;}}
 function guide(){showModal('Scope, sources & local data',`<div class="dialog-body"><p>A handcrafted offline demonstration for Norfolk catalogue case #17. Not AppYard-generated or AppYard-verified.</p><ul class="help-list"><li><b>Source brief:</b> bundled harness/norfolk-snapshot.ts, ID 17. Stony Inlet and every observation are fictional. Craft names are from the catalogue; all numeric limits are invented.</li><li><b>Missing authoritative inputs:</b> NTTP 3-59.3M, MCRP 2-10.3, BMU-HNDBK-5400.1B and a calculator prototype were named, but their contents and formulas were not supplied or used.</li><li><b>Supported:</b> typed records, JSON / CSV import, local deterministic scoring, craft comparisons, review checklist, local audit, HTML and JSON export.</li><li><b>Outside scope:</b> actual MSI, certified Alpha–Hotel SUROB formatting, speech recognition, historical worksheet validation, authenticated approvals, operational recommendations, and transmission. No language model or live integration runs here.</li><li><b>Data:</b> saved in browser local storage. No encryption, security boundary, or tamper-evident audit. Workspace JSON includes observations and activity but imports only observation data; review evidence is never restored from an imported file.</li></ul><div class="model-warning">Only training records belong in this demonstration.</div><div class="actions" style="flex-wrap:wrap"><button class="btn" data-action="restore" ${state.halted?'disabled':''}>${icon('reset')}Restore example watch</button><button class="btn danger" data-action="clear" ${state.halted?'disabled':''}>Clear observations</button></div></div>`);}
 function selectObservation(id){if(state.selected===id)return;state.selected=id;invalidate();audit('Observation selected',`Review context changed to ${id}; checklist reset.`);render();}
 function download(name,type,content){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
 function payload(){const o=selected();return {schema:'digital-surob-exercise/v1',label:'SYNTHETIC EXERCISE — NOT AN OPERATIONAL SUROB REPORT',generatedAt:new Date().toISOString(),station:'Stony Inlet · North beach · fictional station N-01',selectedObservationId:o?.id||null,observations:state.observations,model:{name:'Illustrative exposure score, NOT MSI',formula:'20 × height(m) + 1.5 × period(s) + 0.25 × abs(angle(deg)) + 10 × current(kn)',provenance:'Invented demonstration model; authoritative coefficients not supplied.',uncertainty:'Height-only sensitivity, not a confidence interval; other uncertainty omitted.'},calculation:o?E.score(o):null,craftProfiles:E.profiles.map(p=>({...p,provenance:'Synthetic example limit; not a real craft capability'})),comparison:o?E.profiles.map(p=>E.compare(o,p)):[],review:{status:state.reviewed?'Exercise review recorded':'Draft — review pending',checks:E.checks.map((label,i)=>({label,checked:state.checks[i]})),note:state.reviewNote,operationalAuthorization:'NONE — external BPTC/SRM authority required'},paused:state.halted,audit:state.audit,source:'Bundled Norfolk catalogue ID 17; no authoritative manual contents were supplied.'};}
 function exportBrief(){const o=selected();if(!o)return;const d=payload();audit('Brief exported',`${o.id}; ${d.review.status}. No operational authorization.`);const s=d.calculation;const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Digital SUROB exercise brief — ${esc(o.id)}</title><style>body{font:14px/1.6 system-ui,sans-serif;color:#203d35;max-width:900px;margin:45px auto;padding:0 25px}h1{font-size:32px;line-height:1.2}h2{font-size:19px;margin-top:30px;border-bottom:1px solid #ccd8cf;padding-bottom:8px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #dce3db}th{background:#f1f5ee}.banner{background:#eaf0e4;padding:14px;border-left:4px solid #748350}small{color:#70806c}.formula{background:#f1f5ee;padding:15px}p,td{overflow-wrap:anywhere}@media print{body{margin:15px;font-size:11px}h2{break-after:avoid}tr{break-inside:avoid}}</style></head><body><small>DIGITAL SUROB / NORFOLK CASE 17 / HANDCRAFTED DEMO</small><h1>Stony Inlet, north beach</h1><p>${esc(date(o.time))} · ${esc(time(o.time))} UTC · ${esc(o.id)}</p><div class="banner"><b>SYNTHETIC EXERCISE — NOT AN OPERATIONAL SUROB REPORT</b><br>${esc(d.review.status)}. No operational GO / NO-GO is issued. BPTC / SRM authority remains required outside this demo.${state.halted?'<br>Workspace was paused when exported.':''}</div><h2>Selected observation</h2><table><tbody>${[['Source',o.source],['Breaker height',`${o.height} m ±${o.uncertainty} m`],['Period',`${o.period} sec`],['Breaker angle',`${o.angle}°`],['Alongshore current',`${o.current} kn`],['Wind speed',`${o.wind} kn`],['Breaker type',o.breaker],['Observer notes',o.notes||'None supplied.']].map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table><h2>Illustrative calculation — not MSI</h2><p>${esc(d.model.provenance)}</p><div class="formula">${esc(d.model.formula)}</div><table><tbody>${s.parts.map(p=>`<tr><td>${p.label}</td><td>${esc(p.math)}</td><td>${p.value.toFixed(2)}</td></tr>`).join('')}<tr><th>Total, rounded to one decimal</th><td></td><th>${s.total.toFixed(1)}</th></tr></tbody></table><p>Height-only sensitivity: ${s.low}–${s.high} points. ${esc(d.model.uncertainty)} Wind speed and breaker type are context only.</p><h2>Craft comparisons — invented example limits</h2><table><thead><tr><th>Craft</th><th>Example limit</th><th>Margin</th><th>Comparison</th></tr></thead><tbody>${d.comparison.map(c=>`<tr><td>${c.profile.id}</td><td>${c.profile.limit}</td><td>${signed(c.margin)}</td><td>${c.status}</td></tr>`).join('')}</tbody></table><p>Positive margin means the score is below the invented limit. Below does not mean cleared. The uncertainty range is compared with each example limit.</p><h2>Human review record</h2><p>Status: ${esc(d.review.status)}</p><ul>${d.review.checks.map(c=>`<li>${c.checked?'[checked]':'[pending]'} ${esc(c.label)}</li>`).join('')}</ul><p>Review note: ${esc(d.review.note||'None supplied.')}</p><h2>Observation history</h2><table><thead><tr><th>UTC</th><th>Height (m)</th><th>Period (s)</th><th>Angle (°)</th><th>Current (kn)</th><th>Score</th></tr></thead><tbody>${d.observations.map(r=>`<tr><td>${esc(r.time)}</td><td>${r.height}</td><td>${r.period}</td><td>${r.angle}</td><td>${r.current}</td><td>${E.score(r).total.toFixed(1)}</td></tr>`).join('')}</tbody></table><h2>Provenance and limitations</h2><p>${esc(d.source)} The brief is not certified Alpha–Hotel formatting, an authenticated approval, or an official record. No historical worksheet validation or time-saving claims are made. No speech, language model, network service, or transmission is used.</p><p>Review and audit records are browser-local and not tamper-evident. The workspace JSON export carries the full local activity and input history.</p><small>Generated ${esc(d.generatedAt)} · Software-created exercise brief · No operational authority</small></body></html>`;download(`digital-surob-${o.id}-brief.html`,'text/html;charset=utf-8',html);notify('Exercise brief exported with calculations and source notes.');}
 document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;render();window.scrollTo(0,0);return;}const pt=e.target.closest('[data-point]'),sel=e.target.closest('[data-select]');if(pt||sel){selectObservation((pt||sel).dataset.point||(pt||sel).dataset.select);return;}const edit=e.target.closest('[data-edit]');if(edit){observationDialog(edit.dataset.edit);return;}const row=e.target.closest('tr[data-id]');if(row){selectObservation(row.dataset.id);return;}const pr=e.target.closest('[data-profile]');if(pr){state.profile=pr.dataset.profile;save();render();return;}const chartButton=e.target.closest('[data-chart]');if(chartButton){chartMode=chartButton.dataset.chart;render();return;}const act=e.target.closest('[data-action]');if(!act||act.disabled)return;switch(act.dataset.action){
 case'close':close();break;
 case'new':observationDialog();break;
 case'import':importDialog();break;
 case'guide':guide();break;
 case'model':showModal('The model is illustrative',`<div class="dialog-body"><p>No authoritative MSI formula was supplied. This deterministic teaching model is not MSI, and the numeric craft limits are invented.</p>${selected()?math(selected()):'<p>Add an observation to see the calculation steps.</p>'}<p style="margin-top:18px">Comparison logic: above if the entire height-sensitivity range exceeds a limit; uncertainty overlaps if its upper bound exceeds a limit; below otherwise. Physical input bounds are software validation ranges, not craft safety limits.</p></div>`);break;
 case'clear-search':query='';render();$('#search')?.focus();break;
 case'halt':state.halted=!state.halted;audit(state.halted?'Workspace paused':'Workspace resumed',state.halted?'Input changes and review completion paused. Read-only inspection and exports remain available.':'Input changes and exercise review enabled.');render();notify(state.halted?'Workspace paused.':'Workspace resumed.');break;
 case'import-example':$('#import-format').value='json';$('#import-text').value=JSON.stringify([{...example().at(-1),time:'2026-11-05T07:45:00Z',height:1.5,notes:'Synthetic imported observation. Breaker height increasing.'}],null,2);pendingImport=null;$('#import-apply').disabled=true;$('#import-errors').textContent='';$('#import-status').textContent='Example loaded. Validate to inspect it.';break;
 case'template':download('surob-observations-template.csv','text/csv','time,height,period,angle,current,wind,uncertainty,breaker,notes,source\n2026-11-05T07:45:00Z,1.5,7.2,18,0.5,14,0.1,Plunging,"Synthetic imported observation",Synthetic exercise\n');break;
 case'validate-import':validateImport();break;
 case'apply-import':if(!canEdit()||!pendingImport)return;const imported=pendingImport.map(o=>({...o,id:`OBS-${cryptoId()}`}));state.observations.push(...imported);state.observations.sort((a,b)=>a.time.localeCompare(b.time));state.selected=imported.at(-1).id;invalidate();audit('Observations imported',`${imported.length} validated synthetic records appended. Review reset.`,{observations:imported});close();view='observations';query='';render();notify(`${imported.length} observation${imported.length===1?'':'s'} imported.`);break;
 case'review-complete':if(!canEdit()||!state.checks.every(Boolean))return;state.reviewed=true;audit('Exercise review recorded',`${state.selected}; four checks acknowledged. No operational authorization.`,{checks:state.checks.slice(),note:state.reviewNote});render();notify('Exercise review recorded. No operational authorization issued.');break;
 case'reopen':if(!canEdit())return;state.reviewed=false;audit('Exercise review reopened',state.selected);render();break;
 case'brief':exportBrief();break;
 case'json':audit('Workspace exported','JSON includes observations, local audit, synthetic model, and review state.');download('digital-surob-workspace.json','application/json',JSON.stringify(payload(),null,2));notify('Workspace JSON exported.');break;
 case'restore':case'clear':if(!canEdit())return;const action=act.dataset.action;showModal(action==='restore'?'Restore the example watch?':'Clear the observation log?',`<div class="dialog-body"><p>${action==='restore'?'Replace the current observations with the seven original synthetic records.':'Remove all observations and review state from this browser workspace.'} The local activity log is retained. Export your workspace first if you need a copy.</p><button class="text-button" data-action="json">Export a workspace copy ${icon('download')}</button></div>`,`<div class="dialog-footer"><button class="btn" data-action="close">Cancel</button><button class="btn ${action==='clear'?'danger':'primary'}" data-action="confirm-${action}">${action==='clear'?'Clear observations':'Restore examples'}</button></div>`);break;
 case'confirm-restore':case'confirm-clear':if(!canEdit())return;const restore=act.dataset.action==='confirm-restore',before=state.observations;state.observations=restore?E.seed():[];state.selected=state.observations.at(-1)?.id||null;invalidate();audit(restore?'Example watch restored':'Observations cleared',`${before.length} previous records preserved in this activity event.`,{before,after:state.observations});query='';view='observations';close();render();notify(restore?'Example watch restored.':'Observation log cleared.');break;
 }});
 function cryptoId(){return globalThis.crypto?.randomUUID?crypto.randomUUID().slice(0,8).toUpperCase():Math.random().toString(36).slice(2,10).toUpperCase();}
 document.addEventListener('keydown',e=>{const pt=e.target.closest('[data-point]');if(pt&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectObservation(pt.dataset.point);}});
 document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#record-table').innerHTML=records();}if(e.target.id==='import-text'){pendingImport=null;$('#import-apply').disabled=true;$('#import-status').textContent='';}if(e.target.id==='review-note'&&!state.halted){state.reviewNote=e.target.value;state.reviewed=false;save();}});
 document.addEventListener('change',async e=>{if(e.target.matches('[data-check]')){if(!canEdit())return;state.checks[Number(e.target.dataset.check)]=e.target.checked;state.reviewed=false;audit('Review check changed',`${E.checks[Number(e.target.dataset.check)]}: ${e.target.checked?'acknowledged':'pending'}`);render();}if(e.target.id==='review-note')audit('Review note edited',state.selected,{note:state.reviewNote});if(e.target.id==='import-format'){pendingImport=null;$('#import-apply').disabled=true;$('#import-status').textContent='';}if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;pendingImport=null;$('#import-apply').disabled=true;if(file.size>1000000){$('#import-errors').textContent='File is too large. Maximum size is 1 MB.';return;}try{$('#import-text').value=await file.text();$('#import-format').value=file.name.toLowerCase().endsWith('.csv')?'csv':'json';$('#import-status').textContent=`${file.name} loaded. Validate before importing.`;$('#import-errors').textContent='';}catch{$('#import-errors').textContent='This file could not be read. Try another file or paste its contents.';}}});
 document.addEventListener('submit',e=>{if(e.target.id!=='observation-form')return;e.preventDefault();if(!canEdit())return;const f=new FormData(e.target),o={};for(const k of ['height','period','angle','current','wind','uncertainty'])o[k]=String(f.get(k)).trim()===''?NaN:Number(f.get(k));o.time=f.get('time')+':00Z';o.breaker=f.get('breaker');o.notes=f.get('notes');o.source=f.get('source');const id=e.target.dataset.editId,errors=E.validate(o);if(state.observations.some(r=>r.time===o.time&&r.id!==id))errors.push('An observation already exists at that UTC time. Edit it or choose another time.');if(!id&&state.observations.length>=500)errors.push('Workspace limit reached: 500 observations.');if(errors.length){$('#form-errors').textContent=errors.join(' ');return;}const before=state.observations.find(r=>r.id===id);o.id=id||`OBS-${cryptoId()}`;state.observations=state.observations.filter(r=>r.id!==id).concat(o).sort((a,b)=>a.time.localeCompare(b.time));state.selected=o.id;invalidate();audit(id?'Observation edited':'Observation added',`${o.id} · ${time(o.time)} UTC. Review reset.`,{before:before||null,after:o});close();query='';view='observations';render();notify(id?'Observation updated; review checklist reset.':'Observation added to the watch.');});
 $('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
 save();render();
})();
</script></body></html>
