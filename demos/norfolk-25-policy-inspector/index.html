'use strict';
const arr = v => Array.isArray(v) ? v : [v];
function wildcard(pattern,value,ignoreCase=false){
  if(ignoreCase){pattern=pattern.toLowerCase();value=value.toLowerCase();}
  let p=0,v=0,star=-1,retry=0;
  while(v<value.length){
    if(p<pattern.length&&(pattern[p]==='?'||pattern[p]===value[v])){p++;v++;}
    else if(pattern[p]==='*'){star=p++;retry=v;}
    else if(star!==-1){p=star+1;v=++retry;}
    else return false;
  }
  while(pattern[p]==='*')p++;
  return p===pattern.length;
}

function validate(input){
  const errors=[];
  if(!input || typeof input!=='object' || Array.isArray(input)) throw new Error('Expected a JSON object.');
  Object.keys(input).filter(k=>!['name','principal','policies','probes'].includes(k)).forEach(k=>errors.push(`Unsupported workspace field: ${k}.`));
  if(typeof input.name!=='string'||!input.name.trim()) errors.push('Workspace name is required.');
  if(typeof input.principal!=='string'||!input.principal.trim()) errors.push('A synthetic principal name is required.');
  if(!Array.isArray(input.policies)) errors.push('policies must be an array.');
  if(!Array.isArray(input.probes)) errors.push('probes must be an array.');
  if((input.policies?.length||0)>50) errors.push('Maximum 50 policies per workspace.');
  if((input.probes?.length||0)>100) errors.push('Maximum 100 permission probes.');
  const names=new Set();
  (Array.isArray(input.policies)?input.policies:[]).forEach((p,i)=>{
    const prefix=`Policy ${i+1}`;
    if(!p||typeof p!=='object'){errors.push(`${prefix} must be an object.`);return;}
    Object.keys(p).filter(k=>!['name','document'].includes(k)).forEach(k=>errors.push(`${prefix}: unsupported policy field ${k}.`));
    if(typeof p.name!=='string'||!p.name.trim()) errors.push(`${prefix}: name is required.`);
    if(names.has(p.name)) errors.push(`${prefix}: duplicate policy name.`); names.add(p.name);
    if(!p.document || typeof p.document!=='object'){errors.push(`${prefix}: document is required.`);return;}
    Object.keys(p.document).filter(k=>!['Version','Id','Statement'].includes(k)).forEach(k=>errors.push(`${prefix}: unsupported document field ${k}.`));
    if(!p.document.Statement){errors.push(`${prefix}: Statement is required.`);return;}
    const stmts=arr(p.document.Statement);
    if(stmts.length>100)errors.push(`${prefix}: maximum 100 statements.`);
    stmts.forEach((s,j)=>{
      const at=`${prefix}, statement ${j+1}`;
      if(!s||typeof s!=='object'||Array.isArray(s)){errors.push(`${at}: expected an object.`);return;}
      Object.keys(s).filter(k=>!['Sid','Effect','Action','Resource','Condition'].includes(k)).forEach(k=>errors.push(`${at}: ${k} is outside the supported identity-policy subset.`));
      if(!['Allow','Deny'].includes(s.Effect)) errors.push(`${at}: Effect must be Allow or Deny.`);
      for(const key of ['Action','Resource']) if(!s[key] || !arr(s[key]).length || arr(s[key]).some(v=>typeof v!=='string'||!v.trim()||v.length>500))errors.push(`${at}: ${key} must be a nonempty string or string array (500 characters maximum each).`);
      if(s.Resource && arr(s.Resource).some(v=>typeof v==='string'&&v.includes('${'))) errors.push(`${at}: policy variables are outside the supported subset.`);
      if(s.Sid!==undefined && typeof s.Sid!=='string')errors.push(`${at}: Sid must be a string.`);
      if(s.Action && arr(s.Action).some(v=>typeof v==='string' && v!=='*' && !/^[a-zA-Z0-9*?-]+:[a-zA-Z0-9*?]+$/.test(v)))errors.push(`${at}: Action must use service:Action syntax or *.`);
      if('Condition' in s && (!s.Condition||typeof s.Condition!=='object'||Array.isArray(s.Condition))) errors.push(`${at}: Condition must be an object.`);
    });
  });
  (Array.isArray(input.probes)?input.probes:[]).forEach((p,i)=>{
    if(!p||typeof p.action!=='string'||!/^[a-zA-Z0-9-]+:[a-zA-Z0-9]+$/.test(p.action)||typeof p.resource!=='string'||!p.resource.trim()||/[?*]/.test(p.resource))errors.push(`Probe ${i+1}: use a concrete service:Action and a nonempty resource without wildcards.`);
  });
  if(errors.length)throw new Error(errors.slice(0,12).join('\n'));
  return structuredClone(input);
}
function statements(workspace){return workspace.policies.flatMap((p,pi)=>arr(p.document.Statement).map((s,si)=>({...s,policy:p.name,path:`policies[${pi}].document.Statement${Array.isArray(p.document.Statement)?`[${si}]`:""}`,ref:`${p.name} / ${s.Sid||`statement ${si+1}`}`})));}
function evaluate(workspace,probe){
 const matches=statements(workspace).filter(s=>arr(s.Action).some(a=>wildcard(a,probe.action,true))&&arr(s.Resource).some(r=>wildcard(r,probe.resource)));
 const deny=matches.filter(s=>s.Effect==='Deny'&&!s.Condition);
 const conditional=matches.filter(s=>s.Condition);
 const allow=matches.filter(s=>s.Effect==='Allow'&&!s.Condition);
 let decision=deny.length?'denied':conditional.some(s=>s.Effect==='Deny')?'unknown':allow.length?'allowed':conditional.length?'unknown':'implicit';
 return {...probe,decision,evidence:matches,reason:decision==='denied'?'An unconditional explicit deny overrides every allow.':decision==='unknown'?'Matching conditions require request context; this evaluator does not resolve them.':decision==='allowed'?'At least one unconditional allow matches, with no explicit or unresolved conditional deny.':'No matching allow in these identity policies.'};
}
function analyze(workspace){
 const rows=workspace.probes.map(p=>evaluate(workspace,p));
 const ss=statements(workspace),findings=[];
 const push=(id,severity,title,description,evidence,remediation)=>findings.push({id,severity,title,description,evidence,remediation});
 const passing=rows.find(r=>r.action.toLowerCase()==='iam:passrole'&&r.decision==='allowed');
 const creating=rows.find(r=>r.action.toLowerCase()==='lambda:createfunction'&&r.decision==='allowed');
 if(passing&&creating)push('COMBINATION-01','high','Role passing + function creation','The evaluated role can both pass a role and create a function. This is a potential privilege escalation prerequisite, not proof of exploitability: role trust, passed-role permissions, service restrictions, and other controls are not evaluated.',[...passing.evidence.filter(s=>s.Effect==='Allow'&&!s.Condition),...creating.evidence.filter(s=>s.Effect==='Allow'&&!s.Condition)],'Remove unneeded function creation. Restrict role passing to a reviewed execution role, and validate its trust and permissions separately.');
 ss.filter(s=>s.Effect==='Allow').forEach(s=>{
  if(arr(s.Resource).includes('*'))push('RESOURCE-'+s.path,arr(s.Action).some(a=>wildcard(a,'iam:PassRole',true))?'high':'medium','Unrestricted resource scope',`The allow statement ${s.Sid||'(unnamed)'} targets every resource. Review whether these actions can use narrower resources. This is a scope heuristic; it does not account for service-specific resource support.`,[s],'Replace the universal resource with the minimum supported resource set. Confirm service-specific resource support before applying.');
  if(arr(s.Action).some(a=>a.includes('*')||a.includes('?')))push('ACTION-'+s.path,'medium','Wildcard action grant',`The statement ${s.Sid||'(unnamed)'} matches multiple actions, potentially including actions added in future. Explicit denies can still override individual requests.`,[s],'Replace action wildcards with an explicit list of required actions, then verify representative allowed and denied requests.');
 });
 ss.filter(s=>s.Condition).forEach(s=>push('CONDITION-'+s.path,'review','Request context is unresolved','This statement contains a condition. The evaluator preserves it as evidence but cannot determine its truth.',[s],'Evaluate the condition with representative request context in an authoritative policy simulator.'));
 findings.sort((a,b)=>({high:0,medium:1,review:2}[a.severity]-{high:0,medium:1,review:2}[b.severity]));
 return {rows,findings,statementCount:ss.length,counts:rows.reduce((a,r)=>(a[r.decision]++,a),{allowed:0,denied:0,implicit:0,unknown:0})};
}
function compare(before,after){const a=analyze(before),b=analyze(after);const key=r=>r.action+'\u0000'+r.resource;const keys=[...new Set([...a.rows,...b.rows].map(key))];return keys.map(k=>{const old=a.rows.find(r=>key(r)===k),next=b.rows.find(r=>key(r)===k);return {action:(next||old).action,resource:(next||old).resource,before:old?.decision||'not probed',after:next?.decision||'not probed'};});}
root.PolicyEngine={validate,wildcard,evaluate,analyze,compare,statements};
if(typeof module!=='undefined')module.exports=root.PolicyEngine;
})(globalThis);

function inspection(a){return `<div class="inspection-grid"><div class="inspection-left"><section class="panel"><div class="panel-head"><div><h2>Effective permission map</h2><p>Evaluated against ${a.rows.length} concrete request probes</p></div><div class="segmented"><button data-tab="map" class="${tab==='map'?'selected':''}">Map</button><button data-tab="permissions" class="${tab==='permissions'?'selected':''}">Permissions</button></div></div><div class="permission-summary">${[['allowed','Allowed'],['denied','Explicit deny'],['implicit','No allow'],['unknown','Unresolved']].map(([d,l])=>`<button data-decision="${d}"><span class="number ${d}">${a.counts[d]}</span><span>${l}</span></button>`).join('')}</div>${tab==='map'?permissionMap(a):permissionTable(a)}<div class="panel-foot">${icon('info')} Explicit deny takes precedence. Conditions remain unresolved. <button data-act="scope">View scope ${icon('arrow')}</button></div></section><section class="panel findings"><div class="panel-head"><h2>Findings <span class="count">${a.findings.length}</span></h2><div class="filter-controls"><label class="search">${icon('search')}<input id="finding-search" aria-label="Search findings" placeholder="Search findings" value="${esc(query)}"></label><select id="severity" aria-label="Filter severity"><option value="all">All severity</option>${['high','medium','review'].map(v=>`<option value="${v}" ${severity===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div></div><div id="finding-rows">${findingRows(a)}</div></section></div><aside class="evidence-panel">${evidence(a)}</aside></div>`;}
function permissionMap(a){if(!state.workspace.policies.length)return `<div class="empty"><span class="empty-symbol">${icon('file')}</span><h3>Start with a synthetic policy.</h3><p>Import a workspace or load the Fleet portal scenario.</p><button class="btn" data-act="load-demo">Load example</button></div>`;const groups=[...new Set(a.rows.map(r=>r.action.split(':')[0]))];return `<div class="map-legend"><span>01 / IDENTITY</span><span>02 / ATTACHED POLICIES</span><span>03 / REQUEST SURFACE</span></div><div class="permission-map"><div class="identity-node"><span class="node-icon">${icon('shield')}</span><span class="eyebrow">APPLICATION ROLE</span><b>${esc(state.workspace.principal)}</b><span class="node-sub">Identity policies only</span></div><div class="policy-column">${state.workspace.policies.map((p,i)=>`<button class="policy-node ${p.document.Statement && (Array.isArray(p.document.Statement)?p.document.Statement:[p.document.Statement]).some(s=>s.Effect==='Deny')?'guardrail':''}" data-policy="${i}"><span class="policy-glyph">${icon(p.name==='DeletionGuardrail'?'shield':'file')}</span><span><b>${esc(p.name)}</b><small>${(Array.isArray(p.document.Statement)?p.document.Statement:[p.document.Statement]).length} statement${(Array.isArray(p.document.Statement)?p.document.Statement:[p.document.Statement]).length===1?'':'s'}</small></span>${icon('arrow')}</button>`).join('')}</div><div class="service-column">${groups.map(g=>{const rows=a.rows.filter(r=>r.action.startsWith(g+':'));return `<button class="service-node" data-service="${g}"><span class="service-icon">${{s3:'S3',iam:'IAM',lambda:'λ',logs:'LOG'}[g]||esc(g.toUpperCase())}</span><span><b>${{s3:'Object storage',iam:'Identity',lambda:'Functions',logs:'Logging'}[g]||esc(g)}</b><small>${rows.filter(r=>r.decision==='allowed').length} / ${rows.length} probes allowed</small></span></button>`;}).join('')}</div></div><div class="map-caption"><span class="line-key"></span>Attachment and service groups · Select a policy to inspect its source</div>`;}

function permissionTable(a){const rows=a.rows.filter(r=>(decision==='all'||r.decision===decision)&&(!serviceFilter||r.action.startsWith(serviceFilter+':')));return `<div class="permissions-filter"><label>Decision <select id="decision"><option value="all">All requests</option>${Object.entries(decisionLabel).filter(([d])=>d!=='not probed').map(([d,l])=>`<option value="${d}" ${decision===d?'selected':''}>${l}</option>`).join('')}</select></label>${serviceFilter?`<button class="text-btn" data-act="clear-service">${esc(serviceFilter)} × Clear service</button>`:''}<button class="text-btn" data-act="probe">+ Test a request</button></div><div class="permission-table"><table><thead><tr><th>Action / resource</th><th>Decision</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b class="mono">${esc(r.action)}</b><small>${esc(r.resource)}</small></td><td>${labelDecision(r.decision)}</td><td><button class="icon-btn" data-probe="${a.rows.indexOf(r)}" aria-label="Explain ${esc(r.action)}">${icon('arrow')}</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty-cell">No requests match this filter.</td></tr>'}</tbody></table></div>`;}
function findingRows(a){const fs=a.findings.filter(f=>(severity==='all'||f.severity===severity)&&(f.title+' '+f.description+' '+f.evidence.map(s=>s.policy).join(' ')).toLowerCase().includes(query.toLowerCase()));return fs.map((f,i)=>`<button class="finding-row ${selected===f.id?'active':''}" data-finding="${esc(f.id)}"><span class="finding-index">${String(a.findings.indexOf(f)+1).padStart(2,'0')}</span><span class="finding-name"><b>${esc(f.title)}</b><small>${[...new Set(f.evidence.map(s=>s.policy))].map(esc).join(' + ')}</small></span>${badge(f.severity)}${icon('arrow')}</button>`).join('')||`<div class="empty compact"><h3>${a.findings.length?'No matching findings.':'No findings in the supported rules.'}</h3><p>${a.findings.length?'Adjust the search or severity filter.':'This is not a security or compliance certification.'}</p>${a.findings.length?'<button class="text-btn" data-act="clear-filters">Clear filters</button>':''}</div>`;}

function comparison(a){const b=E.analyze(state.candidate),diff=E.compare(state.workspace,state.candidate),changed=diff.filter(d=>d.before!==d.after);return `<div class="compare-toolbar"><div><span class="eyebrow">BASELINE → CANDIDATE</span><p>${esc(state.workspace.name)} → <b>${esc(state.candidate.name)}</b></p></div><div class="toolbar-actions"><button class="btn" data-act="candidate-copy">Copy baseline</button><button class="btn" data-act="candidate-edit">${icon('code')} Edit candidate</button><button class="btn" data-act="candidate-demo">Load proposed example</button></div></div><div class="compare-summary"><div><span>Findings</span><b>${a.findings.length} <span>→</span> ${b.findings.length}</b><small>Under the same illustrative rules</small></div><div><span>Allowed probes</span><b>${a.counts.allowed} <span>→</span> ${b.counts.allowed}</b><small>Finite requests, not total permissions</small></div><div><span>Changed decisions</span><b>${changed.length.toString().padStart(2,'0')}</b><small>${diff.length} unique action / resource pairs</small></div><div class="candidate-action"><span class="badge review">LOCAL PROPOSAL</span><button class="btn primary" data-act="adopt">Use candidate as baseline ${icon('arrow')}</button></div></div><section class="panel comparison-panel"><div class="panel-head"><div><h2>Permission decision changes</h2><p>Every evaluated request remains visible, including unchanged guardrails.</p></div><button class="text-btn" data-act="export-diff">${icon('download')} Export comparison</button></div><div class="table-scroll"><table class="diff-table"><thead><tr><th>Action / resource</th><th>Baseline</th><th>Candidate</th><th>Change</th></tr></thead><tbody>${diff.map(d=>`<tr class="${d.before!==d.after?'changed':''}"><td><b class="mono">${esc(d.action)}</b><small>${esc(d.resource)}</small></td><td>${labelDecision(d.before)}</td><td>${labelDecision(d.after)}</td><td>${d.before===d.after?'<span class="subtle">Unchanged</span>':'<span class="change-marker">Decision changed</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty-cell">No probes in either workspace. Edit the candidate to add requests.</td></tr>'}</tbody></table></div></section><div class="notice">${icon('info')} The proposed example narrows role and function resources, removes function creation, and replaces the storage wildcard. Adopting it changes only this local workspace.</div>`;}
function remediation(a){const done=a.findings.filter(f=>state.reviews[f.id]).length;return `<div class="review-banner"><div><span class="eyebrow">REVIEW PROGRESS</span><h2>${done} <span>/ ${a.findings.length}</span> items reviewed</h2><p>Review completion does not resolve findings. Re-evaluate an edited policy to verify changes.</p></div><button class="btn primary" data-act="checklist">${icon('download')} Export checklist</button></div><div class="remediation-list">${a.findings.map((f,i)=>`<section class="review-item ${state.reviews[f.id]?'reviewed':''}"><label class="review-check"><input type="checkbox" data-review="${esc(f.id)}" ${state.reviews[f.id]?'checked':''}><span class="sr-only">Mark ${esc(f.title)} reviewed</span></label><div class="review-body"><div class="review-title"><span class="eyebrow">${String(i+1).padStart(2,'0')} / ${state.reviews[f.id]?'REVIEWED':'PENDING REVIEW'}</span>${badge(f.severity)}</div><h2>${esc(f.title)}</h2><p>${esc(f.remediation)}</p><div class="review-evidence">${icon('file')} ${f.evidence.map(s=>esc(s.ref)).join(' · ')}</div><label>Reviewer note<textarea data-note="${esc(f.id)}" placeholder="Record context, proposed scope, and follow-up validation…" rows="2">${esc(state.notes[f.id]||'')}</textarea></label></div></section>`).join('')||'<div class="empty panel"><h2>No review items.</h2><p>The supported rules produced no findings. Full security validation is still outside this demo.</p></div>'}</div>`;}
const pkiSteps=[['Certificate presentation','A browser presents a client certificate through a TLS endpoint configured to request one. The private key stays with its credential provider.','Production component: approved platform middleware and a client-certificate-aware TLS endpoint.'],['Trust & status validation','A server-side verifier would validate the certificate chain, intended usage, validity period, and revocation status using approved trust anchors and policy.','Production component: trusted certificate store and a policy-defined revocation mechanism.'],['Identity mapping','Verified certificate attributes would map to an application account through an explicit, reviewed identity mapping rule. Display names are not an authorization boundary.','Production component: managed account directory and documented attribute mapping.'],['Application authorization','The application would establish a protected session and evaluate its own authorization policy for each protected operation. Authentication alone does not grant application access.','Production component: session management, authorization, and security event logging.']];

function parseInput(text){if(text.length>1000000)throw new Error('File exceeds the 1 MB demo limit.');let obj;try{obj=JSON.parse(text);}catch(e){throw new Error('Invalid JSON. Check commas, quotes, and brackets. '+e.message);}if(obj?.Statement)obj={name:'Imported policy',principal:'synthetic-imported-role',policies:[{name:'ImportedPolicy',document:obj}],probes:structuredClone(DEMO_WORKSPACE.probes)};return E.validate(obj);}
function scope(){modal('Scope & methodology',`<div class="scope-copy"><h3>A deterministic, finite inspection</h3><p>This handcrafted demo implements a limited identity-policy model: matching unconditional allows are combined, explicit denies take precedence, and requests without a matching allow return “No allow.” Action matching is case-insensitive; resource matching is case-sensitive. <code>*</code> and <code>?</code> wildcards are supported.</p><p>Only the listed request probes are evaluated. A matching unresolved conditional deny returns “Unresolved”; a conditional allow does so only when no unconditional allow already determines the result. The combination rule requires both actions to be allowed in the probes.</p><h3>What is outside the model</h3><p>Resource-based policies, permission boundaries, SCPs/RCPs, session policies, role trust, variables, NotAction, NotResource, Principal, service-specific resource semantics, and full condition evaluation. Unsupported statement fields are rejected. There is no AWS connection or policy deployment.</p><h3>Interpretation, not certification</h3><p>Wildcard and combination findings are illustrative heuristics. They are not CIS, Cloud SRG, SCAP, USN approval, or a complete assessment. The CAC/PKI view is a design concept with no authentication implementation.</p><h3>Source provenance</h3><p>Case 25 from the bundled Norfolk catalogue, <code>harness/norfolk-snapshot.ts</code>. All policy names, account identifiers, resources, and request probes are synthetic.</p><p><a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html" target="_blank" rel="noopener">AWS policy evaluation logic ↗</a><br><a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_condition.html" target="_blank" rel="noopener">AWS Condition element ↗</a></p><p>Reference links require internet; evaluation and exports do not. Browser-local storage is unencrypted. Import synthetic data only.</p></div>`,`<button class="btn primary" data-act="close">Understood</button>`);}

 if(el.dataset.policy!==undefined){const p=state.workspace.policies[Number(el.dataset.policy)];modal(esc(p.name),`<div class="scope-copy"><p>Exact source document attached to <b>${esc(state.workspace.principal)}</b>.</p><pre class="full-source">${esc(json(p.document))}</pre></div>`,'<button class="btn" data-act="close">Close</button><button class="btn primary" data-act="edit-from-source">Edit workspace</button>');return;}
 if(el.dataset.probe!==undefined){probeModal(E.analyze(state.workspace).rows[Number(el.dataset.probe)]);return;}
 if(el.dataset.save){try{const w=parseInput($('#json-editor').value);if(el.dataset.save==='candidate')state.candidate=w;else{state.workspace=w;state.reviews={};state.notes={};query='';severity='all';decision='all';serviceFilter='';page='inspect';}save();closeModal();render();toast('JSON validated. Local analysis updated.');}catch(e){$('#editor-error').textContent=e.message;}return;}
 switch(el.dataset.act){
 case 'home':event.preventDefault();page='inspect';render();break;
 case 'close':closeModal();break;case 'scope':scope();break;case 'export':exportReport();break;case 'checklist':checklist();break;
 case 'import':editor('import');break;case 'edit':editor('edit');break;case 'edit-from-source':closeModal();editor('edit');break;
 case 'editor-example':$('#json-editor').value=json(DEMO_WORKSPACE);$('#editor-error').textContent='';break;
 case 'candidate-edit':editor('candidate');break;
 case 'candidate-copy':state.candidate=structuredClone(state.workspace);state.candidate.name+=' · candidate';save();render();toast('Baseline copied into the local candidate.');break;
 case 'candidate-demo':state.candidate=structuredClone(DEMO_CANDIDATE);save();render();toast('Proposed synthetic example loaded.');break;
 case 'adopt':state.workspace=structuredClone(state.candidate);state.reviews={};state.notes={};save();page='inspect';render();toast('Candidate adopted locally. Restore the example from the scenario selector.');break;
 case 'export-diff':download('policy-lens-comparison.json',json({synthetic:true,baseline:state.workspace,candidate:state.candidate,comparison:E.compare(state.workspace,state.candidate),scope:'Finite request probes in an illustrative identity-policy subset.'}));break;
 case 'clear-filters':query='';severity='all';render();break;
 case 'clear-service':serviceFilter='';render();break;
 case 'load-demo':loadScenario('demo');break;
 case 'probe':probeModal();break;
 case 'add-probe':try{const probe={action:$('#probe-action').value.trim(),resource:$('#probe-resource').value.trim()};const w=structuredClone(state.workspace);if(w.probes.some(p=>p.action===probe.action&&p.resource===probe.resource))throw new Error('This request is already in the probe set.');w.probes.push(probe);state.workspace=E.validate(w);save();closeModal();render();probeModal(E.evaluate(w,probe));}catch(e){$('#probe-error').textContent=e.message;}break;
 }
});
function loadScenario(value){if(value==='current')return;state.workspace=structuredClone(value==='demo'?DEMO_WORKSPACE:value==='conditional'?CONTEXT_WORKSPACE:{name:'Empty workspace',principal:'synthetic-role',policies:[],probes:[]});state.reviews={};state.notes={};selected=null;query='';severity='all';serviceFilter='';decision='all';save();render();toast('Synthetic scenario loaded.');}
document.addEventListener('change',async event=>{const el=event.target;if(el.id==='scenario')loadScenario(el.value);if(el.id==='severity'){severity=el.value;render();}if(el.id==='decision'){decision=el.value;render();}if(el.id==='pki-outcome'){pkiOutcome=el.value;render();}if(el.dataset.review){state.reviews[el.dataset.review]=el.checked;save();render();}if(el.id==='json-file'){try{const file=el.files[0];if(!file)return;if(file.size>1000000)throw new Error('File exceeds the 1 MB demo limit.');$('#json-editor').value=await file.text();$('#editor-error').textContent='';}catch(e){$('#editor-error').textContent=e.message;}}});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='finding-search'){query=el.value;$('#finding-rows').innerHTML=findingRows(E.analyze(state.workspace));}if(el.dataset.note){state.notes[el.dataset.note]=el.value;save();}});
render();if(storageIssue)toast(storageIssue);
</script></body></html>
