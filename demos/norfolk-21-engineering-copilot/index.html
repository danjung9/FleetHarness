let eventQueue=Promise.resolve();
function event(type,detail,at){const target=state;const operation=eventQueue.then(async()=>{await W.appendEvent(target.events,type,detail,at);if(state===target)save();});eventQueue=operation.catch(()=>{});return operation;}
async function fresh(){state={version:1,incident:structuredClone(W.sample),query:W.sample.query,retrievedQuery:W.sample.query,checks:{},gaps:structuredClone(gapDefaults),events:[],reviewSeq:null,error:'',retrievalMs:null};await event('session',{text:'Fictional exercise EX-021 loaded. Training reviewer identity is simulated.'},'2026-11-05T14:29:00Z');for(const observation of W.sample.observations)await event('observation',observation,observation.time);await event('retrieval',{query:state.query,citations:results().map(r=>r.passage.id),text:'Initial demonstration passages matched by local keyword retrieval.'},'2026-11-05T14:32:02Z');}
function shell(){const title={workspace:'Casualty workspace',library:'Demonstration library',timeline:'Review timeline'}[view];return `<div class="shell"><aside class="sidebar"><div class="brand"><svg class="brand-mark" viewBox="0 0 32 38" fill="none" aria-hidden="true"><path d="M3 4h26v17c0 8-13 14-13 14S3 29 3 21V4Z" stroke="currentColor" stroke-width="1.3"/><path d="m8 13 4 12 4-8 4 8 4-12" stroke="currentColor" stroke-width="1.8"/></svg><span>WATCHKEEP</span></div><div class="brand-sub">EVIDENCE BEFORE ACTION</div><div class="nav-label">TRAINING STATION</div><nav class="nav" aria-label="Main navigation">${[['workspace','grid','Workspace'],['library','book','Source library'],['timeline','clock','Review timeline']].map(([id,i,label])=>`<button data-action="nav" data-view="${id}" class="${view===id?'active':''}" aria-label="${label}" ${view===id?'aria-current="page"':''}>${icon(i)}<span class="nav-text">${label}</span>${id==='library'?'<span class="count">05</span>':''}</button>`).join('')}</nav><div class="side-scenario"><div class="eyebrow">ACTIVE EXERCISE</div><strong>${esc(state.incident.id)} / Engineering</strong><p>${esc(state.incident.asset)}<br>Fictional plant trainer</p></div><div class="side-bottom"><div class="local"><span class="dot"></span>Local workspace</div><p>Bundled sources · no cloud</p><button data-action="about">About this demonstration ↗</button></div></aside><main class="main"><header class="topbar"><div class="breadcrumb">Engineering trainer ${icon('chevron')} <b>${title}</b></div><div class="profile"><div class="avatar">TR</div><div>Training reviewer<span>Simulated identity</span></div></div></header><div class="content">${storageIssue?`<div class="storage-warning">${esc(storageIssue)} ${damagedSaved?'<button class="text-button" data-action="recovery">Download recovered data</button>':''}</div>`:''}<div class="pagehead"><div><div class="eyebrow">NORFOLK 21 / OFFLINE TRAINING</div><h1>${title}</h1><p class="subtext">${view==='workspace'?'Keep the evidence close. Keep the human in charge.':view==='library'?'Five fictional references. Every passage traceable.':'A reviewable record of evidence, uncertainty, and decisions.'}</p></div><div class="actions">${view==='timeline'?`<button class="button secondary" data-action="note">${icon('plus')} Add observation</button>`:`<button class="button secondary" data-action="import">${icon('upload')} Import exercise</button>`}<button class="button primary" data-action="export">${icon('download')} Export review</button></div></div><div class="notice">${icon('shield')}<div><b>Simulation only.</b> Fictional passages for instructor review. No operational procedures or equipment controls.</div><span>HUMAN AUTHORITY</span></div>${view==='workspace'?workspace():view==='library'?library():timeline()}<footer class="footer"><span>WATCHKEEP / HANDCRAFTED DEMONSTRATION</span><span>LOCAL SOURCES · NO LIVE PLANT CONNECTION</span></footer></div></main></div>`;}
function workspace(){const rs=results(),checked=W.prerequisites.filter(p=>state.checks[p.id]).length,review=state.events.find(e=>e.seq===state.reviewSeq),recent=state.events.filter(e=>['observation','note','review','blocked'].includes(e.type)).slice(-2).reverse();return `<div class="workspace"><section class="left-column"><div class="case-card"><div class="case-top"><div class="eyebrow">${esc(state.incident.id)} · SCENARIO SNAPSHOT</div><span class="pill"><span class="dot" style="background:#dbb384"></span>${review?'Review recorded':'Evidence conflict'}</span></div><h2>${esc(state.incident.title)}</h2><p class="subtext">${esc(state.incident.asset)} · ${state.incident.observations.length} imported observations · fictional exercise</p><div class="case-bottom"><div class="case-detail"><small>Evidence status</small><strong>${state.gaps.length} unresolved information gaps</strong></div><div class="case-detail"><small>Last observation</small><strong>${utc(state.incident.observations.map(o=>o.time).sort().at(-1))} UTC</strong></div>${state.incident.id==='EX-021'?`<div><svg class="case-chart" role="img" aria-label="Illustrative replay: the panel and training log indications diverge. Values are arbitrary, not real equipment readings." viewBox="0 0 170 54"><path d="M0 10H170 M0 29H170 M0 48H170" stroke="#38555d" stroke-width=".6"/><path d="M1 28 16 26 32 28 48 24 64 27 80 24 96 29 112 38 128 35 144 42 168 42" fill="none" stroke="#edbf96" stroke-width="1.8"/><path d="M1 28 16 27 32 28 48 25 64 26 80 24 96 23 112 23 128 22 144 21 168 22" fill="none" stroke="#93bdb6" stroke-width="1.5" stroke-dasharray="3 3"/></svg><div class="chart-legend"><span><i></i>Panel</span><span><i class="second"></i>Log · illustrative</span></div></div>`:''}</div></div><form class="retrieval-box" id="query-form"><div class="section-line"><h2>What did the watch observe?</h2><span class="step-label">01 / RETRIEVE</span></div><div class="input-wrap"><label class="sr-only" for="query">Training observation</label><textarea id="query" maxlength="1200" placeholder="Describe a fictional indication or evidence conflict…">${esc(state.query)}</textarea></div><div id="query-error">${state.error?`<div class="error" role="alert">${esc(state.error)}</div>`:''}</div><div class="query-footer"><span class="helper">Text retrieval from 5 bundled demo passages</span><button class="button primary" type="submit">Find cited passages ${icon('arrow')}</button></div></form><div class="retrieval-head"><h2>Relevant training passages <span class="badge">${rs.length.toString().padStart(2,'0')}</span></h2><span class="retrieval-meta">${state.retrievalMs!==null?`${state.retrievalMs.toFixed(1)} ms · `:''}LOCAL KEYWORD MATCH</span></div>${rs.length?`<div class="results">${rs.map((r,i)=>`<article class="result"><span class="rank">${String(i+1).padStart(2,'0')}</span><div><div class="result-top"><h3>${esc(r.passage.title)}</h3><span class="match">${r.score} matched terms</span></div><p>${esc(r.passage.text)}</p><div class="result-footer"><button class="citation" data-action="source" data-id="${r.passage.id}">${icon('book')}${r.passage.id} §${r.passage.section} · rev ${r.passage.revision} ${icon('chevron')}</button></div></div></article>`).join('')}</div>`:`<div class="empty">${icon('search')}<h3>No grounded passage found</h3><p>No response has been inferred. Try “generator pressure mismatch” or browse the source library.</p><button class="text-button" data-action="nav" data-view="library">Browse the library ${icon('arrow')}</button></div>`}<div class="review-bar"><div><b>${review?'Evidence review recorded':'Ready for a human review'}</b><span>${review?'Acknowledgement only; information gaps remain visible.':`${checked}/3 prerequisites acknowledged · gaps travel with the record`}</span></div><button class="button ${review?'soft':'primary'}" data-action="review">${icon(review?'check':'shield')}${review?'Review again':'Record review'}</button></div><section class="recent"><div class="section-line"><h2>Latest in the incident record</h2><button class="text-button" data-action="nav" data-view="timeline">Full timeline ${icon('arrow')}</button></div>${recent.map(e=>`<div class="recent-row"><span class="time">${utc(e.at)}Z</span><span class="timeline-dot"></span><p>${esc(eventSummary(e))}</p></div>`).join('')}</section></section><aside class="right-column"><section class="panel"><div class="panel-title"><h2>Exercise context</h2><span class="eyebrow">SYNTHETIC</span></div><div class="asset-map"><div class="asset-node">${icon('generator')}<strong>${esc(state.incident.asset)}</strong><span>Observed asset</span></div><div class="map-connector"></div><div class="asset-node muted">${icon('lock')}<strong>${state.incident.id==='EX-021'?'Auxiliary B':'Context unknown'}</strong><span>${state.incident.id==='EX-021'?'Excluded in packet':'Imported exercise'}</span></div></div><div class="asset-foot">${icon('lock')} ${state.incident.id==='EX-021'?'DEMO-T17 · fictional restriction':'No restriction register imported'}</div><p class="context-caption">${state.incident.id==='EX-021'?'Context from the bundled instructor packet.':'The bundled context passage describes EX-021 only.'}</p><button class="text-button" data-action="context">View source observations ${icon('arrow')}</button></section><section class="panel"><div class="panel-title"><h2>Before recording review</h2><span class="step-label">02 / CHECK</span></div>${W.prerequisites.map(p=>`<label class="prerequisite"><input type="checkbox" data-check="${p.id}" ${state.checks[p.id]?'checked':''}><span><strong>${p.label}</strong><small>${p.detail}</small></span></label>`).join('')}<div class="progress-track"><div style="width:${checked/3*100}%"></div></div><div class="progress-label">${checked} of 3 acknowledged</div></section><section class="panel"><div class="panel-title"><h2>Information gaps</h2><span class="tiny-number">${state.gaps.length} open</span></div>${state.gaps.map(g=>`<div class="gap"><div class="gap-top"><strong>${g.title}</strong><span class="badge warn">Unknown</span></div><p>${esc(g.description)}</p>${g.note?`<p><strong>Context note:</strong> ${esc(g.note)}</p>`:''}<button data-action="gap" data-id="${g.id}">${g.note?'Edit context note':'Add context note'}</button></div>`).join('')}</section><div class="right-note">${icon('shield')}<span>Retrieval is not a diagnosis. A review preserves what is known and what still needs an instructor’s judgment.</span></div></aside></div>`;}
function filteredLibrary(){return W.passages.filter(p=>(categoryFilter==='all'||p.category===categoryFilter)&&`${p.id} ${p.title} ${p.text}`.toLowerCase().includes(libraryFilter.toLowerCase()));}
function libraryCards(){const rows=filteredLibrary();return rows.length?rows.map(p=>`<article class="library-card"><div class="eyebrow">${p.id} / SECTION ${p.section}</div><h2>${p.title}</h2><p>${p.text}</p><div class="card-bottom"><span class="pill neutral">${p.category}</span><button class="text-button" data-action="source" data-id="${p.id}">Read source ${icon('arrow')}</button></div></article>`).join(''):`<div class="empty"><h3>No sources match</h3><p>Try a broader term or choose all categories.</p><button class="text-button" data-action="clear-library">Clear filters</button></div>`;}
function library(){return `<div class="audit-banner"><div><h3>A small library, an explicit boundary.</h3><p>Authored solely for this demonstration. These are not EOSS / EOCC references or approved technical doctrine.</p></div><button class="button secondary small" data-action="library-export">${icon('download')} Export library</button></div><div class="toolbar"><label class="search">${icon('search')}<input id="library-search" aria-label="Search demonstration library" placeholder="Search by topic, passage, or source ID…" value="${esc(libraryFilter)}"></label><label><span class="sr-only">Source category</span><select id="category" class="select"><option value="all">All categories</option>${[...new Set(W.passages.map(p=>p.category))].map(c=>`<option ${categoryFilter===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="library-grid" id="library-grid">${libraryCards()}</div>`;}
function eventSummary(e){const d=e.detail;return e.type==='observation'?d.text:e.type==='note'?latestNote(e):e.type==='review'?`Evidence package reviewed with ${d.citations.length} cited passages and ${d.gaps.length} unresolved gaps.`:e.type==='blocked'?d.reason:e.type==='retrieval'?`Retrieved ${d.citations.length} matching passages for “${d.query}”`:e.type==='source'?`${d.id} §${d.section} opened for source inspection.`:e.type==='prerequisite'?`${d.label}: ${d.value?'acknowledged':'cleared'}.`:e.type==='gap'?`${d.title}: ${d.note||'Context note cleared; unknown retained.'}`:e.type==='note-edit'?`Observation #${d.target} amended: ${d.text}`:d.text||'';}
function latestNote(e){return state.events.filter(v=>v.type==='note-edit'&&v.detail.target===e.seq).at(-1)?.detail.text||e.detail.text;}
const typeLabels={session:'Exercise loaded',observation:'Source observation',retrieval:'Passages retrieved',source:'Source inspected',prerequisite:'Prerequisite updated',gap:'Context annotated',review:'Evidence review recorded',blocked:'Policy gate blocked',note:'Reviewer observation', 'note-edit':'Observation amended',export:'Review exported',verify:'Audit checked'};
function timeline(){const rows=state.events.filter(e=>timelineFilter==='all'||(timelineFilter==='review'?e.type==='review':timelineFilter==='blocked'?e.type==='blocked':['observation','note','note-edit'].includes(e.type))).slice().reverse();return `<div class="audit-banner"><div><h3>${icon('shield')} Locally chained review record</h3><p>${state.events.length} events · SHA-256 linked · simulated reviewer. Local records can be rewritten; this is not an immutable or signed log.</p></div><button class="button secondary small" data-action="verify">${icon('check')} Verify chain</button></div><div class="toolbar"><div class="tabs" role="group" aria-label="Timeline filter">${[['all','All events'],['review','Reviews'],['observations','Observations'],['blocked','Blocked']].map(([id,l])=>`<button data-action="timeline-filter" data-id="${id}" class="${timelineFilter===id?'active':''}" aria-pressed="${timelineFilter===id}">${l}</button>`).join('')}</div><span class="retrieval-meta">${rows.length} EVENTS · UTC · RECORD ORDER</span></div>${rows.length?`<div class="timeline-list">${rows.map(e=>`<article class="event ${e.type==='blocked'?'blocked':''}"><div class="event-time">${utc(e.at)}<small>${dateLabel(e.at)}</small></div><div class="event-mark">${icon(e.type==='blocked'?'lock':e.type==='review'?'check':'file')}</div><div class="event-body"><div class="event-title"><h3>${typeLabels[e.type]||e.type}</h3>${e.type==='note'?`<button class="text-button" data-action="edit-note" data-id="${e.seq}">${icon('edit')} Amend</button>`:`<span class="badge ${e.type==='blocked'?'warn':''}">#${String(e.seq).padStart(3,'0')}</span>`}</div><p>${esc(eventSummary(e))}</p>${e.type==='review'&&e.detail.note?`<p><b>Review note:</b> ${esc(e.detail.note)}</p>`:''}${e.type==='review'?`<p><b>Gaps at review:</b> ${e.detail.gaps.map(g=>esc(g.title)+': '+esc(g.note||'Unknown')).join(' · ')}</p>`:''}${e.type==='observation'?`<span class="badge">${esc(e.detail.source)}</span>`:''}${e.detail.citations?e.detail.citations.map(id=>`<button class="citation" data-action="source" data-id="${id}">${icon('book')}${id}</button>`).join(''):''}<code>SHA-256 ${e.hash.slice(0,16)}… · ${e.actor}</code></div></article>`).join('')}</div>`:`<div class="empty">${icon('clock')}<h3>No ${timelineFilter==='review'?'reviews':timelineFilter} recorded yet</h3><p>${timelineFilter==='review'?'Acknowledge the prerequisites in the workspace, then record an evidence review.':'Events appear here as you use the training workspace.'}</p><button class="text-button" data-action="nav" data-view="workspace">Return to workspace ${icon('arrow')}</button></div>`}`;}
function render(){const y=window.scrollY;$('#app').innerHTML=shell();window.scrollTo(0,y);}
function closeDialog(){const d=$('#dialog');d.close();d.innerHTML='';if(lastFocus?.isConnected)lastFocus.focus();}
function modal(eyebrow,title,body,footer=''){lastFocus=document.activeElement;const d=$('#dialog');d.innerHTML=`<div class="dialog-header"><div><div class="eyebrow">${eyebrow}</div><h2 id="dialog-title">${title}</h2></div><button class="icon-button" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;if(!d.open)d.showModal();}
async function showSource(id){const p=W.passages.find(p=>p.id===id);if(!p)return;await event('source',{id:p.id,section:p.section});modal('BUNDLED DEMONSTRATION SOURCE',p.title,`<div class="source-meta"><div><span>Source / section</span><strong>${p.id} §${p.section}</strong></div><div><span>Revision</span><strong>${p.revision} · fictional training text</strong></div><div><span>Publisher</span><strong>WATCHKEEP demonstration authors</strong></div><div><span>Applicability</span><strong>Fictional EX-021 exercise only</strong></div></div><div class="eyebrow">EXACT PASSAGE</div><blockquote class="source-excerpt">${esc(p.text)}</blockquote><h3>Review prerequisite</h3><p>${p.prerequisite}</p><div class="scope-block"><p>This is not approved doctrine. It contains no casualty-response sequence, operating limits, or equipment-control authority.</p></div><div class="link-list">${p.related.map(id=>`<button class="text-button" data-action="source" data-id="${id}">Related source: ${id} ${icon('arrow')}</button>`).join('')}</div>`,`<button class="button secondary" data-action="close">Close source</button>`);}
function importModal(){modal('LOCAL FILE IMPORT','Bring an exercise into view',`<p>Import a synthetic JSON packet. It replaces the active exercise and starts a fresh review record. Export the current review first if you need to keep it.</p><label class="field"><span>Choose a JSON file · maximum 100 KB</span><input type="file" accept=".json,application/json" id="import-file"></label><label class="field"><span>Or paste the exercise JSON</span><textarea class="code-input" id="import-json" spellcheck="false" placeholder='{"schemaVersion":1,"id":"…","observations":[…]}'></textarea></label><div id="import-errors" role="alert"></div><button class="text-button" data-action="import-example">Paste example</button> · <button class="text-button" data-action="sample-download">Download sample JSON</button><div class="form-hint">Required: schemaVersion, id, title, asset, query, and 1–50 observations with valid UTC time, source, and text.</div>`,`<button class="button secondary" data-action="close">Cancel</button><button class="button primary" data-action="import-confirm">Load exercise ${icon('arrow')}</button>`);}
async function doImport(){const parsed=W.validateIncident($('#import-json').value);if(!parsed.ok){$('#import-errors').innerHTML=`<div class="error">${parsed.errors.map(esc).join('<br>')}</div>`;return;}const policy=W.queryPolicy(parsed.value.query);if(!policy.allowed){$('#import-errors').innerHTML=`<div class="error">The query is outside the supported scope: ${esc(policy.reason)}</div>`;return;}state={version:1,incident:parsed.value,query:parsed.value.query,retrievedQuery:parsed.value.query,checks:{},gaps:structuredClone(gapDefaults),events:[],reviewSeq:null,error:'',retrievalMs:null};await event('session',{text:`Imported synthetic exercise ${state.incident.id}. No equipment or sensor integration.`});for(const o of state.incident.observations)await event('observation',o,o.time);await event('retrieval',{query:state.query,citations:results().map(r=>r.passage.id)});closeDialog();view='workspace';render();notify('Exercise imported. Prerequisites and review status reset.');}
function noteModal(seq){const existing=state.events.find(e=>e.seq===Number(seq)&&e.type==='note');modal('REVIEWER ANNOTATION',existing?'Amend an observation':'Add an observation',`<p>${existing?'The original observation remains in the audit record. Your amendment is appended as a new event.':'Record an evidence observation for the training handoff. This does not change the imported source packet.'}</p><label class="field"><span>Observation text</span><textarea id="note-text" maxlength="1500" placeholder="What changed, and which training source supports it?">${existing?esc(latestNote(existing)):''}</textarea></label><div id="note-error" role="alert"></div>`,`<button class="button secondary" data-action="close">Cancel</button><button class="button primary" data-action="save-note" ${existing?`data-id="${existing.seq}"`:''}>${existing?'Save amendment':'Add observation'}</button>`);}
function gapModal(id){const g=state.gaps.find(g=>g.id===id);modal('INFORMATION GAP',g.title,`<p>${g.description} A context note is reviewer-supplied evidence, not a verified equipment fact. Notes are retained alongside the original gap in exports.</p><label class="field"><span>Instructor context note</span><textarea id="gap-note" maxlength="1000" placeholder="Add a synthetic source reference and describe what remains uncertain…">${esc(g.note)}</textarea></label>`,`<button class="button secondary" data-action="close">Cancel</button><button class="button primary" data-action="save-gap" data-id="${g.id}">Save context note</button>`);}
async function startReview(){let gate=W.reviewGate(state.checks,results());if(state.query!==state.retrievedQuery)gate={allowed:false,missing:[...gate.missing,'Retrieve passages for the edited observation']};if(!gate.allowed){await event('blocked',{reason:'Evidence review blocked. Missing: '+gate.missing.join('; '),request:'record-review'});modal('REVIEW GATE','A little context is still missing',`<p>Review was blocked and recorded in the local timeline. Complete these prerequisites to continue:</p><div class="scope-block">${gate.missing.map(m=>`<p>• ${esc(m)}</p>`).join('')}</div>`,`<button class="button primary" data-action="close">Return to prerequisites</button>`);render();return;}modal('03 / HUMAN REVIEW','Review the evidence package',`<p>You are recording a simulated training review. The package preserves the source passages, acknowledgements, and information gaps shown below.</p><div class="source-meta"><div><span>Exercise</span><strong>${esc(state.incident.id)}</strong></div><div><span>Reviewer</span><strong>Training reviewer · simulated</strong></div><div><span>Cited passages</span><strong>${results().length} exact excerpts</strong></div><div><span>Unresolved gaps</span><strong>${state.gaps.length} unknown · ${state.gaps.filter(g=>g.note).length} annotated</strong></div></div>${results().map(r=>`<p>${r.passage.id} §${r.passage.section} — ${r.passage.title}</p>`).join('')}<label class="field"><span>Review note (optional)</span><textarea id="review-note" maxlength="1000" placeholder="Capture a question for the next training debrief…"></textarea></label><div class="scope-block"><p>Review acknowledges this training evidence package. It does not approve an action, confirm a diagnosis, or authorize equipment operation.</p></div>`,`<button class="button secondary" data-action="close">Back</button><button class="button primary" data-action="confirm-review">${icon('check')} Confirm training review</button>`);}
async function confirmReview(){const gate=W.reviewGate(state.checks,results());if(!gate.allowed||state.query!==state.retrievedQuery){closeDialog();return startReview();}const note=$('#review-note').value.trim();await event('review',{query:state.retrievedQuery,citations:results().map(r=>r.passage.id),checks:structuredClone(state.checks),gaps:structuredClone(state.gaps),note});state.reviewSeq=state.events.at(-1).seq;save();closeDialog();render();notify('Training evidence review recorded. No operational action authorized.');}
function download(name,value,type='application/json'){const blob=new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1500);}
async function exportReview(){const check=await W.verifyChain(state.events);if(!check.ok){notify('Export blocked: audit verification failed. Reload to recover the saved record.');return;}await event('export',{text:'Portable review JSON exported with source passages, gaps, and audit hashes.'});const library=await Promise.all(W.passages.map(async p=>({...p,sha256:await W.digest(p)})));const payload={format:'watchkeep-training-review',schemaVersion:1,exportedAt:new Date().toISOString(),simulationOnly:true,limitations:['Fictional demonstration passages, not approved technical doctrine.','Simulated reviewer identity, not authenticated or cryptographically signed.','SHA-256 chain detects changes relative to a retained head; a local user can rewrite the chain. No immutable storage or external anchor.','No diagnosis, operational response, sensor integration, or equipment control.'],incident:state.incident,retrieval:{method:'Unique case-insensitive keyword intersection; ties sorted by source ID; maximum 3 passages.',query:state.retrievedQuery,results:results().map(r=>({id:r.passage.id,section:r.passage.section,score:r.score,matchedTerms:r.matched}))},prerequisites:state.checks,informationGaps:state.gaps,latestReviewSequence:state.reviewSeq,library,audit:{algorithm:'SHA-256 over canonical JSON (sorted object keys), excluding hash field',verification:await W.verifyChain(state.events),events:state.events}};download(`watchkeep-${state.incident.id.replace(/[^a-z0-9_-]/gi,'_')}-review.json`,payload);render();notify('Review exported with exact sources and a verifiable local event chain.');}
function showContext(){modal('UNMODIFIED SOURCE PACKET','Exercise observations',`<p>Imported statements are preserved verbatim. They are synthetic observations, not live equipment telemetry.</p>${state.incident.observations.map(o=>`<div class="source-meta"><div><span>${esc(o.source)}</span><strong>${esc(o.time)}</strong></div></div><p>${esc(o.text)}</p>`).join('')}`,`<button class="button secondary" data-action="close">Close packet</button>`);}
function about(){modal('SCOPE & PROVENANCE','Designed for the training room',`<p>WATCHKEEP is a handcrafted, offline demonstration for Norfolk use case #21. The brief is sourced from the bundled catalogue at harness/norfolk-snapshot.ts. All five training passages and all exercise observations were authored as fictional content for this demo.</p><dl class="keyvalue"><dt>Retrieval</dt><dd>Deterministic keyword matching. No language model or generated procedures.</dd><dt>Sources</dt><dd>Five bundled demonstration passages, with source ID, section, revision, and exact text.</dd><dt>Identity</dt><dd>Simulated reviewer label only. No authentication, signatures, or production security.</dd><dt>Audit</dt><dd>SHA-256 event chaining. A local user can rewrite the chain; it is not immutable.</dd><dt>Storage</dt><dd>Browser-local storage. No cloud calls, live integrations, or synchronization.</dd><dt>Delivery</dt><dd>Handcrafted replacement package. Not generated or verified by AppYard.</dd></dl><div class="scope-block"><p>No approved doctrine, response sequence, operational limits, or equipment controls are supplied.</p></div>`,`<button class="button secondary" data-action="reset">Reset demo…</button><button class="button primary" data-action="close">Back to workspace</button>`);}
async function act(action,el){switch(action){case'nav':view=el.dataset.view;render();window.scrollTo(0,0);break;case'close':closeDialog();break;case'source':await showSource(el.dataset.id);break;case'context':showContext();break;case'import':importModal();break;case'import-example':$('#import-json').value=JSON.stringify(W.sample,null,2);$('#import-errors').innerHTML='';break;case'sample-download':download('watchkeep-sample-exercise.json',W.sample);break;case'import-confirm':await doImport();break;case'gap':gapModal(el.dataset.id);break;case'save-gap':{const g=state.gaps.find(g=>g.id===el.dataset.id);g.note=$('#gap-note').value.trim();await event('gap',{id:g.id,title:g.title,note:g.note});state.reviewSeq=null;save();closeDialog();render();notify('Context note saved. Original uncertainty remains in the record.');break;}case'review':await startReview();break;case'confirm-review':await confirmReview();break;case'export':await exportReview();break;case'library-export':download('watchkeep-demonstration-library.json',{simulationOnly:true,provenance:'Fictional passages authored for Norfolk #21 demonstration. Not operational doctrine.',passages:W.passages});notify('Fictional source library exported.');break;case'clear-library':libraryFilter='';categoryFilter='all';render();break;case'timeline-filter':timelineFilter=el.dataset.id;render();break;case'note':noteModal();break;case'edit-note':noteModal(el.dataset.id);break;case'save-note':{const text=$('#note-text').value.trim();if(!text){$('#note-error').innerHTML='<div class="error">Add an observation before saving.</div>';return;}await event(el.dataset.id?'note-edit':'note',el.dataset.id?{target:Number(el.dataset.id),text}:{text});state.reviewSeq=null;save();closeDialog();render();notify('Observation saved to the local review record.');break;}case'verify':{const v=await W.verifyChain(state.events);modal('LOCAL AUDIT INTEGRITY',v.ok?'The event chain is consistent':'A chain mismatch was found',`<p>${v.ok?`${v.count} events verified by recalculating each SHA-256 hash and checking its link to the previous event.`:`Event ${v.failedAt} failed verification.`}</p>${v.ok?`<div class="field"><span>Current chain head</span><p style="font:10px/1.7 var(--mono);overflow-wrap:anywhere">${v.head}</p></div>`:''}<div class="scope-block"><p>Consistency does not prove identity or prevent a local user from rewriting the full record. Retaining an exported chain head provides a comparison point.</p></div>`,`<button class="button primary" data-action="close">Done</button>`);break;}case'about':about();break;case'reset':modal('RESET LOCAL WORKSPACE','Start the sample again?',`<p>This removes the active exercise, annotations, and local review history. Export your review first if you need to keep it.</p>`,`<button class="button secondary" data-action="close">Cancel</button><button class="button primary" data-action="reset-confirm">Reset to sample</button>`);break;case'reset-confirm':await fresh();closeDialog();view='workspace';render();notify('Sample exercise restored.');break;case'recovery':download('watchkeep-recovered-storage.txt',damagedSaved,'text/plain');break;}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||busy)return;busy=true;try{await act(el.dataset.action,el);}catch(err){console.error(err);notify('The action could not be completed. Your current source record is retained.');}finally{busy=false;}});
document.addEventListener('submit',async e=>{if(e.target.id!=='query-form')return;e.preventDefault();if(busy)return;busy=true;try{state.query=$('#query').value;const policy=W.queryPolicy(state.query);if(!policy.allowed){state.error=policy.reason;if(policy.kind==='policy'){state.retrievedQuery='';state.reviewSeq=null;await event('blocked',{request:state.query,reason:policy.reason});}save();render();return;}const start=performance.now();const rs=W.retrieve(state.query);state.retrievalMs=performance.now()-start;state.retrievedQuery=state.query;state.error='';state.reviewSeq=null;state.checks.sources=false;await event('retrieval',{query:state.query,citations:rs.map(r=>r.passage.id)});render();notify(rs.length?`${rs.length} grounded training passages found.`:'No matching passage. No response was inferred.');}catch(err){console.error(err);notify('Retrieval could not finish. Try again.');}finally{busy=false;}});
document.addEventListener('input',e=>{if(e.target.id==='query'){state.query=e.target.value;}if(e.target.id==='library-search'){libraryFilter=e.target.value;$('#library-grid').innerHTML=libraryCards();}});
document.addEventListener('change',async e=>{if(e.target.dataset.check){const id=e.target.dataset.check;state.checks[id]=e.target.checked;state.reviewSeq=null;await event('prerequisite',{id,label:W.prerequisites.find(p=>p.id===id).label,value:e.target.checked});render();}if(e.target.id==='category'){categoryFilter=e.target.value;$('#library-grid').innerHTML=libraryCards();}if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;if(file.size>100000){$('#import-errors').innerHTML='<div class="error">File exceeds 100 KB. Choose a smaller synthetic exercise packet.</div>';return;}$('#import-json').value=await file.text();$('#import-errors').innerHTML='';}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
async function init(){let raw;try{const backup=localStorage.getItem(KEY+'-recovery');if(backup){damagedSaved=backup;storageIssue='A recovered copy of previously invalid saved data is available to download.';}raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed.version!==1||!W.validateIncident(parsed.incident).ok||!Array.isArray(parsed.events)||!Array.isArray(parsed.gaps)||!parsed.checks)throw Error('Invalid stored shape');const chain=await W.verifyChain(parsed.events);if(!chain.ok)throw Error('Invalid audit chain');state=parsed;}}catch(err){damagedSaved=raw||null;if(raw){try{localStorage.setItem(KEY+'-recovery',raw);}catch{}}storageIssue='Saved data could not be validated. A fresh sample is open; the recovered record is available to download.';}if(!state)await fresh();render();}
init().catch(err=>{$('#app').innerHTML='<div style="padding:40px"><h1>WATCHKEEP needs browser cryptography</h1><p>Open this demo in a current browser at http://127.0.0.1:5321. The browser must support crypto.subtle.</p></div>';console.error(err);});
</script></body></html>
