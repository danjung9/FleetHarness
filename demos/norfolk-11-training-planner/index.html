function readinessPanel(){return `<section class="readiness"><h3>${icon('rules')} Weekly training coverage</h3><p>Planned evolutions against illustrative departmental targets.</p>${coverage().map(x=>`<div class="readiness-row"><span>${DEPTS[x.dept].name}</span><span class="mono">${x.count} / ${x.target}</span></div><div class="mini-track"><i style="width:${Math.min(100,x.count/x.target*100)}%"></i></div>`).join('')}<button class="text-link" data-view="rules">View planning assumptions</button></section>`;}
function crewView(){return `<section class="wide-panel"><div class="panel-title"><div><h2>Personnel loading</h2><p>Scheduled training hours per person · 4-hour daily cap in this demo</p></div><div class="heat-key">0h ${['#f0f5ed','#e0ecdc','#bdD7be','#8fb99c'].map(c=>`<i style="--heat:${c}"></i>`).join('')} 4h</div></div><div class="table-scroll"><table class="heatmap"><thead><tr><th>QUALIFIED PERSONNEL</th>${DAYS.map(d=>`<th>${d.slice(0,3).toUpperCase()}</th>`).join('')}<th>WEEK</th></tr></thead><tbody>${CREW.map(p=>{const weekly=events.filter(e=>e.crew.includes(p.id)).reduce((s,e)=>s+e.duration,0)/60;return `<tr><td class="crew-name"><strong>${p.name}</strong><small>${p.role}</small></td>${DAYS.map((d,day)=>{const list=events.filter(e=>e.day===day&&e.crew.includes(p.id)),hours=list.reduce((s,e)=>s+e.duration,0)/60;const conflicts=analyze(events).filter(i=>i.ids.some(id=>list.some(e=>e.id===id)));return `<td><button class="heat-cell" style="--heat:${hours>4?'#f5d9c9':hours>=3?'#b8d3b8':hours>=2?'#d2e3cb':hours>0?'#e5efde':'#f3f6ef'}" data-load="${p.id}:${day}" aria-label="${p.name}, ${d}, ${hours} hours"><b>${hours||'—'}</b><small>${hours?`${list.length} drill${list.length===1?'':'s'}${conflicts.length?' · review':''}`:'Available'}</small></button></td>`;}).join('')}<td class="mono">${weekly.toFixed(1)}h</td></tr>`;}).join('')}</tbody></table></div><div class="board-footer">${icon('help')}Training hours only; watchstanding, sleep, and total duty hours are not modeled. Click a cell to inspect drills.</div></section>`;}
function rulesView(){return `<section class="wide-panel"><div class="panel-title"><div><h2>The constraint model</h2><p>Deterministic checks run whenever the schedule changes.</p></div><span class="badge">ILLUSTRATIVE RULES</span></div><div class="rules-grid"><article class="rule-block"><h3>${icon('clock')} Time & availability</h3><ul><li>Monday–Friday, 08:00–17:00; half-hour slots.</li><li>Wednesday 10:00–12:00: ship operations blocks all training.</li><li>K. Reed unavailable Thursday 09:00–09:30 for medical duty.</li><li>Maximum 4 scheduled training hours per person per day.</li></ul></article><article class="rule-block"><h3>${icon('crew')} People & resources</h3><ul><li>A person cannot attend overlapping drills.</li><li>Each shared resource holds one evolution at a time.</li><li>Assigned crew must collectively cover every required qualification.</li><li>Locked drills cannot be moved by the automatic solver.</li></ul></article><article class="rule-block"><h3>${icon('spark')} How deconfliction works</h3><p>The solver evaluates half-hour alternatives, discards slots that violate a rule for that drill, and favors the smallest time change on the same day. It repeats until no conflicts remain or no feasible move is found. This is a bounded greedy search, not a guarantee of an optimal solution.</p><p>Every proposal is reviewed by the planner before applying. Qualifications and assigned crew are preserved by the solver.</p></article><article class="rule-block"><h3>${icon('rules')} Weekly targets</h3><p>Illustrative drill counts: Damage control 3, Engineering 3, Combat systems 2, Aviation 1, Weapons 2, Medical 1. Coverage counts planned sessions, even when a scheduling conflict still needs resolution.</p><p>These targets are not an SFTRM periodicity check. No authoritative standard or readiness certification is represented.</p></article></div><div class="rule-note"><b>Source & scope.</b> Norfolk catalogue use case #11, “PB4T (Planning Board for Training) Autonomous Deconfliction Agent,” bundled in harness/norfolk-snapshot.ts. This handcrafted implementation demonstrates local scheduling and human review. Departmental AI agents, live rosters, identity, and enterprise synchronization are not implemented.</div><div class="panel-title"><div><h2>Synthetic roster & qualifications</h2><p>FPL: Fire party leader · DC: Damage control · EOOW: Engineering officer of the watch · TAO: Tactical action officer · CIC: Combat information center · FLIGHT: Flight deck · ORD: Ordnance · MED: Medical</p></div></div><div class="table-scroll"><table class="list-table"><thead><tr><th>Person</th><th>Training role</th><th>Qualifications</th><th>Availability exception</th></tr></thead><tbody>${CREW.map(p=>`<tr><td>${p.name}</td><td>${p.role}</td><td>${p.quals.map(q=>`<span class="tag">${q}</span>`).join(' ')}</td><td>${p.off.length?'Thu 09:00–09:30':'None in demo'}</td></tr>`).join('')}</tbody></table></div></section>`;}
function historyView(){return `<section class="wide-panel"><div class="panel-title"><div><h2>Planner change log</h2><p>${history.length} recorded changes · Local convenience history, not a secure audit trail</p></div><button class="btn" data-action="undo" ${undo?'':'disabled'}>${icon('undo')} Undo last change</button></div>${history.length?`<div class="audit-list">${history.map(h=>`<div class="audit-row"><i class="audit-dot"></i><div><b>${esc(h.title)}</b><p>${esc(h.detail)}</p><p class="mono">${esc(h.at)}</p></div></div>`).join('')}</div>`:`<div class="empty">${icon('history')}<h3>A fresh planning week.</h3><p>Edits, accepted proposals, and imports will appear here.</p><button class="btn" data-view="board">Back to board</button></div>`}</section>`;}
function modal(title,kicker,body,foot='',wide=false){lastFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><div><div class="eyebrow muted">${kicker}</div><h2 id="dialog-title">${esc(title)}</h2></div><button class="close" data-action="close" aria-label="Close dialog">${icon('close')}</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>$('.modal .close')?.focus(),0);}
function closeModal(){if(!$('#modal-root').innerHTML)return;$('#modal-root').innerHTML='';document.body.style.overflow='';modalType=null;lastFocus?.focus();}
function edit(id){modalType='edit';const existing=events.find(e=>e.id===id),e=existing||{id:'D'+Date.now().toString(36),title:'',department:'dc',day:0,start:480,duration:60,resource:'DC trainer',crew:[],requiredQualifications:['FPL'],locked:false};const issues=existing?analyze(events).filter(i=>i.ids.includes(id)):[],alts=existing?alternatives(events,id,3):[];
modal(existing?e.title:'Add a training evolution',existing?`${DEPTS[e.department].name} / ${e.id}`:'NEW DRILL',`<form id="drill-form" data-id="${e.id}" data-existing="${!!existing}"><div id="form-error" role="alert"></div><div class="form-grid"><label class="full">Drill title<input name="title" maxlength="80" value="${esc(e.title)}" placeholder="e.g. Fire party response" required></label><label>Department<select name="department">${Object.entries(DEPTS).map(([k,d])=>`<option value="${k}" ${e.department===k?'selected':''}>${d.name}</option>`).join('')}</select></label><label>Shared resource<select name="resource">${RESOURCES.map(r=>`<option ${e.resource===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Day<select name="day">${DAYS.map((d,i)=>`<option value="${i}" ${e.day===i?'selected':''}>${d}, November ${i+9}</option>`).join('')}</select></label><label>Start time<select name="start">${Array.from({length:18},(_,i)=>480+i*30).map(m=>`<option value="${m}" ${e.start===m?'selected':''}>${time(m)}</option>`).join('')}</select></label><label>Duration<select name="duration">${[30,60,90,120,150,180].map(m=>`<option value="${m}" ${e.duration===m?'selected':''}>${m} minutes</option>`).join('')}</select></label><label>Required qualifications<input name="qualifications" value="${esc(e.requiredQualifications.join(', '))}" placeholder="FPL, DC"><small class="muted">Comma-separated codes from the roster</small></label><div class="full"><span class="field-label">Assigned personnel</span><div class="crew-picker">${CREW.map(p=>`<label class="crew-option"><input type="checkbox" name="crew" value="${p.id}" ${e.crew.includes(p.id)?'checked':''}><span>${p.name}<br><small>${p.quals.join(' · ')}</small></span></label>`).join('')}</div></div></div><label class="toggle-row"><input type="checkbox" name="locked" ${e.locked?'checked':''}>${icon('lock')} Lock placement during automatic deconfliction</label></form>${issues.length?`<div class="detail-issues"><h3>Current scheduling conflicts</h3>${issues.map(i=>`<div class="notice warn"><b>${esc(i.title)}</b><br>${esc(i.detail)}</div>`).join('')}</div>`:''}${existing?`<div style="margin-top:22px"><h3 style="font-size:12px">${e.locked?'Placement locked':'Feasible alternatives'}</h3>${e.locked?'<p class="lead" style="margin:8px 0 0">Unlock and save this drill to calculate alternatives.</p>':alts.length?alts.map(a=>`<div class="alternative"><div><b>${DAYS[a.day]} · ${time(a.start)}–${time(a.start+e.duration)}</b><small>Same personnel and resource · no conflicts for this drill</small></div><button class="btn" data-move="${e.id}:${a.day}:${a.start}">Use slot</button></div>`).join(''):'<p class="lead" style="margin-top:8px">No feasible time found. Review assigned qualifications or the availability constraints.</p>'}</div>`:''}<p class="muted" style="font-size:10px;margin-top:18px">Saving keeps this as a draft. Any conflicts are recalculated and remain visible on the board.</p>`,`${existing?`<button class="btn danger left" data-delete="${e.id}">Remove drill</button>`:''}<button class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit" form="drill-form">Save draft</button>`);}
function reviewPlan(){proposal=optimize(events);modalType='proposal';const before=analyze(events).length;modal('A better fit for the week.','DECONFLICTION / PLANNER REVIEW',`<div class="proposal-banner">${icon('spark')}<div><b>${before} conflicts → ${proposal.remaining.length} remaining</b><p>${proposal.changes.length} placement changes · personnel and resources preserved</p></div></div>${proposal.changes.length?`<p class="lead">Review the proposed moves below. Your current board stays in place until you accept this plan.</p>${proposal.changes.map(c=>`<article class="proposal-row"><h3>${esc(c.title)}</h3><div class="proposal-times"><span>${DAYS[c.from.day].slice(0,3)} ${time(c.from.start)}</span>${icon('arrow')}<span>${DAYS[c.to.day].slice(0,3)} ${time(c.to.start)}</span></div><p>Resolves: ${esc(c.reason)}</p></article>`).join('')}`:`<p class="lead">${before?'No feasible moves were found. A locked placement, missing qualification, or fixed constraint may require a manual change.':'The current schedule has no conflicts under the configured demo rules.'}</p>`}${proposal.remaining.length?`<div class="notice warn"><b>Still needs review</b><br>${proposal.remaining.map(i=>esc(i.title)).join('<br>')}</div>`:''}<div class="notice">The solver checks shared personnel, resources, qualifications, availability, and daily training load. It prioritizes nearby times; it does not guarantee a globally optimal schedule.</div>`,`<button class="btn" data-action="close">${proposal.changes.length?'Keep current plan':'Back to board'}</button>${proposal.changes.length?`<button class="btn primary" data-action="accept">${icon('check')} Accept ${proposal.changes.length} changes${proposal.remaining.length?' (partial)':''}</button>`:''}`);}
function importModal(){modalType='import';modal('Bring a plan to the board.','IMPORT / SYNTHETIC DATA',`<p class="lead">Paste a PB4T JSON schedule or use an exported plan. Import replaces this week's drills; current roster and demo rules remain fixed.</p><div class="import-tools"><button class="text-link" data-action="load-example">Load synthetic example</button><label class="btn file-label">Choose JSON file<input id="import-file" type="file" accept=".json,application/json" hidden></label></div><textarea id="import-text" aria-label="Schedule JSON" spellcheck="false" placeholder='{"events": [{"id": "D01", "title": "Fire party response", ...}]}'></textarea><div id="import-result" aria-live="polite"></div><p class="muted" style="font-size:11px;margin-top:10px">Up to 50 drills / 200 KB. An empty events array clears the board. Export first to preserve a copy.</p>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="validate-import">Review import</button>`);}
let imported=null;
function validateImport(){imported=null;$('.modal-foot').innerHTML='<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="validate-import">Review import</button>';try{imported=parse($('#import-text').value);const issues=analyze(imported);$('#import-result').innerHTML=`<div class="notice"><b>${imported.length} valid drills ready to import.</b><br>${issues.length} scheduling conflicts will remain visible for planner review. This replaces ${events.length} current drills.</div>`;$('.modal-foot').innerHTML='<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="apply-import">Replace schedule</button>';}catch(e){imported=null;$('#import-result').innerHTML=`<div class="error">${esc(e.message)}</div>`;}}
function download(name,content,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast(`${name} exported`);}
function exportModal(){modalType='export';modal('Take the plan with you.','EXPORT / CURRENT SCHEDULE',`<p class="lead">Export all ${events.length} drills for November 9–13, including ${analyze(events).length} unresolved conflicts. Filters do not limit the export.</p><div class="format-options"><button data-export="json">${icon('file')}<span><b>Complete planning file</b><small>JSON · drills, constraints, conflicts, and change history · re-importable</small></span>${icon('arrow')}</button><button data-export="csv">${icon('list')}<span><b>Training schedule</b><small>CSV · one row per drill for spreadsheets and handoffs</small></span>${icon('arrow')}</button><button data-action="print">${icon('board')}<span><b>Print the weekly board</b><small>Browser print view · save as PDF using your print dialog</small></span>${icon('arrow')}</button></div><div class="notice">Synthetic exercise data. This file is a planning draft, not an official training approval or compliance record.</div>`);}
function loadModal(person,day){const p=CREW.find(p=>p.id===person),list=events.filter(e=>e.day===day&&e.crew.includes(person)).sort((a,b)=>a.start-b.start);modalType='load';modal(`${p.name} · ${DAYS[day]}`,'PERSONNEL / DAILY TRAINING',`<p class="lead">${p.role} · ${p.quals.join(', ')}<br>${list.reduce((s,e)=>s+e.duration,0)/60} of 4 illustrative training hours scheduled.</p>${list.length?list.map(e=>`<div class="alternative"><div><b>${esc(e.title)}</b><small>${time(e.start)}–${time(e.start+e.duration)} · ${e.resource}</small></div><button class="btn" data-edit="${e.id}">Review</button></div>`).join(''):'<div class="notice">No training assigned on this day.</div>'}${p.off.filter(w=>w.day===day).map(w=>`<div class="notice warn">Unavailable ${time(w.start)}–${time(w.end)} · ${w.label}</div>`).join('')}<p class="muted" style="margin-top:20px;font-size:11px">Only training hours are counted. The demo does not model full duty schedules or rest periods.</p>`);}
function about(){modalType='about';modal('A planning week, made clear.','PB4T / NORFOLK #11',`<p class="lead">A handcrafted, offline training coordination demo. Start with four conflicts, inspect the affected people and resources, then review a feasible plan before applying it.</p><div class="notice"><b>Presentation walkthrough</b><br>1. Select a conflict to inspect its cause and alternatives.<br>2. Choose Deconflict week and review the proposed moves.<br>3. Accept changes, then open Personnel load.<br>4. Export the plan or edit a drill to explore the rules.</div><p class="lead">All personnel, schedules, and availability windows are synthetic. Weekly targets and the four-hour training cap are illustrative. The app runs a deterministic local solver; it does not implement live integrations, autonomous departmental agents, or SFTRM certification.</p><p class="muted" style="font-size:11px">Source: bundled Norfolk catalogue, use case 11. Local fonts: DM Sans and IBM Plex Mono under the SIL Open Font License. Schedule data is stored in this browser; exported JSON is the portable copy.</p>`,`<button class="btn danger left" data-action="reset-confirm">Reset example</button><button class="btn primary" data-action="close">Explore the board</button>`);}
const actions={close:closeModal,about,add:()=>edit(),optimize:reviewPlan,import:importModal,export:exportModal,accept:()=>{if(!proposal)return;mutate(proposal.events,`Accepted ${proposal.changes.length} schedule changes`,`${proposal.changes.map(c=>`${c.title}: ${DAYS[c.from.day]} ${time(c.from.start)} → ${DAYS[c.to.day]} ${time(c.to.start)}`).join('; ')}. ${proposal.remaining.length} conflicts remain.`);proposal=null;},'clear-filters':()=>{query='';department='all';render();},'load-example':()=>{$('#import-text').value=JSON.stringify({events:seed()},null,2);$('#import-result').innerHTML='';imported=null;$('.modal-foot').innerHTML='<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="validate-import">Review import</button>';},'validate-import':validateImport,'apply-import':()=>{if(imported)mutate(imported,`Imported ${imported.length} drills`,'Replaced the weekly schedule from validated JSON.');imported=null;},undo:()=>{if(!undo)return;const previous=undo;undo=null;events=previous;record('Undid the last schedule change','Restored the prior set of drills.');persist();render();toast('Last schedule change undone');},'reset-confirm':()=>{modal('Restore the example week?','RESET / LOCAL WORKSPACE','<p class="lead">This replaces your schedule with the 12 original synthetic drills and four scheduling conflicts. Export your work first if you want to keep it. The change log remains available.</p>','<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="reset">Restore example</button>');},reset:()=>{query='';department='all';view='board';mutate(seed(),'Restored synthetic example','Reset the board to the original 12 drills and four conflicts.');},print:()=>{closeModal();view='board';mode='calendar';query='';department='all';render();window.print();}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;closeModal();render();}else if(b.dataset.mode){mode=b.dataset.mode;render();}else if(b.dataset.action){actions[b.dataset.action]?.();}else if(b.dataset.edit){edit(b.dataset.edit);}else if(b.dataset.move){const[id,day,start]=b.dataset.move.split(':');const target=events.find(e=>e.id===id);if(target.locked){toast('Unlock this drill before moving it.');return;}if(!alternatives(events,id,1000).some(a=>a.day===+day&&a.start===+start)){toast('This slot is no longer feasible. Reopen the drill.');return;}mutate(events.map(e=>e.id===id?{...e,day:+day,start:+start}:e),`Moved ${target.title}`,`${slot(target)} → ${DAYS[+day]} ${time(+start)}. Chosen feasible alternative.`);}else if(b.dataset.delete){const id=b.dataset.delete;const target=events.find(e=>e.id===id);modal('Remove this drill?','DRAFT / REMOVE EVOLUTION',`<p class="lead">${esc(target.title)} will be removed from the week. Departmental coverage will be recalculated. You can undo this change from the change log.</p>`,`<button class="btn" data-action="close">Keep drill</button><button class="btn danger" data-remove="${id}">Remove drill</button>`);}else if(b.dataset.remove){mutate(events.filter(e=>e.id!==b.dataset.remove),'Removed drill',`${events.find(e=>e.id===b.dataset.remove).title} removed from the schedule.`);}else if(b.dataset.export){const type=b.dataset.export;if(type==='json')download('pb4t-week-46.json',JSON.stringify(payload(events,history),null,2),'application/json');else download('pb4t-week-46.csv',csv(events),'text/csv');}else if(b.dataset.load){const[p,d]=b.dataset.load.split(':');loadModal(p,+d);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#schedule-content').innerHTML=scheduleContent();}if(e.target.id==='import-text'&&imported){imported=null;$('#import-result').innerHTML='';$('.modal-foot').innerHTML='<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="validate-import">Review import</button>';}});
document.addEventListener('change',async e=>{if(e.target.id==='department'){department=e.target.value;$('#schedule-content').innerHTML=scheduleContent();}if(e.target.id==='import-file'){const f=e.target.files[0];if(!f)return;imported=null;$('.modal-foot').innerHTML='<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="validate-import">Review import</button>';if(f.size>200000){$('#import-result').innerHTML='<div class="error">File exceeds the 200 KB demo limit.</div>';return;}try{$('#import-text').value=await f.text();validateImport();}catch{$('#import-result').innerHTML='<div class="error">Could not read this file. Try pasting JSON instead.</div>';}}});
document.addEventListener('submit',e=>{if(e.target.id!=='drill-form')return;e.preventDefault();const form=e.target,fd=new FormData(form),id=form.dataset.id;try{const drill={id,title:fd.get('title'),department:fd.get('department'),day:+fd.get('day'),start:+fd.get('start'),duration:+fd.get('duration'),crew:fd.getAll('crew'),resource:fd.get('resource'),requiredQualifications:fd.get('qualifications').split(',').map(q=>q.trim().toUpperCase()).filter(Boolean),locked:fd.get('locked')==='on'};validate([drill]);const next=form.dataset.existing==='true'?events.map(x=>x.id===id?drill:x):[...events,drill];validate(next);mutate(next,`${form.dataset.existing==='true'?'Updated':'Added'} ${drill.title}`,`${slot(drill)} · ${drill.resource}. ${analyze(next).length} schedule conflicts after this change.`);}catch(err){$('#form-error').innerHTML=`<div class="error">${esc(err.message)}</div>`;$('#form-error').scrollIntoView({block:'nearest'});}});
document.addEventListener('keydown',e=>{if(!$('.modal'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const nodes=[...$('.modal').querySelectorAll('button:not(:disabled),input:not([hidden]),select,textarea,a[href]')].filter(x=>x.offsetParent!==null);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();if(storageWarning)toast(storageWarning);
})();
</script></body></html>
