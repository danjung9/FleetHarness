function activityView(){return `${heading('Activity log','A local record of assessment changes and mitigation decisions.',`<button class="btn" data-action="export">${icon('download')}Export activity</button>`)}<div class="help-box green">This history is stored in the browser. It is an editable demo record, not a signed or tamper-resistant audit trail.</div><div class="activity-list">${state.activity.map(a=>`<article class="activity-item">${icon('activity')}<div><h3>${esc(a.action)}${a.riskId?` · <button class="btn ghost small" data-risk="${esc(a.riskId)}">${esc(a.riskId)}</button>`:''}</h3><p>${esc(a.detail)}</p></div><time>${timestamp(a.at)}</time></article>`).join('')}</div>`}
function bindMain(){bindCommon($('#app'));$('#search')?.addEventListener('input',e=>{query=e.target.value;$('#risk-table').innerHTML=tableView();bindCommon($('#risk-table'))});for(const [id,key]of [['facility-filter','facility'],['priority-filter','priority'],['status-filter','status']])$('#'+id)?.addEventListener('change',e=>{if(key==='facility')facility=e.target.value;if(key==='priority')priority=e.target.value;if(key==='status')status=e.target.value;$('#risk-table').innerHTML=tableView();bindCommon($('#risk-table'))});$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$$('[data-mode]').forEach(b=>b.onclick=()=>{matrixMode=b.dataset.mode;matrixFilter=null;render()});$$('[data-cell]').forEach(b=>b.onclick=()=>{const[l,i]=b.dataset.cell.split(',').map(Number);matrixFilter=matrixFilter?.l===l&&matrixFilter?.i===i?null:{l,i};status='active';render()})}
function bindCommon(root){root.querySelectorAll('[data-risk]').forEach(b=>b.onclick=()=>openRisk(b.dataset.risk,b.dataset.tab||'assessment'));root.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>openSource(b.dataset.source));root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}
function action(a){if(a==='new')openNew();if(a==='import')openImport();if(a==='export')openExport();if(a==='model')openModel();if(a==='about')openAbout();if(a==='add-evidence')openEvidenceForm();if(a==='clear-cell'){matrixFilter=null;render()}if(a==='clear-filters'){query='';facility='all';priority='all';status='active';matrixFilter=null;render()}if(a==='close')closeModal()}
function modal(title,body,{eyebrow='GROUNDWORK / HARBOR POINT',drawer=false,wide=false,footer='',tabs=''}={}){if(!$('#overlay').innerHTML)lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="overlay"><section class="dialog ${drawer?'drawer':''} ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><div><div class="eyebrow">${eyebrow}</div><h2 id="dialog-title">${esc(title)}</h2></div><button class="icon-button" data-action="close" aria-label="Close dialog">${icon('close')}</button></header>${tabs}<div class="dialog-body">${body}</div>${footer?`<footer class="dialog-footer">${footer}</footer>`:''}</section></div>`;document.body.classList.add('modal-open');bindCommon($('#overlay'));setTimeout(()=>$('#overlay button, #overlay input')?.focus(),0);$('#overlay .overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeModal()}}
function closeModal(){if($('#overlay [data-dirty="true"]')){if(!confirm('Discard the unsaved form changes?'))return}$('#overlay').innerHTML='';document.body.classList.remove('modal-open');selected=null;draft=null;lastFocus?.focus()}
document.addEventListener('keydown',e=>{if(!$('#overlay').innerHTML)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const a=[...$('#overlay').querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled&&el.offsetParent!==null),first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const inputField=(name,label,value,type='text',extra='')=>`<div class="form-field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
const selectField=(name,label,values,value)=>`<div class="form-field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options(values,value)}</select></div>`;
const areaField=(name,label,value,extra='')=>`<div class="form-field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${extra}>${esc(value)}</textarea></div>`;
const likelihoods=['Rare','Unlikely','Possible','Likely','Almost certain'],impacts=['Minor','Limited','Moderate','Major','Severe'];
function scaleField(name,label,value,labels){return `<div class="form-field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${labels.map((v,i)=>`<option value="${i+1}" ${Number(value)===i+1?'selected':''}>${i+1} · ${v}</option>`).join('')}</select></div>`}
function scoringFields(r){return `<div class="form-row">${scaleField('likelihood','Inherent likelihood',r.likelihood,likelihoods)}${scaleField('impact','Inherent impact',r.impact,impacts)}</div><div class="form-row">${scaleField('targetLikelihood','Target likelihood',r.targetLikelihood,likelihoods)}${scaleField('targetImpact','Target impact',r.targetImpact,impacts)}</div>`}
function scorePreview(r){return `<div class="score-preview"><div class="stat"><small>INHERENT SCORE</small><strong>${score(r)}</strong><p>${r.likelihood} × ${r.impact} × ${state.model.factor} · ${band(r)}</p></div><span class="arrow">${icon('arrow')}</span><div class="stat"><small>PROJECTED TARGET</small><strong>${target(r)}</strong><p>${r.targetLikelihood} × ${r.targetImpact} × ${state.model.factor} · after mitigation</p></div><div class="stat"><small>PLANNED REDUCTION</small><strong>${score(r)?Math.round((1-target(r)/score(r))*100):0}<span style="font-size:13px">%</span></strong><p>Not a measured outcome</p></div></div>`}
function bindScoreForm(form){form.addEventListener('input',()=>{form.dataset.dirty='true';const obj=Object.fromEntries(new FormData(form));for(const k of ['likelihood','impact','targetLikelihood','targetImpact'])obj[k]=Number(obj[k]);$('#assessment-preview').innerHTML=scorePreview(obj)});form.addEventListener('change',()=>form.dataset.dirty='true')}
function formValues(form){const r=Object.fromEntries(new FormData(form));for(const k of ['likelihood','impact','targetLikelihood','targetImpact'])r[k]=Number(r[k]);for(const k of ['title','owner','description','rationale'])if(r[k])r[k]=r[k].trim();return r}
function showErrors(errors){$('#form-errors').innerHTML=errors.map(esc).join('<br>');if(errors.length)$('#form-errors').scrollIntoView({block:'nearest'})}
function openRisk(id,nextTab='assessment'){const r=state.risks.find(r=>r.id===id);if(!r){toast('This risk is no longer in the register.');return}selected=id;tab=nextTab;let body;if(tab==='assessment')body=`<div id="assessment-preview">${scorePreview(r)}</div><form id="risk-form"><div class="form-field"><label for="f-title">Risk title</label><input id="f-title" name="title" maxlength="140" required value="${esc(r.title)}"></div>${areaField('description','Hazard & readiness consequence',r.description,'required maxlength="8000"')}${selectField('facility','Affected facility',facilities(),r.facility)}<div class="form-section">Assessment assumptions</div>${scoringFields(r)}<div class="form-row">${selectField('confidence','Evidence confidence',['Low','Medium','High'],r.confidence)}${selectField('burden','Mitigation burden',['Low','Medium','High'],r.burden)}</div>${areaField('rationale','Assessment rationale',r.rationale,'maxlength="3000"')}<div class="form-section">Accountability & review</div>${inputField('owner','Accountable owner',r.owner,'text','required maxlength="80"')}<div class="form-row">${selectField('status','Risk status',['Open','Mitigating','Monitoring','Closed'],r.status)}${inputField('review','Next review',r.review,'date','required')}</div><div id="form-errors" class="error" role="alert"></div></form><p class="subtle">Illustrative scales: likelihood describes an assumed planning-period frequency; impact describes relative disruption. Neither is a measured probability or an approved standard.</p>`;
else if(tab==='evidence')body=`<p class="risk-summary">Source records preserve what was observed and what is still uncertain. Open a record to inspect the original narrative.</p>${r.evidenceIds.length?r.evidenceIds.map(id=>{const e=state.evidence.find(e=>e.id===id);return e?`<div class="linked-doc">${icon('file')}<button class="doc-open" data-source="${esc(e.id)}"><strong>${esc(e.name)}</strong><small>${esc(e.id)} · ${esc(e.type)} · ${date(e.date)}</small></button><button class="icon-button" data-unlink="${esc(e.id)}" aria-label="Unlink ${esc(e.name)}">${icon('close')}</button></div>`:''}).join(''):`<div class="empty">${icon('file')}<h3>No evidence linked</h3><p>Link an inspection or project narrative to support this assessment.</p></div>`}<div class="form-section">Link an existing source</div><form id="link-form"><div class="form-field"><label for="source-link">Available evidence</label><select id="source-link" name="source"><option value="">Choose a source record…</option>${state.evidence.filter(e=>!r.evidenceIds.includes(e.id)).map(e=>`<option value="${esc(e.id)}">${esc(e.id+' · '+e.name)}</option>`).join('')}</select></div><button class="btn primary" type="submit">${icon('link')}Link source</button><button class="btn" type="button" id="new-evidence">${icon('plus')}Add evidence</button><div id="form-errors" class="error" role="alert"></div></form>`;
else body=`${scorePreview(r)}<p class="risk-summary">Target scores assume the mitigation plan succeeds. Keep the current assessment until effectiveness is reviewed.</p><div class="section-title"><h2>Action plan <span>${countDone(r)} / ${r.actions.length}</span></h2></div>${r.actions.map(a=>`<div class="task ${a.done?'completed':''}"><input type="checkbox" id="task-${esc(a.id)}" data-task="${esc(a.id)}" ${a.done?'checked':''}><label for="task-${esc(a.id)}">${esc(a.title)}<small>Owner: ${esc(r.owner)}</small></label></div>`).join('')||`<div class="empty"><p>No actions yet. Add the next concrete step below.</p></div>`}<form id="action-form" style="margin-top:25px"><div class="form-field"><label for="new-action">Next mitigation action</label><input id="new-action" name="title" placeholder="e.g. Complete load-capacity review" maxlength="180" required></div><button class="btn primary">${icon('plus')}Add action</button><div id="form-errors" class="error" role="alert"></div></form><div class="form-section">Current ownership</div><div class="mini-row"><span>${esc(r.owner)}</span><span>Review ${date(r.review)}</span></div><p class="subtle">Status: ${r.status}. Use the Assessment tab to change status after a human review.</p>`;
modal(r.title,body,{drawer:true,eyebrow:`${esc(r.id)} / ${esc(r.facility)}`,tabs:`<div class="tabs">${[['assessment','Assessment'],['evidence',`Evidence (${r.evidenceIds.length})`],['mitigation','Mitigation']].map(([t,label])=>`<button data-detail-tab="${t}" class="${tab===t?'active':''}">${label}</button>`).join('')}</div>`,footer:tab==='assessment'?`<small>Saved ${timestamp(r.updated)}</small><button class="btn primary" type="submit" form="risk-form">${icon('check')}Save assessment</button>`:`<small>${esc(r.id)} · ${esc(r.status)}</small><button class="btn" data-action="close">Done</button>`});
$$('[data-detail-tab]').forEach(b=>b.onclick=()=>{if($('#risk-form')?.dataset.dirty==='true'&&!confirm('Discard unsaved assessment changes?'))return;openRisk(id,b.dataset.detailTab)});
if(tab==='assessment'){const form=$('#risk-form');bindScoreForm(form);form.onsubmit=e=>{e.preventDefault();const vals=formValues(form),errors=C.validateRisk(vals);if(errors.length)return showErrors(errors);const old=score(r),oldTarget=target(r),oldStatus=r.status;Object.assign(r,vals,{updated:new Date().toISOString()});log('Assessment updated',`${r.title}. Inherent ${old} → ${score(r)}; projected target ${oldTarget} → ${target(r)}; status ${oldStatus} → ${r.status}. Owner: ${r.owner}.`,id);save();render();openRisk(id);toast('Assessment saved. Scores recalculated.')}}
if(tab==='evidence'){const form=$('#link-form');form.onsubmit=e=>{e.preventDefault();const source=new FormData(form).get('source');if(!source)return showErrors(['Choose an evidence record to link.']);r.evidenceIds.push(source);r.updated=new Date().toISOString();log('Evidence linked',`${source} linked to ${r.title}.`,id);save();render();openRisk(id,'evidence');toast('Source linked to this risk.')};$('#new-evidence').onclick=()=>openEvidenceForm(id);$$('[data-unlink]').forEach(b=>b.onclick=()=>{const source=b.dataset.unlink;r.evidenceIds=r.evidenceIds.filter(x=>x!==source);log('Evidence unlinked',`${source} unlinked from ${r.title}; source retained in library.`,id);save();render();openRisk(id,'evidence');toast('Link removed. Source kept in the library.')})}
if(tab==='mitigation'){$$('[data-task]').forEach(b=>b.onchange=()=>{const a=r.actions.find(a=>a.id===b.dataset.task);a.done=b.checked;r.updated=new Date().toISOString();log(a.done?'Mitigation action completed':'Mitigation action reopened',a.title,id);save();render();openRisk(id,'mitigation');toast(a.done?'Action complete. Assessment remains unchanged.':'Action reopened.')});$('#action-form').onsubmit=e=>{e.preventDefault();const title=new FormData(e.target).get('title').trim();if(!title)return showErrors(['Enter a concrete action.']);r.actions.push({id:id+'-A'+Date.now(),title,done:false});log('Mitigation action added',title,id);save();render();openRisk(id,'mitigation');toast('Mitigation action added.')}}}
function nextId(){let n=1;while(state.risks.some(r=>r.id==='R-'+String(n).padStart(3,'0')))n++;return 'R-'+String(n).padStart(3,'0')}
function openNew(values={}){const r={title:'',description:'',facility:S.facilities[0],owner:'',likelihood:3,impact:3,targetLikelihood:2,targetImpact:2,confidence:'Low',burden:'Medium',status:'Open',review:'2026-11-19',rationale:'',...values};const isDraft=!!values.source;modal(isDraft?'Review narrative draft':'Create a risk',`${isDraft?`<div class="help-box">${esc(values.reason)} Review all fields before adding this risk. The original narrative will be saved as linked evidence.</div>`:''}<form id="new-risk-form">${inputField('title','Risk title',r.title,'text','required maxlength="140"')}${areaField('description','Hazard & readiness consequence',r.description,'required maxlength="8000"')}<div class="form-row">${selectField('facility','Affected facility',facilities(),r.facility)}${inputField('owner','Accountable owner',r.owner,'text','required maxlength="80"')}</div><div class="form-section">Illustrative assessment</div><div id="assessment-preview">${scorePreview(r)}</div>${scoringFields(r)}<div class="form-row">${selectField('confidence','Evidence confidence',['Low','Medium','High'],r.confidence)}${selectField('burden','Mitigation burden',['Low','Medium','High'],r.burden)}</div>${areaField('rationale','Assessment rationale',r.rationale,'maxlength="3000"')}<div class="form-row">${selectField('status','Risk status',['Open','Mitigating','Monitoring','Closed'],r.status)}${inputField('review','Review date',r.review,'date','required')}</div>${isDraft?`<label class="check-line"><input type="checkbox" name="reviewed" required>I reviewed the suggested hazard, scores, burden and source narrative.</label>`:''}<div id="form-errors" class="error" role="alert"></div></form>`,{wide:true,eyebrow:isDraft?'NARRATIVE IMPORT / HUMAN REVIEW':'NEW ASSESSMENT / SYNTHETIC DATA ONLY',footer:`<button class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit" form="new-risk-form">${icon('check')}Add to register</button>`});const form=$('#new-risk-form');bindScoreForm(form);form.onsubmit=e=>{e.preventDefault();const vals=formValues(form),errors=C.validateRisk(vals);if(errors.length)return showErrors(errors);const id=nextId(),newRisk={...vals,id,actions:[],evidenceIds:[],updated:new Date().toISOString()};delete newRisk.reviewed;if(isDraft){const evidenceId='NAR-'+Date.now();state.evidence.push({id:evidenceId,name:vals.title+' · source narrative',type:'Narrative',date:new Date().toISOString().slice(0,10),facility:vals.facility,text:values.source});newRisk.evidenceIds.push(evidenceId)}state.risks.push(newRisk);log(isDraft?'Narrative draft reviewed and added':'Risk created',`${id}: ${vals.title}. Inherent ${score(newRisk)}; projected target ${target(newRisk)}.`,id);save();form.dataset.dirty='false';closeModal();view='register';query='';facility='all';priority='all';status='active';matrixFilter=null;render();openRisk(id);toast(`${id} added to the register.`)}}
function openImport(){modal('Turn a narrative into a reviewable risk',`<div class="help-box">Local keyword assistant · no generative AI. Supported patterns: structural degradation, power reliability, flooding, and fire protection. Suggested scores are illustrative and require review.</div><form id="import-form"><div class="form-row">${selectField('facility','Affected facility',facilities(),S.facilities[0])}${inputField('owner','Accountable owner','','text','maxlength="80"')}</div><div class="form-field"><label for="narrative-file">Load a plain-text narrative</label><input type="file" id="narrative-file" accept=".txt,text/plain"><small>TXT only · up to 12,000 characters · use synthetic information.</small></div>${areaField('narrative','Source narrative','','maxlength="12000" placeholder="Paste a fictional inspection finding or project narrative…"')}<button class="btn small" id="load-example" type="button">${icon('file')}Load example narrative</button><div id="form-errors" class="error" role="alert"></div></form>`,{wide:true,eyebrow:'SOURCE → DRAFT → HUMAN REVIEW',footer:`<small>Source text will be preserved with the risk.</small><button class="btn primary" type="submit" form="import-form">Create review draft ${icon('arrow')}</button>`});$('#load-example').onclick=()=>{$('[name=narrative]').value='FICTIONAL INSPECTION — Workshop 12. Repeated power interruptions were reported during a synthetic load test. The aging electrical switchgear shows signs of overheating. The alternate circuit has not been tested under full load. Proposed work includes replacement of the connection assembly and a planned transfer test before regular service resumes.';$('#f-facility').value=S.facilities[3];$('#f-owner').value='Electrical systems';$('#import-form').dataset.dirty='true'};$('#narrative-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.txt')||f.size>60000){showErrors(['Choose a plain-text .txt file smaller than 60 KB.']);return}const text=await f.text();if(text.length>12000)return showErrors(['The narrative exceeds 12,000 characters.']);$('[name=narrative]').value=text;$('#import-form').dataset.dirty='true';showErrors([])};$('#import-form').oninput=e=>e.currentTarget.dataset.dirty='true';$('#import-form').onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.target));try{draft=C.draftNarrative(vals.narrative);draft.targetLikelihood=Math.min(draft.targetLikelihood,draft.likelihood);draft.targetImpact=Math.min(draft.targetImpact,draft.impact);openNew({...draft,facility:vals.facility,owner:vals.owner,rationale:draft.reason})}catch(err){showErrors([err.message])}}}
function openSource(id){const e=state.evidence.find(x=>x.id===id);if(!e)return;const back=selected;modal(e.name,`<div class="source-meta"><span>${esc(e.id)}</span><span>${esc(e.type)}</span><span>${esc(e.date)}</span><span>${esc(e.facility)}</span></div><div class="source-text">${esc(e.text)}</div><div class="form-section">Linked risks</div>${state.risks.filter(r=>r.evidenceIds.includes(e.id)).map(r=>`<button class="btn" data-risk="${r.id}">${esc(r.id+' · '+r.title)} ${icon('arrow')}</button>`).join(' ')||'<p class="subtle">This source is not linked to a risk yet.</p>'}`,{wide:true,eyebrow:'SOURCE RECORD / SYNTHETIC EVIDENCE',footer:`<small>Original text preserved · no external retrieval</small><button class="btn" id="source-back">${back?'Back to risk':'Close source'}</button>`});$('#source-back').onclick=()=>back?openRisk(back,'evidence'):closeModal()}
function openEvidenceForm(riskId){modal('Add a source record',`<form id="evidence-form">${inputField('name','Source title','','text','required maxlength="160"')}<div class="form-row">${selectField('type','Record type',['Inspection','Project','Narrative','Review note'],'Inspection')}${inputField('date','Source date','2026-11-05','date','required')}</div>${selectField('facility','Facility',facilities(),riskId?state.risks.find(r=>r.id===riskId).facility:S.facilities[0])}${areaField('text','Source text','','required maxlength="12000" placeholder="Preserve the original synthetic finding, assumptions, and uncertainties…"')}<div id="form-errors" class="error" role="alert"></div></form><p class="subtle">${riskId?'This source will be linked to '+esc(riskId)+'.':'The record will be available to link from any risk’s Evidence tab.'}</p>`,{footer:`<button class="btn" data-action="close">Cancel</button><button class="btn primary" form="evidence-form" type="submit">${icon('plus')}Save source</button>`});$('#evidence-form').oninput=e=>e.currentTarget.dataset.dirty='true';$('#evidence-form').onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.target));if(!vals.name.trim()||!vals.text.trim()||!C.validDate(vals.date))return showErrors(['Enter a source title, source text, and valid date.']);const id='SRC-'+Date.now();state.evidence.push({...vals,name:vals.name.trim(),text:vals.text.trim(),id});if(riskId)state.risks.find(r=>r.id===riskId).evidenceIds.push(id);log('Source record added',`${vals.name}${riskId?' linked to '+riskId:''}.`,riskId);save();e.target.dataset.dirty='false';closeModal();render();if(riskId)openRisk(riskId,'evidence');toast('Source record saved.')}}
function download(name,data,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Export downloaded.')}
function openExport(){modal('Export the decision record',`<p class="risk-summary">Take the current assessment, assumptions, and supporting evidence with you. All exports are labeled as synthetic.</p><div class="export-options"><button class="export-option" id="export-json">${icon('layers')}<h3>Complete workspace</h3><p>All ${state.risks.length} risks, ${state.evidence.length} original source records, model settings, mitigation actions, and local history.</p><small>Download JSON ${icon('arrow')}</small></button><button class="export-option" id="export-csv">${icon('grid')}<h3>Filtered risk register</h3><p>${filtered().length} risks in the current register filter, with owner, scores, status, confidence, and review dates.</p><small>Download CSV ${icon('arrow')}</small></button></div><p class="subtle" style="margin-top:22px">JSON is an archival snapshot. This demo imports narrative text, not workspace backups. CSV is suitable for review in a spreadsheet.</p>`,{eyebrow:'PORTABLE RECORD / SYNTHETIC DATA'});$('#export-json').onclick=()=>download('groundwork-synthetic-workspace.json',JSON.stringify(C.exportSnapshot(state),null,2),'application/json');$('#export-csv').onclick=()=>download('groundwork-synthetic-risk-register.csv','\uFEFF'+C.csv(filtered(),state.model),'text/csv;charset=utf-8')}
function openModel(){const m=state.model;modal('Make the scoring assumptions explicit',`<div class="formula">Score = likelihood × impact × multiplier<small>Inherent and projected target scores use the same model. Maximum score: <span id="max-score">${25*m.factor}</span>.</small></div><form id="model-form">${inputField('factor','Consequence multiplier',m.factor,'number','min="0.5" max="2" step="0.05" required')}<p class="subtle">A portfolio-wide sensitivity assumption. A multiplier of 1 uses the familiar 1–25 product. Changing it recalculates every risk and matrix cell.</p><div class="form-section">Priority bands · lower bounds</div><div class="form-row">${inputField('elevated','Elevated ≥',m.elevated,'number','min="0.1" step="0.1" required')}${inputField('high','High ≥',m.high,'number','min="0.1" step="0.1" required')}</div>${inputField('critical','Critical ≥',m.critical,'number','min="0.1" step="0.1" required')}<div class="help-box">Illustrative prioritization only. This is not a Navy-approved risk standard, an engineering determination, or a measured failure probability. Mitigation burden is a separate qualitative planning field.</div><div id="form-errors" class="error" role="alert"></div></form>`,{eyebrow:'ASSESSMENT MODEL / VERSION 1',footer:`<button class="btn" id="default-model">Restore default values</button><button class="btn primary" form="model-form" type="submit">Recalculate portfolio</button>`});$('#model-form').oninput=e=>{e.currentTarget.dataset.dirty='true';$('#max-score').textContent=String(Math.round(25*Number($('#f-factor').value)*10)/10)};$('#default-model').onclick=()=>{for(const[k,v]of Object.entries(C.defaults))$('[name='+k+']').value=v;$('#max-score').textContent='25';$('#model-form').dataset.dirty='true'};$('#model-form').onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)])),errors=C.validateModel(vals);if(errors.length)return showErrors(errors);const before=JSON.stringify(state.model);state.model=vals;log('Assessment model changed',`Previous ${before}; new ${JSON.stringify(vals)}. All inherent and projected target scores recalculated.`);save();e.target.dataset.dirty='false';closeModal();render();toast('Portfolio recalculated with the new model.')}}
function openAbout(){modal('A clear view of infrastructure risk',`<div class="help-box green">GROUNDWORK is a handcrafted, offline demonstration for Norfolk use case #19. Harbor Point, its facilities, owners, findings, and projects are fictional.</div><p class="risk-summary">Use the register to compare relative exposure, preserve source evidence, assign accountable teams, and track mitigation. Every assessment remains a human decision.</p><ul class="notes-list"><li>Data stays in browser local storage. No sign-in or synchronization.</li><li>Narrative drafts use four transparent keyword rules, not Gemini or another AI service.</li><li>Scores and mitigation targets are illustrative assumptions.</li><li>Local history is not a secured audit log.</li><li>Export JSON before resetting or changing browser profiles.</li></ul><div class="danger-zone"><strong>Restart the presentation</strong><p>Reset removes local edits, imported narratives, and added evidence from this workspace. The original fictional portfolio will be restored.</p><button class="btn" id="reset-demo">${icon('refresh')}Reset demo data</button></div>`,{eyebrow:'NORFOLK 19 / DEMONSTRATION SCOPE'});$('#reset-demo').onclick=()=>{if(!confirm('Reset all local risks, evidence, actions, and history to the original synthetic portfolio? Export first if you want to retain changes.'))return;state=structuredClone(S);save();closeModal();view='register';query='';facility='all';priority='all';status='active';matrixFilter=null;matrixMode='inherent';render();toast('Original synthetic portfolio restored.')}}
render();
})();

</script></body></html>
