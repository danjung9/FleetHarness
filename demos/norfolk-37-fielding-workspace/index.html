function requirements(){return `${heading('THE WORK AHEAD','Requirements, with a way forward.','Track the owner, evidence, and next action for each transition requirement. “Recorded” means a note is linked; it does not mean the requirement is verified or authorized.',`<button class="btn primary" data-action="new-requirement">${icon('plus')}Add requirement</button>`)}<div class="toolbar"><div class="search">${icon('search')}<input id="search" aria-label="Search requirements" placeholder="Search requirements, owners, sources…" value="${esc(query)}"></div><select id="group-filter" aria-label="Filter workstream">${['All workstreams',...P.groups].map(g=>`<option ${g===group?'selected':''}>${g}</option>`).join('')}</select><select id="status-filter" aria-label="Filter status">${['All statuses','Unresolved','Critical unresolved',...P.statuses].map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select></div><div id="requirement-results">${requirementResults()}</div>${footer()}`}

function packagePage(){return `${heading('THE HANDOFF PACKAGE','Evidence you can trace.','Keep the source and limits beside every note. This register stores text and provenance; it does not contain release archives or independently verified test artifacts.',`<button class="btn primary" data-action="new-evidence">${icon('plus')}Add evidence note</button>`)}<div class="package-grid"><section><div class="section-head"><h2>Evidence register</h2><span class="eyebrow">${state.evidence.length} NOTES</span></div><div class="evidence-list">${state.evidence.map(e=>`<article class="evidence-item"><div class="file-icon">${icon('file')}</div><div class="evidence-body"><button class="table-link" data-evidence="${e.id}"><strong>${esc(e.title)}</strong></button><p>${esc(e.source)}</p><div class="evidence-meta">${e.id} / ${esc(e.kind.toUpperCase())} / ${state.requirements.filter(r=>r.evidence.includes(e.id)).length} REQUIREMENTS LINKED</div></div><button class="row-action" data-evidence="${e.id}" aria-label="Read ${esc(e.title)}">${icon('chevron')}</button></article>`).join('')||'<div class="empty"><h3>No evidence notes yet.</h3><p>Add a note with its source and limitations.</p></div>'}</div><div class="notice">${icon('info')}The seeded notes are illustrative records, not actual device results, security findings, or a supplied software package.</div></section><section><div class="section-head"><h2>Dependencies</h2><button class="btn ghost small" data-action="new-dependency">${icon('plus')}Add</button></div>${state.dependencies.map(d=>`<article class="dependency"><div class="section-head" style="margin-bottom:0"><h3>${esc(d.name)}</h3><button class="row-action" data-dependency="${d.id}" aria-label="Edit ${esc(d.name)}">${icon('edit')}</button></div><div class="table-sub">${esc(d.version)}</div><p>${esc(d.note)}</p><div class="dependency-foot">${badge(d.status)}<span class="table-sub">${esc(d.owner)}</span></div></article>`).join('')||'<div class="empty"><h3>No dependencies recorded.</h3></div>'}</section></div>${footer()}`}
function hostingPage(){const selected=P.hosting.find(h=>h.id===state.decision.option);return `${heading('A DELIVERY DECISION','Choose a path. Keep the constraints.','These are illustrative architectural options, not approved platforms. A recorded candidate supports the next review; it cannot close a hosting or installation requirement by itself.')}<div class="hosting-grid">${P.hosting.map((h,i)=>`<article class="hosting-card ${selected?.id===h.id?'selected':''}"><div class="hosting-icon">${icon(['web','phone','laptop'][i])}</div><span class="status ${selected?.id===h.id?'recorded':''}">${selected?.id===h.id?'Proposed candidate':h.fit}</span><h2>${h.name}</h2><p class="subtitle">${h.subtitle}</p><p class="description">${h.description}</p><div class="hosting-details">${[['Offline use',h.offline],['Government mobile',h.mobile],['Installation',h.install],['Sustainment',h.sustain]].map(([k,v])=>`<div><b>${k}</b>${v}</div>`).join('')}</div><button class="btn ${selected?.id===h.id?'primary':''}" data-hosting="${h.id}">${selected?.id===h.id?'Edit proposal':'Propose this path'}${icon('arrow')}</button></article>`).join('')}</div>${selected?`<section class="decision-record"><h3>Current proposal · ${selected.name}</h3><p class="wrap-text">${esc(state.decision.rationale)}</p><p style="margin-top:10px"><strong>Still unresolved:</strong> ${selected.barrier}</p></section>`:''}<div class="notice">${icon('shield')}No route is authorized by this workspace. Confirm applicable hosting, mobile distribution, security evidence and operational restrictions with the responsible representatives.</div>${footer()}`}
function briefPage(){const st=P.stats(state),h=P.hosting.find(h=>h.id===state.decision.option);return `${heading('A REVIEWABLE NEXT STEP','The transition brief.','A living handoff assembled from this workspace. Edit the narrative, resolve source records, and export an editable Markdown document.',`<button class="btn primary" data-action="export-brief">${icon('download')}Export brief .md</button>`)}<div class="brief-layout"><aside class="brief-aside"><h2>Ready for a conversation.</h2><p>${st.open} unresolved requirements stay attached to this brief. A complete checklist would still require independent review.</p><button class="btn" data-action="project">${icon('edit')}Edit brief narrative</button><button class="btn" data-page="requirements">${icon('list')}Review source records</button><ul><li>Purpose & named owners</li><li>Proposed delivery path</li><li>Every unresolved requirement</li><li>Evidence and dependency register</li><li>30 / 60 / 90 / 180-day horizon</li></ul><p style="margin-top:18px;font-size:10px">The Markdown export includes the full evidence text and source provenance. It can be edited in any text or document editor.</p></aside><article class="document"><div class="doc-top"><span>PASSAGE / TRANSITION 037</span><span>DRAFT · SYNTHETIC</span></div><h2>${esc(state.project.name)}<br>Path to fleet</h2><div class="doc-subtitle">Version ${esc(state.project.version)} · Planning start ${fmt(state.project.kickoff)}</div><h3>01 / Purpose</h3><p>${esc(state.project.purpose)}</p><dl><div><dt>Proposed receiving owner</dt><dd>${esc(state.project.owner)}</dd></div><div><dt>Transition lead</dt><dd>${esc(state.project.lead)}</dd></div><div><dt>Sustainment owner</dt><dd>${esc(state.project.sustainment)}</dd></div><div><dt>Evidence position</dt><dd>${st.recorded} / ${st.total} notes recorded</dd></div></dl><h3>02 / Proposed delivery path</h3><p>${h?`${esc(h.name)}. ${esc(state.decision.rationale)}`:'Unresolved. A candidate and review rationale are still needed.'}</p>${h?`<p style="margin-top:8px">Remaining constraint: ${h.barrier}</p>`:''}<h3>03 / Unresolved requirements (${st.open})</h3>${state.requirements.filter(r=>r.status!=='Recorded').map(r=>`<div class="doc-barrier"><strong>${r.id} · ${esc(r.title)}</strong><div class="table-sub">${esc(r.owner)} · ${fmt(r.due)} · ${esc(r.status)}</div><p>${esc(r.barrier||'Review remains pending.')}<br><b>Next:</b> ${esc(r.fix||'Proposed fix needed.')}</p></div>`).join('')||'<p>No unresolved checklist entries. This does not authorize fielding.</p>'}<h3>04 / Review horizon</h3>${state.milestones.map(m=>`<p><b>Day ${m.days} · ${fmt(P.dueDate(state.project.kickoff,m.days))}</b><br>${esc(m.title)} — ${esc(m.owner)} · ${esc(m.status)}</p>`).join('')}<h3>05 / Scope & limitations</h3><p>${esc(state.project.notes)}</p><div class="notice">${icon('info')}This is a discussion brief, not a fielding approval. Recorded evidence and checklist completion do not imply authorization.</div><p style="font-size:10px">Source: Norfolk catalogue #37, “Sailor-Built to Fleet-Fielded.” The export includes the complete evidence and dependency registers. All seeded data is fictional.</p></article></div>${footer()}`}
function activity(){return `${heading('LOCAL WORKSPACE HISTORY','A record of the handoff.','Edits and review decisions are recorded in this browser and included in the workspace export. This is an editable local history, not an identity-bound or tamper-proof audit log.',`<button class="btn" data-action="export-workspace">${icon('download')}Export history & workspace</button>`)}<div class="audit-list">${state.audit.map(a=>`<article class="audit-row"><time>${esc(new Date(a.at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}))}<br>${esc(new Date(a.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}))} · local time</time><span class="audit-dot">${icon('check')}</span><div><h3>${esc(a.action)}</h3><p>${esc(a.detail)}</p></div></article>`).join('')||'<div class="empty"><h3>No activity recorded.</h3></div>'}</div>${footer()}`}

function action(a){({project:editProject,'new-requirement':()=>editRequirement(),'new-evidence':()=>editEvidence(),'new-dependency':()=>editDependency(),'export-workspace':exportWorkspace,'export-brief':exportBrief,import:importDialog,about:about,'workspace-tools':workspaceTools,critical:()=>{status='Critical unresolved';group='All workstreams';query='';changePage('requirements')},'clear-filters':()=>{query='';group='All workstreams';status='All statuses';render()},recover:()=>{let raw;try{raw=localStorage.getItem(KEY)}catch{}download('passage-recovery.json',raw||JSON.stringify(state,null,2),'application/json');toast('Stored workspace copy exported.')}}[a]||(()=>{}))()}
function modal(title,body,buttons='<button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save changes</button>'){const d=$('#dialog');d.innerHTML=`<form id="modal-form" novalidate><header class="modal-head"><h2>${title}</h2><button type="button" class="close" data-close aria-label="Close dialog">${icon('close')}</button></header><div class="modal-body"><div class="form-error" role="alert" id="form-error"></div>${body}</div><footer class="modal-footer">${buttons}</footer></form>`;d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());if(!d.open)d.showModal();}

function field(label,name,value,options={}){return `<label class="field ${options.full?'full':''}">${label}${options.textarea?`<textarea name="${name}" ${options.rows?`rows="${options.rows}"`:''} maxlength="12000">${esc(value)}</textarea>`:options.select?`<select name="${name}">${options.select.map(s=>`<option value="${esc(s)}" ${s===value?'selected':''}>${esc(s)}</option>`).join('')}</select>`:`<input name="${name}" type="${options.type||'text'}" value="${esc(value)}" maxlength="${options.max||300}">`}${options.help?`<small>${options.help}</small>`:''}</label>`}
function editProject(){const p=state.project;modal('Project details & brief narrative',`<p class="modal-intro">Edit the fictional project and narrative used in the transition brief. Changing the planning start recalculates all four milestone dates.</p><div class="form-grid">${field('Project name','name',p.name)}${field('Version','version',p.version)}${field('Short description','tagline',p.tagline,{full:true})}${field('Proposed receiving owner','owner',p.owner)}${field('Transition lead','lead',p.lead)}${field('Sustainment owner','sustainment',p.sustainment,{help:'Use “Unassigned” while ownership is unresolved.'})}${field('Planning start','kickoff',p.kickoff,{type:'date'})}${field('Purpose / intended evaluation','purpose',p.purpose,{full:true,textarea:true})}${field('Scope, uncertainty & limitations','notes',p.notes,{full:true,textarea:true})}</div>`);$('#modal-form').onsubmit=e=>{e.preventDefault();let next={};for(let k of ['name','version','tagline','owner','lead','sustainment','kickoff','purpose','notes'])next[k]=val(k);if(!next.name||!next.version||!next.owner||!next.lead||!next.purpose||!next.notes||!next.sustainment)return err('Enter the project name, version, owners, purpose and scope.');if(!P.validDate(next.kickoff))return err('Enter a valid planning start date.');state.project=next;close();persist('Project details updated','Narrative, owners and planning start reviewed for '+next.name+'.')};}
function editRequirement(id){let r=state.requirements.find(r=>r.id===id)||{id:'',title:'',group:'Ownership',owner:'',due:state.project.kickoff,status:'Open',critical:false,evidence:[],barrier:'',fix:'',source:'Norfolk #37 · '};modal(id?'Review '+esc(id):'Add a transition requirement',`<p class="modal-intro">“Recorded” requires an owner and a linked evidence note. It is a local checklist status, not a verification or authorization decision.</p><div class="form-grid">${field('Requirement','title',r.title,{full:true})}${field('Workstream','group',r.group,{select:P.groups})}${field('Responsible owner','owner',r.owner)}${field('Target date','due',r.due,{type:'date'})}${field('Status','status',r.status,{select:P.statuses})}<label class="check field full"><span><input type="checkbox" name="critical" ${r.critical?'checked':''}> Critical to the transition review</span></label>${field('Current barrier / unresolved question','barrier',r.barrier,{full:true,textarea:true})}${field('Proposed fix / next action','fix',r.fix,{full:true,textarea:true})}${field('Requirement source','source',r.source,{full:true})}<div class="field full">Linked evidence notes<div class="check-list">${state.evidence.map(e=>`<label class="check"><input type="checkbox" name="evidence" value="${e.id}" ${r.evidence.includes(e.id)?'checked':''}><span>${e.id} · ${esc(e.title)}</span></label>`).join('')||'<p class="muted">No evidence notes yet. Add one in Package & evidence.</p>'}</div></div></div>`);$('#modal-form').onsubmit=e=>{e.preventDefault();const n={id:id||nextId('R',state.requirements),title:val('title'),group:val('group'),owner:val('owner'),due:val('due'),status:val('status'),critical:$('#modal-form').elements.critical.checked,evidence:[...document.querySelectorAll('[name="evidence"]:checked')].map(x=>x.value),barrier:val('barrier'),fix:val('fix'),source:val('source')};const errors=P.requirementErrors(n,state);if(errors.length)return err(errors.join(' '));if(id)state.requirements=state.requirements.map(x=>x.id===id?n:x);else state.requirements.push(n);close();persist(id?'Requirement reviewed':'Requirement added',`${n.id} · ${n.title}: ${r.status} → ${n.status}. Owner: ${n.owner}.`)};}
function nextId(prefix,items){let i=1;while(items.some(x=>x.id===`${prefix}-${String(i).padStart(2,'0')}`))i++;return `${prefix}-${String(i).padStart(2,'0')}`}
function viewEvidence(id){let e=state.evidence.find(x=>x.id===id),linked=state.requirements.filter(r=>r.evidence.includes(id));modal(esc(e.title),`<p class="modal-intro">${e.id} · ${esc(e.kind)} · ${fmt(e.date)}</p><div class="notice green">${icon('file')}<span><strong>Source / provenance</strong><br>${esc(e.source)}</span></div><div class="read-note">${esc(e.content)}</div><div class="modal-intro" style="margin:20px 0 0">Linked to ${linked.length} requirements: ${linked.map(r=>r.id).join(', ')||'none'}. A note is not an independent verification.</div>`,`<button type="button" class="btn" data-close>Close</button><button type="button" class="btn primary" id="edit-evidence">${icon('edit')}Edit note</button>`);$('#edit-evidence').onclick=()=>editEvidence(id);$('#modal-form').onsubmit=e=>e.preventDefault();}
function editEvidence(id){let e=state.evidence.find(x=>x.id===id)||{title:'',kind:'Review note',date:state.project.kickoff,source:'',content:''};modal(id?'Edit evidence note':'Add evidence note',`<p class="modal-intro">Store a concise text record with its origin, date and limits. Use synthetic material only. Files are not attached or independently verified.</p><div class="form-grid">${field('Evidence title','title',e.title,{full:true})}${field('Type','kind',e.kind,{select:['Review note','Test note','Package note','Design note','Decision note']})}${field('Record date','date',e.date,{type:'date'})}${field('Source / provenance','source',e.source,{full:true,help:'Identify who or what supplied the information and whether it is simulated.'})}${field('Record text, finding & limitations','content',e.content,{full:true,textarea:true,rows:7})}</div>`);$('#modal-form').onsubmit=ev=>{ev.preventDefault();const n={id:id||nextId('E',state.evidence),title:val('title'),kind:val('kind'),date:val('date'),source:val('source'),content:val('content')};if(!n.title||!n.source||!n.content||!P.validDate(n.date))return err('Enter a title, valid date, source and evidence text.');if(id)state.evidence=state.evidence.map(e=>e.id===id?n:e);else state.evidence.push(n);close();persist(id?'Evidence note updated':'Evidence note added',`${n.id} · ${n.title}. Source: ${n.source}`)};}
function editDependency(id){let d=state.dependencies.find(x=>x.id===id)||{name:'',version:'',owner:'',status:'Unresolved',note:''};modal(id?'Edit dependency':'Add dependency',`<p class="modal-intro">Track a technical or organizational dependency. “Documented” means a description exists; it does not imply procurement or approval.</p><div class="form-grid">${field('Dependency','name',d.name,{full:true})}${field('Version / specification','version',d.version)}${field('Owner','owner',d.owner)}${field('Status','status',d.status,{select:['Unresolved','Documented'],full:true})}${field('Constraint / next step','note',d.note,{full:true,textarea:true})}</div>`);$('#modal-form').onsubmit=e=>{e.preventDefault();const n={id:id||nextId('D',state.dependencies),name:val('name'),version:val('version'),owner:val('owner'),status:val('status'),note:val('note')};if(!n.name||!n.owner||!n.note)return err('Enter a dependency name, owner and next step.');if(id)state.dependencies=state.dependencies.map(d=>d.id===id?n:d);else state.dependencies.push(n);close();persist('Dependency updated',`${n.name} · ${n.status}; owner: ${n.owner}.`)};}
function editMilestone(id){const m=state.milestones.find(x=>x.id===id);modal(`Day ${m.days} · ${esc(m.title)}`,`<p class="modal-intro">Target: ${fmt(P.dueDate(state.project.kickoff,m.days))}. Dates are planning offsets, not approval deadlines. A recorded review is not official authorization.</p><div class="form-grid">${field('Review milestone','title',m.title,{full:true})}${field('Review owner','owner',m.owner)}${field('Review status','status',m.status,{select:['Planned','In review','Recorded']})}${field('Review scope / outcome / remaining actions','note',m.note,{full:true,textarea:true,rows:5})}</div>`);$('#modal-form').onsubmit=e=>{e.preventDefault();const n={...m,title:val('title'),owner:val('owner'),status:val('status'),note:val('note')};if(!n.title||!n.owner||!n.note)return err('Enter a review title, owner and scope or outcome.');state.milestones=state.milestones.map(x=>x.id===id?n:x);close();persist('Review milestone updated',`Day ${m.days} · ${n.title}: ${n.status}. ${n.note}`)};}
function proposeHosting(id){let h=P.hosting.find(h=>h.id===id);modal('Propose '+h.name,`<p class="modal-intro">This records a candidate for human review. Hosting and installation requirements keep their current status.</p><div class="notice">${icon('flag')}${h.barrier}</div><div class="form-grid">${field('Why this path / remaining constraints','rationale',state.decision.option===id?state.decision.rationale:'',{full:true,textarea:true,rows:6,help:'Use at least 20 characters. Describe the tradeoff and the next validation step.'})}</div><label class="check" style="margin-top:18px"><input type="checkbox" name="ack"><span>I am recording a proposal, not an approval to host or install.</span></label>`,`<button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Record proposal</button>`);$('#modal-form').onsubmit=e=>{e.preventDefault();let rationale=val('rationale');if(rationale.length<20)return err('Add a review rationale of at least 20 characters.');if(!$('#modal-form').elements.ack.checked)return err('Acknowledge that this is a proposal, not an approval.');state.decision={option:id,rationale,recordedAt:new Date().toISOString()};close();persist('Hosting candidate proposed',`${h.name}. ${rationale}`)};}
function importDialog(){importCandidate=null;modal('Import a workspace',`<p class="modal-intro">Load a version 1 PASSAGE JSON export. The current workspace stays in place until validation succeeds and you choose Replace workspace.</p><div class="file-zone"><label for="import-file">Choose a local JSON file</label><input type="file" id="import-file" accept=".json,application/json"></div><label class="field">Or paste workspace JSON<textarea id="import-json" name="json" class="input-code" spellcheck="false" placeholder='{"schemaVersion": 1, "project": …}'></textarea></label><div id="import-preview"></div>`,`<button type="button" class="btn" id="load-example">Load demo example</button><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" id="import-submit" type="submit">Validate workspace</button>`);$('#load-example').onclick=()=>{$('#import-json').value=JSON.stringify(P.seed(),null,2);invalidate()};function invalidate(){importCandidate=null;$('#import-preview').innerHTML='';$('#import-submit').textContent='Validate workspace';$('#form-error').textContent=''}$('#import-json').oninput=invalidate;$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1500000)return err('File exceeds the 1.5 MB workspace limit.');$('#import-json').value=await f.text();invalidate()};$('#modal-form').onsubmit=e=>{e.preventDefault();if(!importCandidate){try{importCandidate=P.parseWorkspace($('#import-json').value);$('#form-error').textContent='';const s=P.stats(importCandidate);$('#import-preview').innerHTML=`<div class="notice green">${icon('check')}<span>Valid workspace: <strong>${esc(importCandidate.project.name)}</strong><br>${s.total} requirements · ${importCandidate.evidence.length} evidence notes · ${importCandidate.audit.length} activity entries.<br>The next step replaces the current browser workspace.</span></div><button type="button" class="btn small" id="backup-current">${icon('download')}Export current workspace first
