const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.layers}</svg>`;
const brand=`<svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M7 31V9l25 22V9M7 20h25" stroke="#E7BE95" stroke-width="2.2"/><circle cx="7" cy="9" r="3" fill="#E7BE95"/><circle cx="32" cy="31" r="3" fill="#E7BE95"/></svg><span class="brand-word">Navy<em>LINK</em></span>`;
const storageKey='navylink-demo-v1';
let catalogue=structuredClone(NavyData), collections=[{id:'shortlist',name:'My shortlist',ids:[]},{id:'maintenance',name:'Maintenance discovery',ids:['NL-001','NL-002','NL-005']}], storageIssue='';
try{const raw=localStorage.getItem(storageKey);if(raw){const saved=JSON.parse(raw),check=L.validate(saved.entries);if(check.errors.length||!Array.isArray(saved.collections)||saved.collections.length>50||!saved.collections.every(c=>c&&typeof c.id==='string'&&/^[\w-]{1,80}$/.test(c.id)&&typeof c.name==='string'&&c.name.trim()&&c.name.length<=60&&Array.isArray(c.ids)&&c.ids.every(id=>typeof id==='string'))||new Set(saved.collections.map(c=>c.id)).size!==saved.collections.length||!saved.collections.length)throw Error('invalid');catalogue=check.entries;collections=saved.collections.map(c=>({...c,ids:[...new Set(c.ids.filter(id=>catalogue.some(e=>e.id===id)))]}));}}catch{storageIssue='Saved data could not be loaded. The original demo catalogue is available; reset local data in the guide to recover.';}
let page='discover',query='',domain='',type='',status='',sort='recommended',view='grid',activeCollection=collections[0].id,selected=null,pending=null,editing=null,lastFocus=null,toastTimer;

function toast(message){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast">${esc(message)}</div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',5000);}
function isSaved(id){return collections.some(c=>c.ids.includes(id));}

function filtered(){let list=catalogue.map(e=>({entry:e,...L.search(e,query)})).filter(x=>(!domain||x.entry.domain===domain)&&(!type||x.entry.type===type)&&(!status||x.entry.status===status)&&(!L.tokens(query).length||x.score>0));list.sort((a,b)=>sort==='name'?a.entry.name.localeCompare(b.entry.name):sort==='updated'?b.entry.updated.localeCompare(a.entry.updated):query?b.score-a.score||a.entry.name.localeCompare(b.entry.name):Number(b.entry.featured||false)-Number(a.entry.featured||false)||a.entry.id.localeCompare(b.entry.id));return list;}
function card(e,match){return `<article class="project-card" data-entry="${esc(e.id)}"><div class="card-top"><div class="mark-group"><div class="product-mark ${color(e)}">${icon(typeIcon(e))}</div><span class="type-label">${esc(e.type)}</span></div><button class="save ${isSaved(e.id)?'saved':''}" data-action="save" data-id="${esc(e.id)}" aria-label="Save ${esc(e.name)} to a collection" title="Save to a collection">${icon('save')}</button></div><button class="project-title" data-action="detail" data-id="${esc(e.id)}">${esc(e.name)} ${icon('arrow')}</button><p class="subtitle">${esc(e.subtitle)}</p><p class="card-desc">${esc(e.description)}</p><div class="tags"><span class="tag">${esc(e.domain)}</span>${e.tags.slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="card-footer"><span class="owner" title="Fictional organization">${esc(e.owner)}</span>${statusHtml(e)}</div>${match&&query?`<p class="match">Matches: ${match.matched.slice(0,5).map(esc).join(' · ')}</p>`:''}</article>`;}

function network(){return `<svg class="network" viewBox="0 0 410 240" role="img" aria-label="Explore connections between maintenance projects, data and people"><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#c5d1bf"/></pattern></defs><rect x="0" y="0" width="410" height="240" fill="url(#dots)"/><g stroke="#b0c1ad" fill="none"><path d="M204 119 89 55M204 119 329 61M204 119 340 188M204 119 77 184"/><circle cx="204" cy="119" r="71" stroke-dasharray="3 5" opacity=".7"/><circle cx="204" cy="119" r="108" opacity=".25"/></g><g><rect x="22" y="31" width="130" height="43" rx="8" fill="#fafcf7" stroke="#d5dfcd"/><rect x="36" y="44" width="16" height="16" rx="3" fill="#e4ecdd"/><path d="M41 49h6m-6 5h6" stroke="#6f9266"/><text x="61" y="56" font-size="11" fill="#5c7257">Maintenance</text><rect x="270" y="37" width="112" height="43" rx="8" fill="#fafcf7" stroke="#d5dfcd"/><circle cx="290" cy="58" r="7" fill="#e7ddc9"/><text x="306" y="62" font-size="11" fill="#7c724e">Datasets</text><rect x="283" y="167" width="111" height="43" rx="8" fill="#fafcf7" stroke="#d5dfcd"/><circle cx="303" cy="188" r="7" fill="#dbe5e8"/><text x="319" y="192" font-size="11" fill="#62797c">People</text><rect x="19" y="163" width="120" height="43" rx="8" fill="#fafcf7" stroke="#d5dfcd"/><path d="M36 186h14m-7-7v14" stroke="#7e9166"/><text x="57" y="190" font-size="11" fill="#607155">Readiness</text></g><circle cx="204" cy="119" r="40" fill="#d7e2ce" opacity=".8"/><rect x="175" y="90" width="58" height="58" rx="16" fill="#305947"/><path d="M189 133v-28l29 28v-28M189 119h29" stroke="#f0d4a4" stroke-width="2" fill="none"/><circle cx="189" cy="105" r="3" fill="#f0d4a4"/><circle cx="218" cy="133" r="3" fill="#f0d4a4"/><text x="204" y="232" font-size="9" fill="#819277" text-anchor="middle" letter-spacing="1.7">CONNECT IDEAS. COMPOUND IMPACT.</text></svg>`;}
function discover(){const results=filtered();$('#page-content').innerHTML=`<section class="hero"><div><div class="eyebrow">Shared knowledge. Greater possibility.</div><h1>Good ideas deserve<br>to be <em>found.</em></h1><p>Discover the tools, data, and people moving ideas forward.<br>Build on what’s already here.</p></div>${network()}</section><section class="search-section" aria-label="Search catalogue"><form id="search-form" class="searchbox">${icon('search')}<label class="sr-only" for="search">Search projects, problems, or capabilities</label><input id="search" name="query" value="${esc(query)}" placeholder="What are you working on? Try maintenance forecasting…" autocomplete="off"><kbd>/</kbd><button class="btn primary" type="submit">Search</button></form><div class="suggestions"><span>Explore an idea</span>${['Maintenance forecasting','Budget execution','Spare parts'].map(q=>`<button data-action="query" data-query="${q}">${q} ↗</button>`).join('')}</div></section><div class="browse"><aside class="filters" aria-label="Filter catalogue"><div class="filter-heading"><h2>Refine discovery</h2><button class="text-btn" data-action="clear">Reset</button></div><span class="filter-label">Mission domain</span><div class="domain-list">${['',...L.domains].map(d=>`<button class="domain ${domain===d?'active':''}" data-action="domain" data-domain="${esc(d)}" aria-pressed="${domain===d}"><span class="domain-dot"></span><span>${esc(d||'All domains')}</span><span>${catalogue.filter(e=>!d||e.domain===d).length}</span></button>`).join('')}</div><div class="filter-group"><label class="filter-label" for="type-filter">Project type</label><select id="type-filter">${options(['',...L.types],type,'All types')}</select></div><div class="filter-group"><label class="filter-label" for="status-filter">Project status</label><select id="status-filter">${options(['',...L.statuses],status,'Any status')}</select></div><p class="filter-note">${icon('info')}All entries and organizations in this workspace are fictional.</p></aside><section aria-label="Search results"><div class="results-header"><div class="results-title"><h2>${query?'Search results':domain?esc(domain):'Explore the catalogue'}</h2><span class="count">${results.length}</span></div><div class="results-tools"><label class="sr-only" for="sort">Sort results</label><select id="sort">${options(['recommended','updated','name'],sort,'',{recommended:query?'Relevance':'Recommended',updated:'Recently updated',name:'Name A–Z'})}</select><div class="view-toggle"><button class="${view==='grid'?'active':''}" data-action="view" data-view="grid" aria-label="Grid view" aria-pressed="${view==='grid'}">${icon('grid')}</button><button class="${view==='list'?'active':''}" data-action="view" data-view="list" aria-label="List view" aria-pressed="${view==='list'}">${icon('list')}</button></div></div></div>${query?`<div style="font-size:11px;color:#6e816c;margin:-3px 0 15px">Results for “${esc(query)}” · local keyword & synonym matching</div>`:''}${results.length?`<div class="cards ${view}">${results.map(x=>card(x.entry,x)).join('')}</div><div class="footnote">${icon('info')}Explore a project to see access guidance and why related work is connected.</div><div class="footer-controls"><button class="btn" data-action="export" data-scope="results">${icon('down')} Export ${results.length} results</button></div>`:empty('No projects found','Try a broader phrase, select a different domain, or reset your filters.','Reset search & filters','clear')}</section></div>`;}
function options(values,current,emptyLabel='',labels={}){return values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(labels[v]||v||emptyLabel)}</option>`).join('');}
function empty(title,message,button,action){return `<div class="empty">${icon('search')}<h3>${esc(title)}</h3><p>${esc(message)}</p><button class="btn" data-action="${action}">${esc(button)}</button></div>`;}
function collectionPage(){const active=collections.find(c=>c.id===activeCollection)||collections[0];activeCollection=active.id;const entries=active.ids.map(id=>catalogue.find(e=>e.id===id)).filter(Boolean);$('#page-content').innerHTML=`<div class="page-heading"><div><div class="eyebrow" style="color:#87907d;margin-bottom:8px">Ideas worth keeping</div><h1>Your collections</h1><p>Build a useful shortlist. Take the context with you.</p></div><button class="btn primary" data-action="new-collection">${icon('plus')} New collection</button></div><div class="collection-strip">${collections.map(c=>`<button class="collection-tab ${c.id===activeCollection?'active':''}" data-action="collection" data-id="${esc(c.id)}"><strong>${esc(c.name)}</strong><span>${c.ids.length} ${c.ids.length===1?'project':'projects'} · saved locally</span></button>`).join('')}</div><div class="collection-actions"><h2 style="font-size:19px;font-weight:500">${esc(active.name)}</h2><span class="spacer"></span><button class="btn small" data-action="rename-collection">Rename</button><button class="btn small danger" data-action="delete-collection">Delete</button><button class="btn small" data-action="export" data-scope="collection" ${entries.length?'':'disabled'}>${icon('down')} Export collection</button></div>${entries.length?`<div class="cards">${entries.map(e=>card(e)).join('')}</div>`:empty('A place for your next idea','Save projects from the catalogue to compare and revisit them here.','Explore projects','go-discover')}<p class="footnote">${icon('info')}Collections are stored only in this browser. JSON exports retain full project metadata and collection membership.</p>`;}
function guide(){ $('#page-content').innerHTML=`<div class="page-heading"><div><div class="eyebrow" style="color:#84927b;margin-bottom:8px">A little context goes a long way</div><h1>Make discovery useful.</h1><p>How to search, understand connections, and reuse the catalogue.</p></div></div><div class="guide-grid"><section class="guide-panel"><h2>Start with a problem</h2><p>Search names, mission domains, descriptions, owners, tags, or data sources. Phrases such as “maintenance forecasting” expand a small local synonym dictionary. Results are ranked by matched terms, field weights, and query coverage.</p><ul><li>Name: 5; domain and tags: 4; type: 3.</li><li>Subtitle, owner, and data sources: 2; description and use case: 1.</li><li>Quoted phrases are treated as words. There is no live AI or vector search.</li></ul></section><section class="guide-panel"><h2>Know why projects connect</h2><p>Related projects receive an illustrative score from 0–100. Expand “Why this connection?” to inspect the exact contribution of each signal. Scores are similarities, not evidence of interoperability or operational quality.</p><div class="formula">30 × same domain<br>25 × tag overlap (Jaccard)<br>20 × data overlap (Jaccard)<br>25 × text similarity (binary cosine)</div></section><section class="guide-panel"><h2>Make the catalogue your own</h2><p>Add a fictional project with the form, or import a JSON array. Required fields and allowed categories are checked before any entries are added. IDs must be unique. Review changes before committing them locally.</p><div class="footer-controls"><button class="btn" data-action="import">${icon('upload')} Import entries</button><button class="btn" data-action="sample-download">${icon('down')} JSON example</button></div></section><section class="guide-panel"><h2>Keep useful work close</h2><p>The bookmark on a project adds it to one or more collections. Export JSON for the full metadata and CSV for a flat table. CSV exports escape formula-like values for spreadsheet safety. Reimporting an existing ID is rejected to avoid accidental overwrites.</p><div class="footer-controls"><button class="btn" data-action="nav" data-page="collections">${icon('save')} Open collections</button></div></section></div><div class="provenance"><strong>About this demonstration</strong><br>Handcrafted for Norfolk use case #46, NavyLINK. The bundled brief in <code>harness/norfolk-snapshot.ts</code> informed the workflow. All ${catalogue.length} current entries, organizations, contacts, dates, and sources are synthetic. No operational data, real contact addresses, external repositories, or access approvals are connected. Metadata is visible to anyone who can open this local browser profile. This is not an access-control system or an AppYard-generated or AppYard-verified build.<br><br>DM Sans and IBM Plex Mono are bundled under the SIL Open Font License. The application runs without network requests or API keys.</div><div class="footer-controls"><button class="btn" data-action="export" data-scope="all">${icon('down')} Export entire catalogue</button><button class="btn danger" data-action="reset">Reset local demo data</button></div>`;}
function render(){ $('#app').innerHTML=shell();if(page==='collections')collectionPage();else if(page==='guide')guide();else discover();}
function open(html,isDrawer=false){if(!$('#overlay').innerHTML)lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="scrim ${isDrawer?'':'modal-scrim'}"><section class="${isDrawer?'drawer':'modal wide'}" role="dialog" aria-modal="true" aria-label="${isDrawer?'Project details':'NavyLINK workspace dialog'}">${html}</section></div>`;document.body.classList.add('modal-open');const focus=$('#overlay input:not([type=file]), #overlay textarea, #overlay button');focus?.focus();}
function close(){ $('#overlay').innerHTML='';document.body.classList.remove('modal-open');pending=null;lastFocus?.focus();}
function modal(title,intro,body,actions=''){open(`<div class="modal-heading"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close" aria-label="Close dialog">${icon('close')}</button></div>${intro?`<p class="modal-intro">${esc(intro)}</p>`:''}${body}${actions?`<div class="modal-actions">${actions}</div>`:''}`);}
function detail(id){selected=id;const e=catalogue.find(x=>x.id===id);if(!e)return;const related=L.rankRelated(e,catalogue).slice(0,4);open(`<div class="drawer-header"><span>PROJECT PROFILE / ${esc(e.id)}</span><div class="inline-actions"><button class="btn small" data-action="edit" data-id="${esc(e.id)}">${icon('edit')} Edit</button><button class="icon-btn" data-action="close" aria-label="Close project">${icon('close')}</button></div></div><div class="drawer-content"><div class="detail-top"><div class="product-mark ${color(e)}">${icon(typeIcon(e))}</div>${statusHtml(e)}</div><h2>${esc(e.name)}</h2><p class="detail-subtitle">${esc(e.subtitle)}</p><div class="tags"><span class="tag">${esc(e.type)}</span><span class="tag">${esc(e.domain)}</span>${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="detail-description">${esc(e.description)}</p><dl class="detail-meta"><div><dt>Owning organization</dt><dd>${esc(e.owner)}</dd></div><div><dt>Point of contact</dt><dd>${esc(e.poc)}<br><small style="color:#83907e">Fictional team · no live address</small></dd></div><div><dt>Last reviewed</dt><dd>${esc(e.updated)} · synthetic</dd></div><div><dt>Technology</dt><dd>${e.technology.map(esc).join(' · ')||'Not specified'}</dd></div></dl><div class="inline-actions"><button class="btn primary" data-action="save" data-id="${esc(e.id)}">${icon('save')} Save to collection</button><button class="btn" data-action="export" data-scope="entry" data-id="${esc(e.id)}">${icon('down')} Export profile</button></div><section class="detail-section"><div class="section-title"><h3>The problem it helps solve</h3></div><p>${esc(e.useCase)}</p></section><section class="detail-section"><div class="section-title"><h3>Data & provenance</h3></div><div class="tags">${e.datasets.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="tag">No data sources specified</span>'}</div><p style="margin-top:10px">${esc(e.notes||'Catalogue descriptions and listed data sources are synthetic, authored for this demonstration. Compatibility and operational performance have not been verified.')}</p></section><section class="detail-section access-box"><div class="section-title"><h3>${esc(e.access)}</h3>${icon('book')}</div><p>${e.access==='Demo available'?'A local catalogue fact sheet is available. The described capability is fictional; this portal does not include a separate working product.':e.access==='Documentation only'?'Read the local fact sheet to understand the stated scope. No live documentation service or software entitlement is connected.':'Use the access brief to prepare a conversation with the fictional owning team. No request is transmitted and no access is granted.'}</p><div class="inline-actions"><button class="btn small" data-action="fact-sheet" data-id="${esc(e.id)}">Read fact sheet ${icon('arrow')}</button><button class="text-btn" data-action="access-brief" data-id="${esc(e.id)}">Download access brief</button></div></section><section class="detail-section"><div class="section-title"><h3>Connected by more than a name</h3><span class="count">${related.length} related</span></div><p>Discover work with shared problems, data, and approaches.</p>${related.map(r=>`<article class="related-card"><div class="related-top"><button data-action="detail" data-id="${esc(r.entry.id)}">${esc(r.entry.name)} ↗<small>${esc(r.entry.type)} · ${esc(r.entry.domain)}</small></button><div class="score">${r.score}<small>of 100</small></div></div><details><summary>Why this connection?</summary>${r.signals.map(s=>`<div class="signal"><div class="signal-top"><span>${s.name}</span><span>${s.value.toFixed(1)} / ${s.weight}</span></div><div class="signal-track"><span style="width:${s.value/s.weight*100}%"></span></div><small>${esc(s.detail)}</small></div>`).join('')}</details></article>`).join('')||'<p style="margin-top:15px">No shared signals found yet.</p>'}<div class="model-note">Illustrative local similarity score, not a quality rating. Domain 30 · Tags 25 · Data 20 · Text 25.</div></section></div>`,true);}
function saveModal(id){const e=catalogue.find(x=>x.id===id);selected=id;modal('Save '+e.name,'Choose the collections where this project belongs. Changes stay in this browser.',`<form id="save-form" data-id="${esc(id)}">${collections.map(c=>`<div class="collection-option"><label><input type="checkbox" name="collection" value="${esc(c.id)}" ${c.ids.includes(id)?'checked':''}>${esc(c.name)}</label><small>${c.ids.length} projects</small></div>`).join('')}<div class="modal-actions"><button class="btn" type="button" data-action="new-collection" data-return="${esc(id)}">${icon('plus')} New collection</button><button class="btn primary" type="submit">Save changes</button></div></form>`);}
function collectionForm(rename=false,returnId=''){const c=collections.find(x=>x.id===activeCollection);modal(rename?'Rename collection':'Create a collection','Give this collection a name that helps you find it again.',`<form id="collection-form" data-rename="${rename?'yes':''}" data-return="${esc(returnId)}"><label class="field">Collection name<input name="name" maxlength="60" required value="${rename?esc(c.name):''}" placeholder="e.g. Readiness research"></label><div class="error" id="form-error"></div><div class="modal-actions"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary">${rename?'Rename':'Create collection'}</button></div></form>`);}
function example(){return {...structuredClone(NavyData[0]),id:'NL-DEMO-NEW',name:'Harbor Sandbox',subtitle:'A new experiment in maintenance discovery',status:'Concept',featured:undefined};}
function importModal(text=''){pending=null;modal('Bring useful work into view','Import a JSON array or a NavyLINK JSON export. Imports are validated and reviewed before adding entries. Existing IDs are never overwritten.',`<div class="input-tools"><button class="btn small" data-action="load-example">Load example</button><button class="btn small" data-action="choose-file">Choose JSON file</button><input type="file" hidden id="import-file" accept=".json,application/json" aria-label="Choose JSON file"></div><label class="sr-only" for="import-json">Catalogue JSON</label><textarea class="import-input" id="import-json" spellcheck="false" placeholder="Paste a JSON array of fictional project entries…">${esc(text)}</textarea><div class="error" id="form-error"></div>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="validate-import">Review import ${icon('arrow')}</button>`);}
function field(name,label,value='',kind='input',opts){return `<label class="field ${kind==='textarea'?'full':''}">${label}${kind==='select'?`<select name="${name}">${options(opts,value)}</select>`:kind==='textarea'?`<textarea name="${name}" required maxlength="3000">${esc(value)}</textarea>`:`<input name="${name}" value="${esc(value)}" required maxlength="${['tags','datasets','technology'].includes(name)?500:200}" ${name==='updated'?'type="date"':''}>`}</label>`;}
function entryForm(id){editing=id||null;const e=id?catalogue.find(x=>x.id===id):{id:'LOCAL-'+Date.now().toString(36).toUpperCase(),type:'Dashboard',domain:'Maintenance',status:'Concept',access:'Contact owner',updated:'2026-11-05'};modal(id?'Edit '+e.name:'Add a project','Describe a fictional capability. Every field is required; tags, data sources, and technologies use commas. You will review the entry before saving.',`<form id="entry-form"><div class="fields">${field('name','Project name',e.name)}${field('id','Unique catalogue ID',e.id)}${field('subtitle','One-line purpose',e.subtitle)}${field('owner','Owning organization (fictional)',e.owner)}${field('type','Project type',e.type,'select',L.types)}${field('domain','Mission domain',e.domain,'select',L.domains)}${field('status','Project status',e.status,'select',L.statuses)}${field('access','Access information',e.access,'select',L.accesses)}${field('poc','Contact team (fictional)',e.poc)}${field('updated','Last reviewed · synthetic date',e.updated)}${field('description','Description & scope',e.description,'textarea')}${field('useCase','Mission problem addressed',e.useCase,'textarea')}${field('tags','Tags, separated by commas',e.tags?.join(', '))}${field('datasets','Data sources, separated by commas',e.datasets?.join(', '))}${field('technology','Technologies, separated by commas',e.technology?.join(', '))}</div><div class="error" id="form-error"></div><div class="modal-actions"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn primary">Review entry ${icon('arrow')}</button></div></form>`);}
function review(entries,mode,importedCollections){pending={entries,mode,editing,importedCollections};modal('Review before saving',mode==='edit'?'This replaces the selected project’s metadata in your local catalogue. Collection references are preserved.':`${entries.length} valid ${entries.length===1?'entry is':'entries are'} ready to add. This will update only your local browser catalogue.`,entries.map(e=>`<div class="review-row"><div><strong>${esc(e.name)}</strong><br><small>${esc(e.id)} · ${esc(e.type)} · ${esc(e.domain)}</small><p style="margin-top:5px;color:#6f7d69">${esc(e.subtitle)}</p></div><div style="text-align:right">${statusHtml(e)}<small>${esc(e.access)}</small></div></div>`).join('')+(importedCollections?.length?`<p class="modal-intro" style="margin-top:15px">Also restoring ${importedCollections.length} exported collection(s) with new local IDs.</p>`:''),`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="commit">${icon('check')} ${mode==='edit'?'Save changes':'Add to catalogue'}</button>`);}
function showErrors(errors){$('#form-error').innerHTML=`<strong>Check the input and try again.</strong><ul>${errors.slice(0,10).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>${errors.length>10?`<span>And ${errors.length-10} more issues.</span>`:''}`;}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Downloaded '+name);}
let exportSet=[],exportScope='';
function exportModal(scope,id){exportScope=scope;exportSet=scope==='entry'?[catalogue.find(e=>e.id===id)]:scope==='collection'?catalogue.filter(e=>collections.find(c=>c.id===activeCollection).ids.includes(e.id)):scope==='results'?filtered().map(x=>x.entry):catalogue;modal('Take the context with you',`${exportSet.length} ${exportSet.length===1?'project':'projects'} in this export. All files are generated locally from the current catalogue.`,`<div class="provenance" style="margin-top:0"><strong>JSON</strong> keeps complete metadata, provenance, and matching collection memberships. Import entries only where their IDs are not already present; existing entries are edited individually.<br><br><strong>CSV</strong> is a flat table for spreadsheets. Collection membership and ranking context are available in JSON only.</div>`,`<button class="btn" data-action="download-csv">${icon('down')} Download CSV</button><button class="btn primary" data-action="download-json">${icon('down')} Download JSON</button>`);}
function exportPayload(){const ids=exportSet.map(e=>e.id);return {schema:'navylink-demo/1',synthetic:true,exportedAt:new Date().toISOString(),scope:exportScope,query:exportScope==='results'?{text:query,domain,type,status,sort}:null,provenance:'Handcrafted Norfolk #46 demo. All entries and organizations are fictional. No live access entitlements.',ranking:{related:{domain:30,tags:25,datasets:20,text:25},method:'Jaccard overlap and binary cosine text similarity'},entries:exportSet,collections:collections.filter(c=>exportScope==='collection'?c.id===activeCollection:c.ids.some(id=>ids.includes(id))).map(c=>({...c,ids:c.ids.filter(id=>ids.includes(id))}))};}
function accessBrief(id){const e=catalogue.find(x=>x.id===id);download(e.name.toLowerCase()+'-access-brief.txt',`NAVYLINK — SYNTHETIC ACCESS BRIEF\n\nProject: ${e.name} (${e.id})\nOwner: ${e.owner}\nContact team: ${e.poc} (fictional; no live contact address)\nAvailability: ${e.access}\n\nPurpose: ${e.useCase}\nListed sources: ${e.datasets.join(', ')}\n\nSuggested discussion\n1. Confirm the current owner and release conditions through your approved channels.\n2. Describe the intended use and data needs.\n3. Ask about source definitions, interfaces, limitations, and available documentation.\n\nThis local demo does not send requests, grant access, host the described product, or represent a security boundary. All metadata is fictional.`, 'text/plain');}
function factSheet(id){const e=catalogue.find(x=>x.id===id);modal(e.name+' · fact sheet','A local reference authored for this fictional catalogue entry.',`<div class="provenance" style="margin-top:0"><strong>Purpose</strong><br>${esc(e.description)}<br><br><strong>Intended use</strong><br>${esc(e.useCase)}<br><br><strong>Listed data sources</strong><br>${e.datasets.map(esc).join('<br>')||'None specified'}<br><br><strong>Implementation notes</strong><br>${e.technology.map(esc).join(' · ')}<br><br><strong>Limitations</strong><br>${esc(e.notes||'This is catalogue metadata, not a deployed capability. Accuracy, compatibility, data availability, and access permissions have not been independently verified.')}<br><br><strong>Provenance</strong><br>Fictional entry ${esc(e.id)} · reviewed ${esc(e.updated)} · ${esc(e.owner)}</div>`,`<button class="btn" data-action="detail" data-id="${esc(id)}">Back to project</button><button class="btn primary" data-action="access-brief" data-id="${esc(id)}">${icon('down')} Access brief</button>`);}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b){if(ev.target.classList.contains('scrim'))close();return;}const a=b.dataset.action,id=b.dataset.id;
if(a==='nav'){page=b.dataset.page;render();window.scrollTo(0,0);}else if(a==='go-discover'){page='discover';render();}else if(a==='query'){query=b.dataset.query;page='discover';render();}else if(a==='domain'){domain=b.dataset.domain;discover();}else if(a==='clear'){query=domain=type=status='';sort='recommended';discover();}else if(a==='view'){view=b.dataset.view;discover();}else if(a==='detail')detail(id);else if(a==='close')close();else if(a==='save')saveModal(id);else if(a==='collection'){activeCollection=id;collectionPage();}else if(a==='new-collection')collectionForm(false,b.dataset.return);else if(a==='rename-collection')collectionForm(true);else if(a==='delete-collection'){const c=collections.find(x=>x.id===activeCollection);modal('Delete this collection?',`“${c.name}” will be removed. Its projects stay in the catalogue.`, '',`<button class="btn" data-action="close">Keep collection</button><button class="btn danger" data-action="confirm-delete-collection">Delete collection</button>`);}else if(a==='confirm-delete-collection'){collections=collections.filter(c=>c.id!==activeCollection);if(!collections.length)collections=[{id:'shortlist',name:'My shortlist',ids:[]}];activeCollection=collections[0].id;persist();close();render();toast('Collection removed.');}else if(a==='import')importModal();else if(a==='choose-file')$('#import-file').click();else if(a==='load-example'){$('#import-json').value=JSON.stringify([example()],null,2);$('#form-error').innerHTML='';}else if(a==='sample-download')download('navylink-import-example.json',JSON.stringify([example()],null,2),'application/json');else if(a==='validate-import'){try{const text=$('#import-json').value;if(text.length>2000000){showErrors(['Input is too large. Maximum size is 2 MB.']);return;}const raw=JSON.parse(text),v=L.validate(raw,catalogue);if(v.errors.length){showErrors(v.errors);return;}if(catalogue.length+v.entries.length>200){showErrors(['The workspace supports up to 200 entries. Reduce the import size.']);return;}const imported=Array.isArray(raw.collections)?raw.collections:[];if(collections.length+imported.length>50||imported.some(c=>!c||typeof c.name!=='string'||!c.name.trim()||c.name.length>60||!Array.isArray(c.ids)||c.ids.some(id=>typeof id!=='string'))){showErrors(['Exported collections must have short names and arrays of entry IDs.']);return;}editing=null;review(v.entries,'import',imported);}catch{showErrors(['JSON could not be parsed. Check quotes, commas, and brackets, or load the example.']);}}else if(a==='new')entryForm();else if(a==='edit')entryForm(id);else if(a==='commit'){if(!pending)return;const p=pending;if(p.mode==='edit'){catalogue=catalogue.map(e=>e.id===p.editing?p.entries[0]:e);collections=collections.map(c=>({...c,ids:c.ids.map(id=>id===p.editing?p.entries[0].id:id)}));}else{catalogue.push(...p.entries);if(p.importedCollections?.length)collections.push(...p.importedCollections.map((c,i)=>({id:'import-'+Date.now().toString(36)+'-'+i,name:c.name,ids:[...new Set(c.ids.filter(id=>p.entries.some(e=>e.id===id)))]})));}persist();close();render();toast(p.mode==='edit'?'Project updated locally.':`${p.entries.length} project${p.entries.length>1?'s':''} added to the catalogue.`);}else if(a==='export')exportModal(b.dataset.scope,id);else if(a==='download-json')download('navylink-'+exportScope+'.json',JSON.stringify(exportPayload(),null,2),'application/json');else if(a==='download-csv')download('navylink-'+exportScope+'.csv',L.csv(exportSet),'text/csv');else if(a==='access-brief')accessBrief(id);else if(a==='fact-sheet')factSheet(id);else if(a==='reset')modal('Reset local demo data?','This removes imported entries, edited metadata, and collection changes from this browser. Export anything you need first.','',`<button class="btn" data-action="close">Keep my work</button><button class="btn danger" data-action="confirm-reset">Restore original demo</button>`);else if(a==='confirm-reset'){catalogue=structuredClone(NavyData);collections=[{id:'shortlist',name:'My shortlist',ids:[]},{id:'maintenance',name:'Maintenance discovery',ids:['NL-001','NL-002','NL-005']}];activeCollection='shortlist';query=domain=type=status='';persist();close();render();toast('Original catalogue and collections restored.');}});
document.addEventListener('submit',ev=>{ev.preventDefault();const form=ev.target,fd=new FormData(form);if(form.getAttribute('id')==='search-form'){query=String(fd.get('query')).trim();discover();}else if(form.getAttribute('id')==='save-form'){const chosen=fd.getAll('collection'),id=form.dataset.id;collections=collections.map(c=>({...c,ids:chosen.includes(c.id)?[...new Set([...c.ids,id])]:c.ids.filter(v=>v!==id)}));persist();close();render();toast('Collection choices saved.');}else if(form.getAttribute('id')==='collection-form'){const name=String(fd.get('name')).trim();if(!name){showErrors(['Enter a collection name.']);return;}if(collections.some(c=>c.name.toLowerCase()===name.toLowerCase()&&(!form.dataset.rename||c.id!==activeCollection))){showErrors(['A collection with that name already exists.']);return;}if(form.dataset.rename)collections.find(c=>c.id===activeCollection).name=name;else{if(collections.length>=50){showErrors(['The workspace supports up to 50 collections.']);return;}const id='c-'+Date.now().toString(36);collections.push({id,name,ids:[]});activeCollection=id;}persist();const returnId=form.dataset.return;close();render();if(returnId)saveModal(returnId);else toast('Collection saved.');}else if(form.getAttribute('id')==='entry-form'){if(!editing&&catalogue.length>=200){showErrors(['The workspace supports up to 200 entries.']);return;}const entry=Object.fromEntries(fd.entries());for(const k of ['tags','datasets','technology'])entry[k]=entry[k].split(',').map(v=>v.trim()).filter(Boolean);if(editing){entry.notes=catalogue.find(e=>e.id===editing)?.notes||'';}const v=L.validate([entry],catalogue.filter(e=>e.id!==editing));if(v.errors.length)showErrors(v.errors);else review(v.entries,editing?'edit':'new');}});
document.addEventListener('change',async ev=>{if(ev.target.id==='type-filter'){type=ev.target.value;discover();}else if(ev.target.id==='status-filter'){status=ev.target.value;discover();}else if(ev.target.id==='sort'){sort=ev.target.value;discover();}else if(ev.target.id==='import-file'){const file=ev.target.files[0];if(!file)return;if(file.size>2000000){showErrors(['File is too large. Maximum size is 2 MB.']);return;}try{$('#import-json').value=await file.text();$('#form-error').innerHTML='';}catch{showErrors(['The file could not be read. Try pasting its JSON text instead.']);}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if(ev.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#overlay').innerHTML){ev.preventDefault();$('#search')?.focus();}if(ev.key==='Tab'&&$('#overlay').innerHTML){const nodes=[...$('#overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,summary,a[href]')].filter(e=>e.getClientRects().length),first=nodes[0],last=nodes[nodes.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus();}}});
render();if(storageIssue)toast(storageIssue);
})();
