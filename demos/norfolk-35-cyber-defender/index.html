function renderOverview(f,a){
 const critical=f.filter(x=>x.severity==='critical').length,affected=new Set(f.map(x=>x.assetId)).size,scan=state.audit.filter(x=>x.type==='review.completed').at(-1);

 <section class="topology"><div class="section-top"><div><span class="eyebrow">ENCLAVE SNAPSHOT</span><h2>${esc(state.snapshot.name)}</h2></div><div class="topology-meta"><span class="offline-badge"><span class="dot"></span>ISOLATED</span><span class="mono">${esc(state.snapshot.id)}</span></div></div><div class="network-track">${state.snapshot.assets.length?state.snapshot.assets.map(asset=>{const issues=f.filter(x=>x.assetId===asset.id);const assessed=a.checks.filter(x=>x.assetId===asset.id&&x.status!=='not assessed').length;const worst=issues[0]?.severity;return `<button class="asset-node ${assetFilter===asset.id?'selected':''}" data-action="asset" data-id="${esc(asset.id)}" aria-pressed="${assetFilter===asset.id}"><div class="node-head"><span class="asset-icon ${worst||(!assessed?'unknown':'healthy')}">${icon(asset.kind)}</span><span class="node-status ${worst||(!assessed?'unknown':'healthy')}">${issues.length||(!assessed?'?':icon('check'))}</span></div><strong>${esc(asset.id)}</strong><span>${esc(asset.name)}</span><small>${esc(asset.zone)}</small></button>`;}).join(''):'<div class="empty-inline">This snapshot has no assets. Import a populated snapshot to run checks.</div>'}</div><div class="topology-foot"><span><span class="dot critical-dot"></span>Critical <span class="dot high-dot"></span>High <span class="dot mint-dark"></span>No findings in assessed checks</span><span>${assetFilter?`<button class="text-button" data-action="clear-asset">Clear asset filter ×</button>`:'Select an asset to focus the review'} · Topology is illustrative</span></div></section>
 <section class="workbench"><div class="findings-pane"><div class="section-top"><h2>Findings <span class="number-chip">${list.length}</span></h2><select id="severity" aria-label="Filter by severity"><option value="all">All severities</option>${['critical','high','medium'].map(s=>`<option value="${s}" ${severity===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div><div class="search-field">${icon('search')}<input id="search" placeholder="Search findings, assets, or checks" aria-label="Search findings" value="${esc(query)}">${query?'<button data-action="clear-search" aria-label="Clear search">×</button>':''}</div>${scope?`<div class="filter-caption">Focused on ${esc(scope.name)}</div>`:''}<div class="findings-list">${list.length?list.map(x=>`<button class="finding-row ${x.id===selected?'selected':''}" data-action="finding" data-id="${esc(x.id)}"><span class="finding-indicator ${x.severity}"></span><div><div class="finding-title">${esc(x.title)}</div><div class="finding-meta"><span class="mono">${esc(x.assetId)}</span><span>·</span><span>${x.ruleId}</span>${state.proposals.some(p=>p.findingId===x.id&&p.status==='staged')?'<span class="staged-mini">Staged</span>':''}</div></div>${badge(x.severity)}${icon('arrow')}</button>`).join(''):`<div class="empty-state">${icon(f.length?'search':'shield')}<h3>${f.length?'No matching findings':'No findings in assessed checks'}</h3><p>${f.length?'Try another severity or clear your search and asset filters.':'Review missing fields before drawing broader conclusions.'}</p>${f.length?'<button class="button" data-action="clear-filters">Clear filters</button>':'<button class="button" data-action="import">Import snapshot</button>'}</div>`}</div><div class="list-foot">${list.length} of ${f.length} findings · Deterministic local checks</div></div><div class="evidence-pane">${selectedFinding?renderEvidence(selectedFinding):'<div class="empty-state"><h3>Evidence appears here</h3><p>Select a finding to inspect its source and proposed change.</p></div>'}</div></section>`;

 if(modal.type==='reject'){title='Reject this proposal';eyebrow=p.id;body=`<p class="modal-lead">The proposal will remain in the audit record. No configuration value changes.</p><label>Rejection reason<textarea id="reason" maxlength="500" rows="3" placeholder="Explain what needs another review"></textarea></label><div id="modal-error" role="alert"></div><div class="modal-actions"><button class="button" data-action="close-modal">Cancel</button><button class="button primary" data-action="confirm-reject">Record rejection</button></div>`;}
 if(modal.type==='source'){const r=B.RULES.find(r=>r.id===modal.id);title=r.title;eyebrow=r.id+' / BUNDLED SOURCE';body=`${badge(r.severity)}<h3>${esc(r.source)}</h3><p>${esc(r.text)}</p><div class="source-rule"><label>EXPLICIT CHECK</label><code>${esc(r.id==='IAM-06'?'canDelegate === true AND canEditPolicy === true':r.id==='BUL-05'?'transferVersion < 2.3.5 (numeric version comparison)':r.id==='TLS-04'?'minimumTls is 1.0 or 1.1':r.field+' === '+(r.target?'false':'true'))}</code></div><h3>Evidence</h3><p>Exact configuration field and JSON asset index are attached to each finding. Missing required fields are not assessed.</p><h3>Operational prerequisite</h3><p>${esc(r.dependency)}</p><div class="callout">${icon('info')}<p>Authored for this fictional exercise. No compliance certification, external feed, or real CVE attribution.</p></div><div class="modal-actions"><button class="button primary" data-action="close-modal">Back to workspace</button></div>`;}
 if(modal.type==='import'){title='Bring a snapshot into focus';eyebrow='JSON INPUT / SYNTHETIC DATA ONLY';wide=true;body=`<p class="modal-lead">Import a fictional configuration snapshot. A successful import starts a new workspace and replaces local proposals and history. Export the current packet first if needed.</p><div class="import-tools"><label class="button file-label">${icon('upload')}Choose JSON file<input id="file-input" type="file" accept="application/json,.json"></label><button class="text-button" data-action="load-example">Load example</button><button class="text-button" data-action="download-sample">Download schema example</button></div><label>Snapshot JSON<textarea id="import-json" class="json-editor" rows="12" spellcheck="false" placeholder='{"schemaVersion": 1, "id": "RANGE-001", …}'>${esc(importDraft)}</textarea></label><p class="detail-fine">Maximum 150 KB · Up to 100 assets · Unknown configuration fields are rejected. See the example for supported fields.</p><div id="import-result" role="status"></div><div id="modal-error" role="alert"></div><div class="modal-actions"><button class="button" data-action="validate-import">Validate snapshot</button><button class="button primary" id="import-confirm" data-action="confirm-import" disabled>Import validated snapshot${icon('arrow')}</button></div>`;validImport=null;}
 if(modal.type==='export'){const bytes=new TextEncoder().encode(JSON.stringify(B.report(state),null,2)).length;title='Evidence that travels with you';eyebrow='OFFLINE REVIEW PACKET';body=`<p class="modal-lead">One open JSON packet containing the current snapshot, check results, rule sources, proposals, approvals, and complete local audit.</p><div class="packet-summary"><div>${icon('book')}<span><b>bulwark-review.json</b><small>${state.snapshot.assets.length} assets · ${state.audit.length} events · ${state.proposals.length} proposals</small></span><strong>${(bytes/1024).toFixed(1)} KB</strong></div></div><label>Illustrative constrained link<select id="link-rate"><option value="9.6">9.6 kbps — constrained</option><option value="64">64 kbps — narrowband</option><option value="256">256 kbps — available</option></select></label><div class="transfer-estimate"><strong id="transfer-seconds">${Math.ceil(bytes*8/9600)}s</strong><span>Estimated payload transmission<br><small>Bytes × 8 ÷ link rate; excludes protocol overhead</small></span></div><p class="detail-fine">Export is local. No data is sent. Production reconnect synchronization is outside this demonstration.</p><div class="modal-actions"><button class="button" data-action="download-snapshot">Snapshot only</button><button class="button primary" data-action="download-report">${icon('download')}Export JSON packet</button></div>`;modal.bytes=bytes;}
 if(modal.type==='reset'){title='Restart the range exercise?';eyebrow='LOCAL WORKSPACE';body=`<p class="modal-lead">Restore the six fictional assets and seven seeded findings. This replaces the local snapshot, proposals, and audit history.</p><p>Export a review packet first to preserve your session.</p><div class="modal-actions"><button class="button" data-action="close-modal">Keep workspace</button><button class="button danger-button" data-action="confirm-reset">Reset exercise</button></div>`;}
 $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button><div class="eyebrow">${esc(eyebrow)}</div><h2 id="modal-title">${esc(title)}</h2>${body}</section></div>`;
 $('#import-json')?.addEventListener('input',e=>{importDraft=e.target.value;validImport=null;$('#import-confirm').disabled=true;$('#import-result').textContent='';});
 $('#file-input')?.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;if(file.size>150000){modalError('File exceeds the 150 KB limit.');return;}importDraft=await file.text();$('#import-json').value=importDraft;validImport=null;$('#import-confirm').disabled=true;$('#import-result').textContent='';$('#modal-error').textContent='';});
 $('#link-rate')?.addEventListener('change',e=>{$('#transfer-seconds').textContent=Math.ceil(modal.bytes*8/(Number(e.target.value)*1000))+'s';});
}
function modalError(message){const el=$('#modal-error');if(el){el.className='form-error';el.textContent=message;}else notify(message);}
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const action=el.dataset.action,id=el.dataset.id;try{
 if(action==='nav'){view=id;render();window.scrollTo(0,0);}
 if(action==='asset'){assetFilter=assetFilter===id?'':id;selected=null;render();}
 if(action==='clear-asset'){assetFilter='';render();}
 if(action==='finding'){selected=id;render();}
 if(action==='clear-search'){query='';render();}
 if(action==='clear-filters'){query='';severity='all';assetFilter='';render();}
 if(action==='scan'){const result=B.assess(state.snapshot);B.log(state,'review.completed',{snapshotId:state.snapshot.id,findings:result.failed,passed:result.passed,notAssessed:result.notAssessed,ruleCount:B.RULES.length},'Local rule engine');save();render();notify(`${result.failed} findings · ${result.passed} passing checks · Evidence refreshed`);}
 if(['stage','source','import','approve','rollback','reject','export','reset'].includes(action))showModal(action,id);
 if(action==='close-modal')closeModal();
 if(action==='confirm-stage'){const p=B.stage(state,modal.id,{proposed:JSON.parse($('#proposed').value),note:$('#note').value,window:$('#window').value});selectedChange=p.id;save();closeModal();render();notify(p.id+' staged. Snapshot unchanged.');}
 if(action==='view-change'){view='changes';changeFilter='all';selectedChange=id;render();window.scrollTo(0,0);}
 if(action==='select-change'){selectedChange=id;render();}
 if(action==='confirm-approval'){const undo=modal.type==='rollback';const approval={actor:$('#authority').value,reason:$('#reason').value,confirmed:$('#acknowledge').checked};const p=undo?B.rollback(state,modal.id,approval):B.apply(state,modal.id,approval);save();closeModal();render();notify(undo?p.id+' rolled back. Original value verified.':p.id+' applied. Local check passed.');}
 if(action==='confirm-reject'){B.reject(state,modal.id,$('#reason').value);save();closeModal();render();notify('Proposal rejected. No configuration changed.');}
 if(action==='load-example'){importDraft=JSON.stringify(B.SEED,null,2);renderModal();}
 if(action==='validate-import'){importDraft=$('#import-json').value;if(new TextEncoder().encode(importDraft).length>150000)throw Error('Input exceeds the 150 KB limit.');validImport=B.parseSnapshot(importDraft);const a=B.assess(validImport);$('#import-result').className='validation-success';$('#import-result').textContent=`Valid snapshot · ${validImport.assets.length} assets · ${a.failed} findings · ${a.notAssessed} field pairs not assessed`;$('#modal-error').textContent='';$('#import-confirm').disabled=false;}
 if(action==='confirm-import'){if(!validImport)throw Error('Validate this snapshot before importing.');state=B.createState(validImport);save();query='';severity='all';assetFilter='';selected=null;view='findings';closeModal();render();notify('Snapshot imported and evaluated locally.');}
 if(action==='download-sample'){download('aster-example-snapshot.json',B.SEED);notify('Example snapshot downloaded.');}
 if(action==='download-snapshot'){download('bulwark-snapshot.json',state.snapshot);notify('Current snapshot downloaded.');}
 if(action==='download-report'){B.log(state,'packet.exported',{snapshotId:state.snapshot.id,format:'bulwark-review/1',destination:'Local file only'});save();download('bulwark-review.json',B.report(state));closeModal();render();notify('Review packet exported. No data was transmitted.');}
 if(action==='confirm-reset'){state=B.createState();save();view='findings';selected=null;assetFilter='';query='';severity='all';changeFilter='all';closeModal();render();notify('Exercise reset. Seven seeded findings restored.');}
 if(action==='dismiss-recovery'){recovered=false;storageFailure=false;render();}
 }catch(error){modal?modalError(error.message):notify(error.message);}});
document.addEventListener('change',e=>{if(e.target.id==='change-filter'){changeFilter=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if(e.key==='Tab'&&modal){const list=[...document.querySelectorAll('.modal button:not([disabled]), .modal input, .modal textarea, .modal select')].filter(el=>el.offsetParent!==null);const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
save();render();
})();
</script></body></html>
