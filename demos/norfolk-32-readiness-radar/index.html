return `<div class="graph-scroll"><div class="graph"><div class="graph-labels"><span>01 / INPUTS</span><span>02 / RESTORATION</span><span>03 / CAPABILITY</span><span>04 / TASKING</span></div><svg viewBox="0 0 900 325" class="connections" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d7dcd5"/></pattern></defs><rect width="900" height="325" fill="url(#dots)"/><g fill="none" stroke-width="1.7"><path class="${riskRad?'bad':'good'}" d="M185 67H218Q230 67 230 80V121Q230 130 245 130H265M185 164H218Q230 164 230 152V141Q230 130 245 130"/><path class="${riskRad?'bad':'good'}" d="M442 130H470Q484 130 484 115V87H520"/><path class="${riskCrew?'bad':'good'}" d="M185 263H265M442 263H470Q484 263 484 248V100Q484 87 500 87H520M484 181H520"/><path class="${r.risk?'bad':'good'}" d="M697 87H722Q735 87 735 100V146Q735 159 750 159H770M697 181H722Q735 181 735 168V159"/><path class="${r.capacities.slice(2).some(c=>c.slack<0)?'bad':'good'}" d="M697 274H720Q745 274 745 247V173Q745 159 770 159"/></g></svg>
${node('part',riskRad?'danger':'safe',1,40,19,'RECEIVER MODULE',M.date(r.input.part),`${day(r.input.part)} · ${(allSources().find(s=>s.id===r.origins.part)?.confidence||'Estimated').toLowerCase()} arrival`)}
${node('work',riskRad?'danger':'safe',1,139,19,'MAINTENANCE',`${r.input.queue+r.input.repair+r.input.verify} days remaining`,`${r.input.queue} queue + ${r.input.repair} repair + ${r.input.verify} verify`)}
${node('staff',riskCrew?'danger':'safe',1,238,19,'QUALIFIED PERSONNEL',`${r.input.qualified} of ${r.input.required} available`,r.crew?`Relief expected ${M.date(r.crew)}`:'Required coverage met')}
${node('radar',riskRad?'danger':'safe',29.4,103,19.7,'RADAR RESTORATION',M.date(r.radar),`${day(r.radar)} · ${margin(r.input.mission-r.radar)}`)}
${node('crew',riskCrew?'danger':'safe',29.4,238,19.7,'WATCH COVERAGE',r.crew?M.date(r.crew):'Available',r.crew?`${day(r.crew)} · ${margin(r.input.mission-r.crew)}`:'Qualification gate met')}
${node('air',r.capacities[0].slack<0?'danger':'safe',57.7,60,19.7,'AIR SURVEILLANCE',r.capacities[0].status,margin(r.capacities[0].slack))}
${node('surface',r.capacities[1].slack<0?'danger':'safe',57.7,154,19.7,'SURFACE PICTURE',r.capacities[1].status,margin(r.capacities[1].slack))}
${node('other',(r.capacities.slice(2).some(c=>c.slack<0))?'danger':'safe',57.7,248,19.7,'NAVIGATION + COMMS',r.capacities.slice(2).every(c=>c.slack>=0)?'Within window':'At risk','2 supporting capabilities')}
${node('mission',r.risk?'mission danger':'mission safe',85.5,132,13.5,'MISSION',M.date(r.input.mission),`${day(r.input.mission)} · start`)}
</div></div>`;}
function timeline(r){const max=Math.max(28,r.ready+2,r.input.mission+2),w=100/max;
return `<div class="timeline"><div class="time-scale"><span>CAPABILITY / READINESS GATE</span><div>${Array.from({length:8},(_,i)=>{let d=Math.round(i*max/7);return `<span style="left:${d*w}%">${day(d)}</span>`;}).join('')}</div></div>${r.capacities.map(c=>`<button class="timeline-row" data-node="${c.id==='navigation'||c.id==='comms'?'other':c.id}"><span><strong>${c.name}</strong><small>${M.date(c.ready)} · ${margin(c.slack)}</small></span><div class="track"><span class="deadline" style="left:${r.input.mission*w}%"></span><span class="time-bar ${c.slack<0?'late':''}" style="width:${Math.max(2,c.ready*w)}%">${c.ready?day(c.ready):'READY'}</span></div></button>`).join('')}<div class="timeline-caption">Mission gate: ${day(r.input.mission)} / ${M.date(r.input.mission)} · Bars show earliest modeled readiness, not work effort.</div></div>`;}
function sourcesFor(id,r){const o=r.origins;return [...new Set(({part:[o.part],work:[o.queue,o.repair,o.verify],staff:[o.qualified,o.required,o.relief],radar:[o.part,o.queue,o.repair,o.verify],crew:[o.qualified,o.required,o.relief],air:[o.part,o.queue,o.repair,o.verify,o.qualified,o.required,o.relief,'PLAN-001'],surface:[o.qualified,o.required,o.relief,'PLAN-001'],other:[o.comms,o.navigation],mission:[o.mission]}[id]||[]).concat(o.mission))];}
function inspector(r){const details={part:['Delivery estimate',`Module arrival on ${day(r.input.part)} is the start of the serial restoration chain. Source confidence: ${(allSources().find(s=>s.id===r.origins.part)?.confidence||'Estimated').toLowerCase()}.`],work:['Serial work sequence',`The illustrative model adds ${r.input.queue} days of queue, ${r.input.repair} days of repair and ${r.input.verify} day(s) of verification after parts receipt.`],staff:['Qualification shortfall',`${r.input.qualified} available against ${r.input.required} required. ${r.crew?'The model holds both dependent capabilities until qualified relief arrives.':'The qualification requirement is met.'}`],radar:['Radar restoration',`${day(r.input.part)} arrival + ${r.input.queue}d queue + ${r.input.repair}d repair + ${r.input.verify}d verification = ${day(r.radar)}. ${r.radar>r.input.mission?'Restoration misses the mission gate.':'Restoration fits the mission gate.'}`],crew:['Personnel gate',`${r.input.qualified}/${r.input.required} qualified. Earliest coverage: ${r.crew?day(r.crew):'already available'}. Relief dates assume personnel are fully qualified on arrival.`],air:['Air surveillance',`Latest dependency wins: radar ${day(r.radar)} and personnel ${day(r.crew)}. ${r.capacities[0].controller} controls; ${margin(r.capacities[0].slack)}.`],surface:['Surface picture',`Qualified personnel control this capability. Earliest availability ${day(r.crew)}; ${margin(r.capacities[1].slack)}.`],other:['Supporting capabilities',`Navigation is ready ${day(r.input.navigation)}; communications is ready ${day(r.input.comms)}. Each is compared separately against ${day(r.input.mission)}.`],mission:['Exercise mission gate',`All four capabilities are required by ${day(r.input.mission)} (${M.date(r.input.mission)}). Forecast readiness is the latest capability date.`]};const [title,body]=details[selection]||details.radar;
return `<div class="inspector"><div class="inspect-icon">${icon('source')}</div><div><strong>${title}</strong><p>${body}</p><div class="source-chips">${sourcesFor(selection,r).map(s=>`<button data-source="${esc(s)}">${esc(s)} ↗</button>`).join('')}</div></div></div>`;}
function recommendations(r){const actions=M.recommendations(state.events,state.count);if(!actions.length)return `<div class="empty compact">${icon('check')}<div><strong>${r.risk?'Review the remaining capability gate.':'No recovery action required by this model.'}</strong><p>${r.risk?`${r.controller} still controls. The available part and personnel options cannot resolve this gap; inspect the source and test an appropriate update.`:'Keep monitoring estimated dates and qualification coverage.'}</p></div></div>`;
return actions.map((a,j)=>`<article class="action-row"><span class="action-number">0${j+1}</span><div><h3>${a.title}</h3><p>${a.detail}</p><span class="tiny">${a.owner} · ${[...new Set(a.sources)].map(s=>`<button class="source-inline" data-source="${esc(s)}">${esc(s)}</button>`).join(' / ')}</span></div><div class="action-impact"><strong>${a.gain?`${a.gain}d gain`:'Paired action'}</strong><small>${a.gain?'if applied alone':'Another gate still controls'}</small><button class="text-link" data-try="${a.key}" data-value="${a.value}">Test option ${icon('arrow')}</button></div></article>`).join('')+`<p class="human-note">Planning recommendations only. The watch team decides; no actions are sent to source systems.</p>`;}
function eventRail(r){return `<aside class="event-rail"><div class="rail-header"><span class="eyebrow">EVENT STREAM</span><span class="snapshot-pill">${day(r.day)} SNAPSHOT</span></div><h2>The picture is changing.</h2><p>Replay updates to see what moves the forecast.</p><div class="event-progress"><span>${state.count} of ${state.events.length} updates applied</span><button data-action="rewind">Reset replay</button><div><i style="width:${state.count/state.events.length*100}%"></i></div></div><div class="event-list">${state.events.map((e,i)=>{const before=M.calculate(state.events,i),after=M.calculate(state.events,i+1);const change=after.ready-before.ready;const gate=after.input.mission-before.input.mission;return `<button class="event ${i<state.count?'applied':'pending'} ${i===state.count-1?'current':''}" data-event="${i+1}"><span class="event-day">${day(e.day)}<i>${i<state.count?'✓':String(i+1).padStart(2,'0')}</i></span><span><small>${esc(e.source.kind)} ${i>=state.count?'· queued':''}</small><strong>${esc(e.title)}</strong><em>${change?`Ready date ${change>0?'+':''}${change}d`:gate?`Mission gate ${gate}d`:'No forecast movement'}</em></span></button>`;}).join('')}</div><button class="btn primary block" data-action="next" ${state.count>=state.events.length?'disabled':''}>${state.count>=state.events.length?'All updates applied':'Apply next update'} ${icon('arrow')}</button><p class="rail-foot">Snapshot: ${M.date(r.day)}, 2026<br>Cached exercise records · no live sync</p></aside>`;}
function scenarioView(r){const s=scenario(),fields=[['part','Module arrival',r.input.part,'days from Nov 5'],['queue','Maintenance queue',r.input.queue,'days of waiting'],['relief','Qualified relief',r.input.relief,'days from Nov 5'],['mission','Mission start',r.input.mission,'days from Nov 5']];return `<div class="scenario-top"><div class="scenario-intro"><span class="eyebrow">WORKING OPTION / LOCAL ASSUMPTIONS</span><h2>${s.risk?'More recovery needed.':'A workable recovery window.'}</h2><p>${Object.keys(state.options).length?`${r.controller} controls the reported plan. Under this option, ${s.controller.toLowerCase()} controls.`:'No overrides are active. This option matches the reported plan.'}</p></div><div class="scenario-result"><span class="eyebrow">REPORTED → PROPOSED</span><strong><span>${r.slack<0?'−':'+'}${Math.abs(r.slack)}d</span> ${icon('arrow')} <b class="${s.slack<0?'red':'green'}">${s.slack<0?'−':'+'}${Math.abs(s.slack)}d</b></strong><small>Margin to the mission date</small></div></div><div class="lab-grid"><section class="panel assumptions"><div class="section-title"><div><span class="eyebrow">ADJUST THE PLAN</span><h2>What would have to change?</h2></div></div><form id="scenario-form">${fields.map(([k,label,val,hint])=>`<label class="assumption"><span><strong>${label}</strong><small>Reported: ${val} · ${hint}</small></span><div class="number-field"><input type="number" name="${k}" min="${Math.max(k==='queue'?0:1,k==='part'||k==='relief'?r.day:0)}" max="${M.limits[k][1]}" step="1" value="${state.options[k]??val}" required><span>${k==='queue'?'days':'day'}</span></div></label>`).join('')}<div class="form-error" id="scenario-error" role="alert"></div><button class="btn primary block" type="submit">Recalculate option ${icon('arrow')}</button></form><button class="text-link reset-assumptions" data-action="clear-options">Restore reported assumptions</button><div class="assumption-note">${icon('source')}<p>Edits are what-if assumptions. They do not change source records or confirm delivery, staffing, or tasking.</p></div></section><section class="panel comparison"><div class="section-title"><div><span class="eyebrow">CAPABILITY COMPARISON</span><h2>Reported plan vs. working option</h2></div>${badge(s.risk?'At risk':s.slack<=2?'Tight margin':'On track')}</div><div class="table-wrap"><table><thead><tr><th>Mission capability</th><th>Reported ready</th><th>Option ready</th><th>Option margin</th></tr></thead><tbody>${r.capacities.map((c,i)=>`<tr><td><strong>${c.name}</strong><small>${s.capacities[i].controller}</small></td><td>${M.date(c.ready)}<small>${day(c.ready)}</small></td><td>${M.date(s.capacities[i].ready)}<small>${day(s.capacities[i].ready)}</small></td><td><span class="margin-pill ${s.capacities[i].slack<0?'bad':'good'}">${margin(s.capacities[i].slack)}</span></td></tr>`).join('')}</tbody></table></div><div class="controlling-change"><span class="eyebrow">WHY THE FORECAST CHANGED</span><h3>${r.ready===s.ready?'The latest dependency has not moved.':`Forecast readiness moves ${r.ready-s.ready>0?'earlier':'later'} by ${Math.abs(r.ready-s.ready)} days.`}</h3><p>Radar: ${day(s.input.part)} + ${s.input.queue}d queue + ${s.input.repair}d repair + ${s.input.verify}d verification = ${day(s.radar)}. Personnel: ${s.crew?day(s.crew):'available'}. The later gate controls air surveillance. Mission date: ${day(s.input.mission)}.</p><div class="source-chips">${Object.entries(state.options).map(([k,v])=>`<span class="assumption-chip">${M.labels[k]} → ${v}</span>`).join('')||'<span>No local overrides</span>'}</div></div><div class="export-callout"><span>Keep the comparison, assumptions, and source trail together.</span><button class="btn" data-action="export">${icon('download')} Export comparison</button></div></section></div>`;}
function allSources(){return [...M.sources,...state.events.slice(0,state.count).map(e=>({...e.source,day:e.day}))];}
function sourceView(){const rows=allSources().filter(s=>(filter==='All'||s.confidence===filter)&&`${s.id} ${s.title} ${s.kind} ${s.note}`.toLowerCase().includes(search.toLowerCase()));return `<section class="panel ledger"><div class="ledger-tools"><label class="search">${icon('search')}<input id="source-search" type="search" placeholder="Search source IDs, records, or details…" value="${esc(search)}" aria-label="Search sources"></label><label class="filter">Confidence <select id="source-filter">${['All','Reported','Estimated','Assumed'].map(v=>`<option ${v===filter?'selected':''}>${v}</option>`).join('')}</select></label><span class="tiny">${rows.length} RECORDS</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Source record</th><th>Domain</th><th>Snapshot</th><th>Confidence</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><button class="record-link" data-source="${esc(s.id)}"><strong>${esc(s.title)}</strong><small>${esc(s.id)}</small></button></td><td>${esc(s.kind)}</td><td>${day(s.day)} · ${M.date(s.day)}</td><td><span class="confidence ${s.confidence.toLowerCase()}">${s.confidence}</span></td><td><button class="text-link" data-source="${esc(s.id)}">Inspect ↗</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h2>No matching sources</h2><p>Try a source ID such as SUP-019, or clear your filters.</p><button class="btn" data-action="clear-search">Clear filters</button></div>`}<div class="ledger-foot">Only sources available at the selected replay stage are shown. ${state.events.length-state.count} queued update(s) remain outside this snapshot.</div></section>`;}
function logView(){return `<section class="panel audit-panel"><div class="section-title"><div><span class="eyebrow">BROWSER-LOCAL AUDIT</span><h2>${state.audit.length} recorded actions</h2></div><button class="btn" data-action="reset">Reset workspace</button></div><p class="audit-disclaimer">This local log supports exercise review. It is editable browser storage, not a tamper-proof or authenticated audit system.</p><div class="audit-list">${state.audit.slice().reverse().map(a=>`<article><span class="audit-dot"></span><time>${esc(new Date(a.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}))}</time><div><h3>${esc(a.action)}</h3><p>${esc(a.detail)}</p></div></article>`).join('')}</div></section>`;}
function wire(){
$('.brand').onclick=e=>{e.preventDefault();view='overview';render();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();window.scrollTo(0,0);});
document.querySelectorAll('[data-viz]').forEach(b=>b.onclick=()=>{viz=b.dataset.viz;render();});
document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{selection=b.dataset.node;render();});
document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>showSource(b.dataset.source));
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>move(Number(b.dataset.event)));
document.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>{state.options={[b.dataset.try]:Number(b.dataset.value)};audit('Tested a recovery option',`${M.labels[b.dataset.try]} set to day ${b.dataset.value}; other overrides cleared.`);view='scenario';render();window.scrollTo(0,0);});
if($('#scenario-form'))$('#scenario-form').onsubmit=e=>{e.preventDefault();let options={};const r=base();for(const[k,v]of new FormData(e.currentTarget)){const n=Number(v);if(!Number.isInteger(n)||n<M.limits[k][0]||n>M.limits[k][1]||((k==='part'||k==='relief')&&n<r.day)){$('#scenario-error').textContent='Use whole days within the supported range; arrivals cannot precede the snapshot.';return;}if(n!==r.input[k])options[k]=n;}state.options=options;audit('Recalculated working option',JSON.stringify(options));render();toast('Working option recalculated. Source records are unchanged.');};
if($('#source-search'))$('#source-search').oninput=e=>{const pos=e.target.selectionStart;search=e.target.value;render();$('#source-search').focus();$('#source-search').setSelectionRange(pos,pos);};
if($('#source-filter'))$('#source-filter').onchange=e=>{filter=e.target.value;render();};
}
function move(count){const previousCount=state.count;const before=base();state.count=count;const after=base();for(const key of ['part','relief'])if(state.options[key]<after.day)delete state.options[key];audit(count>previousCount?'Applied replay update':'Changed replay snapshot',`Stage ${count}/${state.events.length}. Forecast ${day(before.ready)} → ${day(after.ready)}; mission ${day(after.input.mission)}.`);render();toast(`Snapshot ${day(after.day)}: ${after.controller} controls · ${margin(after.slack)}.`);}
function action(a){if(a==='next')move(Math.min(state.events.length,state.count+1));if(a==='rewind')move(0);if(a==='export')exportDialog();if(a==='import')importDialog();if(a==='guide')guide();if(a==='clear-options'){state.options={};audit('Restored reported assumptions','All local what-if overrides cleared.');render();toast('Working option now matches the reported plan.');}if(a==='clear-search'){search='';filter='All';render();}if(a==='dismiss-warning'){storageWarning='';render();}if(a==='reset')resetDialog();}
function dialog(title,subtitle,body){modalReturn=document.activeElement;$('#modal').innerHTML=`<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><div><span class="eyebrow">${subtitle}</span><h2 id="dialog-title">${title}</h2></div><button class="icon-button" id="close-dialog" aria-label="Close dialog">${icon('close')}</button></div>${body}</section></div>`;$('#close-dialog').onclick=closeDialog;$('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeDialog();};document.body.classList.add('modal-open');$('#close-dialog').focus();}
function closeDialog(){$('#modal').innerHTML='';document.body.classList.remove('modal-open');modalReturn?.focus();}
document.addEventListener('keydown',e=>{if(!$('.dialog'))return;if(e.key==='Escape')closeDialog();if(e.key==='Tab'){const nodes=[...$('.dialog').querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}}});
function showSource(id){const s=allSources().find(s=>s.id===id);if(!s)return;const e=state.events.find(e=>e.source.id===id);dialog(esc(s.title),'ORIGINAL SYNTHETIC SOURCE',`<div class="source-meta"><code>${esc(s.id)}</code><span>${day(s.day)} · ${M.date(s.day)}, 2026</span><span class="confidence ${s.confidence.toLowerCase()}">${s.confidence}</span></div><blockquote>${esc(s.note)}</blockquote>${e?`<h3 class="dialog-subtitle">Model fields in this update</h3><div class="field-list">${Object.entries(e.patch).map(([k,v])=>`<div><span>${M.labels[k]}</span><b>${v}</b></div>`).join('')||'<p>No dependency changes. This update is informational.</p>'}</div>`:''}<p class="dialog-note">Source records are immutable within this demo. Scenario assumptions are exported separately. These records are invented exercise material, not fleet data.</p>`);}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportDialog(){const r=base(),s=scenario();dialog('Export a traceable readiness brief','PORTABLE COMPARISON',`<p class="dialog-copy">Reported plan and working option at ${day(r.day)}. Includes 4 capabilities, ${allSources().length} sources, ${Object.keys(state.options).length} local assumptions, and the activity log.</p><div class="export-preview"><span>Reported margin <b class="${r.slack<0?'red':'green'}">${margin(r.slack)}</b></span><span>Working option <b class="${s.slack<0?'red':'green'}">${margin(s.slack)}</b></span></div><button id="download-json" class="btn primary block">${icon('download')} Download full brief · JSON</button><button id="download-csv" class="btn block">${icon('download')} Download capability comparison · CSV</button><p class="dialog-note">JSON includes source records, event history, model formula, assumptions, and audit entries. CSV is a concise comparison; use the JSON for full provenance.</p>`);
$('#download-json').onclick=()=>{audit('Exported JSON brief',`Reported and scenario comparison at ${day(r.day)}; full source trail included.`);download('readiness-radar-brief.json',JSON.stringify(M.comparison(state.events,state.count,state.options,state.audit),null,2),'application/json');toast('JSON brief exported with source records and assumptions.');};$('#download-csv').onclick=()=>{audit('Exported CSV comparison',`Four capability rows at ${day(r.day)}. Full provenance remains in JSON export.`);download('readiness-radar-comparison.csv',M.csv(M.comparison(state.events,state.count,state.options,state.audit)),'text/csv');toast('Capability comparison exported.');};}
const sample={id:'EV-LOCAL-01',day:13,title:'Qualified relief confirmed earlier',source:{id:'MANN-LOCAL-01',title:'Synthetic relief update',kind:'Personnel',confidence:'Reported',note:'Exercise relief team now qualified and available on day 17.'},patch:{relief:17}};
function importDialog(){dialog('Bring in a synthetic update','READ-ONLY IMPORT / JSON',`<p class="dialog-copy">Add one source-backed update to the event queue. Review and apply it with the replay controls. Up to 50 updates; no network requests.</p><div class="import-tools"><button class="btn small" id="load-example">Load example</button><label class="btn small file-picker">Choose JSON file<input type="file" id="import-file" accept=".json,application/json"></label><button class="text-link" id="import-schema">Supported fields</button></div><div id="schema-help" hidden class="schema-help">${Object.entries(M.limits).map(([k,v])=>`<code>${k}</code> ${v[0]}–${v[1]}`).join(' · ')}<p>All values are whole days from Nov 5 except durations and qualified/required headcounts. Events must be chronological and use unique event/source IDs.</p></div><label class="textarea-label" for="import-json">Event JSON</label><textarea id="import-json" spellcheck="false" placeholder='Paste a synthetic event object or load the example.'></textarea><div id="import-error" class="form-error" role="alert"></div><button id="queue-import" class="btn primary block">Validate & add to queue ${icon('arrow')}</button>`);
$('#load-example').onclick=()=>{$('#import-json').value=JSON.stringify(sample,null,2);$('#import-error').textContent='';};$('#import-schema').onclick=()=>{$('#schema-help').hidden=!$('#schema-help').hidden;};$('#import-file').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>100000){$('#import-error').textContent='File is too large. Use one event under 100 KB.';return;}$('#import-json').value=await f.text();}};
$('#queue-import').onclick=()=>{let e;try{e=JSON.parse($('#import-json').value);}catch{$('#import-error').textContent='Invalid JSON. Load the example to see the supported structure.';return;}const errors=M.validateEvent(e,state.events);if(state.events.length>=50)errors.push('The 50-update limit has been reached.');if(errors.length){$('#import-error').innerHTML=errors.map(esc).join('<br>');return;}state.events.push({id:e.id,day:e.day,title:e.title,source:{id:e.source.id,title:e.source.title,kind:e.source.kind,confidence:e.source.confidence,note:e.source.note},patch:{...e.patch}});audit('Imported synthetic update',`${e.id} · ${e.source.id} queued at ${day(e.day)}. Not yet applied.`);closeDialog();view='overview';render();toast(`${e.id} validated and queued. Apply it in the event stream.`);};}
function guide(){dialog('A transparent model, with clear limits','MODEL & PROVENANCE',`<div class="guide"><h3>How readiness is calculated</h3><p>Radar ready = parts arrival + maintenance queue + repair + verification. Personnel ready = day 0 when qualified coverage meets the requirement, otherwise qualified relief arrival. Air surveillance waits for both gates; surface picture waits for personnel. Navigation and communications use independent reported dates.</p><p>Mission ready is the latest capability date. Margin = mission date − ready date. A negative margin is at risk; zero to two days is tight. These are illustrative thresholds, not a readiness standard.</p><h3>What “confidence” means</h3><p>Reported: a fictional source says it occurred. Estimated: a planned date or duration. Assumed: a scenario dependency. No statistical confidence, failure probability, or certified readiness level is calculated.</p><h3>Source and scope</h3><p>Brief: <code>harness/norfolk-snapshot.ts</code>, Norfolk use case 32, “Know Before It Breaks the Mission.” All ship, records, dates and parameters are handcrafted synthetic exercise data. This is a handcrafted demo, not AppYard-generated or AppYard-verified.</p><h3>Offline and recovery</h3><p>The complete model runs locally. Imported updates provide a manual way to refresh cached exercise records; there is no live reconnect synchronization. Browser storage preserves local work when available. JSON exports include the audit and original records; they are review artifacts, not a workspace backup import format.</p><button class="btn" id="guide-reset">Reset to seeded exercise</button></div>`);$('#guide-reset').onclick=resetDialog;}
function resetDialog(){dialog('Reset the exercise workspace?','LOCAL DATA RESET',`<p class="dialog-copy">This clears locally imported events, working assumptions, and the activity log, then restores the seeded day 9 snapshot. Export your brief first if you want to keep a review copy.</p><div class="dialog-actions"><button class="btn" id="cancel-reset">Keep workspace</button><button class="btn danger-btn" id="confirm-reset">Reset exercise</button></div>`);$('#cancel-reset').onclick=closeDialog;$('#confirm-reset').onclick=()=>{state=fresh();persist();closeDialog();view='overview';selection='radar';search='';filter='All';render();toast('Seeded synthetic exercise restored.');};}
render();persist();
})();

</script></body></html>
