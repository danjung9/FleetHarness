function fieldSpec(doc,key){return templates[doc.template].fields.find(f=>f[0]===key)}
function validateField(doc,field){const spec=fieldSpec(doc,field.key),v=String(field.value).trim();if(!v)return 'Enter a value before verifying.';if(v.length>500)return 'Use 500 characters or fewer.';if(spec[2]==='number'&&(!/^(?:\d+\.?\d*|\.\d+)$/.test(v)||!Number.isFinite(Number(v))))return 'Enter a non-negative number without units.';if(spec[2]==='date'){if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||(!Number.isFinite(new Date(v+'T00:00:00Z').getTime())||new Date(v+'T00:00:00Z').toISOString().slice(0,10)!==v))return 'Use a valid date in YYYY-MM-DD format.';}if(spec[2]==='select'&&!['Serviceable','Needs attention','Out of service'].includes(v))return 'Choose a listed disposition.';return ''}
function needsReview(field){return !field.verified&&(field.confidence===null||field.confidence<70)}
function issues(doc){return doc.fields.filter(f=>needsReview(f)||validateField(doc,f))}
function verifiedCount(doc){return doc.fields.filter(f=>f.verified).length}
function reviewField(doc,key,value,note=''){const f=doc.fields.find(f=>f.key===key);if(!f)throw Error('Unknown field');const error=validateField(doc,{...f,value});if(error)throw Error(error);const entry={at:new Date().toISOString(),from:f.value,to:String(value).trim(),note:note.trim(),action:'verified'};f.history.push(entry);f.value=entry.to;f.verified=true;delete doc.finalizedAt;doc.events.push({key,...entry});return f}

function parseText(text,title='Imported record.txt',chosenTemplate){if(!text.trim())throw Error('Add some labeled text first.');if(text.length>50000)throw Error('Text is limited to 50,000 characters.');const found=[],warnings=[];text.split(/\r?\n/).forEach((line,i)=>{if(!line.trim())return;const m=line.match(/^\s*([^:]+):\s*(.*)$/);if(!m){warnings.push(`Line ${i+1}: no label/value separator; preserved in source.`);return}const key=alias[m[1].toLowerCase().replace(/[^a-z]/g,'')];if(!key){warnings.push(`Line ${i+1}: unsupported label “${m[1]}”.`);return}if(found.some(x=>x.key===key)){warnings.push(`Line ${i+1}: duplicate ${m[1]}; the first value was kept.`);return}found.push({key,value:m[2].trim(),line:i+1});});if(!found.length)throw Error('No supported labels found. Try “Equipment ID: AUX-P-017”.');const template=chosenTemplate||(found.some(x=>['voltage','current','insulation'].includes(x.key))?'electrical':'pump');const doc=makeDoc({id:'text-'+Date.now(),title:title.replace(/\.[^.]+$/,''),template,values:templates[template].fields.map(f=>found.find(x=>x.key===f[0])?.value||''),method:'text',source:{kind:'text',name:title,text}});doc.fields.forEach(f=>{f.line=found.find(x=>x.key===f.key)?.line||null});found.filter(x=>!doc.fields.some(f=>f.key===x.key)).forEach(x=>warnings.push(`${x.key} is not in the selected template; preserved in source.`));doc.warnings=warnings;doc.matchReason=chosenTemplate?'Template selected by reviewer.':template==='electrical'?'Matched locally from voltage, current, or insulation labels.':'Matched locally to the mechanical field vocabulary; confirm the template.';return doc;}

function chooseField(key){activeField=key;const canvas=$('.source-canvas'),oldScroll=canvas?.scrollTop||0;shell();if($('.source-canvas'))$('.source-canvas').scrollTop=oldScroll;}
function nextField(){const d=doc(),pending=issues(d);if(!pending.length){toast('All required fields are resolved. Your record is ready to export.');return}const i=pending.findIndex(f=>f.key===activeField);activeField=pending[(i+1)%pending.length].key;shell();}
function bind(){const root=$('#app');if($('#mobile-doc'))$('#mobile-doc').onchange=e=>{selected=e.target.value;activeField=(issues(doc())[0]||doc().fields[0]).key;shell()};$$('[data-doc]',root).forEach(b=>b.onclick=()=>{selected=b.dataset.doc;view='review';activeField=(issues(doc())[0]||doc().fields[0]).key;fieldFilter='all';zoom=100;shell()});$$('[data-view]',root).forEach(b=>b.onclick=()=>{view=b.dataset.view;shell()});$$('[data-field]',root).forEach(b=>b.onclick=()=>chooseField(b.dataset.field));$$('[data-queue]',root).forEach(b=>b.onclick=()=>{queueFilter=b.dataset.queue;shell()});$$('[data-fields]',root).forEach(b=>b.onclick=()=>{fieldFilter=b.dataset.fields;shell()});$$('[data-use-template]',root).forEach(b=>b.onclick=()=>{importTemplate=b.dataset.useTemplate;importMode='scan';openImport()});$$('[data-action]',root).forEach(b=>b.onclick=e=>{e.preventDefault();action(b.dataset.action)});$('#queue-search').oninput=e=>{query=e.target.value;$('#queue-list').innerHTML=queueHTML();$$('[data-doc]',$('#queue-list')).forEach(b=>b.onclick=()=>{selected=b.dataset.doc;view='review';activeField=(issues(doc())[0]||doc().fields[0]).key;shell()});$$('[data-action]',$('#queue-list')).forEach(b=>b.onclick=()=>action(b.dataset.action))};if($('#review-form'))$('#review-form').onsubmit=e=>{e.preventDefault();try{const d=doc(),f=d.fields.find(f=>f.key===activeField),before=f.value;reviewField(d,activeField,$('#field-value').value,$('#review-note').value);save();const pending=issues(d);activeField=(pending[0]||f).key;shell();toast(before!==f.value?'Correction saved. Original transcription preserved.':'Field verified against source.')}catch(e){$('#field-error').textContent=e.message;$('#field-value').setAttribute('aria-invalid','true')}};}
function action(name){if(name==='home'){view='review';shell()}else if(name==='import')openImport();else if(name==='guide')openGuide();else if(name==='export')openExport();else if(name==='clear-search'){query='';queueFilter='all';shell()}else if(name==='zoom-in'){zoom=Math.min(175,zoom+25);shell()}else if(name==='zoom-out'){zoom=Math.max(75,zoom-25);shell()}else if(name==='zoom-reset'){zoom=100;shell()}else if(name==='source')downloadSource();else if(name==='next-field')nextField();else if(name==='reopen'){reopenField(doc(),activeField);save();shell();toast('Field reopened for review.')}else if(name==='template-detail'){modal('Template mapping',`<span class="eyebrow">${templates[doc().template].code}</span><h3>${templates[doc().template].name}</h3><p>${esc(doc().matchReason||'This synthetic fixture is mapped to its matching illustrative template by design. No AI matching was performed.')}</p><div class="info-block">${icon('info')}<p>Template fields are defined locally. Label-based matching is available for imported text. Scanned forms require manual template selection.</p></div>`)}else if(name==='audit-download'){download('folio-review-history.json',JSON.stringify(docs.map(d=>({id:d.id,title:d.title,events:d.events})),null,2),'application/json');toast('Local review history exported.')}}
let priorFocus;function modal(title,body,wide=false){priorFocus=document.activeElement;$('#modal').innerHTML=`<div class="modal-backdrop"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><div><span class="eyebrow">FOLIO WORKSPACE</span><h2>${title}</h2></div><button class="icon-button" aria-label="Close dialog" id="close-modal">${icon('close')}</button></header><div class="dialog-body">${body}</div></section></div>`;document.body.classList.add('modal-open');$('#close-modal').onclick=closeModal;$('.modal-backdrop').onclick=e=>{if(e.target===$('.modal-backdrop'))closeModal()};$('#close-modal').focus();}
function closeModal(){$('#modal').innerHTML='';document.body.classList.remove('modal-open');modalType='';priorFocus?.focus()}
document.addEventListener('keydown',e=>{if(!$('#modal').innerHTML)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const fs=$$('button,input,select,textarea,a[href]',$('.dialog')).filter(x=>!x.disabled&&x.offsetParent!==null),first=fs[0],last=fs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const example='Training vessel: FNS Aster\nEquipment ID: AUX-P-031\nInspection date: 2026-11-05\nRecorded by: Training team 03\nInlet pressure: 18.2\nOutlet pressure: 47.8\nBearing temperature: 64\nVibration: 2.1\nDisposition: Serviceable\nRemarks: Training example. No leaks observed.';
function openImport(){modalType='import';modal('Bring a document into focus',`<p class="modal-intro">Use synthetic or non-sensitive files. All processing happens in this browser.</p><div class="import-tabs"><button id="scan-tab" class="${importMode==='scan'?'active':''}">${icon('document')} Scanned document</button><button id="text-tab" class="${importMode==='text'?'active':''}">${icon('link')} Labeled text</button></div>${importMode==='scan'?`<label class="form-label" for="import-template">Choose a digital template</label><select id="import-template">${Object.values(templates).map(t=>`<option value="${t.id}" ${t.id===importTemplate?'selected':''}>${t.code} · ${t.name}</option>`).join('')}</select><label class="dropzone" id="dropzone" for="file-input">${icon('upload')}<strong>Drop a scan here, or browse files</strong><span>PDF, PNG, or JPEG · up to 2 MB · one record per file</span><input id="file-input" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"/></label><div class="info-block">${icon('info')}<p><b>Manual review mode.</b> Your source is preserved. Enter the values alongside it; this demonstration does not run handwriting OCR. For a guided review, use the synthetic examples already in the queue.</p></div>`:`<div class="text-import-tools"><label class="form-label" for="import-text">Paste one record with a label on each line</label><button id="load-example">Load example</button></div><textarea id="import-text" rows="10" placeholder="Equipment ID: AUX-P-031&#10;Outlet pressure: 47.8"></textarea><p class="help-text">Local extraction recognizes labels and aliases such as “Equipment ID”, “Outlet pressure”, and “Recorded by”. Every imported field requires verification.</p><button class="button primary full" id="parse-text">Extract labeled fields ${icon('arrow')}</button>`}<p id="import-error" class="field-error" role="alert"></p>`);$('#scan-tab').onclick=()=>{importMode='scan';openImport()};$('#text-tab').onclick=()=>{importMode='text';openImport()};if(importMode==='text'){$('#load-example').onclick=()=>$('#import-text').value=example;$('#parse-text').onclick=()=>{try{addDoc(parseText($('#import-text').value,'Imported maintenance record.txt'));}catch(e){$('#import-error').textContent=e.message}}}else{$('#import-template').onchange=e=>importTemplate=e.target.value;$('#file-input').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0])};const drop=$('#dropzone');drop.ondragover=e=>{e.preventDefault();drop.classList.add('dragging')};drop.ondragleave=()=>drop.classList.remove('dragging');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('dragging');if(e.dataTransfer.files[0])importFile(e.dataTransfer.files[0])};}}
async function importFile(file){try{if(file.size>2*1024*1024)throw Error('This local demo accepts files up to 2 MB. Choose a smaller scan.');const buffer=new Uint8Array(await file.arrayBuffer());let kind,mime;if(buffer[0]===0x25&&buffer[1]===0x50&&buffer[2]===0x44&&buffer[3]===0x46){kind='pdf';mime='application/pdf'}else if(buffer[0]===0x89&&buffer[1]===0x50&&buffer[2]===0x4e&&buffer[3]===0x47){kind='image';mime='image/png'}else if(buffer[0]===0xff&&buffer[1]===0xd8&&buffer[2]===0xff){kind='image';mime='image/jpeg'}else throw Error('Unsupported file content. Choose a PDF, PNG, or JPEG scan.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Unable to read this file.'));r.readAsDataURL(new Blob([buffer],{type:mime}))});if(kind==='image')await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(Error('The image is damaged or unreadable. Try another scan.'));img.src=data});const d=makeDoc({id:'scan-'+Date.now(),title:file.name.replace(/\.[^.]+$/,''),template:importTemplate,values:[],method:'manual',source:{kind,name:file.name,data}});addDoc(d);}catch(e){$('#import-error').textContent=e.message}}
function addDoc(d){if(docs.length>=20){$('#import-error').textContent='This workspace holds up to 20 records. Export your work and reset the demo to start again.';return}docs.unshift(d);selected=d.id;activeField=d.fields[0].key;view='review';fieldFilter='all';query='';queueFilter='all';save();closeModal();shell();toast(d.method==='text'?`Mapped ${d.fields.filter(f=>f.value).length} fields locally. Verify each against its source.`:'Scan loaded. Enter values and verify each field.');if(d.warnings?.length)modal('Import notes',`<p>Source text is preserved in full. These lines need attention:</p><ul class="warning-list">${d.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`);}
function openExport(){const d=doc(),n=issues(d).length;if(n){activeField=issues(d)[0].key;fieldFilter='flagged';shell();toast(`Resolve ${n} flagged or invalid field${n===1?'':'s'} before export.`,'error');return}modal('Your record is ready',`<div class="export-ready">${icon('check')}<div><h3>${esc(d.title)}</h3><p>${verifiedCount(d)} human verified · ${d.fields.length-verifiedCount(d)} above threshold, unverified</p></div></div><p class="modal-intro">Download a distinct record. Original transcriptions, review status, and correction history travel with it.</p><div class="export-options"><button data-format="xlsx"><span class="file-type">XLSX</span><div><strong>Excel workbook</strong><small>Reviewed fields + provenance & audit sheets</small></div>${icon('download')}</button><button data-format="json"><span class="file-type">JSON</span><div><strong>Complete record</strong><small>Source reference or imported source, plus review history</small></div>${icon('download')}</button><button data-format="csv"><span class="file-type">CSV</span><div><strong>Field table</strong><small>Reviewed values, originals, and verification state</small></div>${icon('download')}</button></div><p class="help-text">Fixture confidence remains illustrative. “Verified” means checked in this local demo; it is not an operational approval.</p>`);$$('[data-format]',$('#modal')).forEach(b=>b.onclick=()=>{const format=b.dataset.format;d.events.push({action:'exported',at:new Date().toISOString(),note:format.toUpperCase()+' record downloaded'});try{const content=format==='xlsx'?workbook(d):format==='json'?JSON.stringify(exportRecord(d),null,2):csv(d);download(`${d.id}-reviewed.${format}`,content,format==='xlsx'?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':format==='json'?'application/json':'text/csv');d.finalizedAt=new Date().toISOString();save();closeModal();shell();toast(`${format.toUpperCase()} exported with original values and review provenance.`)}catch(e){d.events.pop();toast(e.message,'error')}});}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function downloadSource(){const s=doc().source;if(s.kind==='text')download(s.name,s.text,'text/plain');else if(s.kind==='fixture'){const a=document.createElement('a');a.href=asset(s.file);a.download=s.file;a.click()}else{const a=document.createElement('a');a.href=s.data;a.download=s.name;a.click()}toast('Original source downloaded.');}
function openGuide(){modal('A clear path from paper to record',`<div class="guide-step"><b>01</b><div><h3>Start with a source</h3><p>Select one of three synthetic forms, import a PDF or image for manual entry, or paste labeled text for real local parsing.</p></div></div><div class="guide-step"><b>02</b><div><h3>Keep uncertainty visible</h3><p>Fixture scores below 70% are flagged. Click a field to see its source region, correct the value, then save and verify. All imported fields require review because they have no statistical score.</p></div></div><div class="guide-step"><b>03</b><div><h3>Export with context</h3><p>Excel and JSON preserve original values and a review trail. CSV includes originals and review states. High-scoring fixture fields remain labeled unverified unless you check them.</p></div></div><div class="info-block">${icon('info')}<p><b>Scope.</b> No OCR, AI semantic matching, printer integration, official master templates, authentication, or cloud storage. This handcrafted Norfolk #22 demo uses fictional data and illustrative templates.</p></div><div class="reset-row"><div><strong>Restart the presentation</strong><p>Clears imported files and corrections in this browser.</p></div><button class="button" id="reset-demo">Reset demo</button></div>`);$('#reset-demo').onclick=()=>{modal('Reset this local workspace?',`<p>Imported sources, corrections, and review history will be removed from this browser. Download any records you want to keep first.</p><div class="modal-actions"><button class="button" id="cancel-reset">Keep my work</button><button class="button danger" id="confirm-reset">Reset to synthetic examples</button></div>`);$('#cancel-reset').onclick=closeModal;$('#confirm-reset').onclick=()=>{docs=fixtures();selected=docs[0].id;activeField='outlet';query='';queueFilter='all';fieldFilter='all';view='review';zoom=100;save();closeModal();shell();toast('Presentation reset to the three synthetic examples.')}};}
shell();
</script></body></html>
